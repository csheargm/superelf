<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendar</title>
<style>
html{font-size:calc(17px * var(--fs,1))}   /* A-/A+ scale, broadcast by the shell (pa:'prefs' fontScale) */
:root{
  --bg:#f4f4f2; --card:#fff; --text:#1c1e1d; --muted:#6b7370;
  --line:#e2e2de; --accent:#0f6355; --today-bg:#0f6355; --today-text:#fff;
  --dot:#e07340; --header-bg:#fff; --other-month:#c8ccc9;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#111514; --card:#1b201f; --text:#e5e8e6; --muted:#8f9894;
    --line:#2a302e; --accent:#57c2ac; --today-bg:#57c2ac; --today-text:#111514;
    --dot:#e08163; --header-bg:#1b201f; --other-month:#3a403e;
  }
}
*{ box-sizing:border-box; margin:0; padding:0; }
body{ background:var(--bg); color:var(--text); font:15px/1.4 -apple-system,system-ui,sans-serif; min-height:100vh; }

/* Header */
#cal-header{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 16px 10px; background:var(--header-bg); border-bottom:1px solid var(--line);
  position:sticky; top:0; z-index:10;
}
#month-label{ font-size:18px; font-weight:600; }
.nav-btn{
  background:none; border:1px solid var(--line); color:var(--text); border-radius:8px;
  width:36px; height:36px; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center;
}
.nav-btn:active{ background:var(--line); }

/* Day-of-week row */
#dow-row{
  display:grid; grid-template-columns:repeat(7,1fr);
  padding:6px 8px 0; gap:2px;
}
.dow{ text-align:center; font-size:11px; color:var(--muted); font-weight:600; padding:4px 0; text-transform:uppercase; }

/* Grid */
#grid{
  display:grid; grid-template-columns:repeat(7,1fr);
  padding:4px 8px 120px; gap:3px;
}
.day-cell{
  aspect-ratio:1; display:flex; flex-direction:column; align-items:center;
  justify-content:flex-start; padding-top:6px; border-radius:10px;
  cursor:pointer; position:relative; user-select:none;
}
.day-cell:active{ background:var(--line); }
.day-num{
  font-size:14px; font-weight:500; line-height:1;
  width:28px; height:28px; display:flex; align-items:center; justify-content:center;
  border-radius:50%;
}
.day-cell.today .day-num{ background:var(--today-bg); color:var(--today-text); font-weight:700; }
.day-cell.other-month .day-num{ color:var(--other-month); }
.dot{
  width:5px; height:5px; background:var(--dot); border-radius:50%;
  margin-top:3px;
}

/* Detail panel */
#detail{
  position:fixed; bottom:0; left:0; right:0;
  background:var(--card); border-top:2px solid var(--accent);
  padding:16px 16px 28px; display:none;
  box-shadow:0 -4px 20px rgba(0,0,0,.12);
}
#detail.open{ display:block; }
#detail-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
#detail-label{ font-size:16px; font-weight:600; }
#close-btn{ background:none; border:none; font-size:22px; color:var(--muted); cursor:pointer; padding:0 4px; }
#note-area{
  width:100%; font:inherit; font-size:14px; padding:8px 10px;
  border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text);
  resize:none; height:80px; outline:none;
}
#note-area:focus{ border-color:var(--accent); }
#note-actions{ display:flex; gap:8px; margin-top:8px; }
.action-btn{
  font:inherit; font-size:13px; padding:7px 16px; border-radius:8px; cursor:pointer; border:none;
}
.action-btn.save{ background:var(--accent-fill,var(--accent)); color:#fff; }
.action-btn.clear{ background:none; border:1px solid var(--line); color:var(--muted); }
#status{ padding:0 12px 6px; font-size:13px; color:#c33; text-align:center; }
#status:empty{ display:none; }
#save-status{ font-size:12px; color:var(--muted); margin-top:6px; min-height:16px; }
</style>
</head>
<body>

<div id="cal-header">
  <button class="nav-btn" id="prev-btn">&#8249;</button>
  <span id="month-label"></span>
  <button class="nav-btn" id="next-btn">&#8250;</button>
</div>
<div id="status" role="status"></div>
<div id="dow-row">
  <div class="dow">Su</div><div class="dow">Mo</div><div class="dow">Tu</div>
  <div class="dow">We</div><div class="dow">Th</div><div class="dow">Fr</div>
  <div class="dow">Sa</div>
</div>
<div id="grid"></div>

<div id="detail">
  <div id="detail-header">
    <span id="detail-label"></span>
    <button id="close-btn">&#x2715;</button>
  </div>
  <textarea id="note-area" placeholder="Add a note for this day…"></textarea>
  <div id="note-actions">
    <button class="action-btn save" id="save-btn">Save</button>
    <button class="action-btn clear" id="clear-btn">Clear</button>
  </div>
  <div id="save-status"></div>
</div>

<script>
/* ── State ── */
const today = new Date();
let curYear  = today.getFullYear();
let curMonth = today.getMonth();   // 0-based
let notes    = {};                 // { "YYYY-MM-DD": "text" }
let selected = null;               // "YYYY-MM-DD"

// PAStore (web/store.inline.html, ADR 0010) refuses every save until the file has been read: after a
// failed or unreadable read `notes` is still empty, and the next save would replace every saved note.
const notesFile = PAStore.file('calendar-notes.json', {
  shape: d => (d && typeof d === 'object' && !Array.isArray(d)) ? '' : 'not a notes map',
  unreadable: why => '笔记文件无法读取 · Notes file unreadable (' + why + ')',
});
async function loadNotes(){
  const r = await notesFile.load();
  if(r.state==='ok') notes=r.value;
  document.getElementById('status').textContent=r.text||'';
}

// Answers '' once saved, otherwise why not.
const saveNotes = () => notesFile.save(JSON.stringify(notes, null, 2));

/* ── Render ── */
const MONTHS = ['January','February','March','April','May','June',
                'July','August','September','October','November','December'];

function dateKey(y,m,d){ return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }
function todayKey(){ return dateKey(today.getFullYear(),today.getMonth(),today.getDate()); }

function renderGrid(){
  document.getElementById('month-label').textContent = `${MONTHS[curMonth]} ${curYear}`;

  const firstDay = new Date(curYear, curMonth, 1).getDay(); // 0=Sun
  const daysInMonth = new Date(curYear, curMonth+1, 0).getDate();
  const daysInPrev  = new Date(curYear, curMonth, 0).getDate();

  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  const tk = todayKey();

  // Leading cells from prev month
  for(let i=0; i<firstDay; i++){
    const d = daysInPrev - firstDay + 1 + i;
    const key = dateKey(curYear, curMonth-1, d);
    grid.appendChild(makeCell(d, key, true));
  }
  // Current month
  for(let d=1; d<=daysInMonth; d++){
    const key = dateKey(curYear, curMonth, d);
    const cell = makeCell(d, key, false);
    if(key===tk) cell.classList.add('today');
    grid.appendChild(cell);
  }
  // Trailing cells
  const total = firstDay + daysInMonth;
  const trailing = total%7===0 ? 0 : 7 - (total%7);
  for(let d=1; d<=trailing; d++){
    const key = dateKey(curYear, curMonth+1, d);
    grid.appendChild(makeCell(d, key, true));
  }
}

function makeCell(d, key, otherMonth){
  const cell = document.createElement('div');
  cell.className = 'day-cell' + (otherMonth ? ' other-month' : '');
  cell.dataset.key = key;

  const num = document.createElement('div');
  num.className = 'day-num';
  num.textContent = d;
  cell.appendChild(num);

  if(notes[key] && notes[key].trim()){
    const dot = document.createElement('div');
    dot.className = 'dot';
    cell.appendChild(dot);
  }

  cell.addEventListener('click', ()=>openDetail(key));
  return cell;
}

/* ── Detail panel ── */
const LONG_MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function friendlyDate(key){
  const [y,m,d] = key.split('-').map(Number);
  return `${LONG_MONTHS[m-1]} ${d}, ${y}`;
}

function openDetail(key){
  selected = key;
  document.getElementById('detail-label').textContent = friendlyDate(key);
  document.getElementById('note-area').value = notes[key] || '';
  document.getElementById('save-status').textContent = '';
  document.getElementById('detail').classList.add('open');
  document.getElementById('note-area').focus();
}

function closeDetail(){
  document.getElementById('detail').classList.remove('open');
  selected = null;
}

document.getElementById('close-btn').addEventListener('click', closeDetail);

document.getElementById('save-btn').addEventListener('click', async()=>{
  if(!selected) return;
  const text = document.getElementById('note-area').value.trim();
  if(text) notes[selected] = text;
  else delete notes[selected];
  document.getElementById('save-status').textContent = 'Saving…';
  const err = await saveNotes();
  document.getElementById('save-status').textContent = err || 'Saved.';
  renderGrid();
  if(!err) setTimeout(()=>{ document.getElementById('save-status').textContent=''; }, 1500);
});

document.getElementById('clear-btn').addEventListener('click', async()=>{
  if(!selected) return;
  document.getElementById('note-area').value = '';
  delete notes[selected];
  const err = await saveNotes();
  renderGrid();
  if(err){ document.getElementById('save-status').textContent = err; return; }   // stays open, so it is seen
  closeDetail();
});

/* ── Navigation ── */
document.getElementById('prev-btn').addEventListener('click', ()=>{
  curMonth--;
  if(curMonth<0){ curMonth=11; curYear--; }
  closeDetail();
  renderGrid();
});
document.getElementById('next-btn').addEventListener('click', ()=>{
  curMonth++;
  if(curMonth>11){ curMonth=0; curYear++; }
  closeDetail();
  renderGrid();
});

/* ── Init ── */
(async()=>{
  await loadNotes();
  renderGrid();
})();
</script>
</body>
</html>
