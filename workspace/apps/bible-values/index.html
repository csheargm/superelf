<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biblical Values</title>
<style>
html{font-size:calc(17px * var(--fs,1))}   /* A-/A+ scale, broadcast by the shell (pa:'prefs' fontScale) */
:root{
  --bg:#f5f3ee; --card:#fff; --text:#1c1a16; --muted:#7a7265;
  --line:#e5e1d8; --accent:#7c4a1e; --accent2:#c8843a; --gold:#d4a843;
  --tag-bg:#fdf3e3; --tag-text:#9a5e1a;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#16120d; --card:#221d15; --text:#ede8df; --muted:#9c9285;
  --line:#332c20; --accent:#e8a85a; --accent2:#c8843a; --gold:#d4a843;
  --tag-bg:#2a2115; --tag-text:#d4a843;
}}
*{box-sizing:border-box;margin:0;}
body{background:var(--bg);color:var(--text);font:16px/1.6 -apple-system,system-ui,sans-serif;min-height:100vh;}

/* Header */
.hdr{background:var(--accent);color:#fff;padding:16px 16px 12px;position:sticky;top:0;z-index:10;}
.hdr h1{font-size:18px;font-weight:700;letter-spacing:.01em;}
.hdr .sub{font-size:12px;opacity:.8;margin-top:1px;}
.search{display:flex;gap:8px;margin-top:10px;}
.search input{flex:1;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:7px 10px;color:#fff;font:inherit;font-size:14px;outline:none;}
.search input::placeholder{color:rgba(255,255,255,.6);}

/* Daily card */
.daily-wrap{padding:14px 14px 4px;}
.daily{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-radius:14px;padding:16px;position:relative;overflow:hidden;}
.daily::before{content:'✦';position:absolute;right:14px;top:10px;font-size:40px;opacity:.15;}
.daily-label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;opacity:.8;margin-bottom:4px;}
.daily-name{font-size:22px;font-weight:700;margin-bottom:4px;}
.daily-verse{font-size:13px;line-height:1.5;opacity:.92;font-style:italic;margin-bottom:10px;}
.daily-ref{font-size:11px;opacity:.7;margin-bottom:12px;}
.daily-btn{background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.4);color:#fff;padding:7px 14px;border-radius:8px;font:inherit;font-size:13px;cursor:pointer;}
.daily-btn:active{background:rgba(255,255,255,.35);}

/* Section header */
.sec-hdr{padding:16px 14px 8px;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);}

/* Grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px 100px;}
.vcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 12px;cursor:pointer;transition:transform .12s,box-shadow .12s;}
.vcard:active{transform:scale(.97);}
.vcard .icon{font-size:28px;margin-bottom:6px;}
.vcard .name{font-size:15px;font-weight:600;margin-bottom:2px;}
.vcard .tagline{font-size:12px;color:var(--muted);line-height:1.4;}
.vcard .tag{display:inline-block;margin-top:6px;background:var(--tag-bg);color:var(--tag-text);font-size:11px;padding:2px 8px;border-radius:20px;}

/* Modal */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;align-items:flex-end;}
.overlay.open{display:flex;}
.sheet{background:var(--bg);border-radius:20px 20px 0 0;width:100%;max-height:88vh;overflow-y:auto;padding:20px 18px 40px;}
.drag-bar{width:40px;height:4px;background:var(--line);border-radius:2px;margin:0 auto 18px;}
.sheet-icon{font-size:44px;margin-bottom:8px;}
.sheet-name{font-size:24px;font-weight:700;margin-bottom:2px;}
.sheet-tagline{font-size:14px;color:var(--muted);margin-bottom:16px;}
.badge{display:inline-block;background:var(--tag-bg);color:var(--tag-text);font-size:12px;padding:3px 10px;border-radius:20px;margin-bottom:16px;}
.block{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;}
.block-lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px;}
.verse-text{font-style:italic;font-size:15px;line-height:1.6;color:var(--text);}
.verse-ref{font-size:12px;color:var(--muted);margin-top:4px;}
.steps{list-style:none;padding:0;}
.steps li{padding:6px 0;font-size:14px;display:flex;gap:8px;align-items:flex-start;border-bottom:1px solid var(--line);}
.steps li:last-child{border-bottom:none;}
.steps li::before{content:'→';color:var(--accent);flex-shrink:0;margin-top:1px;}
.ask-btn{width:100%;background:var(--accent);color:#fff;border:none;border-radius:12px;padding:13px;font:inherit;font-size:15px;font-weight:600;cursor:pointer;margin-top:4px;}
.ask-btn:disabled{opacity:.6;}
.ai-block{background:var(--card);border:1px solid var(--gold);border-radius:12px;padding:14px;margin-top:12px;font-size:14px;line-height:1.65;white-space:pre-wrap;}
.ai-block .ai-lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--gold);margin-bottom:6px;}
.close-btn{position:absolute;right:18px;top:20px;background:var(--line);border:none;border-radius:50%;width:30px;height:30px;font-size:16px;cursor:pointer;color:var(--muted);}
.sheet-wrap{position:relative;}
</style>
</head>
<body>

<div class="hdr">
  <h1>Biblical Values</h1>
  <div class="sub">Rooted in Scripture · Applied to Life</div>
  <div class="search">
    <input id="q" placeholder="Search values…" oninput="filter(this.value)">
  </div>
</div>

<div class="daily-wrap">
  <div class="daily" id="daily">
    <div class="daily-label">Value of the Day</div>
    <div class="daily-name" id="d-name"></div>
    <div class="daily-verse" id="d-verse"></div>
    <div class="daily-ref" id="d-ref"></div>
    <button class="daily-btn" id="d-btn">Reflect on this →</button>
  </div>
</div>

<div class="sec-hdr">All Values</div>
<div class="grid" id="grid"></div>

<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="sheet-wrap">
      <button class="close-btn" onclick="closeSheet()">✕</button>
      <div class="drag-bar"></div>
      <div class="sheet-icon" id="s-icon"></div>
      <div class="sheet-name" id="s-name"></div>
      <div class="sheet-tagline" id="s-tagline"></div>
      <div class="badge" id="s-theme"></div>

      <div class="block">
        <div class="block-lbl">Key Scripture</div>
        <div class="verse-text" id="s-verse"></div>
        <div class="verse-ref" id="s-ref"></div>
      </div>

      <div class="block">
        <div class="block-lbl">What it means</div>
        <div id="s-meaning" style="font-size:14px;line-height:1.65;"></div>
      </div>

      <div class="block">
        <div class="block-lbl">Living it out — today</div>
        <ul class="steps" id="s-steps"></ul>
      </div>

      <button class="ask-btn" id="ask-btn" onclick="askAI()">Ask for deeper reflection…</button>
      <div id="ai-out"></div>
    </div>
  </div>
</div>

<script>
const VALUES = [
  {
    id:'love', icon:'❤️', name:'Love', theme:'Agape / 无私的爱',
    tagline:'The greatest commandment',
    verse:'"Love is patient, love is kind. It does not envy, it does not boast, it is not proud."',
    ref:'1 Corinthians 13:4',
    meaning:'Agape love — unconditional and self-giving — is the foundation of the entire biblical ethic. Jesus called loving God and loving others the two greatest commandments, on which all else hangs.',
    steps:['Choose patience before reacting to someone who frustrates you','Do one act of kindness today with no expectation of return','Pray for someone you find it hard to love']
  },
  {
    id:'faith', icon:'🕊️', name:'Faith', theme:'Trust / 信心',
    tagline:'Confidence in what we cannot see',
    verse:'"Now faith is confidence in what we hope for and assurance about what we do not see."',
    ref:'Hebrews 11:1',
    meaning:'Biblical faith is not blind belief, but a settled trust in God\'s character and promises even when circumstances seem to contradict them. It grows through relationship, Scripture, and faithfulness in small things.',
    steps:['Write down one promise from Scripture and carry it with you today','Take one step toward a goal you\'ve been afraid to start','When anxious, name aloud what you trust God for specifically']
  },
  {
    id:'hope', icon:'🌅', name:'Hope', theme:'Expectation / 盼望',
    tagline:'A confident expectation in God\'s promises',
    verse:'"May the God of hope fill you with all joy and peace as you trust in him."',
    ref:'Romans 15:13',
    meaning:'Christian hope is not wishful thinking — it is a sure expectation grounded in the resurrection. It enables resilience in suffering and prevents despair from taking root.',
    steps:['Read one account of someone who persevered through difficulty (Psalms, Job, Romans 8)','Write three things you\'re trusting God for this month','Encourage someone today who seems to have lost hope']
  },
  {
    id:'humility', icon:'🌾', name:'Humility', theme:'Servanthood / 谦卑',
    tagline:'Valuing others above yourself',
    verse:'"Do nothing out of selfish ambition or vain conceit. Rather, in humility value others above yourselves."',
    ref:'Philippians 2:3',
    meaning:'Humility is not thinking less of yourself, but thinking of yourself less. It is modeled perfectly in Christ who, though God, took the form of a servant. Pride closes us off; humility opens us to grace and growth.',
    steps:['Listen fully to someone today without planning your response','Acknowledge a mistake quickly rather than deflecting','Do a task that benefits others and tell no one']
  },
  {
    id:'forgiveness', icon:'🕊️', name:'Forgiveness', theme:'Grace / 宽恕',
    tagline:'Releasing what you are owed',
    verse:'"Be kind and compassionate to one another, forgiving each other, just as in Christ God forgave you."',
    ref:'Ephesians 4:32',
    meaning:'Forgiveness is not excusing wrong, but releasing the debt another owes you. It is primarily for your own freedom. You cannot forgive by willpower — it is a choice made repeatedly, empowered by remembering how much you have been forgiven.',
    steps:['Name the person or offense and say aloud "I release this"','If reconciliation is safe, take one small step toward it','Pray for the person who wronged you — even briefly']
  },
  {
    id:'justice', icon:'⚖️', name:'Justice', theme:'Righteousness / 公义',
    tagline:'Doing right by God and neighbor',
    verse:'"He has shown you, O mortal, what is good. And what does the Lord require of you? To act justly and to love mercy and to walk humbly with your God."',
    ref:'Micah 6:8',
    meaning:'Biblical justice is not merely legal fairness — it is active advocacy for those who are powerless, poor, or marginalized. The prophets and Jesus both sharply confronted those who had power but withheld it from others.',
    steps:['Learn about one injustice affecting people around you','Support or pray for an organization working for justice','Ask: in my own sphere, am I fair and honest in how I treat people?']
  },
  {
    id:'integrity', icon:'💎', name:'Integrity', theme:'Honesty / 诚实',
    tagline:'The same inside and out',
    verse:'"The integrity of the upright guides them, but the unfaithful are destroyed by their duplicity."',
    ref:'Proverbs 11:3',
    meaning:'Integrity means being the same person in private as in public, with no gap between what you profess and how you live. It is built in small daily choices: keeping a small promise, telling an inconvenient truth, refusing a small shortcut.',
    steps:['Keep one commitment today that no one is watching','Correct a small inaccuracy you spoke or wrote earlier','Ask: where is there a gap between what I say and what I do?']
  },
  {
    id:'compassion', icon:'🫂', name:'Compassion', theme:'Mercy / 怜悯',
    tagline:'Moved by others\' suffering — then acting',
    verse:'"Therefore, as God\'s chosen people, clothe yourselves with compassion, kindness, humility, gentleness and patience."',
    ref:'Colossians 3:12',
    meaning:'Compassion is not just feeling sorry — the word literally means to suffer with. Jesus was regularly described as being moved in his gut (splagchnizomai) before he healed someone. Compassion closes the distance between us and those who suffer.',
    steps:['Reach out to one person you know is struggling — not to fix, just to listen','Notice someone overlooked today and acknowledge them','Give something practical to someone in need this week']
  },
  {
    id:'gratitude', icon:'🙏', name:'Gratitude', theme:'Thankfulness / 感恩',
    tagline:'Acknowledging what you\'ve received',
    verse:'"Give thanks in all circumstances; for this is God\'s will for you in Christ Jesus."',
    ref:'1 Thessalonians 5:18',
    meaning:'Gratitude reorients us from scarcity to abundance, from entitlement to gift. Studies confirm what Scripture has always said: thankfulness improves wellbeing, strengthens relationships, and deepens faith. It is a discipline, not just a feeling.',
    steps:['Write three specific things you\'re grateful for — not generic, be precise','Thank a person who helped you — a real message, not just a thought','When you feel resentment, ask: what has this situation given me?']
  },
  {
    id:'service', icon:'🤲', name:'Service', theme:'Giving / 服务',
    tagline:'Greatness through giving',
    verse:'"For even the Son of Man did not come to be served, but to serve, and to give his life as a ransom for many."',
    ref:'Mark 10:45',
    meaning:'Service is the currency of the kingdom of God. Jesus flipped the world\'s hierarchy: the greatest is the servant. A life oriented around giving — time, energy, resources — is the antidote to the emptiness that accumulates self-serving.',
    steps:['Do one task today that only benefits someone else','Volunteer time this week to a cause larger than yourself','Ask a friend: "How can I help you?" — then follow through']
  },
  {
    id:'wisdom', icon:'📖', name:'Wisdom', theme:'Discernment / 智慧',
    tagline:'Knowing and doing what is right',
    verse:'"If any of you lacks wisdom, you should ask God, who gives generously to all without finding fault."',
    ref:'James 1:5',
    meaning:'Biblical wisdom is not intellectual cleverness — it is the skill of living well according to God\'s design. It begins with reverence for God (Proverbs 9:10), grows through Scripture, counsel, and reflection on experience.',
    steps:['Before a decision, pause and pray: "Give me wisdom for this"','Seek input from someone wiser — then genuinely weigh their view','Read one chapter of Proverbs (there are 31 — one per day)']
  },
  {
    id:'peace', icon:'☮️', name:'Peace', theme:'Shalom / 平安',
    tagline:'Wholeness, not merely the absence of conflict',
    verse:'"Peace I leave with you; my peace I give you. I do not give to you as the world gives. Do not let your hearts be troubled."',
    ref:'John 14:27',
    meaning:'Shalom — the Hebrew root of biblical peace — means wholeness, flourishing, rightness in every dimension: with God, self, others, and creation. It is both a gift received and a practice cultivated, especially through prayer and releasing anxiety.',
    steps:['Spend 5 minutes in silence today — no phone, no agenda','Identify one relationship tension and take one step toward resolution','Pray Philippians 4:6-7: present your anxiety to God specifically']
  },
];

let current = null;
let _id = 0;
const _wait = {};
window.addEventListener('message', e => {
  const m = e.data;
  if (m && m.pa === 'res' && _wait[m.id]) {
    _wait[m.id](m);
    delete _wait[m.id];
  }
});
function paAsk(msg) {
  return new Promise(res => {
    const id = ++_id;
    _wait[id] = res;
    parent.postMessage({pa:'req',id,kind:'ask',message:msg},'*');
  });
}

// Pick daily value based on day of year
function dayOfYear() {
  const now = new Date();
  const start = new Date(now.getFullYear(), 0, 0);
  return Math.floor((now - start) / 86400000);
}
const daily = VALUES[dayOfYear() % VALUES.length];

function initDaily() {
  document.getElementById('d-name').textContent = daily.name + ' — ' + daily.theme.split('/')[0].trim();
  document.getElementById('d-verse').textContent = daily.verse;
  document.getElementById('d-ref').textContent = '— ' + daily.ref;
  document.getElementById('d-btn').onclick = () => openSheet(daily);
}

function renderGrid(list) {
  const g = document.getElementById('grid');
  g.innerHTML = '';
  list.forEach(v => {
    const el = document.createElement('div');
    el.className = 'vcard';
    el.innerHTML = `<div class="icon">${esc(v.icon)}</div><div class="name">${esc(v.name)}</div><div class="tagline">${esc(v.tagline)}</div><div class="tag">${esc(v.theme)}</div>`;
    el.onclick = () => openSheet(v);
    g.appendChild(el);
  });
}

function filter(q) {
  const s = q.toLowerCase();
  const list = s ? VALUES.filter(v =>
    v.name.toLowerCase().includes(s) ||
    v.theme.toLowerCase().includes(s) ||
    v.tagline.toLowerCase().includes(s)
  ) : VALUES;
  renderGrid(list);
}

function openSheet(v) {
  current = v;
  document.getElementById('s-icon').textContent = v.icon;
  document.getElementById('s-name').textContent = v.name;
  document.getElementById('s-tagline').textContent = v.tagline;
  document.getElementById('s-theme').textContent = v.theme;
  document.getElementById('s-verse').textContent = v.verse;
  document.getElementById('s-ref').textContent = '— ' + v.ref;
  document.getElementById('s-meaning').textContent = v.meaning;
  const steps = document.getElementById('s-steps');
  steps.innerHTML = v.steps.map(s => `<li>${esc(s)}</li>`).join('');
  document.getElementById('ai-out').innerHTML = '';
  document.getElementById('ask-btn').disabled = false;
  document.getElementById('ask-btn').textContent = 'Ask for deeper reflection…';
  document.getElementById('overlay').classList.add('open');
  document.querySelector('.sheet').scrollTop = 0;
}

function closeSheet() {
  document.getElementById('overlay').classList.remove('open');
}
document.getElementById('overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('overlay')) closeSheet();
});

async function askAI() {
  if (!current) return;
  const btn = document.getElementById('ask-btn');
  btn.disabled = true;
  btn.textContent = 'Thinking…';
  const prompt = `You are a wise biblical guide. The user is reflecting on the value of "${current.name}" (${current.theme}).

Key verse: ${current.verse} (${current.ref})

Give a 3-4 paragraph personal reflection that:
1. Unpacks the deeper meaning of this value
2. Shares a brief illustration or story (biblical or everyday)
3. Offers one challenge for genuine transformation this week
4. Closes with an encouraging word

Keep it warm, practical, and grounded in Scripture. Avoid jargon. Write in plain, direct prose.`;

  try {
    const r = await paAsk(prompt);
    const out = document.getElementById('ai-out');
    out.innerHTML = r.ok
      ? `<div class="ai-block"><div class="ai-lbl">Reflection</div>${esc(r.text)}</div>`
      : `<div class="ai-block" style="color:var(--muted)">Could not reach AI. ${esc(r.error||'')}</div>`;
    btn.textContent = 'Refresh reflection';
    btn.disabled = false;
  } catch(e) {
    document.getElementById('ai-out').innerHTML = `<div class="ai-block" style="color:var(--muted)">Error: ${esc(e.message)}</div>`;
    btn.disabled = false;
    btn.textContent = 'Try again';
  }
}

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

initDaily();
renderGrid(VALUES);
</script>
</body>
</html>
