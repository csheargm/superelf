<style>
:root {
  --bg: #f0f0f7; --surface: #fff; --border: #ddd; --text: #1a1a2e;

}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0f0f1a; --surface: #1a1a2e; --border: #2a2a45; --text: #e8e8f5; --muted: #8888aa; }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; font-size: 15px; }
#header { background: var(--accent); color: #fff; padding: 12px 16px; display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 10; }
#header h1 { font-size: 16px; font-weight: 700; flex: 1; }
#header button { background: rgba(255,255,255,.2); border: none; color: #fff; border-radius: 6px; padding: 6px 10px; cursor: pointer; font-size: 13px; }
#day-tabs { display: flex; gap: 4px; padding: 10px 12px; background: var(--surface); border-bottom: 1px solid var(--border); overflow-x: auto; }
.day-tab { flex-shrink: 0; padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border); background: transparent; color: var(--text); cursor: pointer; font-size: 13px; font-weight: 500; }
.day-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
#filters { display: flex; gap: 6px; padding: 8px 12px; background: var(--surface); border-bottom: 1px solid var(--border); overflow-x: auto; flex-wrap: nowrap; }
.filter-btn { flex-shrink: 0; padding: 4px 10px; border-radius: 12px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; font-size: 12px; }
.filter-btn.active { color: #fff; border-color: transparent; }
#starred-toggle { flex-shrink: 0; padding: 4px 10px; border-radius: 12px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; font-size: 12px; }
#starred-toggle.active { background: var(--star); color: #000; border-color: var(--star); }
#list { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.session { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px; border-left: 4px solid var(--accent); }
.session-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.session-title { font-weight: 600; font-size: 14px; line-height: 1.35; }
.star-btn { background: none; border: none; cursor: pointer; font-size: 18px; line-height: 1; flex-shrink: 0; color: var(--muted); }
.star-btn.on { color: var(--star); }
.session-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; align-items: center; }
.time { font-size: 12px; color: var(--muted); font-weight: 500; }
.room-tag { font-size: 11px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 2px 8px; color: var(--muted); }
.track-tag { font-size: 11px; border-radius: 8px; padding: 2px 8px; color: #fff; font-weight: 500; }
.speakers { font-size: 12px; color: var(--muted); margin-top: 4px; }

.section-label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; padding: 4px 0 2px; }
#empty { text-align: center; color: var(--muted); padding: 40px 20px; font-size: 14px; }
</style>
</head>

  {id:'h33',day:2,s:'16:15',e:'17:15',room:'Workshop',title:'Your Chat App is Actually a Game',sp:['nohkumado'],track:'Workshop',url:'https://cfp.2026.matrix.org/matrix-conference-2026/talk/RXVU33/'},
  // Friday 23
  {id:'f01',day:3,s:'12:30',e:'18:00',room:'Aalborg Uni, Copenhagen',title:'Hackathon',sp:[],track:'Social',url:'https://conference.matrix.org/hackathon'},
];

const DAYS = [
  {label:'Tue 20 Oct', note:'Networking + Welcome Party'},
  {label:'Wed 21 Oct', note:'Conference Day 1'},
  {label:'Thu 22 Oct', note:'Conference Day 2'},
  {label:'Fri 23 Oct', note:'Hackathon (Copenhagen)'},
];

const ROOMS = ['All','Sofya','Katherine','Peter','Workshop','Networking','Babel','Aalborg Uni, Copenhagen'];

let curDay = 1, curRoom = 'All', showStarred = false;
let starred = new Set();

function br(kind, data) {
  return new Promise(res => {
    const id = Math.random().toString(36).slice(2);
    const handler = e => { const m = e.data; if (m && m.pa==='res' && m.id===id) { window.removeEventListener('message',handler); res(m); } };
    window.addEventListener('message', handler);
    window.parent.postMessage({pa:'req', id, kind, ...data}, '*');
  });
}

async function loadStarred() {
  const r = await br('data', {path:'starred.json'});
  if (r.ok && Array.isArray(r.data)) starred = new Set(r.data);
}

async function saveStarred() {
  await br('save-data', {path:'starred.json', data:[...starred], what:'data'});
}

function toggleStar(id) {
  starred.has(id) ? starred.delete(id) : starred.add(id);
  saveStarred();
  renderList();
}

function renderDayTabs() {
  const el = document.getElementById('day-tabs');
  el.innerHTML = DAYS.map((d,i)=>`<button class="day-tab${i===curDay?' active':''}" onclick="setDay(${i})">${d.label}</button>`).join('');
}

function renderFilters() {
  const el = document.getElementById('filters');
  const roomBtns = ROOMS.map(r=>{
    const active = r===curRoom;
    return `<button class="filter-btn${active?' active':''}" style="${active?'background:var(--accent)':''}" onclick="setRoom('${r}')">${r}</button>`;
  }).join('');
  el.innerHTML = roomBtns + `<button id="starred-toggle" class="${showStarred?'active':''}" onclick="toggleStarredFilter()">★ Starred</button>`;
}

function renderList() {
  const el = document.getElementById('list');
  let talks = TALKS.filter(t=>t.day===curDay);
  if (curRoom !== 'All') talks = talks.filter(t=>t.room===curRoom);
  if (showStarred) talks = talks.filter(t=>starred.has(t.id));
  talks.sort((a,b)=>a.s.localeCompare(b.s));
  if (!talks.length) { el.innerHTML='<div id="empty">No sessions match your filters.</div>'; return; }
  el.innerHTML = talks.map(t=>{
    const color = TC[t.track]||'#888';
    const on = starred.has(t.id);
    const sp = t.sp.length ? `<div class="speakers">${t.sp.join(', ')}</div>` : '';
    return `<div class="session" style="border-left-color:${color}">
      <div class="session-top">
        <div class="session-title">${esc(t.title)}</div>
        <button class="star-btn${on?' on':''}" onclick="toggleStar('${t.id}')" title="${on?'Unstar':'Star'}">${on?'★':'☆'}</button>
      </div>
      <div class="session-meta">
        <span class="time">${t.s}–${t.e}</span>
        <span class="room-tag">${esc(t.room)}</span>
        <span class="track-tag" style="background:${color}">${esc(t.track)}</span>
      </div>
      ${sp}
    </div>`;
  }).join('');
}

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function setDay(i) { curDay=i; renderDayTabs(); renderFilters(); renderList(); }
function setRoom(r) { curRoom=r; renderFilters(); renderList(); }
function toggleStarredFilter() { showStarred=!showStarred; renderFilters(); renderList(); }


function render() { renderDayTabs(); renderFilters(); renderList(); }

document.getElementById('chat-btn').addEventListener('click', () => {
  PAChat.fullscreen({ system: DEFAULT_PROMPT, placeholder: 'Ask about the schedule…', greeting: 'Hi! Ask me about any session, speaker, or track at Matrix Conf 2026.' }).open('matrix-conf');
});
document.getElementById('settings-btn').addEventListener('click', () => {
  PASettings.attach({ host: document.body, appPrompt: { key: 'matrix-conf-prompt', default: DEFAULT_PROMPT } });
});

loadStarred().then(render);
</script>
</body>
</html>
