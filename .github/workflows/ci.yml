# CI · 持续集成 — the full suite on every push and pull request.
#
# Where it runs, and why not everywhere:
#   ubuntu-latest   every trigger. The production node is a Linux VM (docs/vm-node.md).
#   windows-latest  every trigger. Windows nodes exist, and nobody runs the suite on one by hand.
#   macos-latest    ONLY when started by hand: gh workflow run ci.yml (or "Run workflow" on the
#                   Actions tab). The owner's Mac already runs `npm test` before every push.
#
# Billing, as checked on docs.github.com on 2026-10-11 ("GitHub Actions billing" and "Actions runner
# pricing"): the repo is PRIVATE, so minutes count. GitHub Free includes 2,000 minutes per month for
# standard runners; beyond that, with no payment method, runs are blocked. Per-minute rates: Linux
# 2-core $0.006, Windows 2-core $0.010, macOS $0.062 (about 10x Linux). Every job is rounded UP to a
# whole minute. A macOS run costs about as much as ten Linux runs, so it is opt-in.
# Measured on the first runs (2026-10-11): Linux ~1.5 min -> 2 billed, Windows ~2.8 min -> 3 billed,
# macOS ~0.5 min -> 1 billed. So ~5 billed minutes per push (~$0.04 at the rates above once the
# included minutes are used up), +1 macOS minute (~$0.06) per manual run. The current docs list
# the included minutes without per-OS multipliers; if Windows still counted double it would be ~8.
# A branch with an open pull request runs twice per push (push + pull_request).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref cancels the run it supersedes: only the newest commit matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # R14: a run that tested nothing is a failure, not a green tick. The floor is on PASSED tests (a
  # skip is not a pass): a stable lower bound, not an exact count. 2026-11-25: ~4,180 pass on macOS
  # without Playwright, ~3,900 expected on Windows; a glob or path bug that runs a fraction must fail.
  MIN_TESTS: 3500

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # No per-OS skip ceiling to raise by hand any more: the guard checks every skip's REASON TAG
        # against test/helpers-skip.mjs (which tags this OS may skip), so a new Playwright test
        # ("[no-browser]") or POSIX-only test on Windows ("[posix-only]") passes with no edit here,
        # and an untagged or unexpected skip fails (R14).
        os: [ubuntu-latest, windows-latest]
    env:
      PA_E2E_SKIP: '1'   # no Playwright on CI: e2e tests skip on purpose, as "[no-browser] ..."
    steps: &steps
      # The ink tests load pinned older engines with `git show <sha>:path` as their honest
      # control (R14), so CI needs full history, not the default shallow clone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # No npm install: package.json has no dependencies.
      - name: npm test
        shell: bash
        run: npm test 2>&1 | tee "$RUNNER_TEMP/test-output.txt"
      - name: Guard against a vacuous run (R14)
        if: always()
        shell: bash
        run: node .github/ci-guard.mjs "$RUNNER_TEMP/test-output.txt"

  test-macos:
    name: test (macos-latest, manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      PA_E2E_SKIP: '1'
    steps: *steps
