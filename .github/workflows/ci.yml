        # 2026-11-24: EVERY OS +1 (ubuntu 193, windows 278): app-edit-e2e member test (own copy via the one app chat), skipped on CI by PA_E2E_SKIP.
        # 2026-11-24: EVERY OS +2 (ubuntu 195, windows 280): iphone-chat-e2e (iPhone tab + home-screen PWA), skipped on CI by PA_E2E_SKIP.
        # 2026-11-24: EVERY OS +4 (ubuntu 199, windows 284): demo-signin-link-e2e (other-browser link, expired link,
        #   good link, 429 / sent), skipped on CI by PA_E2E_SKIP.
        # 2026-11-25: EVERY OS +1 (ubuntu 200, windows 285): app-edit-e2e mouse bar test (F2-06), skipped on CI by PA_E2E_SKIP.
        # 2026-11-25: EVERY OS +2 (ubuntu 202, windows 287): app-chat-camera-e2e (camera + 3-cap + retake after Undo/self-reload;
        #   failure path + tip once), skipped on CI by PA_E2E_SKIP.
        # 2026-11-25: windows +1 (288): app-edit-multi-apply's write half (the fake jail models POSIX rule paths).
        # 2026-11-25: EVERY OS +7 (ubuntu 209, windows 295): menus-close-e2e (3 devices x bar hold + inventory close paths, stale Publish preview), skipped on CI by PA_E2E_SKIP.
        # 2026-11-25: EVERY OS +9 (ubuntu 218, windows 304): tips-close-e2e (home tip x4 engine/device, blocked storage,
        #   app tips x4), skipped on CI by PA_E2E_SKIP.
        # 2026-11-25: EVERY OS +1 (ubuntu 219, windows 305): app-chat-sweep-ui F6 (PASnap fixed bar in Chromium), skipped on CI by PA_E2E_SKIP.
        # 2026-11-25: EVERY OS +9 (ubuntu 228, windows 314): phone-friendly-e2e and phone-chat-notes-e2e (WebKit iPhone/iPad), skipped on CI by PA_E2E_SKIP.
        # 2026-11-25: EVERY OS +2 (ubuntu 230, windows 316): stationery-from-photo-e2e (Chromium flow + WebKit iPhone/iPad delete-button checks), skipped on CI by PA_E2E_SKIP.
        # 2026-11-25: EVERY OS +2 (ubuntu 232, windows 318): chat-phone-actions-e2e (440x956 and 390x844), skipped on CI by PA_E2E_SKIP.
        # 2026-11-25: EVERY OS +4 (ubuntu 236, windows 322): fork-publish-honesty-e2e, skipped on CI by PA_E2E_SKIP.
        # 2026-11-25: EVERY OS +1 (ubuntu 237, windows 323): journal-print-e2e, skipped on CI by PA_E2E_SKIP.
        # 2026-11-25: EVERY OS +2 (ubuntu 239, windows 325): menu-anchor-e2e (1680 and 390 widths), skipped on CI by PA_E2E_SKIP.
        include:
          - os: ubuntu-latest
            max_skipped: 239
          - os: windows-latest
            max_skipped: 325
    env:
      MAX_SKIPPED: ${{ matrix.max_skipped }}
      PA_E2E_SKIP: '1'   # no Playwright on CI: e2e files skip on purpose, still capped by MAX_SKIPPED
    steps: &steps
      # The ink tests load pinned older engines with `git show <sha>:path` as their honest
      # control (R14), so CI needs full history, not the default shallow clone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # No npm install: package.json has no dependencies.
      - name: npm test
        shell: bash
        run: npm test 2>&1 | tee "$RUNNER_TEMP/test-output.txt"
      - name: Guard against a vacuous run (R14)
        if: always()
        shell: bash
        run: node .github/ci-guard.mjs "$RUNNER_TEMP/test-output.txt"

  test-macos:
    name: test (macos-latest, manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      MAX_SKIPPED: 87
      PA_E2E_SKIP: '1'
    steps: *steps
