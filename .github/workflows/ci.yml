# CI · 持续集成 — the full suite on every push and pull request.
#
# Where it runs, and why not everywhere:
#   ubuntu-latest   every trigger. The production node is a Linux VM (docs/vm-node.md).
#   windows-latest  every trigger. Windows nodes exist, and nobody runs the suite on one by hand.
#   macos-latest    ONLY when started by hand: gh workflow run ci.yml (or "Run workflow" on the
#                   Actions tab). The owner's Mac already runs `npm test` before every push.
#
# Billing, as checked on docs.github.com on 2026-10-11 ("GitHub Actions billing" and "Actions runner
# pricing"): the repo is PRIVATE, so minutes count. GitHub Free includes 2,000 minutes per month for
# standard runners; beyond that, with no payment method, runs are blocked. Per-minute rates: Linux
# 2-core $0.006, Windows 2-core $0.010, macOS $0.062 (about 10x Linux). Every job is rounded UP to a
# whole minute. A macOS run costs about as much as ten Linux runs, so it is opt-in.
# Measured on the first runs (2026-10-11): Linux ~1.5 min -> 2 billed, Windows ~2.8 min -> 3 billed,
# macOS ~0.5 min -> 1 billed. So ~5 billed minutes per push (~$0.04 at the rates above once the
# included minutes are used up), +1 macOS minute (~$0.06) per manual run. The current docs list
# the included minutes without per-OS multipliers; if Windows still counted double it would be ~8.
# A branch with an open pull request runs twice per push (push + pull_request).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref cancels the run it supersedes: only the newest commit matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # R14: a run that tested nothing is a failure, not a green tick. The floor is on PASSED tests (a
  # skip is not a pass). The suite has ~1,800; a glob or path bug on one OS that silently runs a
  # handful must not pass. Raise it as the suite grows.
  MIN_TESTS: 1500

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # max_skipped: this OS's skip ceiling (R14). Skips hang on runtime probes, so a probe or
        # runner-image regression could turn real tests into skips; above the ceiling is red. Measured
        # 2026-10-11: ubuntu 6, windows 61 (60 ops-script tests: Windows runs the .ps1 scripts; plus
        # harness-ports' probe test, which skips where it cannot fail), macOS 3 (2 measured on the
        # runner, plus that same probe test, confirmed locally); +2 slack. A new POSIX-only test
        # raises Windows' count: raise its ceiling with it. 2026-10-12: windows 63, from the two
        # POSIX-only legacy-bot tests in removed-telegram (ADR 0006). 2026-10-13: windows 70, from
        # the seven bash+gpg tests in backup.test.mjs (the backup is macOS-only for now).
        # 2026-10-17: windows 73, from three more bash+gpg backup tests (backup_extra).
        # 2026-10-18: windows 76, from three more in backup-extra.test.mjs (pause/resume, one tar each).
        # 2026-10-27: EVERY OS +7 (ceilings ubuntu 15, windows 85, macOS 12), from note-link-e2e.test.mjs (6)
        # and note-link-gate-e2e.test.mjs (1): they run real Chromium through PA_PLAYWRIGHT, which CI does
        # not install (no dependencies), so all 7 skip here.
        # 2026-11-01: EVERY OS +1 (ubuntu 16, windows 86, macOS 13), from note-photo-multi-e2e.test.mjs (1, Playwright).
        # 2026-11-18: EVERY OS +37 (ubuntu 53, windows 123, macOS 49). All 45 Playwright e2e tests skip on
        # CI by explicit PA_E2E_SKIP=1 (measured locally: `PA_E2E_SKIP=1 node --test test/*e2e*.test.mjs`
        # → 45 skipped); 8 were already counted, 37 were added after 2026-11-13 without a ceiling raise.
        # Without the opt-out those files now FAIL (test/helpers-e2e-gate.mjs).
        # 2026-11-21: EVERY OS +6, from landing-page-e2e.test.mjs (6 Playwright layout checks, skip on CI).
        # 2026-11-22: windows 143 (measured 142 in run 44990421956, +1 slack like ubuntu). The 12 new
        # Windows-only skips are bash+gpg backup tests (13 counted above, 25 now): backup-linux.test.mjs
        # (11, the Linux passphrase file for backup.sh/restore.sh) plus one more in the backup files.
        # All of them run on ubuntu.
        # 2026-11-22: EVERY OS +12 (ubuntu 73, windows 155; measured 72 and 154 in run 45054412816, +1
        # slack): demo-account-ui-e2e.test.mjs + demo-home-link.test.mjs, 12 Playwright e2e checks
        # that skip on CI (PA_E2E_SKIP), from the sync of the private repo's demo work.
        # 2026-11-23: EVERY OS +6 (ubuntu 79, windows 161; measured 78 and 160 in run 45122519933, +1
        # slack): new Playwright e2e checks (ink pen contrast, app-page access, 375px top bars) that
        # skip on CI by PA_E2E_SKIP; no real test turned into a skip.
        # 2026-11-23: EVERY OS +9 (ubuntu 88, windows 170; measured 87 and 169 in run 45124049583, +1
        # slack): ink-enclosure-e2e.test.mjs, 9 Playwright checks that skip on CI by PA_E2E_SKIP.
        # 2026-11-23: EVERY OS +6 (ubuntu 98, windows 180): fix/morning's new Playwright checks (demo
        # limit screen 3, demo app sign-out 1, removed member 1, family labels 1), skipped on CI by PA_E2E_SKIP.
        # 2026-11-23: windows +1 (181): test/auth.test.mjs read-only-folder sweep test skips on Windows
        # (no POSIX file modes there); measured 181 in run 45247410656.
        # 2026-11-23: EVERY OS +30 (ubuntu 128, windows 211; measured 128 and 211 in run 45262355037):
        # overnight triage merge's new Playwright e2e files (bible reader, notes polish, chat stop,
        # family offline, member tips, ...), skipped on CI by PA_E2E_SKIP; fail 0 on both.
        # 2026-11-23: EVERY OS +1 (ubuntu 129, windows 212): shell-placeholder-e2e.test.mjs (1 Playwright check).
        # 2026-11-23: EVERY OS +1 (ubuntu 130, windows 213): family-offline-e2e service-worker-on offline check.
        # 2026-11-23: EVERY OS +1 (ubuntu 131, windows 214): bible-reader-e2e no-404 check.
        # 2026-11-23: EVERY OS +1 (ubuntu 132, windows 215): note-link-e2e range-end check.
        # 2026-11-23: EVERY OS +2 (ubuntu 135, windows 218): bible-reader-e2e swipe split per orientation + old-857c8f2-copy control.
        # 2026-11-23: EVERY OS +10 (ubuntu 145, windows 228): bar-no-jump-e2e 8 hide/show viewports + 2 daily-banner checks.
        # 2026-11-23: EVERY OS +2 (ubuntu 147, windows 230): bible-note-chapter-e2e, one test per shipped Bible copy.
        # 2026-11-23: EVERY OS +1 (ubuntu 148, windows 231): bible-note-chapter-e2e held-photo check.
        # 2026-11-23: EVERY OS +1 (ubuntu 149, windows 232): revision-update-e2e (PAUpdate after a REVISION change).
        # 2026-11-24: WINDOWS ONLY +2 (windows 234): revision-stamp runs the Dockerfile stamp + entrypoint tar in POSIX bash.
        # 2026-11-23: EVERY OS +1 (ubuntu 150, windows 236): release-notes-e2e (bumped version is current);
        #   windows +1 more: bump-version-tool's version.sh parity check needs bash.
        # 2026-11-24: EVERY OS +7 (ubuntu 157, windows 242): settings-close-e2e (sticky bar, discard guard, slow Save).
        # 2026-11-24: EVERY OS +3 (ubuntu 160, windows 245): publish-e2e (owner publish, token-needed, member hidden).
        # 2026-11-24: EVERY OS +2 (ubuntu 162, windows 247): app-edit-e2e (panel + change + undo, menu + phone sheet).
        # 2026-11-24: EVERY OS +1 (ubuntu 163, windows 248): new-look (tiles, drawer 5 + More, Aa, app palette).
        # 2026-11-24: EVERY OS +7 (ubuntu 170, windows 255): bible-verse-order-e2e (中文 first at 3 sizes, the ⚙ tick
        #   + tip, ink + highlights across the flip at iPad portrait/landscape x both orders, the member template).
        # 2026-11-24: EVERY OS +6 (ubuntu 178, windows 263): owner-alerts-e2e (dot + card + fix, Claude rebuild
        #   confirm, Not today, member sees nothing, reduced motion + 375px, data box + reload mid-fix), skipped on CI by PA_E2E_SKIP.
        # 2026-11-24: EVERY OS +2 (ubuntu 180, windows 265): stray-square-e2e (1600x900, 1180x820), skipped on CI by PA_E2E_SKIP.
        # 2026-11-24: EVERY OS +1 (ubuntu 181, windows 266): app-chat-honesty-e2e (note + Change this app → panel prefilled), skipped on CI by PA_E2E_SKIP.
        # 2026-11-24: EVERY OS +3 (ubuntu 184, windows 269): home-v2 (owner: chips + More menu + alert dot; member: Start here;
        #   demo guest: welcome, Sign in, Diabetes hidden, Make an app, 390 width, reduced motion), skipped on CI by PA_E2E_SKIP.
        # 2026-11-24: EVERY OS +7 (ubuntu 191, windows 276): drawer-sections-e2e (first open, remembered taps, keyboard,
        #   header one line at 390/1180/dark, short-screen scroll), skipped on CI by PA_E2E_SKIP.
        # 2026-11-24: EVERY OS +1 (ubuntu 192, windows 277): publish-e2e menu states (not in repo / up to date /
