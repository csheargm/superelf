# Publishes the landing page (site/index.html only) to GitHub Pages at superelf.app.
# The custom domain is set in the repo's Pages settings (a CNAME file is ignored for Actions deploys).
# Checks run in a read-only job; only the separate deploy job holds Pages and OIDC permissions.
name: pages
on:
  push:
    branches: [main]
    paths: ['site/**', 'test/landing-page*.mjs', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Page checks
        run: node --test test/landing-page.test.mjs
      # Real-browser checks (layout, language toggle); Playwright lives outside the repo.
      - name: Browser checks
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y > /dev/null && npm install --no-audit --no-fund playwright@1.58.2 > /dev/null
          npx playwright install --with-deps chromium
          cd "$GITHUB_WORKSPACE"
          PA_PLAYWRIGHT="$RUNNER_TEMP/pw/node_modules/playwright/index.mjs" node --test test/landing-page-e2e.test.mjs
  deploy:
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      # Publish exactly the reviewed page, nothing else that may sit in site/.
      - name: Stage the page
        run: mkdir _site && cp site/index.html _site/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
