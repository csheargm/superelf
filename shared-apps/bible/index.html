// ── Drawing ──
// The draw editor is the shared PANote engine (web/note-ui.inline.html) in single-canvas
// mode, shown as a full-screen overlay. Vector strokes are stored in ANN.draws[scopeKey]
// as a PANote notebook (vector JSON, not PNG). drawPad is defined below, with aiChat.
let _drawScope='general';
// _drawPath: the chapter file the open note was opened in. The pad's save writes only while ANN is
// that chapter's and fully read — a late save or retry after the location moved is refused, never
// re-aimed at the chapter now showing.
let _drawPath='';
// SCAR: this assigned the NEW _drawScope before drawPad.open(), and open() → reload() then fired
// an un-awaited flush. The outgoing page's save closure reads _drawScope when it RUNS, so
// switching verses within the debounce window wrote the old notebook into the NEW verse's key and
// destroyed the destination's handwriting. The flush is now awaited FIRST, under the OLD scope.
async function openDrawFull(forceKey,forceTitle,rowId,at){
  hideBackPill();
  const from=annPath();                  // the file the OUTGOING flush belongs to — the notice key
  // In the rail the pad lives in a slot that starts collapsed, so opening a note has to REVEAL it.
  // expand() re-measures unconditionally, which a collapsed pad needs: it measured 0 while hidden.
  // Only the NOTE slot: the chat stays as it was (PANote.prefs().openAi, default off — a bound
  // thread is reopened by the ☰ chat row or Ask AI, never by opening the note). Pinned by test.
  if(rail){ rail.open(); rail.expand('note'); }
  // _drawScope is repointed INSIDE the callback, which the pad runs after flushing the OUTGOING
  // verse under its OLD key and before pulling the new one.
  const r=await drawPad.open(()=>{ _drawScope=forceKey||scopeKey(); _drawPath=annPath();
    // Title from the note's own content where it has some, so reopening shows what the drawer says.
    paintNoteTitle(forceKey?(forceTitle||freeNoteTitle(forceKey)):noteTitleFor(scopeKey(),ANN.draws[scopeKey()]));
  });
  if(r&&!r.ok) annNotice('上一幅未保存 · Previous drawing not saved — reopen it to retry 请重新打开重试','',from);
  // The id of the ROW THAT WAS CLICKED wins over a re-derived one. A chat row works because
  // openConvo records the row's own id; a note row used to re-compute the identity from selV /
  // _drawScope and overwrite the drawer's correct record with it. Two places deriving one fact
  // (R3) — and one branch returns '__gen' whenever selV is empty, which can never match a
  // `file:…` row, so the highlight silently vanished. Opened from the ＋/fab there IS no row,
  // and currentNoteId() is then the right answer.
  chatUI().setActiveNote(rowId || currentNoteId()); // mark this note active in the ☰ list
  if(at&&drawPad.reveal) drawPad.reveal(at);   // a search hit: its page and the matched lines (PANote owns the overlay)
}
// Open a brand-new blank draw note (not tied to any verse selection). Uses a timestamp-
// scoped key so it is stored separately from the general and verse notes in the same
// chapter file, and appears as its own entry in the ☰ Notes list.
// Mirrors web.mjs freeStamp/autoTitle so the pad's title bar matches the drawer row the
// server will list (apps are sandboxed: no shared module, so the format is pinned by a test).
function freeNoteTitle(k){
  // The format lives in PANote (NEW_NOTE_LABEL + stamp) — ONE definition shared with Journal and
  // mirrored server-side by web.mjs freeStamp for the listing. A key with no usable epoch keeps
  // the book/chapter title, which is its identity in the list.
  const m=/^free-(\d{10,})$/.exec(String(k||'')); const base=`${(BOOKS[bookIdx]||[])[0]||'Book'} ${chapter}`;   // BOOKS[i] = [en, zh, chapters]
  if(!m) return base;
  const s=PANote.stamp(Number(m[1]));
  return s ? PANote.NEW_NOTE_LABEL+s : base;
}
async function openNewDrawNote(key){               // key: a note the caller already wrote (a saved summary) opens as that note
  hideBackPill();
  const from=annPath();
  const freeKey=key||'free-'+Date.now();
  // No stored title: the server derives "<Book> <ch> · HH:MM" from the key's epoch (web.mjs
  // freeStamp), so several notes on one chapter are distinguishable. Storing a fixed
  // placeholder here is what made six notes all read "New Note". Format mirrors freeStamp
  // and is pinned by test/bible-note-title.test.mjs.
  const r=await drawPad.open(()=>{ _drawScope=freeKey; _drawPath=annPath(); drawPad.setTitle(freeNoteTitle(freeKey)); });
  if(r&&!r.ok) annNotice('上一幅未保存 · Previous drawing not saved — reopen it to retry 请重新打开重试','',from);
  // Use the explicit note ID so the drawer highlights this new entry, not the general slot.
  chatUI().setActiveNote(`file:${bookIdx}:${chapter}:${freeKey}`);
}

// ── Clickable verse references in AI replies ──
// Walk the text nodes of a rendered AI bubble and wrap any verse reference in a .vref span.
// DOM-based (not HTML-string regex) so tags/code aren't corrupted; skips links & code.
const REF_SKIP=new Set(['A','CODE','PRE','SCRIPT','STYLE']);
function linkifyVerses(root){
  if(!root) return;
  const walk=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){
    if(!n.nodeValue||!/\d/.test(n.nodeValue)) return NodeFilter.FILTER_REJECT;
    for(let p=n.parentNode;p&&p!==root;p=p.parentNode){ if(REF_SKIP.has(p.nodeName)||(p.classList&&p.classList.contains('vref'))) return NodeFilter.FILTER_REJECT; }
    return NodeFilter.FILTER_ACCEPT; }});
  const targets=[]; let t; while((t=walk.nextNode())) targets.push(t);
  for(const node of targets){
    const refs=parseRefs(node.nodeValue); if(!refs.length) continue;
    const s=node.nodeValue, frag=document.createDocumentFragment(); let pos=0;
    for(const r of refs){ if(r.index<pos) continue;
      if(r.index>pos) frag.appendChild(document.createTextNode(s.slice(pos,r.index)));
      const span=document.createElement('span'); span.className='vref';
      span.dataset.b=r.book; span.dataset.c=r.chapter; span.dataset.v=r.verses.join('.');
      span.textContent=s.slice(r.index,r.index+r.length);
      frag.appendChild(span); pos=r.index+r.length; }
    if(pos<s.length) frag.appendChild(document.createTextNode(s.slice(pos)));
    node.parentNode.replaceChild(frag,node); }
}
// Jump to a referenced passage; remember the chat so the back pill can restore it.
let backConvo=null, backLabel='';
const backPill=document.getElementById('back-chat');
function hideBackPill(){ backPill.classList.remove('show'); }
backPill.onclick=()=>{
  hideBackPill();
  if(backConvo) aiChat.openConvo(backConvo,{label:backLabel||scopeRef()}); else aiChat.open(scopeKey());   // pill only shows when backConvo is set
  backConvo=null;
};
function jumpToRef(bi,ch,verses){
  if(bi==null||isNaN(bi)||!BOOKS[bi]) return;
  backConvo=(aiChat.getConvo&&aiChat.getConvo())||null;
  backLabel=document.querySelector('.pac-fs .pac-title')?.textContent||'';
  aiChat.hide();   // step away from the full-screen chat to reveal the passage
  goChapter(bi,ch).then(ok=>{ if(ok===false) return;   // superseded: another chapter is showing
    (verses||[]).slice(0,1).forEach(n=>{ const el=[...document.querySelectorAll('.verse')].find(e=>+e.dataset.n===n);
      if(el){ selV.add(n); el.classList.add('selected'); } });
    updateFab(); followSelection();   // the side chat (railChat) follows the jumped-to verse; aiChat.hide() only closed the full-screen one
    const tgt=document.querySelector('.verse.selected')||document.querySelector('.verse');
    if(tgt) tgt.scrollIntoView({block:'center'});   // instant: smooth is unreliable across a full-chapter jump
    if(backConvo) backPill.classList.add('show'); });
}
// One delegated handler: a .vref tap anywhere in the chat jumps to its passage.
document.body.addEventListener('click',e=>{ const r=e.target.closest&&e.target.closest('.vref'); if(!r) return;
  e.preventDefault(); e.stopPropagation();
  jumpToRef(+r.dataset.b,+r.dataset.c,(r.dataset.v||'').split('.').filter(Boolean).map(Number)); });

// ── AI: the shared PAChat component (web/chat-ui.inline.html), injected at serve time ──
// The ONE definition of "does this scope already have a conversation?". PAChat consumes it as
// getConvoId, and the split rail's auto-explain consumes it to decide whether a thread is FRESH.
// Two copies of this expression is how the rail would re-send an explanation over an existing
// conversation, or stay silent on a new one.
function convoIdFor(k){ return k==='general' ? GEN.chat : (ANN.chat||{})[k]; }

// ── Split view · 分屏 ─────────────────────────────────────────────────────────────────────────
// Tapping Ask AI on a verse opens the chat BESIDE the text and, for a FRESH thread only, asks for
// one structured explanation. Desktop and iPad landscape only — PASplit's own gate keeps it off
// every iPhone orientation, and below the gate this whole branch is skipped and the existing
// full-screen chat opens exactly as it does today.
const EXPLAIN_PROMPT_BODY='Answer briefly first.\n\n'
  +'FIRST REPLY — 1–2 plain sentences saying what this verse means, then one short line offering more: '
  +'"想深入可以问我 · Ask for more". Nothing else. No headings, no lists, no background. '
  +'Do NOT include anything from the section below in this first reply.\n\n'
  +'ONLY IF I ASK FOR MORE — answer under the heading `详解 Details`:\n'
  +'1. 历史背景 Context — who is speaking, to whom, when, and what is happening around it.\n'
  +'2. 关键词 Key Terms — the words carrying the weight, with the Greek/Hebrew where it changes the sense.\n'
  +'3. 这段在说什么 Plain Meaning — the passage in ordinary words.\n'
  +'4. 为什么重要 Why It Matters — what it asks of a reader today.\n\n'
  +'Keep technical terms bilingual on first use (English + 中文). Be concise; this is read on a phone.';
// What the reader SEES of an explain turn ends at EXPLAIN_SPLIT; the instructions after it go to the
// model only (owner 2026-11-13: "no need to display the whole prompt"). ONE constant, used by both
// the builder and showMe (R3).
const EXPLAIN_HEAD='\u91ca\u7ecf Explain \u2014 ';
const EXPLAIN_SPLIT='\n\n\u2014\u2014\u2014\n';
// _explainPromptOverride: set from prefs.explainPrompt at startup and on settings save.
// When set, it replaces the instructions; the header line and verse text are always shown.
let _explainPromptOverride=null;
function selVerseText(){ return [...selV].sort((a,b)=>a-b).map(n=>(VERSES||[]).find(v=>v.n===n)).filter(Boolean)
  .map(v=>versePair(v).join('\n')).join('\n'); }
function explainMsg(ref){ const txt=selVerseText();
  return EXPLAIN_HEAD+ref+(txt?'\n'+txt:'')+EXPLAIN_SPLIT+(_explainPromptOverride||EXPLAIN_PROMPT_BODY); }
// The chat bubble for a user turn: an explain turn shows its header + verse only. Turns stored before
// EXPLAIN_SPLIT existed show their header line only.
function showMe(t){ const s=String(t||''), i=s.indexOf(EXPLAIN_SPLIT);
  if(i>=0) return s.slice(0,i);
  return s.startsWith(EXPLAIN_HEAD) ? s.split('\n')[0] : s; }
let rail=null, railChat=null, _booted=false;
const splitOn=()=>!!(window.PASplit&&PASplit.available&&PASplit.gateOpen());
// The ☰ list belongs to whichever chat is ON SCREEN. There are two Chat instances — the
// full-screen one and the rail panel — and each builds its OWN drawer. Addressing `aiChat`
// directly for list operations opened the hidden instance's drawer: the app's content was pushed
// aside for a panel that was never revealed. Every list call goes through here instead.
const chatUI=()=>railChat||aiChat;

// DATA hooks — what the chat IS. Shared verbatim by both hosts (R3): the full-screen chat and
// the split rail must answer identically about scope, context, labels and where a conversation
// id is stored, or the same verse would get two different threads depending on screen width.
// ── Period summaries · 按时期总结 (plan E): the drawer's bulk Summarize over selected chapter notes ──
// run: the turn goes into whichever chat is on screen (rail when there is room, full-screen
// otherwise) under its summary scope; saveNote: a free-form note in the CURRENT chapter, written
// like any notebook on the blank 'plain' page and then opened through openNewDrawNote — a NEW note for
// EVERY run (owner 2026-11-12); with `id` (that run's own follow-up or re-save) exactly that note's page 0
// text replaced in place (ink and images kept), a deleted one answering {gone:true}. `id` in the answer is the ☰ row id (the back pill's target). No
// monthSummary: chapter notes carry no months, and the chat scope here is the verse, so the thread
// is not bound to the saved note.
// TODO(R4 seam): BIBLE_SUMMARY + chatData are the Ask AI host hooks — move them to their own inlined part.
// A run's follow-up after the reader changed chapter (review 2026-11-12): read THAT chapter's file, replace only the
// run note's page 0 text, write the whole object back (every other key kept as read). Not loaded = not written (R5).
// key null (review 2026-11-23): a run's FIRST save after the reader moved on — a NEW note in the chapter the run was asked in.
async function summaryOffChapter(b,ch,key,html,period){
  const p=`notes/${b+1}-${ch}.json`, r=await DATA.read(p);
  if(!(r.status===DATA.ST.loaded&&r.data)&&!(key==null&&r.status===DATA.ST.absent)) return {ok:false,error:'无法读取该章 · that chapter could not be read'};
  const o=r.data||{notes:{},draws:{},chat:{},titles:{},pins:{}}, now=Date.now(); if(!o.draws) o.draws={};
  if(key==null){ let t=now; while(o.draws['free-'+t]) t++; key='free-'+t;
    o.draws[key]={v:2,id:key,created:now,updated:now,template:'plain',summary:period||undefined,pages:[{id:'p0',created:now,updated:now,strokes:[],pageHtml:html,images:[]}]}; }
  else { const d=o.draws[key]; if(!d||!Array.isArray(d.pages)||!d.pages.length) return {ok:false,gone:true};
    o.draws[key]=Object.assign({},d,{updated:now,pages:[Object.assign({},d.pages[0],{updated:now,pageHtml:html})].concat(d.pages.slice(1))}); }
  const w=await saveAnnAt(p,JSON.stringify(o)); return w&&w.ok?{ok:true,key,id:`file:${b}:${ch}:${key}`}:(w||{ok:false,error:'not saved'}); }
const SUMMARY_AT={};   // summary scope → {b,ch}: the chapter a run was asked in, so its first save lands there (review 2026-11-23)
const BIBLE_SUMMARY={
  run:async({scope,message,images,model})=>{   // images + model: the summary's page images and lane (note-features.md I)
    SUMMARY_AT[scope]={b:bookIdx,ch:chapter};
    if(!splitOn()){ if(await aiChat.open(scope)===false) return false; return aiChat.send(message,{attachments:images||[],model}); }
    rail.open(); rail.expand('chat'); if(await railChat.open(scope)===false) return false; return railChat.send(message,{attachments:images||[],model}); },
  saveNote:async({id:runId,html,period,quiet,scope})=>{   // quiet: written, not opened (the follow-up's second save, web/summary-followup.inline.html)
    if(ANN_BLOCKED) return {ok:false,error:ANN_BLOCKED};
    const rid=runId!=null?String(runId).split(':'):null;   // file:<bookIdx>:<chapter>:<key>, the row id the first save answered
    if(rid&&rid.length===4&&(Number(rid[1])!==bookIdx||Number(rid[2])!==chapter)) return summaryOffChapter(Number(rid[1]),Number(rid[2]),rid[3],html);   // the reader moved on: write THAT chapter's file
    const at=!rid&&SUMMARY_AT[scope]; if(at&&(at.b!==bookIdx||at.ch!==chapter)) return summaryOffChapter(at.b,at.ch,null,html,period);   // first save, reader moved on: a new note in the run's chapter
    const old=rid?rid[rid.length-1]:null; if(old&&!ANN.draws[old]) return {ok:false,gone:true};   // its run's note, by the row id it answered
    const now=Date.now(); let t=now; while(!old&&ANN.draws['free-'+t]) t++;   // two runs in one ms stay two notes
    const k=old||'free-'+t, prev=old?ANN.draws[k]:null;
    const page0=prev&&prev.pages&&prev.pages[0]?Object.assign({},prev.pages[0],{updated:now,pageHtml:html}):{id:'p0',created:now,updated:now,strokes:[],pageHtml:html,images:[]};
    ANN.draws[k]=prev?Object.assign({},prev,{updated:now,pages:[page0].concat(prev.pages.slice(1))}):{v:2,id:k,created:now,updated:now,template:'plain',summary:period||undefined,pages:[page0]};
    const r=await saveAnn(); if(!r||!r.ok){ if(prev) ANN.draws[k]=prev; else delete ANN.draws[k]; return r||{ok:false,error:'not saved'}; }
    renderDots(); if(!quiet) await openNewDrawNote(k); return {ok:true,key:k,id:`file:${bookIdx}:${chapter}:${k}`}; },
  onLink:async({id,page})=>{ const row=(await chatData.listAugment()).find(r=>r.id===id); if(row) row.onClick(id,{page}); },   // a [n] link in a summary (note-features.md F): the ☰ row's own open path, on that page
};
const chatData={
  summary:BIBLE_SUMMARY,               // the Summarize · 总结 button in the ☰ multi-select bar and Save as note (plan E)
  placeholder:'Ask about this passage…',
  // Strong SYSTEM directive — goes into the model's system message every turn. The fast-lane
  // Ollama models ignore a language instruction buried in the user turn, so it must be a system
  // message. Bilingual (Chinese + English keywords) per the user's standing preference.
  //
  // SCAR (2026-09-11): passage context was ONLY in contextPrefix (first user message). After 20
  // turns the Ollama lane drops that first message (convo.messages.slice(-20)) and the model
  // loses the "which verse" context entirely. A function re-evaluates every turn so the current
  // passage is always in the system message, even in long conversations.
  system:(k)=>{   // k: the thread's key — a summary thread (plan E) gets the component's ONE system line, not the verse study
    if(window.PADrawerSummary&&window.PADrawerSummary.isScope(k)) return window.PADrawerSummary.SYSTEM;
    const base='请用中文回答，关键术语保留英文（如 grace 恩典、faith 信心、covenant 圣约），简明扼要。Always reply in Chinese, keeping key scriptural/technical terms in English; be concise.';
    if(!selV.size) return 'You are a Bible study assistant. The user may ask about any book, passage, or topic in the whole Bible. '+base;
    return 'You are a Bible study assistant. We are studying '+scopeCtx()+'. Answer about this passage. '+base;
  },
  greeting:(k)=> k==='general' ? 'Ask anything about the Bible \u2014 any book, passage, or topic. '+"问圣经里任何经文或主题。" : `Ready \u2014 ask anything about ${scopeRef()}.`,
  contextPrefix:(body,k)=> (window.PADrawerSummary&&PADrawerSummary.isScope(k)) ? body : k==='general'
    ? `You are a Bible study assistant. The user may ask about any book, passage, or topic in the whole Bible. 请用中文回答，关键术语保留英文（如 grace 恩典、faith 信心、covenant 圣约），简明扼要。(Always reply in Chinese, keeping key scriptural/technical terms in English, concise.)\n\nQuestion: ${body}`
    : `Context: we are studying ${scopeCtx()}. Answer about this passage; 请用中文回答，关键术语保留英文，简明扼要。(Always reply in Chinese, keeping key terms in English, concise.)\n\nQuestion: ${body}`,
  getLabel:(k)=> (window.PADrawerSummary&&PADrawerSummary.isScope(k)) ? PADrawerSummary.titleOf(PADrawerSummary.periodOfScope(k)) : k==='general' ? 'Bible '+"圣经" : scopeRef(),   // chip in the chat list
  showMe,   // explain turns show header + verse, not the instructions
  enhance:(el)=>linkifyVerses(el),   // make verse references in AI replies clickable (fullscreen's ✕ closes)
  getConvoId:convoIdFor,
  // Deleting a conversation from the ☰ list must release the verse that points at it. Without
  // this the chapter file keeps naming a tombstoned file: the next ask sends a dead id, the
  // server quietly starts a fresh thread, and the list fills with one-exchange rows for the same
  // verse. Measured before the fix: 4 of 9 pointers dangling, 45 two-message conversations.
  unbindConvo:(id)=>{
    if(!id) return;
    let changed=false;
    if(GEN.chat===id){ GEN.chat=undefined; saveGen(); changed=true; }
    for(const k of Object.keys(ANN.chat||{})) if(ANN.chat[k]===id){ delete ANN.chat[k]; changed=true; }
    if(changed){ saveAnn(); renderDots(); }
  },
  // Awaited: convoMap is the ONLY pointer binding a chat to its verse — a dropped write orphans
  // the conversation, and the in-memory map hides that until the next reload.
  // THE CALLER DROPS THE PROMISE: web/chat-ui.inline.html setCid() is
  // `if(opts.setConvoId){ opts.setConvoId(k,id); return; }` — un-awaited — so this closure is the
  // ONLY place the outcome can be handled and it must be self-sufficient. It is: saveAnn/saveGen
  // put the reason on the (now fixed, now above-the-overlay) notice and schedule the retry
  // themselves. This write is also the exact V2 case — it only ever fires while PAChat's opaque
  // full-screen .pac-fs is open, which is what used to make its failure message invisible.
  // Returning the outcome costs nothing and makes the contract honest the day PAChat awaits it.
  setConvoId:async(k,id)=>{ let r;
    // Belt and braces with chat-ui's own guard: a chapter file must never grow a scope named
    // "null". One already exists in live data from before that guard — a conversation bound
    // to no verse, which every later unkeyed chat then overwrote.
    if(k===null||k===undefined||k==='') return {ok:true};
    // A summary thread (plan E) belongs to no verse: nothing in the chapter file names it (see docs/plans/note-features.md E limits).
    if(window.PADrawerSummary&&window.PADrawerSummary.isScope(k)) return {ok:true};
    if(k==='general'){ GEN.chat=id; r=await saveGen(); }
    else { ANN.chat=ANN.chat||{}; ANN.chat[k]=id; r=await saveAnn(); renderDots(); }
    return r; },
  listAugment:async()=>{
    const items=[];
    // general note
    if(GEN.note&&GEN.note.trim()) items.push({id:'__gen',title:'Bible 圣经 — General Note',preview:GEN.note.trim().slice(0,80),updated:Date.now(),onClick:()=>{ selV.clear(); updateFab(); openPanel('note',null,undefined,'__gen'); }});
    // all saved chapter notes/draws across every chapter
    const r=await paNotesList();
    // R5: a failed listing used to render as "you have no saved notes" — the same lie as V1, one
    // level up. An empty list is only reported as empty when the server actually said so.
    if(r&&r.ok) paNoticeOk(NOTES_LIST_KEY);
    else annNotice('无法列出笔记 · Could not list your notes — the list may be incomplete 列表可能不完整','',NOTES_LIST_KEY);
    const allNotes=(r&&r.ok&&r.notes)||[];
    for(const n of allNotes){
      const vNums=n.verseKey&&n.verseKey.startsWith('v')?n.verseKey.slice(1).split('.').map(Number):[];
      // ONE expression for this row's identity, used BOTH as the item id and as what the drawer
      // is told to keep highlighted. Deriving it twice is what let them disagree.
      const rowId=`file:${n.bookIdx}:${n.chapter}:${n.verseKey||''}`;
      const doOpen=(at)=>{ selV.clear(); vNums.forEach(v=>selV.add(v)); updateFab();   // `at`: a search hit's {page,boxes,terms}
        if(vNums.length){ const ve=[...document.querySelectorAll('.verse')].find(e=>+e.dataset.n===vNums[0]); if(ve) ve.scrollIntoView({behavior:'smooth',block:'center'}); }
        // A free-form key carries no verses, so it must be passed EXPLICITLY or openPanel
        // falls back to the general scope and shows a different (empty) note.
        const free=n.verseKey&&n.verseKey.startsWith('free-')?n.verseKey:null;
        setTimeout(()=>openPanel(free?'draw':(n.hasDraws?'draw':'note'),free,free?n.title:undefined,rowId,at),120); };
      items.push({id:rowId,title:n.title,preview:n.preview||'',chip:rowChip(n),updated:n.updated||0,created:n.created||0,doc:{path:chapterFile(n.bookIdx,n.chapter),scope:n.verseKey||''},onClick:(_id,at)=>{   // which file + draws key this row is, for the drawer's note search; `at` is the hit (phase 3)
        aiChat.hide();
        if(n.bookIdx!==bookIdx||n.chapter!==chapter){ goChapter(n.bookIdx,n.chapter).then(ok=>{ if(ok!==false) doOpen(at); }); }
        else doOpen(at);
      },onRename:(newTitle)=>renameChapterNote(n,newTitle),
        onPin:(flag)=>pinChapterNote(n,flag), pin:!!n.pin,
        onDelete:()=>deleteChapterNote(n)});
    }
    return items;
  },
};

// SURFACE hooks — what the chat SITS IN. Deliberately NOT shared. onShow tears down the draw pad
// because a full-screen chat COVERS it; in the split rail the pad is a sibling and dismissing it
// would be wrong. Passing this block through to the rail is the bug this separation prevents.
const aiChat=PAChat.fullscreen(Object.assign({}, chatData, {
  onNewNote:async()=>{ aiChat.hide(); await openNewDrawNote(); },
  // ✕ on the chat clears the chat's drawer highlight (PAChat side); if a note/draw surface is
  // still showing behind it, re-assert THAT as the active row — so peeking at a chat from within
  // a note never leaves the chat highlighted after closing it.
  onClose:()=>{ if(drawPad&&drawPad.isOpen&&drawPad.isOpen()) chatUI().setActiveNote(currentNoteId()); },
  // When the chat surface reveals itself (a chat row or ＋ tapped in the drawer), dismiss the
  // draw pad — it sits at the same z-level later in the DOM and would otherwise cover the chat.
  onShow:async()=>{ if(typeof drawPad!=='undefined'&&drawPad.isOpen&&drawPad.isOpen()) await drawPad.hide(); },
}));
// Rename / delete of a listed note. Hoisted out of the listAugment literal so they are named,
// testable units (R6) rather than closures nothing can reach. Both read-then-write the WHOLE
// chapter file, so both are exactly the shape V1 destroys: readChapterOrRefuse returns null on
// any read it could not complete, and null means NOTHING is written.
async function renameChapterNote(n,newTitle){
  const obj=await readChapterOrRefuse(n.bookIdx,n.chapter); if(!obj) return {ok:false,error:'无法读取 · unreadable'};
  obj.titles=obj.titles||{}; obj.titles[n.verseKey||'general']=newTitle;
  const r=await DATA.write(chapterFile(n.bookIdx,n.chapter), JSON.stringify(obj));
  if(!r.ok) annNotice('重命名未保存 · Rename not saved — '+r.error,'',chapterFile(n.bookIdx,n.chapter)); else paNoticeOk(chapterFile(n.bookIdx,n.chapter));
  // The write above went to the FILE; ANN is the in-memory copy the next saveAnn() serializes over
  // that same file. Renaming a note in the chapter that is currently open therefore has to land in
  // BOTH, or the stale ANN carries the OLD title and the next stroke undoes the rename. (Reading
  // titles back in loadAnn() fixes the omission; this fixes the staleness — the same revert, two
  // causes.) deleteChapterNote() solves it with a reload because it must also repaint the dots;
  // nothing rendered depends on a title, so one key is all this needs.
  if(r.ok&&n.bookIdx===bookIdx&&n.chapter===chapter){ ANN.titles=ANN.titles||{}; ANN.titles[n.verseKey||'general']=newTitle; }
  return r;
}
// Bookmark · 收藏 (plan D): `pins[key]=true` beside `titles`, in the chapter file and in the
// in-memory ANN of the open chapter, for the same two reasons renameChapterNote() names.
// TODO(R4 seam): chapter-note list actions (rename/pin/delete) → apps/bible/notes-actions.js
async function pinChapterNote(n,flag){
  const obj=await readChapterOrRefuse(n.bookIdx,n.chapter); if(!obj) return {ok:false,error:'无法读取 · unreadable'};
  obj.pins=obj.pins||{}; if(flag) obj.pins[n.verseKey||'general']=true; else delete obj.pins[n.verseKey||'general'];
  const r=await DATA.write(chapterFile(n.bookIdx,n.chapter), JSON.stringify(obj));
  if(!r.ok) annNotice('收藏未保存 · Bookmark not saved — '+r.error,'',chapterFile(n.bookIdx,n.chapter)); else paNoticeOk(chapterFile(n.bookIdx,n.chapter));
  if(r.ok&&n.bookIdx===bookIdx&&n.chapter===chapter) ANN.pins=obj.pins;
  return r;
}
async function deleteChapterNote(n){
  const obj=await readChapterOrRefuse(n.bookIdx,n.chapter); if(!obj) return {ok:false,error:'无法读取 · unreadable'};
  // Marks survive the note's delete unless the row IS only marks (the drawer row said `Mark` and nothing else).
  if(n.verseKey){ delete (obj.notes||{})[n.verseKey]; delete (obj.draws||{})[n.verseKey]; if(!n.hasDraws&&!n.hasText) delete (obj.marks||{})[n.verseKey]; delete (obj.titles||{})[n.verseKey]; delete (obj.pins||{})[n.verseKey]; }
  const r=await DATA.write(chapterFile(n.bookIdx,n.chapter), JSON.stringify(obj));
  if(!r.ok){ annNotice('删除未保存 · Delete not saved — '+r.error,'',chapterFile(n.bookIdx,n.chapter)); return r; }
  paNoticeOk(chapterFile(n.bookIdx,n.chapter));
  if(n.bookIdx===bookIdx&&n.chapter===chapter&&await loadAnn()){ renderDots(); VM.render(); INK.load(ANN.ink); }   // the deleted marks must leave the text too
  return r;
}

// ── Draw: the shared PANote engine as a full-screen overlay (single-canvas mode) ──
// Persistence is app-local: a chapter's notes, chat pointers, titles AND its handwriting all
// travel together in the ONE chapter file, written whole (see the ONE FILE PER CHAPTER block
// above). `let`, not `const`: PANote calls load() from inside its constructor (boot pull), so a
// `const` binding would still be in its temporal dead zone there and even `typeof drawPad` THROWs.
let drawPad;
// ── Legacy text notes ────────────────────────────────────────────────────────────────────────
// Before the pad became the only note surface a verse could hold BOTH a plain-text note in
// ANN.notes[k] and handwriting in ANN.draws[k] — two surfaces, two fields, one verse. They merge
// onto one page: the text becomes the page's text layer, the ink stays over it.
//
// The merge is ONE-WAY and completes on the next save, which deletes the old key in the SAME
// chapter write. Without that, editing the text in the pad would be overwritten by the stale
// ANN.notes copy on the next load — the merge would silently undo the user's own edit.
// A note's title follows its first line, recomputed on every save — the same rule the Journal
// app uses, so a note reads the same in both. Block tags become line breaks before the text is
// extracted; a pure-handwriting page has no text, so it falls back to the timestamped default.
const TITLE_MAX=40;
function derivedTitleOf(nb){
  try{
    const h=(nb&&nb.pages&&nb.pages[0]&&nb.pages[0].pageHtml)||'';
    const d=document.createElement('div');
    d.innerHTML=String(h).replace(/<\/?(?:br|div|p|li|h[1-6])\b[^>]*>/gi,'$&\n');
    const line=(d.textContent||'').split('\n').map(s=>s.trim()).find(Boolean)||'';
    return line.slice(0,TITLE_MAX);
  }catch(_){ return ''; /* unparsable pageHtml: falls back to the default title — cosmetic only */ }
}
// What the note is CALLED right now: its first line, else the verse it belongs to, else the
// timestamped default PANote and the server listing both use (R3 — one label, one format).
function noteTitleFor(k,nb){
  const derived=derivedTitleOf(nb);
  if(derived) return derived;
  if(String(k||'').startsWith('free-')) return freeNoteTitle(k);
  return scopeTitle();   // general included: the book + chapter it was opened from (owner 2026-11-15)
}
// One place paints it, so the slot header and the pad's own bar can never disagree.
function paintNoteTitle(t){
  if(rail) rail.setTitle('note',t);
  if(drawPad&&drawPad.setTitle) drawPad.setTitle(t);
}

function legacyText(k){ const t=(ANN.notes||{})[k]; return (typeof t==='string'&&t.trim())?t:''; }
const pageHasText=(p)=>!!(p&&typeof p.pageHtml==='string'&&p.pageHtml.trim());
const textToHtml=(t)=>esc(t).replace(/\n/g,'<br>');
function legacyNotebook(text){ const t=Date.now();
  return {v:2,id:'nb'+t,created:t,updated:t,template:'plain',bgColor:'#fdfdfb',
    pages:[{id:'p0',created:t,updated:t,strokes:[],pageHtml:textToHtml(text),images:[]}]}; }
function legacyMerged(nb,k){
  const text=legacyText(k);
  if(!text||!nb||!Array.isArray(nb.pages)||!nb.pages.length) return nb;
  const p=nb.pages[0], add=textToHtml(text);
  // APPENDS when the page already has text — it must never SKIP. The save that follows deletes
  // ANN.notes[k], so a merge that declined to carry the text across would delete a note the user
  // never saw moved. Appending is the only version of this that cannot lose the old note.
  // Recomputed from disk on every load, so it can persist at most once: the save that writes it
  // also removes the source key.
  p.pageHtml = pageHasText(p) ? (p.pageHtml+'<br>'+add) : add;
  return nb;
}

// ONE options object, two possible hosts. Exactly one pad is ever constructed: _drawScope is a
// single app-level variable and every save writes the WHOLE chapter, so two pads would show the
// same scope and their independent debounces would lose each other's handwriting.
const NOTE_OPTS={
  onAskImage:(im)=>askAboutImage(im),   // Ask AI in a selected picture's ⋯ menu
  pages:true,   // multi-page verse notes with page number/navigation
  // A verse note is a TEXT note that may also be drawn on, not a sketch pad: open in the text
  // tool on plain paper. Ruled was PANote's default and made every typed note look like a legal
  // pad. Existing notebooks keep whatever paper they were saved with.
  tool:'text', template:'plain',
  // History opens the drawer BESIDE the note, not over a blank chat. It used to hide the pad
  // and call showList(), which REVEALS the chat surface — so the drawer highlighted 活水
  // while the right side showed an empty new chat. The pad stays open now (the docked drawer
  // narrows it), so the highlighted row is the thing on screen. Durability was the reason for
  // the old hide(), not the disappearance — flush() gives that without leaving the note.
  onHistory:async()=>{ await drawPad.flush(); chatUI().showListOnly(); },
  // PANote's ✕ now AWAITS hide() (which returns the flush) before calling this, so the old
  // comment's claim that "hide() already flushed the save" is finally true.
  // ✕ on the pad closes the NOTE. It used to only flush and clear the drawer highlight, so the
  // pane stayed exactly where it was and the ✕ looked broken while the collapse caret did the job.
  onClose:()=>{
    renderDots(); chatUI().setActiveNote(null); chatUI().closeList();
    if(rail) rail.collapse('note'); else if(drawPad&&drawPad.hide) drawPad.hide();
  },
  // Returns a LOAD OUTCOME (PANote.LOAD / PA_LOAD), never data-or-null. The strokes live inside
  // the chapter file, so this pad's load status IS the chapter's: if loadAnn could not READ the
  // chapter, ANN is an empty object we invented, and opening a blank pad on top of it is exactly
  // how a chapter gets wiped. Report `failed` instead — the pad then refuses to write.
  load:async()=>{
    if(ANN_BLOCKED) return DATA.LOAD.failed(ANN_BLOCKED,'chapter_unreadable');
    const v=ANN.draws[_drawScope];
    // The notebook is inline in the chapter file the app has already READ, so this needs no second
    // request and has no second failure mode: either the chapter loaded (and this scope has a
    // notebook or provably does not) or ANN_BLOCKED refused above.
    if(isInlineNotebook(v)) return DATA.LOAD.loaded(legacyMerged(v,_drawScope));
    const legacy=legacyText(_drawScope);
    // A verse that only ever held a typed note has no notebook at all. Reporting `absent` would
    // open a BLANK pad over text the user can still see listed, and the first save would then
    // write that blank over it — so synthesise a one-page notebook carrying the text instead.
    return legacy ? DATA.LOAD.loaded(legacyNotebook(legacy)) : DATA.LOAD.absent();
  },
  // Which note the two closures above are pointed at, for PANote's per-note failure state (F2):
  // the chapter AND the scope, because both can change under the pad. A save failure filed under
  // this key can never be re-aimed at the next verse's notebook.
  noteKey:()=>`${bookIdx+1}-${chapter}/${_drawScope}`,
  doc:()=>({path:chapterFile(bookIdx,chapter),scope:_drawScope}),   // which file + draws key the open note is (PANote's Transcript row)
  // Returns the OUTCOME of the real write. `k` is captured synchronously, and openDrawFull
  // flushes the OUTGOING scope BEFORE reassigning _drawScope — the old order let a late save write
  // the previous verse's notebook into the INCOMING verse's key and destroy its handwriting.
  save:async(nb)=>{
    const k=_drawScope;
    if(ANN_BLOCKED) return {ok:false,error:ANN_BLOCKED};
    if(ANN_LOADING||_drawPath!==ANN_PATH) return {ok:false,error:NOTE_MOVED};
    const has=p=>p&&((p.strokes&&p.strokes.length)||(p.texts&&p.texts.length)||(p.pageHtml&&p.pageHtml.length)||(p.images&&p.images.length));
    const empty=!(nb&&Array.isArray(nb.pages)&&nb.pages.some(has));
    // An emptied scope drops out of the chapter file entirely — that is what makes the verse dot
    // disappear.
    // An empty note is never written: tapping "new note" and leaving discards it (Apple Notes
    // behaviour). Nothing is created until there is content, so there is NO delete path that
    // could race a still-pending save — the failure class that cost handwriting on 2026-09-04.
    if(empty){ if(k in ANN.draws){ delete ANN.draws[k]; const r=await saveAnn(); renderDots(); return r; } return {ok:true}; }
    // ONE write: the notebook goes into the chapter object and the whole chapter file is written.
    // Completes the one-way merge in the SAME chapter write: once the text lives in the notebook
    // the old ANN.notes key must go, or the next load re-injects it over the user's edit.
    if(ANN.notes&&(k in ANN.notes)) delete ANN.notes[k];
    ANN.draws[k]=nb; const r=await saveAnn(); renderDots();
    if(r&&r.ok){
      // The title follows the content, and a note that now exists belongs in the ☰ list. Both
      // happen HERE, on a successful write, so the drawer can never advertise a note the disk
      // does not have.
      paintNoteTitle(noteTitleFor(k,nb));
      const c=chatUI(); if(c&&c.refreshList) c.refreshList();
    }
    return r;
  },
  // Optional image IO — photo bytes route through the shell broker, keeping them out of
  // the page JSON. Only {path,x,y,w,h} lands in the notebook.
  // The reason a photo was refused — too large vs signed out vs the store being down — comes back
  // ALREADY RENDERED from the shell (`text`: the right noun, both languages and, for a size
  // rejection, the cap). Using it rather than the raw `error` is what stops "Photo too large ·
  // 照片过大 (max 20 MB)" from reading like a 401 (leftover (e)).
  uploadImage:async(file)=>{
    // R5: a missing component is NAMED. The pad's button guards too, but the paste/drop paths
    // reach this hook directly, so the one place that actually needs PAPhoto checks for it.
    if(!window.PAPhoto){ const why=PANote.PHOTO_TXT.noComponent; paNotice(why,'',UPLOAD_KEY); return {ok:false,error:why,text:why}; }
    // maxEdge is REQUIRED, not implied: PAPhoto.upload() only downscales when it is asked to
    // (capture() is the call that defaults it). Without it this hook would send the original —
    // and since the pad has stood down from its own pre-flight in favour of PAPhoto's, an 8MB
    // camera shot would go all the way to the server to earn a 413. DEFAULT_MAX_EDGE rather
    // than a literal 1600: the component owns that number (R3).
    const r=await window.PAPhoto.upload(file,{name:file.name||'image.png',what:'Photo',
      maxEdge:window.PAPhoto.DEFAULT_MAX_EDGE});
    if(r&&r.ok){ paNoticeOk(UPLOAD_KEY); return r.path; }
    const why=(r&&(r.text||r.error))||'上传被拒绝 · upload rejected';
    paNotice(PHOTO_FAILED+' — '+why,'',UPLOAD_KEY);
    return {ok:false,error:why,text:(r&&r.text)||''}; },   // an OUTCOME, so the pad's own flash carries the reason too
  imageUrl:async(path)=>{ const r=await paAttachUrl(path); return (r&&r.ok)?r.dataUrl:null; },
  // Diagnostics — PANote's "发送笔迹日志 · Send Pencil log" (ink popover) writes its Pencil recorder
  // here: debug/pencil-log-<time>.json in this app's own data namespace, through the same checked
  // write as an annotation. Timings, contact kinds and geometry: NOT the handwriting (inking moves
  // carry no x/y), and never text, images, ids or titles.
  saveLog:(path,text)=>DATA.write(path,text),
};

// ── The host follows the SCREEN, not the boot ────────────────────────────────────────────────
// Exactly one pad, hosted by whichever surface this screen can show.
//
// This was a bare `if(splitOn()){…}else{…}` that ran ONCE. An iPad booted in portrait therefore
// never gained the rail when it was rotated into landscape: the gate was read at boot and the
// answer stood until a reload. PASplit.onGate is the component's OWN gate watcher — there is
// exactly one matchMedia(GATE) in the page and this subscribes to it, rather than opening a
// second one here that could disagree with it (R3: GATE is a critical string).
//
// THE DATA RULE, and the reason this is not a straight teardown: _drawScope is a single
// app-level variable and every save writes the WHOLE chapter, so two live pads lose each other's
// handwriting (scars 2026-09-02, 2026-09-04). The outgoing pad is FLUSHED, then DESTROYED —
// which also unbinds its document/window listeners — before the incoming one is constructed.
// At no instant do two exist.
let _wide=null;
function mountHost(wide){
  if(wide){
    rail=PASplit.open({
      ratio:0.34,
      onToggle:()=>syncTopBtns(), onClose:()=>syncTopBtns(),   // pressed state follows the panes
      slots:[
        // Zones: the explanation sits BESIDE the verse you are reading; the note sits UNDER the text,
        // like a notebook under a book, with the full reading width for handwriting. Either can be
        // moved with the ⤓/⤒ control in its own header.
        // Collapsed until Ask AI is pressed. It used to be open by default, so opening a NOTE
        // revealed an empty chat pane beside it that nobody had asked for.
        { key:'chat', title:'问一问 · Ask AI', zone:'right', min:260, collapsed:true,
          mount:(host,r)=>{ railChat=PAChat.panel(Object.assign({host:host}, chatData, {
            // The rail's OWN onShow — deliberately not the full-screen one, which dismisses the draw
            // pad: here the pad is a sibling, so revealing the chat must leave it alone. PAChat calls
            // this before opening a conversation from the ☰ list and before a new chat, so tapping a
            // chat row expands this slot instead of loading a thread into a collapsed panel nobody
            // can see.
            onShow:()=>{ r.open(); r.expand('chat'); },
            // Closes the CHAT only. It used to close the whole rail, which took the note down with
            // it — two panels, two independent ✕s. An empty zone stops pushing on its own.
            onClose:()=>r.collapse('chat'),              // reveals PAChat's own ✕, beside ＋
            onNewNote:async()=>{ await openNewDrawNote(); },
          })); return railChat; } },
        // Collapsed until asked for: Ask AI must not surrender half the rail to an empty note.
        { key:'note', title:'笔记 · Note', zone:'bottom', min:200, collapsed:true,
          mount:(host)=>{ drawPad=PANote.panel(Object.assign({host:host}, NOTE_OPTS)); return drawPad; } },
      ],
    });
  } else {
    drawPad=PANote.fullscreen(NOTE_OPTS);
  }
}
// The PAD comes down FIRST, always: when the rail is the host the pad lives INSIDE it, so
// destroying the rail first would take the pad's DOM away before its last write had settled.
async function unmountHost(){
  if(drawPad){
    await drawPad.flush();                         // durability BEFORE anything else moves
    await drawPad.destroy();                       // …and unbind: a second live pad IS the scar
    if(drawPad.el&&drawPad.el.remove) drawPad.el.remove();
    drawPad=null;
  }
  if(rail){ rail.destroy(); rail=null; railChat=null; }   // chatUI() falls back to aiChat again
}
async function swapHost(wide){
  if(wide===_wide) return;                         // a media query can fire without crossing
  _wide=wide;
  // Asked BEFORE the teardown, and differently per host: a panel pad's isOpen() is always true
  // (it has no overlay to hide), so in the rail the real question is whether its slot is expanded.
  const wasOpen=rail?!rail.isCollapsed('note'):!!(drawPad&&drawPad.isOpen&&drawPad.isOpen());
  const scope=_drawScope;
  await unmountHost();
  mountHost(wide);
  // Reopened through the app's ONE opening path (R3), so the title paint, the unconditional
  // re-measure and the ☰ highlight are exactly the ones a tap produces.
  if(wasOpen) await openDrawFull(scope===scopeKey()?undefined:scope);
  syncTopBtns();                                   // the new host's panes, not the old one's
}
_wide=splitOn();
mountHost(_wide);                                  // boot stays SYNCHRONOUS: drawPad is assigned
                                                   // before any later top-level code reads it
// Serialised on one chain: two quick rotations must not run two swaps at once, which is precisely
// how a second pad gets built while the first is still flushing. A failure is REPORTED, never
// swallowed — the screen is now in a state no later rotation will repair on its own (R5).
let _swapping=Promise.resolve();
if(window.PASplit&&PASplit.onGate) PASplit.onGate(function(on){
  _swapping=_swapping.then(()=>swapHost(on)).catch(e=>{
    annNotice('布局切换失败 · Layout change failed — '+((e&&e.message)||e)+' — reload to recover 请重新加载','',GEN_PATH);
  });
});

// ── Paste an AI answer into a note as RICH TEXT ────────────────────────────────────────────
// DELETED HERE (leftover f, round 3): this app's own markdown-paste converter — paRenderMd via
// broker kind 'render-md', mdToNoteHtml/noteBlocks/noteInline/insertNoteHtml and a
// document-level capture-phase `paste` listener. The ENGINE owns paste now
// (web/note-ui.inline.html onPaste, bound to its own text layer, converting with its exported
// mdToHtml/looksLikeMarkdown/plainToHtml and sanitising before insertion).
// Two handlers ran on ONE paste event: this one fired first (capture), called preventDefault and
// then rendered ASYNCHRONOUSLY, while the engine's own listener still ran on the same event and
// inserted the text synchronously — so a pasted answer landed twice, in two different dialects,
// and R3's "one markdown parser" was false. One owner, one dialect, one insertion.
// Nothing app-side replaces it: the pad is now the app's ONLY text surface, and the engine
// owns paste there.

// ── Daily Reading ──
// Cycles through all 1189 Bible chapters, one per day, by day index since Unix epoch.
function dailyRead(){
  const totalChapters=BOOKS.reduce((s,b)=>s+b[2],0);
  let idx=Math.floor(Date.now()/86400000)%totalChapters, b=bookIdx, c=chapter;
  for(let i=0;i<BOOKS.length;i++){
    if(idx<BOOKS[i][2]){ b=i; c=idx+1; break; }
    idx-=BOOKS[i][2];
  }
  goChapter(b,c).then(ok=>{ if(ok===false) return;   // superseded: another chapter is showing
    const [en,zh]=BOOKS[bookIdx];
    const b=document.getElementById('daily-banner');
    // No arbitration with the failure surface any more — they are different elements now, so a
    // greeting can never hide a "not saved" report and a report can never suppress the greeting.
    b.textContent=`☀️ 今日晨读 · ${zh} 第${chapter}章 · ${en} ${chapter}`;
    b.classList.add('show');
    setTimeout(()=>b.classList.remove('show'),5000);
  });
}
document.getElementById('daily-btn').onclick=dailyRead;

// ── ⚙ Settings · 设置 ────────────────────────────────────────────────────────────────────────
// The shared PASettings panel, mounted into this app's OWN header bar so it reads as part of the
// app rather than as a second chrome. It is the LAST child of #nav, i.e. the right-hand end.
//
// Guarded on the component existing at all — the same shape splitOn() uses — so an app page
// served without the PA_SETTINGS_UI marker still boots instead of white-screening on a missing
// global. (web.mjs skips a marker it cannot find, silently, with a 200.)
//
// appPrompt is this app's OWN system prompt, the one chatData sends with every turn. Handing it
// over lets the panel complete the precedence chain (your override -> this node's default -> the
// app's own) and SAY which one is in force, rather than showing an empty box for a prompt that is
// very much in effect. Read from chatData so there is exactly one copy of that text (R3).
// chatData.system is a function (re-evaluated per turn) — call it to get a plain string before
// handing it to postMessage; functions are not structured-cloneable and postMessage would throw.
// ── Explain-prompt editor — lives inside the ⚙ Settings panel as an extra section ────────────
const EP_FILE='explain-prompt.json';
// Through DATA, not raw paLoad/paSave. DATA is the ONE reader for this app: it tells "absent"
// apart from "unreadable" (a damaged file must never read as "no override"), and a refused write
// is reported and blocks the path instead of vanishing. test/app-load.test.mjs pins that every
// write in this app goes through DATA.write for exactly that reason.
DATA.read(EP_FILE).then(r=>{
  if(r&&r.status===DATA.ST.loaded&&r.data&&typeof r.data.prompt==='string') _explainPromptOverride=r.data.prompt||null;
});

if(window.PASettings&&PASettings.available){
  window.PAVerseOrderHost=true;   // shows the 经文顺序 row in the dialog (PASettingsRows)
  PASettings.attach({
    host:document.getElementById('nav'), onSave:readOrder,
    appPrompt:chatData.system(),
    extras:[{
      label:'解经提示词 · Explain prompt',
      hint:'长按经文时的提示，留空则使用默认。 · What to ask when you long-press a verse. Leave blank to restore the default',
      getValue:()=>_explainPromptOverride!==null?_explainPromptOverride:EXPLAIN_PROMPT_BODY,
      onCommit:async(v)=>{
        const r=await DATA.write(EP_FILE, JSON.stringify({prompt:v}));
        if(r&&r.ok) _explainPromptOverride=v||null;
        return r;
      }
    },INK_READOUT]
  });
}

// ── Start ──
let _openDrawOnLoad=false;
(()=>{ const h=location.hash.match(/^#b(\d+)c(\d+)(:draw)?$/); if(h){ const bi=parseInt(h[1]),ch=parseInt(h[2]); if(bi>=0&&bi<BOOKS.length&&ch>=1){ bookIdx=bi; chapter=Math.min(ch,BOOKS[bi][2]); bookSel.value=bookIdx; _hashBoot=true; if(h[3]) _openDrawOnLoad=true; } } })();
// Boot. Neither promise is awaited (nothing is waiting on them) but neither is SWALLOWED: a
// failed general-note read blocks writes to general.json and puts its reason on the notice, and
// a failed chapter read does the same for the chapter — both inside the functions themselves,
// which is what makes a dropped promise safe here (R5).
// ── Ask AI: beside the text when there is room, over it when there is not ────────────────────

// Auto-explain fires ONCE per conversation. Four ways it must stay silent, each a real failure:
//   - no verse selected — there is nothing to explain;
//   - the chapter is unreadable (ANN_BLOCKED) — convoIdFor would report "no thread" for a scope
//     whose thread we merely failed to READ, and we would then talk over an existing
//     conversation. An unreadable chapter is not a fresh one (R14: a failed read is not a clean
//     result);
//   - the boot load has not finished — the same lie, for one tick;
//   - a thread already exists — reopening a verse restores it. Re-asking on every tap is a model
//     call the user never requested and cannot see coming.
// `force` is a LONG PRESS: an explicit, deliberate "explain this one". It asks again even when a
// thread already exists, because the user asked again — that is the whole point of the gesture,
// and it is the one case where re-spending a model call is what was requested.
// _booted still gates it: before the chapter load resolves we cannot tell WHICH thread a reply
// belongs to, so a forced ask would start a duplicate conversation for a verse that already has
// one. That resolves in milliseconds.
function shouldExplain(k,force){
  if(!_booted || !selV.size) return false;
  if(force) return true;
  return !ANN_BLOCKED && !convoIdFor(k);
}

// ⋯ on a selected picture in the note → Ask AI about THAT picture (as the Journal does, owner 2026-11-15).
// Attached by path: the photo is already on the node, so no second upload.
const IMAGE_ASK_PROMPT=(ref)=>'Read this picture from my notes on '+ref+': transcribe any text, then help me study it with the passage · '+
  '请读这张图（转写其中的文字），再结合 '+ref+' 帮我学习。';
async function askAboutImage(im){
  const key=scopeKey(), ref=scopeRef(), b0=bookIdx, c0=chapter;   // before any await: a verse or chapter change mid-open must not split thread and prompt
  let chat=aiChat, opened;
  if(splitOn()){ rail.open(); rail.expand('chat'); opened=await railChat.open(key); chat=railChat; }
  else opened=await aiChat.open(key);
  if(opened===false||scopeKey()!==key||bookIdx!==b0||chapter!==c0){ annNotice('选择已改变 · Selection changed — 请重新提问 · ask again','',NOTES_LIST_KEY); return; }   // a superseded open returns normally: the chat now shows another thread
  if(!chat.attach({name:'picture.jpg',path:im.path})){ annNotice('无法附加图片 · Could not attach the picture','',NOTES_LIST_KEY); return; }
  if(await chat.send(IMAGE_ASK_PROMPT(ref))===false) annNotice('正在回答中 · Still answering — 请稍后再问 · ask again in a moment','',NOTES_LIST_KEY);
}
async function askAI(opts){
  const force=!!(opts&&opts.force);
  const k=scopeKey(), ref=scopeRef(), b0=bookIdx, c0=chapter, moved=()=>scopeKey()!==k||bookIdx!==b0||chapter!==c0;   // before any await: thread, passage and prompt stay one
  const msg=explainMsg(ref);   // the whole prompt, verse text included, read now
  if(!splitOn()){
    const fresh=shouldExplain(k,force);
    if(await aiChat.open(k)===false||moved()) return;   // superseded, or the selection moved meanwhile: never send into the wrong thread
    if(!fresh) return;
    if(await aiChat.send(msg)===false){
      annNotice('正在回答中 · Still answering — 请稍后再问 · ask again in a moment','',NOTES_LIST_KEY);
    }
    return;
  }
  rail.open(); rail.expand('chat');
  const fresh=shouldExplain(k,force);
  if(await railChat.open(k)===false||moved()) return;   // AWAITED — the send below depends on it; false = superseded, never send into the new thread
  if(!fresh) return;
  // PAChat discards a send while a turn is still streaming (`if(sending) return;`). Unreported,
  // that leaves an empty pane that reads as "the model said nothing" (R5).
  // AWAITED: send() is async, so the unawaited call resolves to a Promise and `===false` could
  // never have matched — the report below would have been dead code.
  if(await railChat.send(msg)===false){
    annNotice('正在回答中 · Still answering — 请稍后再问 · ask again in a moment','',NOTES_LIST_KEY);
  }
}


// ── Long-press a verse: ask the AI about it, now ─────────────────────────────────────────────
// A tap selects a verse; a HOLD asks about it. Pressing again re-asks, deliberately — see the
// `force` note on shouldExplain.
//
// Delegated on #verses because the verse nodes are rebuilt on every chapter load; per-node
// handlers would be re-attached each time and the stale ones leak.
const LONG_PRESS_MS=500;       // below ~400ms a slow tap fires it; above ~700ms it feels broken
const LONG_PRESS_SLOP=10;      // px of finger drift still counted as "held", not "scrolled"
let _lpTimer=null, _lpX=0, _lpY=0, _lpFired=false;
function lpCancel(){ if(_lpTimer){ clearTimeout(_lpTimer); _lpTimer=null; } }

function longPressVerse(n,el){
  _lpFired=true;
  lpCancel();
  // iOS may still have started a word selection under the finger even with callout suppressed;
  // leaving it behind puts a blue highlight and a handle over the text while the panel opens.
  try{ const sel=window.getSelection&&window.getSelection(); if(sel&&sel.removeAllRanges) sel.removeAllRanges(); }
  catch(e){ /* no Selection API here: nothing was selected, so nothing to clear */ }
  // The gesture means "explain THIS verse", so it replaces the selection rather than adding to
  // it — holding a second verse must not ask about both.
  selV.clear();
  document.querySelectorAll('#verses .verse.selected').forEach(function(e){ e.classList.remove('selected'); });
  selV.add(n); el.classList.add('selected');
  updateFab(); hideBackPill(); followSelection();   // an open note pane follows too
  askAI({force:true});
}

;let _penPress=false;   // the last press on the verse list came from the Pencil
// Palm rejection (owner 2026-11-22): writing with the Pencil, the side of the hand rests on the glass.
// iPad sends it as a FINGER, so it long-pressed a verse (Ask AI) and started an iOS word selection
// (Highlight). A finger that lands while the Pencil is down or within PALM_WINDOW_MS of its last
// event is a palm: no long-press, no tint, no selection. Later deliberate finger presses still work.
// TODO(R4 seam): this press / long-press / palm block -> bible/verse-press.js when this file is split.
const PALM_WINDOW_MS=600;
let _lastPen=-Infinity, _penDown=0, _palmHeld=0, _fingers=0, _palmClick=false;
const palmGuard=()=>_penDown>0||_palmHeld>0||Date.now()-_lastPen<PALM_WINDOW_MS;
function clearSel(){
  try{ const sel=window.getSelection&&window.getSelection(); if(sel&&sel.rangeCount&&sel.removeAllRanges) sel.removeAllRanges(); }
  catch(e){ /* no Selection API here: nothing was selected, so nothing to clear */ }
}
(function(){
  const wrap=document.getElementById('verses');
  if(!wrap) return;
  const palmIds=new Set(), liveFingers=new Set();
  // Only a Pencil ON the glass counts: hover (buttons 0, no pressure) must not swallow finger taps.
  const penSeen=(e)=>{ if(e.pointerType==='pen'&&(e.buttons!==0||e.pressure>0)) _lastPen=Date.now(); };
  document.addEventListener('pointermove',penSeen,{capture:true,passive:true});
  for(const t of ['pointerup','pointercancel']) window.addEventListener(t,function(e){
    if(e.pointerType==='pen'){ _penDown=Math.max(0,_penDown-1); _lastPen=Date.now(); return; }
    if(e.pointerType==='touch'){ _fingers=Math.max(0,_fingers-1); liveFingers.delete(e.pointerId); }
    if(palmIds.delete(e.pointerId)){ _palmHeld=palmIds.size; _palmClick=true; _lastPen=Math.max(_lastPen,Date.now()); clearSel(); }   // the window runs on past a lifted palm
  },{capture:true,passive:true});
  // A palm resting on the glass while the Pencil is down: stop iOS's own long-press selection at the
  // source. Only then — a lone finger (link tap, scroll, swipe) is never cancelled here.
  wrap.addEventListener('touchstart',function(e){
    const ts=[...(e.touches||[])];
    if(ts.some(t=>t.touchType==='stylus')&&[...(e.changedTouches||[])].some(t=>t.touchType!=='stylus')) e.preventDefault();
  },{passive:false});
  document.addEventListener('selectstart',function(e){ if(palmGuard()&&wrap.contains(e.target)) e.preventDefault(); });
  document.addEventListener('selectionchange',function(){ if(palmGuard()) clearSel(); });
  // Set in the DOCUMENT capture phase: the ink layer's own capture listener on #verses stops a
  // Pencil pointerdown before wrap's listeners run. A finger press tints its verse here (.press).
  let pressed=null; const unpress=()=>{ if(pressed){ pressed.classList.remove('press'); pressed=null; } };
  document.addEventListener('pointerdown',function(e){
    if(!wrap.contains(e.target)) return;
    if(e.pointerType==='pen'){ _penPress=true; _penDown++; _lastPen=Date.now(); lpCancel();
      // Palm first, Pencil second: every finger already resting is a palm from now on.
      if(liveFingers.size){ for(const id of liveFingers) palmIds.add(id); _palmHeld=palmIds.size; unpress(); clearSel(); }
      return; }
    _palmClick=false;
    if(e.pointerType==='touch'){ _fingers++; liveFingers.add(e.pointerId); }
    if(e.pointerType==='touch'&&palmGuard()){ palmIds.add(e.pointerId); _palmHeld=palmIds.size; lpCancel(); return; }
    unpress(); pressed=e.target.closest?e.target.closest('.verse'):null; if(pressed) pressed.classList.add('press');
  },{capture:true,passive:true});
  for(const t of ['pointerup','pointercancel']) window.addEventListener(t,function(e){ if(e.pointerType!=='pen') unpress(); },{capture:true,passive:true});
  window.addEventListener('blur',unpress); wrap.addEventListener('scroll',unpress,{passive:true});
  wrap.addEventListener('pointerdown',function(e){
    const v=e.target&&e.target.closest?e.target.closest('.verse'):null;
    _penPress=e.pointerType==='pen';         // Pencil writes; it never selects or long-presses (owner 2026-11-13)
    lpCancel(); _lpFired=false;              // cleared here too: a press that never produced a
    if(!v||_penPress) return;                // click would otherwise swallow the NEXT one
    if(palmIds.has(e.pointerId)||_fingers>1) return;   // a palm, or a second finger (pinch/scroll): never a long-press
    _lpX=e.clientX; _lpY=e.clientY;
    const n=+v.dataset.n, at=Date.now();
    // Re-checked when it fires: the Pencil may arrive AFTER the palm, or a second finger join it.
    _lpTimer=setTimeout(function(){ _lpTimer=null; if(_lastPen>=at||_fingers>1||_palmHeld) return; longPressVerse(n,v); },LONG_PRESS_MS);
  },{passive:true});
  wrap.addEventListener('pointermove',function(e){
    if(!_lpTimer) return;
    if(Math.abs(e.clientX-_lpX)>LONG_PRESS_SLOP||Math.abs(e.clientY-_lpY)>LONG_PRESS_SLOP) lpCancel();
  },{passive:true});
  wrap.addEventListener('pointerup',lpCancel,{passive:true});
  wrap.addEventListener('pointercancel',lpCancel,{passive:true});
  // A long press is followed by a click, which would run selectVerse and toggle the selection
  // straight back off. Swallow exactly that one click, in the CAPTURE phase so it never reaches
  // the verse's own handler.
  wrap.addEventListener('click',function(e){
    if(_penPress){ _penPress=false; e.stopPropagation(); e.preventDefault(); return; }   // a Pencil tap: no verse selection
    if(_palmClick){ _palmClick=false; e.stopPropagation(); e.preventDefault(); return; }   // a palm lifting: no verse selection, no link
    if(!_lpFired) return;
    _lpFired=false; e.stopPropagation(); e.preventDefault();
  },true);
})();

loadGen(); load().then(ok=>{ _booted=true; if(ok!==false&&_openDrawOnLoad){ openPanel('draw'); } });
// TODO(R4 seam): this PAAppBar wiring + the #nav/search chrome → bible/host-chrome.js when this file is split.
// The app's own bar (PAAppBar, ADR 0032): ← Home and A-/A+ in #nav; it slides away as the reading
// pane scrolls down and returns on scroll up or at the top. Never while search or a sheet is open.
// Held open while anything opened from the bar is up: search, drawer, the Highlight sheet (.pvm-sheet), a
// dialog, the pen sheet, or the Note / Ask AI pane — in the rail, or full screen on a phone.
const BAR_KEEPS_OPEN='#search-overlay.on,.pac-drawerhost.on,.pvm-sheet,dialog[open]';
const barPaneUp=()=>(rail?(paneOpen('note')||paneOpen('chat')):!!(drawPad&&drawPad.isOpen()))||!!(aiChat.isOpen&&aiChat.isOpen());
if(window.PAAppBar) PAAppBar.attach({bar:document.getElementById('nav'),scroller:document.getElementById('verses'),
  keepOpen:()=>INK_PEN.isOpen()||barPaneUp()||markVerses().length>0||!!document.querySelector(BAR_KEEPS_OPEN)});   // + a selected verse or words: Highlight / Note / Ask AI are in the bar (F2-06)
</script>
</body>
</html>
