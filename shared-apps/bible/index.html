<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Bible 圣经</title>
<style>
:root{--bg:#f4f4f2;--card:#fff;--text:#1c1e1d;--muted:#6b7370;--line:#e2e2de;--accent:#0f6355;--danger:#983d24;--sab:env(safe-area-inset-bottom,0px);--fs:1}
@media(prefers-color-scheme:dark){:root{--bg:#111514;--card:#1b201f;--text:#e5e8e6;--muted:#8f9894;--line:#2a302e;--accent:#57c2ac;--danger:#e08163}}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,system-ui,sans-serif;line-height:1.5}
html{font-size:calc(17px * var(--fs,1))}   /* A-/A+ scale, broadcast by the shell (pa:'prefs' fontScale) */
body{display:flex;flex-direction:column}
/* Nav */
#nav{display:flex;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--card);flex-shrink:0;flex-wrap:wrap;row-gap:6px}   /* wraps when the 44px touch buttons do not fit (iPad 820) */
#search-overlay{position:fixed;inset:0;background:var(--bg);z-index:30;display:none;flex-direction:column}
#search-overlay.on{display:flex}
#search-bar{display:flex;gap:6px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;border-bottom:1px solid var(--line);background:var(--card)}
#search-inp{flex:1;min-width:0;font:inherit;font-size:15px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;outline:none}
#search-results{flex:1;overflow-y:auto;padding:6px 0}
.sr{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.sr:active{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.sr-ref{font-size:12px;font-weight:700;color:var(--accent);margin-bottom:2px}
.sr-txt{font-size:14px;line-height:1.45}
.sr mark,.sr b{background:color-mix(in srgb,var(--accent) 22%,transparent);border-radius:3px;padding:0 2px}
.sl-hint{padding:24px 18px;color:var(--muted);font-size:14px;text-align:center}
#book-sel{flex:1;min-width:96px;font:inherit;font-size:14px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.ch-btn{background:var(--card);border:1px solid var(--line);border-radius:8px;width:36px;height:36px;font-size:20px;cursor:pointer;color:var(--text);display:flex;align-items:center;justify-content:center;flex-shrink:0}
#ch-end{display:flex;gap:10px;justify-content:center;padding:18px 12px 28px}
.ch-step{font:inherit;font-size:14px;font-weight:600;background:var(--bg);color:var(--accent);border:1px solid var(--line);border-radius:10px;padding:10px 16px;min-height:44px;cursor:pointer}
.ch-step:disabled{opacity:.4;cursor:default}
#ch-label{font:inherit;font-size:14px;font-weight:600;min-width:52px;flex-shrink:0;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 4px;text-align:center}   /* chapter drop-down */
/* Verses */
#verses{flex:1;overflow-y:auto;padding:8px 10px calc(76px + var(--sab))}
#loading{padding:40px;text-align:center;color:var(--muted);font-size:15px}
.verse{padding:10px 12px;border-radius:10px;margin-bottom:5px;cursor:pointer;border:1.5px solid transparent;transition:background .12s;
  /* Long-press asks the AI about this verse. Without this, iOS answers the same gesture
     with its own Copy/Look Up bubble on top of the panel that just opened. */
  -webkit-touch-callout:none}
.verse.press{background:color-mix(in srgb,var(--accent) 8%,transparent)}   /* press feedback, set by a FINGER pointerdown only (not :active, which a Pencil also lights) */
.verse.selected{background:color-mix(in srgb,var(--accent) 11%,transparent);border-color:color-mix(in srgb,var(--accent) 28%,transparent)}
.vnum{font-size:11px;font-weight:700;color:var(--accent);margin-bottom:3px;display:flex;align-items:center;gap:5px}
.ndot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex-shrink:0}
.ven{font-size:1.125em;line-height:1.6}
.vzh{font-size:1.0625em;line-height:1.7}
.vnum+div{margin-bottom:6px}.vnum+div+div{color:var(--muted)}   /* 经文顺序: the first line is the text, the second muted, whichever language orderLines put first */
/* FAB */
/* Top bar pane toggles (plan item 1): pressed = that pane is open. Narrow screens wrap the label. */
#top-panes{margin-left:auto;display:flex;gap:6px;flex-shrink:0}
.top-pane{font:inherit;font-size:13px;padding:0 10px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;white-space:nowrap}
.top-pane.on{background:var(--accent-fill,var(--accent));color:#fff;border-color:var(--accent)}
.top-pane:disabled{opacity:.45;cursor:default}
/* Phone: one short line per control (owner 2026-11-13: the bilingual labels wrapped to two lines); the full
   label stays the accessible name (aria-label) and the tooltip. */
@media(max-width:600px){.top-pane{padding:0 7px}.top-pane[data-short]{font-size:0}.top-pane[data-short]::after{content:attr(data-short);font-size:13px}
  /* Phone: 5 icons + book + 3 panes do not fit in 375px, and body is overflow:hidden (clips, never scrolls) — the panes wrap to a 2nd row. */
  #nav{flex-wrap:wrap;row-gap:6px}#book-sel{min-width:72px}}
/* Panel overlay */
.pane{flex:1;overflow:hidden;display:none;flex-direction:column}
.pane.on{display:flex}
/* Ask AI is a full-screen, app-level surface (PAChat's own header is the identity) */
/* Note pane */
/* Draw is now a full-screen PANote overlay (web/note-ui.inline.html), not an in-sheet pane. */
/* AI pane */
/* Daily reading banner — the ☀️ greeting ONLY. It used to double as the save-failure surface,
   which is exactly the V2 defect: a static in-flow element painted under every overlay, plus a
   greeting and a data-loss report fighting over one element. The failure surface is now its own
   fixed element (PA_NOTICE below) and this one is back to doing one thing. */
#daily-banner{display:none;background:var(--accent-fill,var(--accent));color:#fff;text-align:center;font-size:13px;font-weight:600;padding:7px 12px;flex-shrink:0;letter-spacing:.01em}
#daily-banner.show{display:block}
/* ══ PA_NOTICE_CSS_BEGIN ══ the save/load-failure surface, mirrored verbatim in every app ══
   V2 SCAR (2026-09-02, round 2): this app's only save-failure surface was a STATIC in-flow
   element with no position and no z-index, so PAChat's .pac-fs and PANote's .pan-fs — both
   position:fixed, z-index:50, background:var(--card), i.e. FULLY OPAQUE — painted straight over
   it. The one message that reports a lost write was invisible exactly when it fired: the chat
   pointer write (setConvoId) only ever runs while that overlay is open. A static element cannot
   use z-index at all, which is why the fix is position:fixed FIRST and z-index second.
   --pa-notice-z must beat every layer that can be on screen in these apps:
       #panel 10 · #back-chat 12 · #search-overlay 30 · .pac-fs 50 · .pan-fs 50 ·
       .pac-drawerhost 60 · .pac-lb 1000 (the chat's image lightbox)
   2000 clears all of them with room for a future overlay, and test/app-load.test.mjs recomputes
   this ladder from the real component files — a new overlay that outranks the notice fails the
   build instead of hiding it.
   --pa-notice-top is the vertical slot: BELOW every surface's top control row (this app's #nav
   is 57px, PAChat's .pac-top ~51px, PANote's .pan-top ~ safe-area+47px) so the notice can never
   cover ☰ / ✕ and trap the user inside an overlay, and BELOW PANote's own .pan-save pill
   (top 78px, ~32px tall) so the two failure surfaces never overlap.
   V6 (round 3): the surface now holds ONE message PER PATH and a tap dismisses the one on
   screen (the next takes the slot), so it is a control, not a label — hence cursor:pointer. */
:root{--pa-notice-z:2000;--pa-notice-top:118px}
.pa-notice{position:fixed;top:calc(var(--pa-notice-top) + env(safe-area-inset-top,0px));
  left:50%;transform:translateX(-50%);z-index:var(--pa-notice-z);
  max-width:calc(100vw - 24px);width:max-content;display:none;cursor:pointer;
  padding:8px 14px;border-radius:999px;background:var(--danger,#c8433b);color:#fff;
  font-size:12.5px;font-weight:600;line-height:1.35;text-align:center;
  box-shadow:0 3px 14px rgba(0,0,0,.3)}
.pa-notice.on{display:block}
.pa-notice.info{background:var(--accent,#0f6355)}
/* ══ PA_NOTICE_CSS_END ═══════════════════════════════════════════════════════════════════ */
/* Clickable verse references inside AI replies */
.vref{color:var(--accent);border-bottom:1px dashed color-mix(in srgb,var(--accent) 55%,transparent);cursor:pointer;font-weight:600;white-space:nowrap}
.vref:active{background:color-mix(in srgb,var(--accent) 16%,transparent);border-radius:3px}
/* Floating pill to return to the chat after jumping to a referenced verse */
#back-chat{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + var(--sab));z-index:12;display:none;align-items:center;gap:6px;background:var(--accent-fill,var(--accent));color:#fff;border:0;border-radius:22px;padding:9px 16px;font:inherit;font-size:14px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.28);cursor:pointer}
#back-chat.show{display:inline-flex}
#back-chat:active{filter:brightness(.93)}
/* The draw pad narrows with the docked drawer, like the chat surface does. It used to be
   pinned full-width here, because the push changed the pad's width WITHOUT firing a resize
   event and the canvas kept its old backing size — ink then drifted right of the pen. That
   cause is fixed at the source (a ResizeObserver on the stage re-measures on any width
   change, whatever caused it), so refusing the push now only means the drawer covers the
   page the user is trying to see. */
</style>
</head>

<script>
// ── Broker ──
let _id=0; const _wait={};
window.addEventListener('message',e=>{
  const m=e.data;
  if(m&&m.pa==='res'&&_wait[m.id]){ const keep=(m.ev&&!m.done); _wait[m.id](m); if(!keep) delete _wait[m.id]; }
});
function paBible(book,chapter){ return new Promise(res=>{ const id=++_id; _wait[id]=res; parent.postMessage({pa:'req',id,kind:'bible',book,chapter},'*'); }); }
function paLoad(path){ return new Promise(res=>{ const id=++_id; _wait[id]=res; parent.postMessage({pa:'req',id,kind:'data',path},'*'); }); }
// paSave RESOLVES THE OUTCOME — {ok:true} or {ok:false,error} — and every caller below checks it.
// SCAR 2026-09-02: this resolved the raw broker reply, nobody read it, and the annotation file for
// one chapter (58-10.json, 64,892 B) was the single file OVER the old 64KB body cap — every save
// of it was rejected in total silence. It also had no deadline. The ok-vs-not rule and the
// deadline both live in PANote (R3 — one definition shared by every app).
function paSave(path,data){ return new Promise(res=>{ const id=++_id;
  const t=setTimeout(()=>{ delete _wait[id]; res({ok:false,error:'保存超时 · save timed out'}); },PANote.SAVE_TIMEOUT_MS);
  _wait[id]=m=>{ clearTimeout(t); res(PANote.saveOutcome(m)); };
  parent.postMessage({pa:'req',id,kind:'save-data',path,data},'*'); }); }
// Image IO for PANote's optional photo hooks — bytes go through the shell (uploads/ store),
// so they never bloat the chapter's annotation JSON (which is body-size capped). upload
// takes raw base64 (the server base64-decodes); attach-url resolves a stored path to a data: URL.
function paAttachUrl(path){ return new Promise(res=>{ const id=++_id; _wait[id]=res; parent.postMessage({pa:'req',id,kind:'attach-url',path},'*'); }); }
// paUpload + fileToB64 used to live here: a private FileReader and a private `upload` postMessage,
// one of FOUR copies of that pair in the tree, and the only one with no downscale — so a phone
// photo was refused outright by the pad's cap instead of being resized to fit. Both are now
// window.PAPhoto.upload (web/photo-ui.inline.html), which arrives with PAChat (R1/R3).
// ══ PA_DATA_CORE_BEGIN ══ DOM-FREE ON PURPOSE ═════════════════════════════════════════════
// test/app-load.test.mjs extracts everything between the PA_DATA_CORE markers out of EVERY app
// that carries it and runs it against a real HTTP server, so nothing in here may touch
// document/window. The block is byte-identical in all four copies (Notes and Bible, template and
// live), and that test fails the build if they drift — R3 enforced by a machine instead of by a
// promise. The shelf's copies in shared-apps/ follow at the owner's next promote.
//
// THE V1 SCAR (2026-09-02, round 2): every failure to READ was indistinguishable from "the file
// does not exist". The shell relay answered {ok:false,error:'not found'} for a 401 (expired
// session / restarted server), for a 500 and for every network rejection alike; the app then
// applied a 1.5s deadline that RESOLVED NULL, treated null as "a new empty note", and the next
// save wrote an empty notebook over the user's good data. Measured on the real writer:
// 800 strokes / 40 pages / 47,076 B → 1 stroke / 1 page / 198 B, answered 200 {"ok":true}; and
// 50 index entries / 7,399 B → 0 entries / 20 B, also 200 {"ok":true}.
//
// THE V6 SCAR (2026-09-02, round 3) — the rule above shipped with an ESCAPE HATCH. `soft:true`
// said "a failure here blocks nothing", and its only caller was a second store of the user's
// unsaved work. So a file we could not read stayed WRITABLE and was then overwritten on the
// strength of an unrelated success. Measured: 184 unconfirmed strokes, the only copy, emptied to
// {v:1,pages:[]}; no notice, green pill. The hatch is DELETED, and in round 4 so was that second
// store (see web/note-ui.inline.html "DELETED HERE"). Blocking is PER PATH, so it never bought
// anything anyway.
// The same rule has a second half, and it is what now protects a PER-PAGE note: a path that was
// NEVER READ is not known either. A write that REPLACES whatever a path holds — every page file,
// every index, every tombstone, {replaces:true} — is refused until THIS session has established
// what that path holds: a read of the SAME path that resolved `loaded` or EARNED `absent`.
//
// THE RULE NOW: a read resolves exactly ONE of three states and never collapses them —
// loaded / absent / failed, the engine's contract (web/note-ui.inline.html `const LOAD`).
// `failed` never creates and never overwrites: the path is BLOCKED for writing until some later
// read of it succeeds. A wrongly-`failed` read only makes the app refuse to write (recoverable,
// visible); a wrongly-`absent` read destroys the file (unrecoverable, silent). So every
// undecidable case resolves to `failed`, and `absent` must be EARNED — see the two evidence
// steps in makeReader below.
const LOAD_TIMEOUT_MS=20000;
// The engine owns the reply→outcome rule (R3) and this app CONSUMES it: PA_LOAD IS PANote.LOAD
// (web/note-ui.inline.html, exported on window.PANote). There is no copy to fall back on: this app
// reads PANote at load anyway (PANote.PHOTO_TXT), so a copy could never run, and it had drifted
// from the engine's rule (ADR 0015, amendment).
const PA_LOAD=PANote.LOAD;
const PA_ST=PA_LOAD.STATUS;
// The refusal a REPLACE-ONLY write gets when this session never established what the path holds.
const PA_UNKNOWN='本次未读取 · not read this session — refusing to replace it 拒绝覆盖';
// io = { load(path)->Promise<brokerReply>, save(path,text)->Promise<{ok,error}>, now?, timeoutMs? }
function makeReader(io){
  const timeoutMs=io.timeoutMs||LOAD_TIMEOUT_MS;
  const blocked=new Map();               // path -> bilingual reason; a blocked path is never written
  const known=new Set();                 // paths whose CONTENT this session established: loaded, or PROVEN absent
  let allBlocked='';                     // app-wide stop (e.g. the note index itself is unreadable)
  // clearTimeout matters: Promise.race settles, but the loser's timer keeps running. Without
  // this every read left a 20s timer armed — harmless-looking in a browser, but it is a real
  // leak (one per read, and a notebook reads many pages) and it held Node's event loop open
  // for the full LOAD_TIMEOUT_MS after the tests had finished.
  const deadline=(pr)=>{ let t; return Promise.race([pr,new Promise(r=>{ t=setTimeout(()=>r({__late:true}),timeoutMs); })]).finally(()=>clearTimeout(t)); };
  // A failed read blocks ITS OWN path — ALWAYS, for every caller, with no opt-out (V6). It also
  // drops the path from `known`: whatever we thought was there, we no longer know.
  const fail=(path,err,code)=>{ const out=PA_LOAD.failed(err,code);
    known.delete(path); blocked.set(path,out.error); return out; };
  const ok=(path,out)=>{ blocked.delete(path); known.add(path); return out; };
  // "This file is missing" is only believable when its BACKUP is missing too. A file that has
  // been saved twice has a rolling previous generation at <path>.bak (lib/appdata.mjs
  // maybeBackup), so a readable .bak PROVES the file existed — which turns "missing" back into a
  // per-file read fault (a 500 out of sendFile, a half-deleted file) and never into a licence to
  // start blank and overwrite. Anything but a PROVEN-absent backup withholds that licence.
  // Cost: one extra 404 on a genuinely new file. Runs for EVERY caller, with no opt-out: a page
  // file that answers "missing" when its index names it is a fault, not an empty page.
  async function absentEarned(path){
    const m=await deadline(io.load(path+'.bak'));
    if(m&&m.__late) return false;
    return PA_LOAD.fromBroker(m).status===PA_ST.absent;
  }
  // opts = { mustExist:true  a listing the app JUST read named this file, so "no such file" is a
  //                          fault (it vanished between the listing and the read), never a new
  //                          file to start blank from. Use it only where something really did
  //                          prove existence — an index row alone does NOT, because a row whose
  //                          content write failed at creation must stay openable rather than be
  //                          locked out for ever. }
  // There is deliberately no `soft` any more: see the V6 scar above.
  async function read(path,opts){
    const o=opts||{};
    const m=await deadline(io.load(path));
    if(m&&m.__late) return fail(path,'读取超时 · read timed out','timeout');
    const out=PA_LOAD.fromBroker(m);
    if(out.status===PA_ST.loaded) return ok(path,out);
    // Every non-loaded outcome that is not a PROVEN absence is a failure — including a reply that
    // carried no code at all, which is what the shell used to send for a 401/500/network drop.
    if(out.status===PA_ST.failed) return fail(path,out.error,out.code);
    if(o.mustExist) return fail(path,'已列出却读不到 · listed but missing — refusing to recreate it 拒绝重建','vanished');
    return (await absentEarned(path)) ? ok(path,out)
      : fail(path,'存在旧版本 · a previous version exists — refusing to start blank 拒绝以空白开始','bak_present');
  }
  // EVERY write goes through here: a path we could not READ is a path we must not WRITE.
  // opts = { replaces:true   this write DESTROYS whatever the path currently holds (a page file,
  //                          an index, a tombstone). It needs more than "not blocked": the path
  //                          must be KNOWN — read to `loaded` or PROVEN absent in this session —
  //                          or a file nobody in this app has ever looked at is replaced blind. }
  async function write(path,text,opts){
    const why=allBlocked||blocked.get(path);
    if(why) return {ok:false,error:why};
    if(opts&&opts.replaces&&!known.has(path)) return {ok:false,error:PA_UNKNOWN};
    return io.save(path,text);
  }
  return {
    read, write, LOAD:PA_LOAD, ST:PA_ST, UNKNOWN:PA_UNKNOWN,
    blockedReason:(p)=>allBlocked||blocked.get(p)||'',
    isKnown:(p)=>known.has(p),
    // A path the app is CREATING: an id it has just minted, which nothing has ever written to.
    // That is the ONE way a path becomes known without a read, and it exists because the
    // alternative is worse: a brand-new note's very first page file could never be written at all
    // ({replaces:true} refusing an unread path), so the note could not be created.
    // It is the app's claim rather than the store's, so it is deliberately a separate call with
    // exactly one legitimate caller ("I generated this id a line ago"), and a path whose read has
    // FAILED cannot be claimed this way — evidence beats assertion.
    fresh:(p)=>{ if(!blocked.has(p)) known.add(p); },
    block:(p,why)=>{ known.delete(p); blocked.set(p,why); },
    unblock:(p)=>{ blocked.delete(p); },
    blockAll:(why)=>{ allBlocked=why||''; },
    anyBlocked:()=>!!allBlocked||blocked.size>0,
  };
}
// ══ PA_DATA_CORE_END ══════════════════════════════════════════════════════════════════════
// ══ PA_NOTICE_JS_BEGIN ══ mirrored verbatim in every app; the WHY is in the CSS block ══════
// ONE persistent, bilingual failure surface per app — and every message on it is KEYED BY THE
// PATH IT IS ABOUT. It is NOT a toast: a message about work that did not reach disk stays up
// until THAT PATH is confirmed, or the user dismisses it by tapping it.
//
// V6 SCAR (2026-09-02, round 3): the surface was one anonymous slot and `paNotice('')` wiped it.
// Every app called that on the next confirmed read or write of ANY path — loadAnn() of a
// different chapter, saveGen() of the general note, a note switch — so a chapter whose save had
// been REJECTED lost its own report (and, one global slot again, its retry ladder) the moment an
// unrelated file succeeded. A lost write could end up visible to nobody. A report may now be
// retired ONLY by paNoticeOk(<its own path>) or by the user's tap; success on any other path
// cannot touch it.
//
// Two or more live reports: errors outrank info, the newest of the winning kind takes the slot,
// and the rest are COUNTED in the suffix — a second failure can never silently hide the first.
// `kind` is 'err' by default; 'info' is the same slot in the accent colour, for a recovery or
// progress message that is not a failure. Never console-only (R5); `alert` is not a fallback
// either — the sandbox has no allow-modals, so it is a no-op here.
const PA_NOTICES=new Map();                        // key (the PATH it is about) -> {msg,kind,n}
let _paSeq=0, _paShown='';
const PA_MORE=(n)=>' (+'+n+' more 其他)';
function paRenderNotice(){

// Resolves false when a newer load() superseded this one: a .then() that acts on THIS chapter must stop.
async function load(){
  const g=++_loadSeq;
  if(_rhBoot) await restoreReading(g);             // boot only: the last chapter read, unless the hash chose one. Later loads stay synchronous up to loadAnn (its read gate)
  if(g!==_loadSeq) return false;                         // a newer load started during the boot restore: it owns the chapter
  const b0=bookIdx, c0=chapter;
  selV.clear(); updateFab();
  fillChapters();
  const wrap=document.getElementById('verses');
  wrap.innerHTML='<div id="loading">加载中… · Loading…</div>';
  INK.load([]);                                    // the last chapter's undo history and ink go now, not after the read
  const annOk=await loadAnn(); if(g!==_loadSeq) return false;   // superseded: the newer load draws its own chapter
  if(annOk){ followSelection(); INK.load(ANN.ink); }   // AFTER the read: an open pane re-opens on THIS chapter's notes (a new chapter has no selection: the whole-Bible state), never the last one's
  // annOk false = a later read (☰ delete) owns ANN and loads the ink itself. The ink goes in before the text: a failed text load must never keep the last chapter's groups
  const timeout=new Promise(res=>setTimeout(()=>res(null),10000));
  const r=await Promise.race([paBible(bookIdx+1, chapter), timeout]);
  if(g!==_loadSeq) return false;                         // superseded while the text loaded: never paint an old chapter or its timeout over the new one
  if(!r){ wrap.innerHTML='<div id="loading">无法加载 · Could not load — 请检查网络后重试 · check the connection and retry</div>'; return; }
  const vs=(r.ok&&r.data&&r.data.verses)?r.data.verses:[];
  renderVerses(vs); if(vs.length&&g===_loadSeq&&b0===bookIdx&&c0===chapter) recordWhenRead(g,b0,c0);   // a superseded load never records
}

// verse note is one thing with one surface. The Save button went with them — the pad

function renderDots(){
  const av=annotatedVerses();
  document.querySelectorAll('#verses .verse').forEach(el=>{
    const n=+el.dataset.n, vnum=el.querySelector('.vnum');
    if(vnum) vnum.innerHTML=`${n} ${hasAnnotation(n,av)?'<span class="ndot"></span>':''}`;
