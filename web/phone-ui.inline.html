<!-- PAPhoneUI — the ONE phone bottom sheet（底部面板）and the phone list sizes (journal-iphone step 3, rule 5).
     Inlined by web.mjs into any page carrying the PA_PHONE_UI marker (chat-ui carries it, so every PAChat page,
     the Journal and the Bible included, gets it with no app code).
     PHONE MODE = a viewport narrower than 768px AND a coarse pointer (the same rule as PANotePhone). Everything
     here is inside that media query or behind isPhone(): on an iPad or a desktop nothing changes.
     A menu or panel becomes the bottom sheet by carrying the class `pa-sheet`:
       · PAChat's pacSheet (the list's ⋯, a row's ⋯, the tag entries) adds it on a phone;
       · PANote adds it to its colour/size, Page settings, photo, header ⋯ and tool ⋯ panels.
     The sheet is fixed to the bottom edge, full width, rounded on top, and beats a panel's inline placement
     (positionPop / pacSheet write left/top inline), hence the !important.
     API: PAPhoneUI.MQ, PAPhoneUI.isPhone() → bool, read at use time (no switch).
     Driven by test/phone-ui.test.mjs and test/phone-sheet-e2e.test.mjs (WebKit iPhone 390 + iPad 820). -->
<style id="pap-style">
@media (max-width:767.98px) and (pointer:coarse){
  .pa-sheet{position:fixed!important;left:0!important;right:0!important;bottom:0!important;top:auto!important;
    transform:none!important;width:auto!important;min-width:0!important;max-width:none!important;max-height:70vh!important;
    overflow-y:auto!important;border-radius:16px 16px 0 0!important;
    padding:6px 10px calc(12px + env(safe-area-inset-bottom,0px))!important;box-shadow:0 -6px 24px rgba(0,0,0,.22)!important;z-index:40!important}
  /* The grab line says "sheet": it is decoration, not a control (a tap outside or ✕/Cancel closes). */
  .pa-sheet::before{content:'';display:block;flex:none;width:36px;height:4px;border-radius:2px;background:var(--line,#d0d0d0);margin:2px auto 6px}
  .pa-sheet button{min-height:44px}
  /* The list on a phone (audit #8): tag chips at least 12px, the search box a 44px target. */
  .pac-ltag{font-size:12px!important}
  .pac-q{min-height:44px}
}
</style>
<script id="pap-script">
(function(){
  if(window.PAPhoneUI) return;
  const MQ='(max-width: 767.98px) and (pointer: coarse)';
  function isPhone(){
    try{ return !!(window.matchMedia&&window.matchMedia(MQ).matches); }
    catch(_){ return false; /* no matchMedia: never phone mode, so the iPad/desktop path is the default */ }
  }
  window.PAPhoneUI={MQ,isPhone};
})();
</script>
