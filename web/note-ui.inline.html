<!-- PANote — the ONE canonical handwriting/note engine. Single source of truth,
     the sibling of PAChat (web/chat-ui.inline.html). Inlined into any app's HTML at
     serve time wherever the PA_NOTE_UI marker appears (web.mjs). The sandbox CSP is
     `script-src 'unsafe-inline'` with no 'self', so a shared engine CANNOT be a
     <script src>; serve-time inlining of this one file is the only way to single-source
     it (same contract as PAChat). It never touches the network: every read/write goes
     through app-supplied load/save closures (which use the app's own broker).

     The engine is the hardened vector engine ported faithfully from the Journal app
     (workspace/apps/notes) — coalesced pen samples, palm rejection, pressure→width,
     rAF incremental render, per-page undo, sanitize-on-load. Preserve those properties.

     Notability-class toolset (all tools apply in BOTH pages:true and pages:false modes):
       pen · marker · highlighter · eraser · box-select · rich-text · image · redo · full color.
     Text is a WORD-PROCESSOR page: selecting the T tool turns the whole page content area into
     ONE contenteditable RICH-TEXT region (bold/italic/underline, size, colour, bullet + numbered
     lists) — you put the cursor and type, text flows top-to-bottom and wraps at the page width,
     the page scrolls as it grows (like the Journal app's .jtext, NOT a small positioned box).
     The region is an HTML surface BENEATH the ink canvas — NOT fillText pixels — so mixed
     formatting + lists render; handwriting always paints on top of it (and of pictures, which
     live on the same canvas), the way a pen annotates a printed page. It is pointer-events:none
     in the drawing tools; it travels with .pan-pageInner on a page-flip. The formatting
     bar shows only while the T tool is active (docked over the iOS keyboard via visualViewport,
     floated at the page top on desktop). The page's rich HTML is stored as page.pageHtml
     (sanitized); legacy positioned {texts[]} boxes and old plain {text} entries migrate into it
     on load (concatenated top-to-bottom by y — positions dropped, a document flows).
     File-size note (R4): this canonical engine exceeds the 300-line budget because the
     CSP forbids splitting a shared component across files (see the ADR); functions are
     kept small instead — with ONE declared exception, makeSaveGuard, which is a single
     state machine (dirty / in-flight / failed / blocked / locked / carried). Its
     inner functions are each small; the factory is long because splitting it would mean
     exporting that state so the pieces could share it, which is how the flush latch and the
     unguarded first write got in. Judged the worse trade, deliberately, not overlooked.

     Usage in an app:
       <div id="pad"></div>               (any positioned, full-size container)
       PA_NOTE_UI                         (the HTML-comment marker, once in <body>)
       <script> const pad = PANote.mount(document.getElementById('pad'), {
                  pages:true,                       // multi-page (Journal) vs single canvas
                  // REQUIRED LOAD CONTRACT (R3) — an OUTCOME, never data-or-null:
                  //   load: async()=> PANote.LOAD.loaded(notebook)   // the file was READ; here it is
                  //                 | PANote.LOAD.absent()          // the store PROVED there is no file
                  //                 | PANote.LOAD.failed(err,code)  // could NOT read it (see below)
                  // Map a broker reply with PANote.LOAD.fromBroker(m) — it answers `absent` ONLY for
                  // an explicit not-found code/404 and `failed` for everything else (401, 5xx, a
                  // network reject, a timeout, corrupt JSON).
                  // (SCAR 2026-09-02 V1: every READ failure was indistinguishable from "no file" —
                  // the shell answered {ok:false,error:'not found'} for a 401, a 500 AND every fetch
                  // rejection, the app collapsed that to `null` on a 1.5s deadline, PANote opened a
                  // blank notebook and the next autosave wrote it over a 40-page note. So a load
                  // that cannot PROVE absence now LOCKS the pad: no write of any kind is issued for
                  // that note until a load succeeds. `null`/`undefined`/a throw = failed, on purpose.)
                  load: async()=> PANote.LOAD.absent(),
                  // REQUIRED CONTRACT: save resolves {ok:true} or {ok:false,error}.
                  // Anything else — including `undefined` from a fire-and-forget helper — is
                  // treated as a FAILURE, which is what makes the banner + retry possible.
                  // (SCAR 2026-09-02: the old contract was `async(dataObj)=>{}`, i.e. the closure
                  // was not even allowed to report failure, so a 413 was structurally invisible.)
                  // save(nb) — PANote calls this debounced, with the WHOLE notebook. One note is
                  // one atomic file; a store must never split it (see "ONE ATOMIC WHOLE-NOTEBOOK
                  // WRITE PER NOTE" beside makeSaveGuard for the measured reasons).
                  save: async(dataObj)=> ({ok:true}),
                  // OPTIONAL but strongly recommended for any app with more than one note:
                  //   noteKey: ()=> '<stable id of the note load/save currently point at>'
                  // A save failure is filed against the key that was current when the write was
                  // cut, so switching notes can never re-aim it at another note's notebook, and
                  // coming back to a note whose write never landed re-surfaces that report.
                  // OPTIONAL: which FILE the open note is, for the Transcript row in page settings
                  // (web/note-text.inline.html reads the node's index by it): null = not saved yet.
                  //   doc: ()=> ({path:'entry-3.json', scope:''})   // scope: the notebook's key in the file (omit = any)
                  onHistory: ()=> {},               // optional: shows a History button
                  // OPTIONAL: an app-supplied paste converter. PANote owns the paste event for its
                  // own text region — an app must NOT add a paste listener (two handlers on one
                  // paste inserted the text twice; that was the round-2 regression). Supply the
                  // renderer instead; its HTML is re-sanitized to the note's allow-list.
                  //   pasteConverter: async(plainText)=> htmlString
                  //   uploadMaxBytes: 6*1024*1024   // photo size the app's store will accept
                  // OPTIONAL image IO — keeps photo bytes OUT of the notebook JSON (which is
                  // capped by the broker's save-data body limit). When BOTH are supplied the
                  // "Add photo" button appears; if either is absent the button is hidden.
                  //   uploadImage: async(file) => path        // store bytes, return an opaque path
                  //   imageUrl:    async(path) => dataURL      // resolve a stored path to a data: URL
                  // Both the Journal app and the Bible Draw pane wire these to their shell
                  // broker: uploadImage → kind:'upload' (returns an uploads/ path);
                  // imageUrl → kind:'attach-url' (returns a data: URL). See web/index.html.
                });
       </script>
     Or PANote.fullscreen(opts) for a full-screen overlay (top bar carries History + ✕),
     mirroring PAChat.fullscreen(). -->
<style id="pan-style">
/* Chrome (toolbars) is theme-aware; the paper itself is always white — like Notability,
   a handwriting page reads as paper regardless of OS dark mode, keeping ink legible. */
.pan{position:absolute;inset:0;overflow:hidden;background:var(--pan-bg,#eceded);
  font-family:-apple-system,system-ui,sans-serif;-webkit-tap-highlight-color:transparent;
  /* A finger press must not start a text selection / callout — that "selects the whole
     page" and swallows strokes until dismissed. Suppress selection across the whole pad
     (there is no selectable text here, only canvas + buttons). */
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  --pan-toolstop:calc(env(safe-area-inset-top,0px) + 8px)}
@media(prefers-color-scheme:dark){.pan{--pan-bg:#0d1110}}
.pan *{box-sizing:border-box;margin:0}
/* Optional top bar (only rendered when onHistory/onClose/title given — e.g. fullscreen). */
/* z-index 12 keeps ☰ / ✕ ABOVE the locked-note curtain (z-index 8): a note that could not be
   read must still be leavable — the user has to be able to open another note or close the pad. */
.pan-top{position:absolute;top:0;left:0;right:0;z-index:12;display:flex;align-items:center;gap:8px;
  padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 8px;
  background:var(--card,#fff);border-bottom:1px solid var(--line,#e6e6e6)}
.pan-hbtn{display:flex;align-items:center;gap:4px;color:var(--accent,#0f6355);font-size:13px;font-weight:600;
  background:color-mix(in srgb,var(--accent,#0f6355) 12%,transparent);border:none;border-radius:8px;padding:6px 10px;cursor:pointer}
.pan-htitle{flex:1;text-align:center;font-size:14px;font-weight:600;color:var(--text,#111);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pan-hx,.pan-hprint,.pan-hask,.pan-hmore,.pan-hphoto{background:none;border:none;color:var(--muted,#888);font-size:20px;cursor:pointer;width:30px;flex-shrink:0}
/* Lit while its panel is open — the only header button that owns a popover, so without this the
   panel looks like it belongs to nothing. */
.pan-hmore.on,.pan-hphoto.on{color:var(--accent,#0f6355)}
.pan-i{width:19px;height:19px;display:block;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.pan-i.pan-ifill{fill:currentColor;stroke:none}
/* Every button that now holds an icon instead of a glyph has to CENTRE it: a glyph sat on the
   text baseline, an <svg> is a block box. One rule for all of them rather than a size per button. */
.pan-tbtn,.pan-hx,.pan-hprint,.pan-hask,.pan-fmtbtn,.pan-grip{display:inline-flex;align-items:center;justify-content:center}
/* MODE BUTTONS · 模式按钮. The header used to be ☰ / title / ✨ / ⎙ with 12 tool buttons and 6
   page buttons parked on the page below it — 22 controls competing for a surface whose whole job
   is to be blank. Draw and Text are now TABS: the resting state is the header alone, and a tab
   reveals only its own row. Same controls, one row at a time, chosen rather than all present.
   Sized as real tap targets (min 44px) — these are the two most-pressed controls in the app. */
.pan-hmode{display:flex;align-items:center;justify-content:center;gap:5px;min-width:44px;min-height:34px;
  padding:6px 10px;border:none;border-radius:9px;background:none;cursor:pointer;flex-shrink:0;
  color:var(--muted,#888);font-size:13px;font-weight:600;-webkit-tap-highlight-color:transparent}
.pan-hmode.on{background:color-mix(in srgb,var(--accent,#0f6355) 14%,transparent);color:var(--accent,#0f6355)}
.pan-hmode .pan-mlbl{font-size:12px}
@media (max-width:520px){ .pan-hmode .pan-mlbl{display:none} }
/* Below 900px (iPad portrait beside the docked list, the app bar's Home · A- · A+ in the row) the header wraps
   onto a 2nd line instead of pushing Print off the right edge (F3-02); barClearance reads its height. */
@media (max-width:900px){ .pan-top{flex-wrap:wrap;row-gap:4px} }   /* TODO(R4 seam): the header CSS → its own part */   /* on a phone the glyph carries it */
/* PHONE HEADER · 手机标题栏 (phone audit #4): under 600px Photo and Print fold into the ⋯ menu (.pan-ovf, which also
   holds Page settings), so ☰ · title · ✨ · Draw · Text · ⋯ fit ONE row and the title keeps its room. A docked tool
   bar still takes the 2nd row (the wrap rule above). Automatic by width — no phone/desktop switch. */
@media (max-width:600px){ .pan-top{column-gap:4px;padding-left:6px;padding-right:6px} .pan-top .pan-hphoto,.pan-top .pan-hprint{display:none} }
.pan-ovf{gap:2px;padding:6px;width:max-content}
.pan-ovf button{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border:none;background:none;border-radius:9px;
  font:inherit;font-size:15px;color:var(--text,#111);text-align:left;cursor:pointer;white-space:nowrap}
.pan-ovf button .pan-i{color:var(--muted,#888)}
/* A control row that its tab has not asked for. !important because the dock/drag machinery
   writes inline styles onto these bars and would otherwise win. */
.pan-bar.pan-off{display:none!important}
/* Page area; the flip layer and page group live inside. */
.pan-stage{position:absolute;inset:0;overflow:auto;background:var(--pan-bg,#eceded);
  -webkit-overflow-scrolling:touch}
.pan-pageInner,.pan-flip{position:absolute;inset:0;will-change:transform}
/* The page-turn overlay is a PICTURE of the outgoing page, never an input surface: a nib that
   landed on it while a flip settled reached no handler and the Pencil wrote nothing until
   re-gripped (owner's iPad, swipe-to-flip ON). A finger driving the flip is captured before it
   shows. See A NIB THAT LANDS WHILE A PAGE-TURN SETTLES in the routing. */
.pan-flip{display:none;z-index:2;pointer-events:none;box-shadow:0 0 24px rgba(0,0,0,.28)}
.pan-bg,.pan-ink{position:absolute;inset:0;width:100%;height:100%;display:block}
/* touch-action:none on the ink surface so the browser never claims pen movement for
   scroll/zoom; we drive page-flips ourselves from touch gestures. */
.pan-ink{touch-action:none;z-index:2}
/* Ink paints ABOVE the typed text (.pan-textlayer is z-index:1): handwriting is an annotation on
   the page, so a stroke across a typed line or a picture must show, never hide under the glyphs.
   Paint order and hit order are the same axis for a stacked element (the 2026-09-30 scar: a raised
   canvas swallowed every tap meant for the text), so the two are separated explicitly: while the
   T tool is active (.pan-editing on the pad root) the canvas is transparent to pointer events and
   the text layer beneath takes the taps. The canvas keeps its place in the paint order, so switching
   tools never reorders what is on the page. ADR 0021.
   TODO(R4): grows this over-budget file; the split seam is this whole <style> block → web/note-ui.css,
   served beside the engine. */
.pan-editing .pan-ink{pointer-events:none}
/* A finger MAY pan the page — but only when it is not being used to draw, and never while the
   pen owns the surface. touch-action:none blocked panning outright, which on a phone left the
   readable-width page unreachable. Page-flip is an EDGE-gutter gesture, so the middle of the
   page was free all along. penNear() keeps palm rejection intact: a palm resting mid-sentence
   must not scroll the page out from under the nib. */
.pan-ink.pan-canpan{touch-action:pan-x pan-y}
/* The writing-area guard: in the drawing tools the WHOLE stage refuses native gestures (defensive:
   today the page covers the stage except mid-page-turn, when the sliding page box uncovers it). Toggled with the
   tool by syncGuard() (off in the T tool, where the text needs native scrolling). touch-action
   intersects down the tree, so this also overrides .pan-canpan above while it is on. Finger
   scrolling is manual here (the routing drives scrollTop) — see THE WRITING-AREA GUARD. */
.pan-stage.pan-guarded{touch-action:none}
/* The bar guard: in the drawing tools a palm resting on the title row or a bar (page-nav, the tool
   row docked or floating) cannot START a native pan, pinch-zoom, selection or callout there.
   Toggled on the pad by syncGuard() with .pan-guarded (off in the T tool). Every descendant too,
   so no button inside is left with touch-action:auto. Clicks are unaffected (no touchstart
   preventDefault here); a bar that overflows is dragged sideways by THE BAR GUARD in the routing.
   The selectors are GUARDED_BARS there — test/note-bar-guard.test.mjs pins one rule per member. */
.pan-barguard .pan-top,.pan-barguard .pan-top *,.pan-barguard .pan-bar,.pan-barguard .pan-bar *{
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
/* Edge gutters: thin left/right strips that capture a FINGER edge-swipe page-flip while the
   T tool is active (the full-page contenteditable would otherwise swallow the touch). They are
   pointer-events:none by default so in the drawing tools BOTH finger and Pencil pass straight
   through to the ink surface (the Pencil draw path is never involved); .pan-editing (set only
   while the T tool is active) turns them on. Interior touches miss the 28px strip and reach the
   text region for caret/scroll. */
.pan-gutter{position:absolute;top:0;bottom:0;width:var(--pan-edge,28px);z-index:4;
  pointer-events:none;touch-action:none;background:transparent}
.pan-editing .pan-gutter{pointer-events:auto}
.pan-gutterL{left:0}.pan-gutterR{right:0}
/* Toolbars float over the page with safe-area insets. */
.pan-bar{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;
  background:var(--card,#fff);border:1px solid var(--line,#e6e6e6);border-radius:14px;padding:6px;
  box-shadow:0 3px 14px rgba(0,0,0,.18);z-index:5;max-width:calc(100vw - 12px);overflow-x:auto;-webkit-overflow-scrolling:touch}
/* Tool bar lives at the BOTTOM (one panel with the colors, like the reference app). */
.pan-tools{bottom:calc(env(safe-area-inset-bottom,0px) + var(--pan-toolsbottom,8px))}
/* ── Top docking ── Both the tool bar AND the T-mode formatting bar can dock to the TOP (they ride
   the shared makeMovable drag machinery + a shared makeDock — no duplicate drag/dock code).
   FULLSCREEN: a bar slides inline into the .pan-top title row, flowing as a normal flex child next
   to the title. MOUNT (no title bar): it pins to the surface's top edge as a centred strip.
   Dragging the grip back down undocks it to its floating home. */
.pan-top .pan-docked{position:static;transform:none;left:auto;top:auto;bottom:auto;
  background:none;border:none;box-shadow:none;border-radius:0;padding:0;max-width:none;overflow-x:auto}
.pan-docktop{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);bottom:auto;left:50%;transform:translateX(-50%)}
/* Mount mode: when the tool bar is also docked at the top, the formatting bar rides one row below
   it (--pan-dockrow = the tool-bar strip height, set when the tool bar docks; 0 when it floats).
   The extra selector specificity also makes the fixed .pan-fmt honour position:absolute here. */
.pan-fmt.pan-docktop{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px + var(--pan-dockrow,0px))}
/* Drop-target hint: a top accent line on the dock target while a bar hovers the dock band. */
.pan-dockhint{box-shadow:inset 0 3px 0 0 var(--accent,#0f6355)}
/* Grip: drag the bar to move it, tap to collapse it to just the grip. */
.pan-grip{border:none;background:none;color:var(--muted,#6b7370);font-size:15px;line-height:1;cursor:grab;
  padding:0 4px;touch-action:none;flex-shrink:0;align-self:center}
.pan-grip:active{cursor:grabbing}
/* Collapsed state (tap the grip): hide everything but the grip. Shared by the tool bar, the
   page-navigation bar, and the text formatting bar via the makeMovable helper. Any bar can be
   tapped-to-collapse; by default the tool bar + formatting bar open DOCKED and EXPANDED, and the
   page-navigation bar opens expanded, so their controls are ready without a first tap. */
.pan-bar.collapsed>*:not(.pan-grip),.pan-fmt.collapsed>*:not(.pan-grip){display:none}
/* Page-navigation bar: compact + unobtrusive (smaller buttons/label than the tool bar).
   Default resting position is the BOTTOM-RIGHT corner (respecting the right/bottom safe-area
   insets), clear of the bottom-centred tool bar. Still movable + collapsible via its grip —
   makeMovable overrides left/top on drag, so this anchor only sets the initial spot. */
.pan-pages{left:auto;right:calc(env(safe-area-inset-right,0px) + 8px);transform:none;
  bottom:calc(env(safe-area-inset-bottom,0px) + 8px);gap:2px;padding:4px}
.pan-pages .pan-tbtn{width:30px;height:30px;font-size:14px}
.pan-pages .pan-lbl{font-size:11px;min-width:34px}
.pan-pages .pan-sep{height:18px}
.pan-tbtn{width:38px;height:38px;border:none;border-radius:10px;background:none;color:var(--text,#1c1e1d);font-size:17px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;line-height:1;flex-shrink:0}
.pan-tbtn:active{background:var(--pan-bg,#eceded)}
.pan-tbtn.on{background:var(--accent,#0f6355);color:#fff}
.pan-delconfirm{background:var(--danger,#c8433b)!important;color:#fff!important}
.pan-tbtn:disabled{opacity:.32;cursor:default}
.pan-sep{width:1px;height:24px;background:var(--line,#e6e6e6);margin:0 2px;flex-shrink:0}
.pan-sw{width:22px;height:22px;border-radius:50%;border:2px solid var(--card,#fff);
  box-shadow:0 0 0 1px var(--line,#e6e6e6);cursor:pointer;padding:0}
.pan-sw.on{box-shadow:0 0 0 2px var(--accent,#0f6355);transform:scale(1.14)}
/* Rich colour grid (grayscale + hue rows), like the reference app. */
.pan-swgrid{display:grid;grid-template-columns:repeat(6,22px);gap:8px;justify-content:center}
/* A finger (pointer:coarse) gets the 44px hit area web/touch-base.css asks for: the column is 44px and a
   transparent border keeps the visible dot small, so the swatches no longer overlap (phone audit #5 #6). */
@media (pointer:coarse){ .pan-swgrid{grid-template-columns:repeat(6,44px);gap:2px}
  .pan-sw{border:9px solid transparent;background-clip:padding-box!important;box-shadow:inset 0 0 0 1px var(--line,#e6e6e6)} .pan-sw.on{transform:none;box-shadow:0 0 0 2px var(--accent,#0f6355)} }
.pan-customlbl{font-size:12px;font-weight:600;color:var(--muted,#6b7370)}
/* Paper-template picker rows (Basic / Notepads), reusing the .pan-tbtn button + .on states. */
.pan-tplrow{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.pan-tplgrp{font-size:11px;color:var(--muted,#6b7370);min-width:58px}
.pan-lbl{font-size:13px;color:var(--muted,#6b7370);min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
/* The current-ink dot on the toolbar; opens the color+size popover. */
.pan-inkdot{width:18px;height:18px;border-radius:50%;border:2px solid #fff;
  box-shadow:0 0 0 1px var(--line,#e6e6e6);background:#141414}
/* Color+size panel: expands upward from the bottom tool bar (sits just above it), collapsible
   via the ink button. Height-capped so the tall colour grid always stays on-screen. */
.pan-pop{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + var(--pan-toolsbottom,8px) + 54px);top:auto;z-index:7;
  display:none;flex-direction:column;gap:10px;border:1px solid var(--line,#e6e6e6);
  border-radius:14px;padding:12px;box-shadow:0 3px 14px rgba(0,0,0,.18);max-height:calc(100vh - 130px);overflow-y:auto;
  max-width:calc(100% - 16px);box-sizing:border-box;   /* never wider than the page: positionPop's 8px clamp then holds both edges (F3-08) */
  /* Scroll-shadow affordance: iOS hides scrollbars, so when the popover content overflows
     (e.g. the finger-drawing row below the swatches on a phone), a soft shadow at the clipped
     edge signals "more below/above". Pure CSS: the local layers cover the shadows at the ends. */
  background-color:var(--card,#fff);
  background-image:
    linear-gradient(var(--card,#fff) 30%, rgba(255,255,255,0)),
    linear-gradient(rgba(255,255,255,0), var(--card,#fff) 70%),
    radial-gradient(farthest-side at 50% 0, rgba(0,0,0,.25), rgba(0,0,0,0)),
    radial-gradient(farthest-side at 50% 100%, rgba(0,0,0,.25), rgba(0,0,0,0));
  background-position:top,bottom,top,bottom;background-repeat:no-repeat;
  background-size:100% 40px,100% 40px,100% 13px,100% 13px;
  background-attachment:local,local,scroll,scroll}
.pan-pop.on{display:flex}
.pan-poprow{display:flex;align-items:center;gap:8px;justify-content:center}
/* A menu row is an icon BESIDE its label. display:block put the two on separate lines the moment
   the glyphs became <svg> elements — an svg is a block box, where a glyph sat on the text
   baseline — which turned a 5-row menu into a 700px column. */
/* A GRID, not a flex row. Reported on iPad and iPhone: the two widest rows put their icon on its
   own line while the others stayed inline. flex-wrap:nowrap did not stop it, which rules out
   wrapping and leaves the flex ITEMS being mis-sized — so the row no longer relies on flex at all.
   Two explicit grid columns cannot become two rows: there is no wrap concept for them, and a
   mis-sized item is clamped by minmax(0,1fr) instead of pushing its sibling off the line.
   The label is an ELEMENT rather than an anonymous text item so it can occupy the second column,
   shrink below its content width, and truncate instead of forcing the row wider than the popover. */
.pan-photoopt{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border-radius:8px;font-size:15px;background:none;border:none;cursor:pointer;color:var(--text,#1a1a1a);white-space:nowrap}
.pan-optlbl{min-width:0;overflow:hidden;text-overflow:ellipsis}
/* The label leads; the icon identifies. Full-strength ink on both makes the row read twice. */
.pan-photoopt .pan-i{color:var(--muted,#8a8a8e)}
/* MENU popovers are LISTS, not stacks of sections. The shared .pan-pop gap is spacing BETWEEN
   GROUPS — swatches, the size slider, the checkboxes — and between menu rows it is dead space on
   top of padding each row already carries as its tap target. */
.pan-photopop,.pan-imgpop,.pan-stylepop,.pan-tablepop,.pan-selpop{gap:0;padding:6px}

      // a successful reply to a bare {ok:true} is what kept the cap invisible until a save was
      // REFUSED at it — mid-sentence, with a page of Pencil strokes live only in memory. Carried,
      // not acted on: this maps outcomes, it does not decide UI.
      // Only when there IS something to report: an ordinary save stays exactly {ok:true}, because
      // this outcome is a shared contract (PANote.saveOutcome) and every caller comparing against
      // {ok:true} would otherwise have to learn about fields that are meaningless to it.
      : (m.warn ? {ok:true,warn:m.warn,bytes:m.bytes|0,limit:m.limit|0} : {ok:true}))
    // A failure keeps the shell's sentence (relayFail in web/index.html: what was refused, why, the
    // cap). Dropping it here left Notes and the Bible showing "未保存 · Not saved — <raw error>".
    : {ok:false,error:String((m&&m.error)||'保存被拒绝 · save rejected'),...(m&&typeof m.text==='string'&&m.text?{text:m.text}:{})};
  // TODO(R4): grows this over-budget file; the split seam is this DOM-free block (SAVE_TIMEOUT_MS
  // down to function Note()), which the tests already extract at exactly that boundary.
  // What a host's notice says for a save that did not land (R3): the shell's sentence when there is
  // one (superelf.md: show `text`), else NOT_SAVED and the reason — a timeout, a locked pad or a
  // refused shrink never reached the shell, so nothing worded it.
  const notSavedText=(r)=> (r&&typeof r.text==='string'&&r.text) ? r.text : NOT_SAVED+(r&&r.error?' — '+r.error:'');
  // Content census — the shrink guard's per-page baseline, and pickRicher's measure (R3).
  // `h` (per-page text length) + `hh` (a cheap FNV-1a hash of that text) are what let the guard
  // see a TEXT regression — strokes and images alone were blind to the whole rich-text half of a
  // page (V3 amplifier).
  const hashStr=(s)=>{ let h=0x811c9dc5; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=(h+((h<<1)+(h<<4)+(h<<7)+(h<<8)+(h<<24)))>>>0; } return h; };
  function census(nb){
    const out={pages:Object.create(null),count:0,strokes:0,images:0,html:0};   // no prototype: keyed by a page's id (ADR 0015)
    if(!nb||!Array.isArray(nb.pages)) return out;
    out.count=nb.pages.length;
    for(const p of nb.pages){ if(!p||typeof p!=='object') continue;
      const s=(p.strokes&&p.strokes.length)||0, im=(p.images&&p.images.length)||0;
      const html=(typeof p.pageHtml==='string')?p.pageHtml:'';
      out.pages[p.id||('#'+out.count)]={s,im,h:html.length,hh:hashStr(html)};
      out.strokes+=s; out.images+=im; out.html+=html.length; }
    return out;
  }

  // "Which copy holds MORE?" — the ONE rule that keeps a load from discarding unsaved work.
  // Its only caller is pull(): when a load SUCCEEDS while the pad already holds strokes the file
  // does not, the richer copy wins and the pad stays dirty. It never returns the poorer one, so a
  // re-read can only ever add.
  function pickRicher(main,other){
    const a=census(main), b=census(other);
    if(!other||!Array.isArray(other.pages)||!other.pages.length) return main;
    if(b.strokes+b.images>a.strokes+a.images) return other;
    if(b.strokes+b.images===a.strokes+a.images && b.html>a.html) return other;
    return main;
  }

  // ── SKIP AN IDENTICAL WRITE（跳过无变化的保存）─────────────────────────────────────────────
  // A save re-serializes and re-POSTs the WHOLE notebook (see "ONE ATOMIC WHOLE-NOTEBOOK WRITE
  // PER NOTE" above), so a write that would store exactly what the server has already CONFIRMED
  // costs a structured clone, a stringify, an HTTP round-trip and an fsync for nothing. Ordinary
  // flows produce them: undo-then-redo, a text region committed unchanged, an image drag that
  // ends where it began, a page turn whose flush follows an edit that was itself undone.
  //
  // WHAT "IDENTICAL" MEANS, AND WHY IT IS NOT A LITERAL BYTE COMPARE (R14 — a check that could
  // never fire is a feature that does not exist): every one of those flows stamps an mtime.
  // write() sets nb.updated on each attempt and touchPage() sets page().updated on each edit, so
  // two notebooks with byte-identical CONTENT always differ by those timestamps and a literal
  // JSON.stringify comparison would be false every single time. `updated` is bookkeeping — it
  // orders the notes drawer — and never content, so it is the ONE key excluded, by name, here and
  // nowhere else. A real edit always changes something outside it, so it is still written and the
  // mtime still moves; a no-op edit moves neither, which is the honest answer.
  // Fast O(n_strokes) fingerprint — replaces full JSON.stringify which blocked the main thread
  // for 30-50ms per save cycle (every 700ms) as notebooks grew to 3+ pages × 150 strokes.
  // Detects: stroke count, image count, text length+hash, template, bgColor, stroke positions
  // (rolling hash of each stroke's first point catches translateSel moves).
  const contentPrint=(nb)=>{
    if(!nb||!Array.isArray(nb.pages)) return '';
    let strokes=0,images=0,html=0,h=0;
    for(const p of nb.pages){
      const sl=(p.strokes&&p.strokes.length)||0, il=(p.images&&p.images.length)||0;
      const tx=typeof p.pageHtml==='string'?p.pageHtml:'';
      // TEXT BY CONTENT, not merely by LENGTH. Counting characters meant every edit that keeps
      // the count was invisible — and a paragraph style is exactly that: <h1>Title</h1> and
      // <h2>Title</h2> are the same length, so applying a style produced a fingerprint identical
      // to the last confirmed write and the guard skipped the save as "nothing to send". Same
      // shape as the image bug above: a change-detector must be derived from everything a user
      // can CHANGE, or it is a data-loss device. hashStr is one pass, so this stays linear.
      strokes+=sl; images+=il; html+=tx.length;
      if(tx) h=(h*31+hashStr(tx))|0;
      for(const s of (p.strokes||[])) if(s.p&&s.p[0]) h=(h*31+Math.round(s.p[0][0]*1e4)+Math.round(s.p[0][1]*1e4))|0;
      // Images by IDENTITY and PLACE, not merely by count. Counting them meant every edit that
      // keeps the count — cropping a photo (path changes), moving it, resizing it — produced a
      // fingerprint identical to the last confirmed write, so the guard skipped the save as
      // "nothing to send" and the change never reached disk. Reported as "I cropped it and the
      // old image came back"; move and resize had been silently unsaved the same way all along.
      for(const im of (p.images||[])) h=(h*31+hashStr(String(im.path||''))
        +Math.round((im.x||0)*1e4)+Math.round((im.y||0)*1e4)
        +Math.round((im.w||0)*1e4)+Math.round((im.h||0)*1e4))|0;
      h=(h*31+(p.id?hashStr(p.id):0))|0;
    }
    // Stationery is a user CHANGE like the template: left out, choosing a design would fingerprint
    // as "nothing to send" and the save-skip guard would drop it. Appended only when present, so
    // every note without one keeps the fingerprint it always had.
    const st=nb.stationery;
    return strokes+'|'+images+'|'+html+'|'+h+'|'+(nb.template||'')+'|'+(nb.bgColor||'')
      +(st?'|'+st.source+':'+st.id+':'+(st.fade||0):'');
  };

  // cfg = { serialize():notebook, write(nb):Promise<reply>, noteKey():string,
  //         onState(state), setTimer(fn,ms), clearTimer(id), startLocked:bool }
  // The notebook object is NEVER copied away from the caller: a failed write leaves the newest
  // content exactly where the pad is still drawing into it, so no stroke can be dropped. That —
  // not a second file — is what carries unsaved work, and the retry ladder below is what keeps
  // trying to land it.
  //
  // `noteKey()` (F2) names the note a write BELONGS TO — the Journal's entry id, the Bible's
  // chapter+scope. It is read at the moment a write is cut and again when the outcome comes back,
  // so a failure can only ever be recorded against the note it was actually for. That is the whole
  // fix for the switch-away bug: the old guard had ONE anonymous failure slot plus a `rearmDirty`
  // callback, so note A's failure was re-armed against note B's notebook the moment the pad was
  // repointed. An app with no note identity passes nothing and gets one key ('') — the old
  // behaviour, minus the cross-note leak, because there is then only ever one note.
  function makeSaveGuard(cfg){
    const setT=cfg.setTimer||((fn,ms)=>setTimeout(fn,ms)), clrT=cfg.clearTimer||((id)=>clearTimeout(id));
    const keyOf=()=>{ try{ return cfg.noteKey?String(cfg.noteKey()):''; }
      catch(_){ return ''; /* an app whose key closure throws mid-swap: fall back to the single-note key rather than mis-file the failure */ } };
    // note key -> the error of a write for THAT note that never landed. It survives a switch away
    // (that is the point), it is NEVER consulted for another note, and only a CONFIRMED write of
    // that same note — or the user's tap — removes an entry. A successful READ may not: that is
    // the round-3 rule (a success in one direction cannot retire a report about the other).
    const OUTSTANDING=new Map();
    let dirty=false, inFlight=null, again=false, attempt=0, timer=0, retryT=0, stopped=false;
    // `said`: the shell's sentence for the last failed write (outcomeOf carries it), shown by the pill
    // rather than a second wording of that failure. Set by the one branch that fails without blocking,
    // so it is never read stale. `error` stays the raw reason (tooltip, OUTSTANDING).
    let failed=false, blocked=false, carried=false, error='', said='', base=null, shrinkOk=false;
    // The last write this note had CONFIRMED, as {key,fp} (contentPrint above). ONE slot, not a
    // map: it is compared with its own note key so a switch can never match the wrong note, and
    // holding one fingerprint instead of one per visited note bounds the memory a pad can pin to
    // a single notebook. Set ONLY by a confirmed write — a successful READ does not set it (a
    // read proves what the server holds, not that this pad's write landed), and reset()/lock()
    // clear it, so after a note swap or a failed load the first write is never skipped.
    let lastOk=null;
    // WRITE LOCK (V1). The guard starts LOCKED and is unlocked ONLY by seed() — i.e. by a load
    // that actually reported an outcome. That closes the whole class at its root: before the first
    // load, between a note switch and its load, and after any failed load there is no code path
    // that can issue a write, so a note that was never read can never be overwritten. It also
    // closes the boot race the shrink guard could not see: `base` was null until the first
    // CONFIRMED write, so the first save after every load/switch used to be entirely unguarded.
    let locked=cfg.startLocked===false?'':LOAD_TXT.pending, lockCode=locked?'not_loaded':'';
    // What THIS note still owes the server, from a write that was cut before the pad was pointed
    // away from it. Read live (not cached) because the app repoints noteKey() between reset() and
    // seed(), and the answer must follow the note the user is actually looking at.
    const owed=()=>OUTSTANDING.get(keyOf())||'';
    const state=()=>({
      dirty, failed, attempt, blocked, carried, error,
      locked:!!locked, lockError:locked, lockCode,
      unsaved: dirty||!!inFlight||failed,
      // THIS note has a write that never landed (F2). Distinct from `carried`, which is about some
      // OTHER note, and from `failed`, which means a ladder is still running right now.
      outstanding: !!owed(),
      text: failed ? (blocked?SAVE_TXT.blocked:said?said+' — '+RETRYING:(error||SAVE_TXT.notSaved)+' — '+SAVE_TXT.retry)
        : (owed()?SAVE_TXT.outstanding+' — '+owed():(carried?SAVE_TXT.carried:'')),
    });
    const emit=()=>{ if(cfg.onState) cfg.onState(state()); };
    // Refuse a write that would LOSE content relative to the last CONFIRMED write, unless the
    // user actually removed something (eraser / delete-selection / undo → allowShrink()).
    // Proven server behaviour this guards against: POST /api/save-data replaces a 44KB notebook
    // with `null` and answers 200 {"ok":true} — the server cannot detect this, so the client must.
    function regression(nb){
      if(!nb||!Array.isArray(nb.pages)||!nb.pages.length) return '拒绝写入空笔记 · refused: empty notebook';
      if(!base||shrinkOk) return '';
      const now=census(nb);
      if(now.count<base.count) return 'refused: pages '+base.count+'→'+now.count+' · 页数变少，拒绝覆盖';
      for(const id in base.pages){
        const b=base.pages[id], n=now.pages[id];
        if(!n) return '页面丢失，拒绝覆盖 · refused: a page disappeared';
        if(n.s<b.s) return 'refused: strokes '+b.s+'→'+n.s+' · 笔迹变少，拒绝覆盖';
        if(n.im<b.im) return 'refused: images '+b.im+'→'+n.im+' · 图片变少，拒绝覆盖';
        // TEXT counts too (V3 amplifier): the guard protected handwriting and images but not the
        // typed/pasted half of a page, so a text-only collapse wrote through with no refusal. The
        // text region arms allowShrink() on every edit that genuinely shortens the text, so what
        // is left here is the shape no user action produces: a page's text vanishing on its own.
        if(n.h<b.h) return 'refused: text '+b.h+'→'+n.h+' · 文字变少，拒绝覆盖';
      }
      return '';
    }
    function scheduleRetry(){
      if(stopped) return;
      clrT(retryT);
      // The promise is RETURNED, not dropped: a timer driver (and the test harness) can then
      // await the retry it fired instead of guessing when the write finished.
      retryT=setT(()=>{ retryT=0; return run(); }, SAVE_RETRY_MS[Math.min(attempt-1,SAVE_RETRY_MS.length-1)]);
    }
    async function run(){
      // THE LOCK COMES FIRST — before serialize, before the shrink guard. While the note has not
      // been READ, there is nothing to compare a write against and no way to know what would be
      // lost, so nothing is written at all (V1).
      if(locked) return {ok:false,error:locked,locked:true,code:lockCode};
      if(inFlight){ again=true; return inFlight; }          // ONE write at a time; the newest content is re-sent after it settles
      clrT(retryT); retryT=0;
      const nb=cfg.serialize();
      // Cleared AFTER serialize: committing the live text region can itself call schedule(), and
      // that debounce is already satisfied by the write this call is about to perform.
      clrT(timer); timer=0;
      const bad=regression(nb);
      if(bad){                                              // a refusal is not transient — surface it and WAIT for the next real change
        failed=true; blocked=true; error=bad; dirty=true; emit();
        return {ok:false,error:bad};
      }
      const snap=census(nb);                                // baseline taken BEFORE any await — nb keeps growing while the write is in flight
      // WHOSE write is this? Captured in the same synchronous step as the census, so the outcome
      // can only ever be filed against the note the payload actually came from (F2).
      const who=keyOf();
      // Same synchronous step again, and for the same reason: this is the payload that is about
      // to be handed to cfg.write, which clones it before it can be edited again.
      const print=contentPrint(nb);
      // NOTHING TO SEND: this note's content already matches the write the server confirmed.
      // `!failed` is the load-bearing half. It keeps the retry ladder intact — a failed write's
      // bytes are NOT the last confirmed bytes, so a retry never matches here and is always
      // re-sent — and it keeps this branch out of failure handling entirely, so a skip can never
      // be the thing that clears a real failure (the {ok:true,saved:0} scar). The reply says
      // `skipped`, so no caller can read it as "a write happened".
      if(!failed && lastOk && lastOk.key===who && lastOk.fp===print){
        dirty=false; again=false;
        shrinkOk=false;                                     // memory equals `base`; nothing was removed, so the shrink guard re-arms
        emit();
        return {ok:true,skipped:true};
      }
      dirty=false;
      inFlight=(async()=>{ try{ return outcomeOf(await cfg.write(nb)); }
        catch(e){ return {ok:false,error:String((e&&e.message)||e)}; } })();
      let r; try{ r=await inFlight; } finally { inFlight=null; }
      // `carried` is deliberately NOT cleared here: it belongs to a DIFFERENT notebook that never
      // landed, and a healthy save of the current one must not make that disappear. Only the
      // user's tap (clearCarried) dismisses it.
      if(r.ok){ failed=false; blocked=false; error=''; attempt=0; shrinkOk=false; base=snap;
        lastOk={key:who,fp:print};                          // CONFIRMED — the one thing a later identical write may be skipped against
        OUTSTANDING.delete(who);                            // THIS note is durable again — and no other note's report is touched
        // Distance to the cap, reported only for a write that actually landed. A telemetry
        // handler that throws must not turn a good save into a failed one, hence the catch —
        // and it is logged rather than swallowed (R5).
        if(r.warn&&cfg.onWarn){ try{ cfg.onWarn(r); }catch(e){ console.warn('[PANote] onWarn failed',e); } }
        emit(); }
      else {
        failed=true; blocked=false; error=r.error; said=r.text||''; dirty=true; attempt++;
        OUTSTANDING.set(who,r.error);                       // keyed to the note it was for, so a switch cannot re-aim it
        emit();
        scheduleRetry();
      }
      if(again&&!stopped){ again=false; return run(); }
      return r;
    }
    return {
      state,
      touch:()=>{ dirty=true; if(inFlight) again=true; },
      allowShrink:()=>{ shrinkOk=true; },                   // the user removed something on purpose
      schedule(){ this.touch(); if(stopped||locked) return; clrT(timer); timer=setT(()=>{ timer=0; return run(); },SAVE_DEBOUNCE_MS); },
      // Force a write whenever anything is unconfirmed, and do not resolve until every write this
      // flush is responsible for has SETTLED. NOT gated on the debounce timer — that gate is what
      // turned every flush into a no-op after the first failed save — and NOT gated on the `dirty`
      // flag either, which is bug F1:
      //
      //   `await inFlight` once, then check `dirty`, was WRONG BY MICROTASK ORDERING. run()
      //   registered its own continuation on that same promise FIRST, so when the write settled
      //   run() resumed first, cleared inFlight, saw `again` (the user had drawn during the write),
      //   and started write #2 — which set dirty=false synchronously. Only then did flush() resume,
      //   read dirty===false, and resolve {ok:true} with write #2 still in the air. The note switch
      //   that followed proceeded believing the outgoing note was safe. MEASURED.
      //
      // So: loop. Each pass either awaits a write that is already in flight or cuts one of its own,
      // and the loop ends only when nothing is in flight and nothing is outstanding. The bound is
      // there because a user can keep drawing for ever; hitting it reports the truth (still
      // unwritten), never {ok:true}.
      async flush(){
        clrT(timer); timer=0;
        let last=null;
        for(let step=0;step<FLUSH_MAX_STEPS;step++){
          if(inFlight){ last=await inFlight; continue; }     // the CHAIN, not a flag: re-check after every settle
          if(locked) return dirty ? {ok:false,error:locked,locked:true,code:lockCode} : {ok:true,locked:true};
          if(last) return last;                              // a write this flush waited on has settled: report ITS outcome
          if(!dirty&&!failed) return {ok:true};
          last=await run();
          if(!last.ok) return last;                          // honest: the ladder is running, the caller is told now
        }
        return {ok:false,error:SAVE_TXT.notSaved+' — '+SAVE_TXT.retry};
      },
      // Teardown path (hide / pagehide / visibilitychange). It is the same flush: with the draft and
      // the per-page store both gone there is no second write to fire. On a leave it runs while the
      // shell still serves the page (PALeave, ADR 0018); the real pagehide later finds nothing left.
      flushDurable(){ return this.flush(); },
      // A load reported an outcome: this notebook is now KNOWN, so writing it is safe again.
      // `base` is seeded from what was READ — not only from what this pad has itself written —
      // which is what makes the first write after a load/switch guarded instead of unguarded.
      // `replaced` says the in-memory notebook IS the stored one (so nothing is unsaved); it is
      // false when the pad kept content the store did not have, which must stay dirty.
      //
      // ROUND-4 FIX (a verified leftover): this used to clear failed/blocked/error/attempt
      // UNCONDITIONALLY, so a successful LOAD retired a SAVE failure it had not covered — a
      // success on one direction of one path erasing a report about the other. A read proves the
      // write landed ONLY when the notebook it read REPLACES what is in memory; otherwise the
      // failure, its retry ladder and its message all survive. The SAME rule covers OUTSTANDING
      // (F2): coming back to a note whose write never landed re-surfaces that report — reading the
      // file proves what the server holds, which is precisely why it cannot prove the write landed.
      // Only a confirmed WRITE of this note, or the user's tap, clears it.
      seed(nb,replaced){ locked=''; lockCode=''; base=census(nb); shrinkOk=false;
        if(replaced){ dirty=false; again=false; failed=false; blocked=false; error=''; attempt=0;
          clrT(retryT); retryT=0; }
        emit(); },
      // A load could NOT be trusted (or a page of it could not be read): block every write for
      // this note until seed() is called.
      lock(reason,code){ locked=reason||LOAD_TXT.locked; lockCode=String(code||'load_failed');
        lastOk=null;                                        // the store could not be read: nothing may be assumed already saved
        clrT(timer); timer=0; clrT(retryT); retryT=0; emit(); },
      // A notebook swap (scope/entry change). Any failure is carried over as a sticky notice so a
      // successful save of the NEXT note cannot quietly hide that the previous one never landed.
      // It RE-LOCKS: between the swap and the new note's load there is no notebook it would be
      // safe to write, and that gap is exactly where a blank used to be written over a real note.
      // Called BEFORE the app repoints noteKey(), so keyOf() here is still the OUTGOING note: any
      // work this pad is walking away from is filed against the note it belongs to (F2), and the
      // user meets that report again when they come back to it.
      reset(){ clrT(timer); timer=0; clrT(retryT); retryT=0;
        if(dirty||failed||inFlight) OUTSTANDING.set(keyOf(),error||SAVE_TXT.notSaved);
        if(failed) carried=true;
        dirty=false; again=false; failed=false; blocked=false; attempt=0; error=''; base=null; shrinkOk=false;
        lastOk=null;                                        // a different note is coming: the first write of ANY note is always sent
        locked=LOAD_TXT.pending; lockCode='not_loaded'; emit(); },
      // The user's tap: dismiss the "some other note" banner AND this note's own outstanding
      // report. Their tap is the one thing besides a confirmed write that may retire it.
      clearCarried(){ carried=false; OUTSTANDING.delete(keyOf()); emit(); },
      stop(){ stopped=true; clrT(timer); clrT(retryT); timer=retryT=0; },
    };
  }

  // The phone's pen toggle (web/note-phone.inline.html): its two states and its first-use tip. 中文 first.
  const FINGER_TXT={on:'手指书写（两指滚动） · Finger writes (two fingers scroll)',off:'手指滚动 · Finger scrolls',
    tip:'笔开：一指书写，两指滚动或缩放。笔关：手指滚动翻页 · Pen on: one finger writes, two fingers scroll or zoom. Pen off: a finger scrolls'};
  // The phone's Read view（阅读视图）: typed text reflowed at the device's own size, ink hidden. 中文 first.
  const READ_TXT={btn:'阅读视图 · Read view',title:'阅读视图 · Read view',inkHidden:'手写已隐藏，没有删除 · Ink hidden, not deleted',
    empty:'这一页没有打字的文字 · No typed text on this page',smaller:'字小一点 · Smaller text',bigger:'字大一点 · Larger text',close:'关闭阅读视图 · Close Read view',
    tip:'阅读视图：文字按手机宽度重排，手写暂时隐藏。A−/A+ 只改这台设备 · Read view: text fits the phone, ink is hidden for now. A−/A+ change this device only'};
  const TIP_OPEN_MODE='打字的页面以文字打开，手写的页面以手写或选择打开 · A note opens in Text when its page is typed, in Draw or Select when it is ink';   // TODO(R4 seam): first-use tip text (ADR 0030)
  function Note(host, opts){
    const PAGES=!!opts.pages;
    const hasTop=!!(opts.onHistory||opts.onClose||opts.title);
    const imgHooks=!!(opts.uploadImage&&opts.imageUrl);      // photo button only if BOTH IO hooks exist (graceful)
    // Stationery · 信纸: only for a host that opted in (opts.stationery) AND inlined the component.
    // TODO(R4): the picker/paint hooks below are the seam; everything else lives in PAStationery.
    const STN=(opts.stationery&&window.PAStationery)||null;
    let stPick=null;                                         // the picker, once the popover exists
    host.classList.add('pan');
    // TODO(R4 seam): first-use tip (ADR 0030) — the opening-tool rule (note-features.md J); text in PANote.TIP_OPEN_MODE.
    if(window.PATips) window.PATips.register({id:'note-open-mode',anchor:()=>host.querySelector('.pan-mtext'),text:TIP_OPEN_MODE});
    // Bottom bar layout: in multi-page mode the tool bar sits above the page bar; the color
    // panel and (below) the tool bar derive their bottom offset from this so they stack cleanly.
    if(PAGES) host.style.setProperty('--pan-toolsbottom','60px');
    const readBtnHtml=cls=>'<button class="'+cls+' pan-readbtn" aria-pressed="false" title="'+READ_TXT.btn+'" aria-label="'+READ_TXT.btn+'">'+ico('read')+'</button>';

      else { const pg=page(); drawImages(pg); for(const s of pg.strokes) if(s.t==='highlighter') drawStroke(inkCtx,s.p.map(denorm),s.c,s.w*W,s.t,s.a); for(const s of pg.strokes) if(s.t!=='highlighter') drawStroke(inkCtx,s.p.map(denorm),s.c,s.w*W,s.t); }
      drawOverlay();
      updatePageLabel();
    }
    // Rebuild the offscreen committed canvas from scratch (images + HL behind pen/marker).
    // Call whenever committed strokes change: endStroke, undo, redo, erase, delete, page flip, image load.
    function rebuildCommitted(){
      if(!committedCtx) return;
      committedCtx.clearRect(0,0,W,H);
      const pg=page();
      drawImages(pg, committedCtx);
      for(const s of pg.strokes) if(s.t==='highlighter') drawStroke(committedCtx,s.p.map(denorm),s.c,s.w*W,s.t,s.a);
      for(const s of pg.strokes) if(s.t!=='highlighter') drawStroke(committedCtx,s.p.map(denorm),s.c,s.w*W,s.t);
    }

    // ── Print · 打印 (PAPrint drives these — web/print-ui.inline.html) ──
    // The pad owns the ONLY stroke/paper renderer, so printing asks it to draw rather than
    // re-implementing ink elsewhere. Geometry is stored normalised by page width, so a scale
    // transform is the only difference between a 700px screen page and a 2244px sheet — which
    // is why print resolution costs nothing here beyond the bigger canvas.
    // Relative luminance of a #rgb/#rrggbb colour, 0..1. Above LIGHT_INK a stroke is indistinct on
    // white paper: visible on a tinted page, gone on a printed one.
    const LIGHT_INK=0.86;
    function inkLum(c){
      const m=/^#([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(String(c||'').trim()); if(!m) return 0;
      let h=m[1]; if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
      const r=parseInt(h.slice(0,2),16)/255, g=parseInt(h.slice(2,4),16)/255, b=parseInt(h.slice(4,6),16)/255;
      return 0.2126*r+0.7152*g+0.0722*b; }
    function printInfo(){ return {
      width:W,
      // The sheet the screen divides on. Exported so print splits where the user SAW the fold,
      // rather than at a second sheet height of its own (R3) — an invisible break is how writing
      // ends up across a boundary nobody knew was there.
      sheetH:PAGE_H,
      pages:(NB.pages||[]).map(p=>({
        // A page on stationery is a WHOLE sheet of content: the design reaches the bottom edge,
        // so print fits the full page rather than cropping the design under short writing.
        extent:Math.max(pageExtent(p),STN&&STN.has(NB.stationery)?PAGE_H/W:0), inkExtent:pageExtent(p),   // print pads INK only; the stationery floor is exactly one sheet
        // Typed text lives in an HTML overlay, not on the canvas, so this render cannot carry
        // it. Reported so the caller can SAY so rather than quietly printing a page that is
        // missing the words on it.
        hasText:pageHasText(p),
        images:(p.images||[]).length,
        unresolved:(p.images||[]).filter(im=>!(imgCache[im.path]||{}).ready).length,
        // Counted, not hidden: printing these onto white makes them disappear from the paper.
        lightInk:(p.strokes||[]).filter(st=>inkLum(st.c)>LIGHT_INK).length })) }; }
    // Resolve every page's photos before rendering, so one does not print as the grey
    // placeholder box drawImages falls back to. Bounded — a broker that never answers must not
    // hang the print — and printInfo() is re-read afterwards so an unresolved photo is
    // REPORTED rather than silently printed as a grey rectangle (R5/R14).
    async function printPrime(ms){
      const paths=[...new Set((NB.pages||[]).flatMap(p=>(p.images||[]).map(im=>im.path)))];
      const t0=Date.now(), cap=ms||PRINT_PRIME_MS;
      if(STN&&NB.stationery) await STN.prime(NB.stationery,cap);   // a design still decoding would print as plain paper
      await Promise.all(paths.map(path=>new Promise(res=>{
        const rec=ensureImage(path);
        (function tick(){ if(rec.ready||Date.now()-t0>cap) return res(); setTimeout(tick,60); })(); }))); }
    function printPage(i,ctx,scale,hCss,paper,fit){
      const pg=(NB.pages||[])[i]; if(!pg||!ctx) return false;
      ctx.save();
      ctx.setTransform(scale,0,0,scale,0,0);                    // draw in CSS px; the transform buys the DPI
      ctx.lineCap='round'; ctx.lineJoin='round';                // setupCanvases sets these per context; a fresh one must too
      // ONE transform for paper, rules, stationery, text and ink, so the writing stays on its
      // lines. `fit.k` is the note-wide scale PAPrint chose (the same for every page); the paper
      // is drawn out to the sheet edge in the scaled space, so a shrunk note still fills the page.
      const k=(fit&&fit.k)||1;
      if(k!==1) ctx.scale(k,k);
      drawPaper(ctx,hCss/k,paper,null,W/k);
      drawText(ctx,pg.pageHtml);                                // first: on screen the text layer sits BENEATH the ink canvas (ADR 0021); inside fit, so it slices with the rest
      drawImages(pg,ctx);
      // Same back-to-front order as rebuildCommitted: highlighter sits BEHIND pen and marker.
      for(const s of pg.strokes) if(s.t==='highlighter') drawStroke(ctx,s.p.map(denorm),s.c,s.w*W,s.t,s.a);
      for(const s of pg.strokes) if(s.t!=='highlighter') drawStroke(ctx,s.p.map(denorm),s.c,s.w*W,s.t);
      ctx.restore();
      return true; }

    // ── Typed text, on paper ─────────────────────────────────────────────────────────────────
    // Print used to say "typed text is not printed yet". The reason was not effort: there was no
    // page geometry to render text INTO — a page was whatever shape the screen was, so there was
    // no such thing as "where this paragraph sits on the sheet". A Letter page makes it a
    // transcription job instead of a layout job.
    //
    // The browser lays the text out; we copy down where it put every word. No second layout
    // engine, so print cannot drift from the screen — the failure mode a hand-rolled renderer
    // guarantees eventually.
    //
    // MEASURED, not assumed (in a browser, before writing this): Range.getClientRects returns the
    // FONT box, not the line box — height 21 for an 18px font whose ascent+descent is 17+4. So the
    // baseline is bottom − the font's descent, and that holds across mixed sizes on one line: an
    // 18px word (bottom 55, descent 4) and a 32px word (bottom 58, descent 7.1) both land on 51.
    let measureEl=null;
    function textMeasureEl(){
      if(!measureEl){ measureEl=document.createElement('div'); measureEl.className='pan-textlayer';
        measureEl.setAttribute('aria-hidden','true'); host.appendChild(measureEl); }
      // Parked off-screen but LAID OUT: visibility:hidden keeps the boxes (display:none would not),
      // and this is a separate element from the live layer so printing page 3 cannot disturb the
      // page being edited. Unzoomed, because it hangs off host rather than the page — so its rects
      // are already page px and need no scale correction.
      measureEl.style.cssText='position:absolute;left:-10000px;top:0;width:'+W+'px;height:auto;'+
        'visibility:hidden;pointer-events:none;overflow:visible;z-index:-1';
      // The metrics applyTextMetrics puts on the live layer for a ruled template — same rule gap,
      // same first-line offset — or ruled pages would print with different line spacing.
      for(const k of ['lineHeight','fontSize','paddingTop','paddingLeft']) measureEl.style[k]=textLayer.style[k]||'';
      return measureEl;
    }
    const TRANSPARENT=/^rgba\(0, *0, *0, *0\)$|^transparent$/;
    function drawText(ctx,html){
      if(!html) return false;
      const el=textMeasureEl(); el.innerHTML=html;
      if(!el.textContent.trim()&&!el.querySelector('li')) return false;
      const base=el.getBoundingClientRect(); if(!(base.width>0)) return false;
      let drew=false;
      const walk=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);
      for(let n;(n=walk.nextNode());){
        if(!/\S/.test(n.nodeValue)) continue;
        const pe=n.parentElement; if(!pe) continue;
        const cs=getComputedStyle(pe), fsz=parseFloat(cs.fontSize)||18;
        ctx.font=[cs.fontStyle,cs.fontWeight,cs.fontSize,cs.fontFamily].join(' ');
        const tm=ctx.measureText('Hg'), desc=tm.fontBoundingBoxDescent||fsz*0.22;
        const bg=cs.backgroundColor, ul=/underline/.test(cs.textDecorationLine||cs.textDecoration||'');
        const re=/\S+/g;
        for(let m;(m=re.exec(n.nodeValue));){
          const r=document.createRange(); r.setStart(n,m.index); r.setEnd(n,m.index+m[0].length);
          const rc=r.getClientRects()[0]; if(!rc||!rc.width) continue;
          const x=rc.left-base.left, yb=rc.bottom-base.top-desc;
          // Highlight first: it is a marker UNDER the words, not a box over them.
          if(bg&&!TRANSPARENT.test(bg)){ ctx.fillStyle=bg; ctx.fillRect(x,rc.top-base.top,rc.width,rc.height); }
          ctx.fillStyle=cs.color||'#141414';
          ctx.fillText(m[0],x,yb);
          if(ul) ctx.fillRect(x,yb+Math.max(1,fsz*0.09),rc.width,Math.max(1,fsz*0.06));
          drew=true;
        }
      }
      // CELL BORDERS are CSS, not text, so a transcription draws the words in a table and none of
      // the table. Same class of omission as list markers below: content that is not a text node
      // is invisible to a renderer built out of Ranges, and printing a table as loose columns of
      // words would be worse than not printing it.
      for(const cell of el.querySelectorAll('td,th')){
        const r=cell.getBoundingClientRect(); if(!(r.width>0&&r.height>0)) continue;
        const cs=getComputedStyle(cell);
        const bg=cs.backgroundColor;
        const x=r.left-base.left, y=r.top-base.top;
        if(bg&&!TRANSPARENT.test(bg)){ ctx.fillStyle=bg; ctx.fillRect(x,y,r.width,r.height); }
        ctx.strokeStyle=cs.borderTopColor||'#d8d8d8';
        ctx.lineWidth=Math.max(0.6,parseFloat(cs.borderTopWidth)||1);
        // Half-pixel inset so a 1px rule lands ON a device pixel instead of straddling two and
        // printing as a soft grey smear.
        ctx.strokeRect(x+0.5,y+0.5,r.width-1,r.height-1);
        drew=true;
      }
      // ::marker is a pseudo-element with no text node and no Range, so a transcription misses it
      // and a bulleted list prints as unmarked paragraphs. Drawn from the item's own box instead.
      for(const li of el.querySelectorAll('li')){
        const lr=li.getBoundingClientRect(), cs=getComputedStyle(li), fsz=parseFloat(cs.fontSize)||18;
        ctx.font=[cs.fontStyle,cs.fontWeight,cs.fontSize,cs.fontFamily].join(' ');
        const desc=ctx.measureText('Hg').fontBoundingBoxDescent||fsz*0.22;
        const ordered=li.parentElement&&li.parentElement.tagName==='OL';
        const label=ordered?([...li.parentElement.children].indexOf(li)+1)+'.':'\u2022';
        // The marker sits on the item's FIRST LINE baseline, transcribed from that line's own
        // text exactly as every word above is. Computing it instead (box bottom less the descent)
        // ignores the line box's half-leading and drew every bullet ~4px below its words.
        let yb=null;
        const w=document.createTreeWalker(li,NodeFilter.SHOW_TEXT);
        for(let t;(t=w.nextNode());){
          const at=/\S/.exec(t.nodeValue); if(!at) continue;
          const r=document.createRange(); r.setStart(t,at.index); r.setEnd(t,at.index+1);
          const rc=r.getClientRects()[0]; if(!rc) continue;
          yb=rc.bottom-base.top-desc; break;
        }
        // An EMPTY list item has no text to measure; centre the marker in the item's own box.
        if(yb==null) yb=lr.top-base.top+(lr.height+fsz*0.7)/2;
        ctx.fillStyle=cs.color||'#141414';
        ctx.fillText(label,lr.left-base.left-fsz*0.95,yb);
        drew=true;
      }
      return drew; }

    // ── Images (bytes live outside the notebook; the notebook stores only {path,x,y,w,h}
    //    normalised by width). Resolved to a data: URL via opts.imageUrl and cached. ──
    const imgCache=Object.create(null);                       // path -> {img, ready}; no prototype: a path is the notebook's text (ADR 0015)
    function ensureImage(path){
      if(imgCache[path]) return imgCache[path];
      const rec={img:new Image(), ready:false}; imgCache[path]=rec;
      if(opts.imageUrl){ (async()=>{ try{ const url=await opts.imageUrl(path); if(!url) return;
        rec.img.onload=()=>{ rec.ready=true; rebuildCommitted(); redrawPage(); }; rec.img.src=url;
      }catch(_){ /* image unresolved (broker down / deleted): placeholder stays, page still renders */ } })(); }
      return rec;
    }
    function drawImages(pg, ctx){ ctx=ctx||inkCtx;
      for(const im of pg.images){ const rec=ensureImage(im.path); const x=im.x*W,y=im.y*W,w=im.w*W,h=im.h*W;
        if(rec.ready){ try{ ctx.drawImage(rec.img,x,y,w,h); }catch(_){ /* decode failed mid-draw: skip this image, keep the rest */ } }
        else { ctx.save(); ctx.fillStyle='rgba(0,0,0,.05)'; ctx.fillRect(x,y,w,h);
          ctx.strokeStyle='rgba(0,0,0,.12)'; ctx.strokeRect(x+.5,y+.5,w-1,h-1); ctx.restore(); } }
    }
    function primeImage(path,url){ return new Promise(res=>{ const img=new Image();
      img.onload=()=>{ imgCache[path]={img,ready:true}; res(img.width?img.height/img.width:0.75); };
      img.onerror=()=>res(0.75); img.src=url; }); }
    // A photo is stored outside the notebook, but its bytes still cross the store's body cap on
    // the way in, so the size is checked HERE — before ~20MB is pushed over cellular to earn a 413
    // nobody wanted — against the number the store publishes, and the message NAMES THAT NUMBER.
    const PHOTO_MAX_BYTES=(opts.uploadMaxBytes|0)||UPLOAD_MAX_BYTES;
    // Several photos in one pick land STAGGERED, each this much of the page right of and below
    // the last, so none hides the one before it; the user then drags each where it belongs.
    // The spots CYCLE (a library pick of 20 is routine): the k-th spot is never past 0.40/0.45,
    // so a half-page-wide photo always stays inside the page instead of walking off its edge.
    const PHOTO_STAGGER=0.05, PHOTO_SPOTS=8;
    const photoSpot=(i)=>{ const k=i%PHOTO_SPOTS; return {x:round4(0.05+k*PHOTO_STAGGER), y:round4(0.10+k*PHOTO_STAGGER)}; };
    async function addPhoto(file,at){
      if(!imgHooks) return;
      // The pre-flight belongs to whoever knows the REAL size that will be sent. When PAPhoto is
      // on the page (web/photo-ui.inline.html — it arrives with PAChat, which every app mounting
      // this pad also mounts) the app's uploadImage hook DOWNSCALES before sending, so refusing
      // here on the ORIGINAL file size would reject an 8MB camera shot that lands at 300KB. That
      // is a false refusal, and a false refusal is precisely what this cap was invented to stop —
      // it only ever had the right to say "the server will not take this".
      // PAPhoto pre-flights the RESIZED bytes against the SAME published cap and renders the SAME
      // sentence (it calls PAChat.failText, which is where PHOTO_TXT.big's wording came from), so
      // nothing is lost by standing down. Without PAPhoto the pad still guards, unchanged.
      // The one refusal the user can act on. It states the cap, not the photo's size: "12 MB" tells
      // nobody what would fit. Bilingual, and word-for-word the shell's own sentence (R3).
      if(!window.PAPhoto&&file&&file.size>PHOTO_MAX_BYTES){ flash(PHOTO_TXT.big(PHOTO_MAX_BYTES)+PHOTO_TXT.bigAct); return; }
      // The note the photo was picked FOR (review 2026-11-23): an upload is slow, and the pane may
      // load another note (a chapter change) before it answers. Never insert into that one.
      const nb0=NB, pg0=page();
      try{
        const r=await opts.uploadImage(file);
        const path=(r&&typeof r==='object')?(r.ok===false?'':(r.path||'')):r;
        // R5: surface WITH the reason the app gave, never a bare generic failure. The app hands
        // back the SHELL'S rendered sentence when it has one (`text` — already the right noun, the
        // right language and, for a size rejection, the right cap), and its own `error` otherwise.
        if(!path){ flash(PHOTO_TXT.failed+((r&&(r.text||r.error))?' — '+(r.text||r.error):'')); return; }
        const url=await opts.imageUrl(path);
        const ratio=url?await primeImage(path,url):0.75;
        if(NB!==nb0||page()!==pg0){ flash(PHOTO_TXT.moved); return; }   // after the LAST await
        pushUndo();
        const w=0.5;                                           // half page width; keep aspect
        const x=at?at.x:0.25, y=at?at.y:0.18;
        page().images.push({path,x:round4(x),y:round4(y),w:round4(w),h:round4(w*ratio)});
        rebuildCommitted(); redrawPage(); touchPage(); scheduleSave();
      }catch(err){ flash(PHOTO_TXT.broken+' — '+String((err&&err.message)||err)); }   // R5: user-visible failure, with the reason
    }

    // ── Re-editing a photo already on the page ───────────────────────────────────────────
    // PAScan (web/scan-ui.inline.html) already does crop AND tilt in one gesture: four draggable
    // corners solved as a homography, so straightening a photographed page and cropping to it is
    // the same drag. It was only ever reachable from the 🖼 menu's Scan path, which meant a photo
    // inserted from the library could never be straightened afterwards.
    //
    // DESTRUCTIVE, deliberately. The bytes on disk are the processed JPEG, not the original, so a
    // second edit re-warps an edited image. Keeping the original alongside every photo would
    // roughly double note size, and note size is already the thing pushing the store's cap — the
    // note that lost handwriting was 6.54MB. "Straighten it a bit more" is worth that trade;
    // "undo my crop" is not offered, and undo covers the placement rather than the pixels.
    const EDIT_TXT={
      unavailable:'图片编辑器未加载 · Photo editor unavailable',
      fetching:'正在打开图片… · Opening the photo',
      noBytes:'无法读取该图片 · Could not read this photo',
    };
    // TODO(R4 seam): "make stationery from a photo" belongs with the image menu in its own file (image-menu split).
    // Make stationery · 做成信纸: the photo's stored bytes go to the Stationery picture panel (page settings), where
    // "Use as background" and "Recreate with AI" already live — and, once kept, every note can pick it.
    const TPL_TXT={ unavailable:'信纸不可用 · Stationery is not available here',
      tip:'可以把这张图片做成信纸，其他笔记也能用 · Make this picture a page stationery; other notes can use it too' };
    const canStationery=()=>!!(imgHooks&&stPick&&stPick.hasStudio&&stPick.hasStudio()&&window.PAPhoto&&window.PAPhoto.toFile);
    let tplSeq=0;                                               // the live request; a newer one, or a deselected photo, voids it
    async function stationeryFromImage(im){
      if(!im||!canStationery()){ flash(TPL_TXT.unavailable); return; }
      const my=++tplSeq;
      try{
        flash(EDIT_TXT.fetching);
        const url=await opts.imageUrl(im.path);                  // NOT fetch(): connect-src 'none' (see editImage)
        if(my!==tplSeq||singleImage()!==im) return;              // moved on (another note, another photo): open nothing
        if(!url){ flash(EDIT_TXT.noBytes); return; }
        closePops(); paperPop.classList.add('on'); positionPop(paperPop,paperBtn); syncPopBtns();
        await stPick.usePicture(window.PAPhoto.toFile(url,'photo.jpg'));
      }catch(err){ flash(PHOTO_TXT.broken+' — '+String((err&&err.message)||err)); }   // R5: shown, not swallowed
    }
    async function editImage(im){
      if(!im||!imgHooks) return;
      if(!window.PAScan){ flash(EDIT_TXT.unavailable); return; }
      try{
        flash(EDIT_TXT.fetching);
        // The stored bytes, via the same resolver the renderer uses — an app may serve them as a
        // data: URL, which is the only form a sandboxed page can fetch at all.
        const url=await opts.imageUrl(im.path);
        if(!url){ flash(EDIT_TXT.noBytes); return; }
        // NOT fetch(). App pages are served connect-src 'none', so fetching even the data: URL the
        // broker just handed back fails with "Failed to fetch" — which is precisely what the first
        // version of this did, in the user's hands, on a real photo.
        if(!(window.PAPhoto&&window.PAPhoto.toFile)){ flash(EDIT_TXT.unavailable); return; }
        const r=await window.PAScan.correct(window.PAPhoto.toFile(url,'photo.jpg'));
        if(!r||!r.ok) return;                                   // cancelled: the note is untouched
        const up=await opts.uploadImage(r.file);
        const path=(up&&typeof up==='object')?(up.ok===false?'':(up.path||'')):up;
        if(!path){ flash(PHOTO_TXT.failed+((up&&(up.text||up.error))?' — '+(up.text||up.error):'')); return; }
        // The crop changes the SHAPE, so the placed box must follow it or the picture stretches.
        // Width is kept (the user chose that size); height follows the new aspect.
        const nurl=await opts.imageUrl(path);
        const ratio=nurl?await primeImage(path,nurl):(im.h/im.w)||0.75;
        pushUndo();
        im.path=path; im.h=round4(im.w*ratio);
        // A replaced photo can be SMALLER than the one it replaced (that is what cropping is), and
        // the shrink guard would otherwise refuse the write as a suspicious loss of content.
        guard.allowShrink();
        rebuildCommitted(); redrawPage(); touchPage(); scheduleSave();
      }catch(err){ flash(PHOTO_TXT.broken+' — '+String((err&&err.message)||err)); }   // R5
    }

    // ── Image clipboard （图片剪贴板）──────────────────────────────────────────────────────
    // INTERNAL, not the system clipboard. Two reasons, and the first is the good one: a note
    // image is stored as a PATH to uploaded bytes, so a copy is a second placement pointing at
    // the SAME file — a pasted photo costs a few dozen bytes of JSON, not another 300KB. On a
    // store whose cap a real note has already hit, that is the difference between a feature and
    // a liability. The second reason is that the sandbox grants clipboard-WRITE only, so reading
    // a system image back is not available to this page at all (it would have to come via the
    // shell — deliberately out of scope here).
    let _imgClip=null;                                        // {path,w,h} of the last copied/cut image
    const PASTE_NUDGE=0.03;                                   // offset a paste so it never lands exactly on its source
    function copyImage(im){ if(!im) return; _imgClip={path:im.path,w:im.w,h:im.h}; _selClip=null; syncPasteRows(); flash(IMG_TXT.copied); }
    function pasteImage(){
      if(!_imgClip) return;
      pushUndo();
      // Nudged down-right and clamped, so a paste onto the same page is visibly a second copy
      // rather than looking like nothing happened.
      const x=Math.min(0.9-_imgClip.w, Math.max(0, 0.25+PASTE_NUDGE));
      const y=Math.max(0, 0.18+PASTE_NUDGE);
      page().images.push({path:_imgClip.path,x:round4(x),y:round4(y),w:round4(_imgClip.w),h:round4(_imgClip.h)});
      rebuildCommitted(); redrawPage(); touchPage(); scheduleSave();
    }
    // Show or hide a menu ROW without deciding what it is. SCAR: 'block' was used as a synonym
    // for "visible" here, on rows the stylesheet lays out as a grid — and an inline style beats
    // every rule in it. The two rows toggled this way (Ask AI, Crop) were re-laid-out as blocks,
    // which put the icon on its own line with the label beneath, while every untouched row was
    // fine. It survived a flex-wrap fix, a grid rewrite, a label rewrite and an icon swap,
    // because none of those could outrank an inline style. '' hands the row back to the sheet.
    const showRow=(el,on)=>{ if(el) el.style.display=on?'':'none'; };
    function syncPasteOpt(){ syncPasteRows(); }          // kept as the name other call sites use

    // ── The selected-image menu ───────────────────────────────────────────────────────────
    const IMG_TXT={ copied:'已复制图片 · Image copied', cut:'已剪切图片 · Image cut' };
    function openImgMenu(im,at){
      const pop=q('.pan-imgpop'); if(!pop||!im) return;
      const cropBtn=pop.querySelector('[data-img="crop"]');
      // Crop is offered only where the editor actually exists — an item that flashes "unavailable"
      // is worse than an item that is not there.
      showRow(cropBtn, !!(window.PAScan&&imgHooks));
      // Offered only where the APP can answer it. The pad has no idea what a conversation is —
      // it hands over the image and the host decides where the answer appears.
      const askBtn=pop.querySelector('[data-img="ask"]');
      showRow(askBtn, !!opts.onAskImage);
      const tplBtn=pop.querySelector('[data-img="tpl"]'); showRow(tplBtn, canStationery());

    function pasteSel(){

    // rather than a screenshot of a page. Images in the selection are drawn through the pad's own
    // renderer (a fake page carrying only them) rather than a second copy of that code (R3).
    function renderSelPng(){
      const b=selBBox(); if(!b) return null;
      const pad=14, scale=2;

      for(const s of strokes) if(s.t==='highlighter') drawStroke(ctx,s.p.map(denorm),s.c,s.w*W,s.t,s.a);

    async function askSelection(){
      if(!opts.onAskImage||!opts.uploadImage||!window.PAPhoto) return;
      const url=renderSelPng(); if(!url){ flash(SEL_TXT.tooBig); return; }
      let path=null;

      catch(_){ path=null; }                            // the hook surfaces its own reason (R5)

    }
    const selPop=q('.pan-selpop');

    // pointer, which is where a context menu belongs; the ⋯ handle passes nothing and keeps
    // hanging off the selection's corner.

      if(!selPop) return;

      syncPasteRows();
      closePops(); selPop.classList.add('on');
      const b=selBBox(); if(!b) return;
      const r=ink.getBoundingClientRect(), hr=host.getBoundingClientRect(), k=pageK(r);
      const hx=at?at.x:((b.x+b.w)*W*k + r.left - hr.left), hy=at?at.y:(b.y*W*k + r.top - hr.top);
      const pw=selPop.offsetWidth||200;

    host.querySelectorAll('[data-pg]').forEach(b=>b.addEventListener('click',()=>{
      const a=b.dataset.pg; closePops();
      if(a==='paste') pasteAny();
      else if(a==='text'){ if(textPanel) textPanel.open(); else flash(NO_TEXT_PANEL); }   // TODO(R4 seam): the component-glue block (plog, reveal, textPanel)

      const a=b.dataset.sel; closePops();

    // copy would be a far worse bug than the one this fixes. For Z that guard is load-bearing in a

    //    while the T tool is active the browser also gives native per-keystroke undo). ──
    let undoStacks, redoStacks; const clearHistory=()=>{ undoStacks=Object.create(null); redoStacks=Object.create(null); }; clearHistory();   // no prototype: keyed by a page's id (ADR 0015)

    // ── Pointer routing: pen/mouse draw; a FINGER edge-swipe flips pages. Palm rejection =
    //    ignore touch while a pen is down (a resting palm registers as touch and must not draw).
    //    Select/Text tools take over the surface before any finger logic. The Pencil/mouse draw
    //    path below is left EXACTLY as it was — the finger edge-swipe is the only added input. ──
    // Finger edge-swipe: shared live-drag entry points used by BOTH the ink surface (drawing
    // tools) and the edge gutters (T tool), so there is ONE flip-drag implementation. Touch only.
    /* ══ PA_PENCIL_LOG_BEGIN — glue for the Pencil recorder (web/pencil-log.inline.html); extracted by the routing tests ══ */
    // TODO(R4): this file is far over the 300-line budget. Split seam: the pointer routing below
    // (PA_POINTER_ROUTING markers) is already a self-contained, test-extracted block — it becomes
    // its own inlined component, the way the Pencil recorder already is.
