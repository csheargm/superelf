    // The search-hit reveal（命中定位）: go to the hit's page and mark the matched lines
    // (web/note-reveal.inline.html, carried by the PA_NOTE_REVEAL_UI marker below). The component
    // owns the overlay; this glue only lends it the page and the flip.
    // TODO(R4 seam): grows this over-budget file by two lines; the seam is the component-glue block (plog, reveal).
    const reveal=window.PANoteReveal?window.PANoteReveal.attach({host,stage,pageInner,textLayer,flipTo,listen:listenG}):null;
    // The Transcript panel（转写）: the page settings' row opens it; it reads the node's index for the
    // note opts.doc() names (web/note-text.inline.html, carried by the PA_NOTE_TEXT_UI marker below).
    const NO_TEXT_PANEL='此页面没有转写 · Transcript is not on this page';   // the component was not inlined (a page without the marker)
    const textPanel=window.PANoteText?window.PANoteText.attach({host,doc:()=>(typeof opts.doc==='function'?opts.doc():null)}):null;
    // "发送笔迹日志 · Send Pencil log" — in the ink popover only when the host wired opts.saveLog.
    const sendLogBtn=q('.pan-sendlog');
    if(sendLogBtn) sendLogBtn.addEventListener('click',async()=>{ closePops();
      if(!plog){ flash('笔迹日志不可用 · Pencil log unavailable'); return; }
      const path='debug/pencil-log-'+new Date().toISOString().replace(/[:.]/g,'-')+'.json';

      catch(err){ r={ok:false,error:String((err&&err.message)||err)}; }   // surfaced by the flash below (R5)

    /* ══ PA_PENCIL_LOG_END ══ */
    /* ══ PA_POINTER_ROUTING_BEGIN — cut out by routingSource() and driven for real by runPad() in test/helpers-panote-routing.mjs, for every suite that calls them ══ */
    // ── PALM REJECTION（掌拒）for the finger page-flip ──────────────────────────────────────
    // SYMPTOM (reported from a real iPad): resting the pinky/palm on the page to START WRITING
    // turned the page. The old guard was `penId!==null` at gesture start only, and that is the
    // one instant it cannot work: the palm lands BEFORE the nib, so penId was still null, the
    // gesture armed, nothing re-checked it afterwards, and a >6px palm slide called beginFlipDrag.
    // Three guards, one per window the old check left open:
    //   1. penTookOver() — a pen pointerdown CANCELS an armed or already-dragging finger flip and
    //      snaps the page back. The nib arriving is proof the earlier contact was a palm.
    //   2. fingerFlipMove/fingerFlipEnd re-check penId — the pen owns the surface CONTINUOUSLY,

    // Position the floating tools bar below the top bar when one is present (measured, so it
    // tracks the real bar height incl. safe-area). No top bar → CSS default (safe-area + 8px).
    function syncToolsTop(){ if(!topBar) return; const h=toolsClearance(); if(h||topBar.getAttribute('data-paab-hidden')==='1') host.style.setProperty('--pan-toolstop',(h+8)+'px'); }

    // strokes aren't lost; re-fit canvases on resize; keep the formatting bar tracking the

    // SCAR (2026-09-02, Pencil ink landed right of the nib): the canvas BACKING store is
    // sized from the stage width at setup, while pointAt reads the element's CURRENT rect.
    // Any width change without a re-measure leaves CSS stretching the canvas, so one canvas
    // pixel becomes >1 screen pixel and ink drifts further right the further right you write.
    // window.resize alone is not enough: aae66be made the docked drawer narrow .pan-fs via
    // `left:var(--pac-dock)`, which fires NO resize event, and setupCanvases early-returns

    // change was dropped entirely. Observe the ELEMENT: the cause stops mattering.
    let roStage=null;

        const r=stage.getBoundingClientRect();
        if(r.width<=0||r.height<=0) return;                       // hidden: the show() re-measure covers it
        if(Math.abs(r.width-lastW)<0.5 && Math.abs(r.height-lastH)<0.5) return;   // no real change
        lastW=r.width; lastH=r.height; onResize();               // setupCanvases redraws at its end
      });
      roStage.observe(stage);
    }
    // visibilitychange fires BEFORE pagehide. The old pair cleared the debounce timer here and
    // therefore made the pagehide handler — the genuine last chance — a guaranteed no-op. Both
    // now call flushDurable(), which is gated on unconfirmed work rather than on a timer. A real
    // pagehide is too late (the shell no longer serves the page: lost in both engines, ADR 0018), so
    // on a leave the shell says {pa:'leaving'} first and PALeave runs this while writes are answered.
    const onHide=()=>{ if(document.visibilityState==='hidden'){ commitPageHtml(); flushDurable(); } };
    const onPageHide=()=>{ commitPageHtml(); flushDurable(); };

    // runs in a sandboxed iframe (opaque origin — localStorage, sessionStorage, IndexedDB and
    // document.cookie ALL throw SecurityError, verified 2026-09-02), so there is no client-side
    // store to fall back on: what is unconfirmed lives in the notebook object and must be WRITTEN.

    // the protection itself.
    const onBeforeUnload=(e)=>{ if(!guard.state().unsaved) return;
      e.preventDefault(); e.returnValue=SAVE_TXT.leave; return SAVE_TXT.leave; };
    const onVV=()=>{ if(txtEdit){ positionFmt(); if(linkPop.classList.contains('on')) placeLinkPop(); } };   // the keyboard moved the bar: the link strip follows
    window.addEventListener('resize',onResize);

    window.addEventListener('pagehide',onPageHide);
    window.addEventListener('beforeunload',onBeforeUnload);

    if(opts.title!=null&&htitle) htitle.textContent=opts.title;
    setColor(COLORS[0]); setSize(SIZE_DEF);                      // seed swatch/dot/size from the single sources
    // The opening tool is seeded SYNCHRONOUSLY, not through setTool(): setTool is async and
    // awaits a flush before it assigns, and setColor/setSize above each call setTool('pen')
    // whenever the current tool is erase/select/text — so routing the initial tool through it
    // left the pad on the pen every time, with the T button unlit and the page not editable.
    tool=OPEN_TOOL;
    toolBtns.forEach(b=>b.classList.toggle('on',b.dataset.tool===tool));

    // here only covers the window before the first pull completes.

    dockTools();                                                // dock first: mount mode measures the strip height here

    // place the first time it is asked for, rather than measuring itself while hidden.
    drawRowOpen=!topBar; syncMode();
    setupCanvases();                                            // paint paper immediately (fresh notebook)
    // After the first pull the page is known: choose the opening tool by it — unless the user
    // already picked one in the load window (a deliberate choice outranks the content rule).
    (async()=>{ await pull(false); setupCanvases(); redrawPage(); renderTextLayer(); updateUndo();
      if(!userPicked){ if(tool==='text') exitTextMode(); const nf=applyOpenTool(); if(tool==='text') enterTextMode(nf); } })();

    return {
      popsOpen,   // "a popover from this pad is open" — the ONE POPS_OPEN check, for a host's own guards (PAAppBar keepOpen, R3)
      // Re-fit + re-pull persistence and repaint — used by fullscreen open() when the overlay
      // becomes visible or the app points it at a different scope. Flushes the outgoing scope first.
      // Scope switch. `applyScope` is the app's "now point load()/save() at the new entry/verse"
      // callback and it is called BETWEEN the flush and the pull — the ordering is structural, not
      // a comment an app can forget. SCARS this closes:
      //   * the flush was fired WITHOUT await and pull(true) then REPLACED NB, so the only copy of
      //     an unsaved stroke died in the swap;
      //   * apps switched their scope variable BEFORE calling reload, so this flush wrote the
      //     OUTGOING notebook under the INCOMING key and destroyed the destination's handwriting.

      reload:async(applyScope)=>{ if(tool==='text') exitTextMode(); userPicked=false;   // reset at the START: a tool tapped during the switch wins

        const wasId=NB.id; await pull(true); setupCanvases(); syncToolsTop(); redrawPage(); renderTextLayer(); updateUndo();

        // the tool the user chose stays. TODO(R4 seam): the open-tool rules could move to their own file.
        const rule=NB.id!==wasId&&!userPicked;   // a new note with no tap during the switch: the content picks

      resize:()=>{ setupCanvases(); syncToolsTop(); },
      redraw:redrawPage,
      reveal:(at)=>reveal?reveal.show(at):Promise.resolve(false),   // a search hit: {page,boxes,terms} after reload (phase 3)
      transcript:()=>textPanel?textPanel.open():Promise.resolve(false),   // the Transcript panel, as the page-settings row opens it

      markDirty:()=>guard.touch(),

      saveState:()=>guard.state(),                              // apps can ask "is anything unconfirmed?" before a destructive step
      // The load half of the same question: {status,error,code} for the note currently open, and

      loadState:()=>({status:loadOut.status,error:loadOut.error,code:loadOut.code,locked:guard.state().locked}),
      retryLoad,                                              // re-run the SAME load (the curtain's button; an app can offer its own)
      addPage,                                               // add a fresh blank page and flip to it (mirrors the ＋ button)
      setTitle:(t)=>{ if(htitle) htitle.textContent=t||''; },
      // Returns the flush promise so a caller can await durability BEFORE the pad is gone.
      destroy:()=>{ commitPageHtml(); const done=flushDurable(); clearTimeout(lockShowT); clearTimeout(textTimer);
        document.removeEventListener('pointerdown',onPopOutside,true); document.removeEventListener('keydown',onPopEsc,true); document.removeEventListener('paste',onDocPaste,true);

        document.removeEventListener('keydown',onKey); document.removeEventListener('keydown',onShortcut); document.removeEventListener('selectionchange',onSelChange);
        globalsOff.forEach(off=>off());                          // the Pencil recorder's and the pen backstop's window/document listeners
        if(window.visualViewport){ window.visualViewport.removeEventListener('resize',onVV); window.visualViewport.removeEventListener('scroll',onVV); }
        return done.finally(()=>guard.stop()); },                // retries stop only once the last write has settled
    };
  }

  // TODO(R4 seam): this search block → web/note-search.inline.html (needs a component marker in every host, so it waits for the split session).
  // ── Device prefs a HOST reads（主机读取的设备偏好）── openAi: open a note's bound AI conversation
  // with the note. ONE value for the page, set by the shell's {pa:'prefs'} push (iframe load, and
  // again after the app's Settings dialog saves): the account's appPrefs[slug].openAi, set in that
  // dialog (web/settings-rows.inline.html) — one place, per app. Hosts read it through PANote.prefs()
  // at the moment a note opens, so a host never parses the message and a change applies to the
  // next note opened. Default false (the shell sends ===true).
  const PREFS={openAi:false};
  function applyPrefs(m){ if(m&&m.pa==='prefs'&&typeof m.openAi==='boolean') PREFS.openAi=m.openAi; }
  window.addEventListener('message',(e)=>applyPrefs(e.data));
  // ── Note search（笔记搜索）── The ONE client entry to the broker kind 'note-search' (web.mjs
  // GET /api/note-search, lib/note-search.mjs; ADR 0023). It goes through PAStore.ask — the one
  // postMessage round-trip every served app page carries — so this file posts no request of its
  // own (R3). A reply to a query that has since been superseded resolves {stale:true}; the caller
  // drops it. Resolves an OUTCOME, {ok,hits} or {ok:false,error,code}, never a throw: the drawer
  // must say "search unavailable" under its box, not die at boot (R5).
  // `where` labels are exported ONE place (SEARCH_TXT): ink/photo are phase 2's, named now so the
  // drawer needs no change when those hits arrive.
  // `pending` carries the count as {n}; `noOcr` is said when the node cannot transcribe at all and
  // `ocrFailed` when it could but failed lately (the drawer appends the node's reason).
  const SEARCH_TXT=Object.freeze({ transcript:'转写 · Transcript', tag:'标签 · Tag', typed:'文本 · Text', ink:'手写 · Ink', photo:'图片 · Photo', failed:'搜索不可用 · Search unavailable', searching:'搜索中… · Searching…', more:'仅显示最相关的笔记 · Only the best matches are shown',
    pending:'正在识别 {n} 页 · Transcribing {n} pages', noOcr:'手写搜索需要 Mac 节点 · Handwriting search needs the Mac node', ocrFailed:'本机手写识别失败 · Handwriting transcription failed on this node' });
  let _searchSeq=0;
  async function searchNotes(q){
    const my=++_searchSeq, query=String(q||'').trim();
    if(!query) return {ok:true,hits:[]};
    if(!(window.PAStore&&typeof window.PAStore.ask==='function')) return {ok:false,error:SEARCH_TXT.failed,code:'no-broker'};
    const r=await window.PAStore.ask({kind:'note-search',q:query});
    if(my!==_searchSeq) return {ok:true,stale:true,hits:[]};
    // Phase 2 passes through what the node says about handwriting: `pending` pages still being
    // transcribed (0 when none or unknown), `ocr` ('ready'|'building'|'failed'|'unavailable') and
    // `reason` (why it failed, '' otherwise).
    // Phase 3: `terms` (the query tokens as matched) ride along; each hit carries its `boxes`.
    if(r&&r.ok) return {ok:true,hits:Array.isArray(r.hits)?r.hits:[],truncated:r.truncated===true,pending:Math.max(0,Number(r.pending)||0),ocr:typeof r.ocr==='string'?r.ocr:'',reason:typeof r.reason==='string'?r.reason:'',terms:Array.isArray(r.terms)?r.terms.filter(t=>typeof t==='string'):[]};

  // ── THE PENCIL GUARD（防误触）on an ink surface: explicit touch-event preventDefault (Pointer-event
  // preventDefault, even with touch-action:none, does NOT reliably stop the iOS selection gesture that
  // steals the Pencil — the proven fix from NotabilityEditor) plus selectstart. Pointer Events keep
  // firing, so drawing and the finger page-flip ride on. `when(e)` lets a surface guard only SOME
  // touches (PAInkAnchor: the stylus, so a finger still scrolls the verse list); the pad guards all.
  function guardInk(el,when){
    const stop=e=>{ if(!when||when(e)) e.preventDefault(); };
    el.addEventListener('touchstart',stop,{passive:false});
    el.addEventListener('touchmove',stop,{passive:false});
    el.addEventListener('selectstart',stop);
  }
  // ── Stroke renderer（笔迹渲染）, module scope so a SECOND ink surface (PAInkAnchor, the Bible's
  // anchored ink over the verse text, docs/plans/annotation-anchoring.md §3 b) reuses it through
  // window.PANote.ink instead of re-implementing it (R3). Pure: canvas ctx + CSS-px points in, no
  // instance state. Hoisted out of Note() unchanged. TODO(R4 seam): this block + guardInk are the
  // first lines of a web/ink-core.inline.html that note-ui would carry above its own script.
  const segWidth=(base,p)=>base*(0.45+1.25*(p||0.5));        // pressure modulates thickness
  // One smoothed, pressure-weighted segment shared by the committed renderer and the live
  // renderer, so a stroke drawn live matches its committed re-render exactly (no drift).
  function segTo(ctx,base,prev,a,b){
    const m0=prev?mid(prev,a):a, m1=mid(a,b);
    ctx.lineWidth=segWidth(base,(a.p+b.p)/2);
    ctx.beginPath(); ctx.moveTo(m0.x,m0.y); ctx.quadraticCurveTo(a.x,a.y,m1.x,m1.y); ctx.stroke();
  }
  // Render one committed stroke (points already denormalised to CSS px). Pen & marker use
  // midpoint-quadratic + per-segment width so pen pressure shows as line weight; highlighter
  // uses drawFlat (one path, uniform alpha). `t` absent = pen (v1 back-compat).
  function drawStroke(ctx,pts,col,base,t,alpha){
    if(!pts.length) return;
    if(t==='highlighter'){ drawFlat(ctx,pts,col,base,alpha==null?HILITE_ALPHA:alpha); return; }
    ctx.save(); ctx.strokeStyle=col; ctx.fillStyle=col;
    if(pts.length===1){ ctx.beginPath(); ctx.arc(pts[0].x,pts[0].y,segWidth(base,pts[0].p)/2,0,TAU); ctx.fill(); ctx.restore(); return; }
    for(let i=1;i<pts.length;i++) segTo(ctx,base,i>=2?pts[i-2]:null,pts[i-1],pts[i]);
    const last=pts[pts.length-1], prev=pts[pts.length-2];    // reach the final point
    ctx.lineWidth=segWidth(base,last.p); ctx.beginPath(); ctx.moveTo(mid(prev,last).x,mid(prev,last).y); ctx.lineTo(last.x,last.y); ctx.stroke();
    ctx.restore();
  }
  // Highlighter: the WHOLE stroke is ONE path stroked ONCE at globalAlpha<1, so self-overlap
  // composites as a single coverage op and never darkens to opaque. Constant width (no pressure).
  function drawFlat(ctx,pts,col,base,alpha){
    ctx.save(); ctx.globalAlpha=alpha; ctx.strokeStyle=col; ctx.fillStyle=col; ctx.lineWidth=base;
    ctx.beginPath();
    if(pts.length===1){ ctx.arc(pts[0].x,pts[0].y,base/2,0,TAU); ctx.fill(); ctx.restore(); return; }
    ctx.moveTo(pts[0].x,pts[0].y);
    for(let i=1;i<pts.length-1;i++){ const m=mid(pts[i],pts[i+1]); ctx.quadraticCurveTo(pts[i].x,pts[i].y,m.x,m.y); }
    const last=pts[pts.length-1]; ctx.lineTo(last.x,last.y);
    ctx.stroke(); ctx.restore();
  }
  window.PANote={
    ink:Object.freeze({drawStroke,drawFlat,segTo,segWidth,guardInk,MAX_CANVAS_PX,HILITE_ALPHA}),   // the shared stroke renderer + Pencil guard (R3): PAInkAnchor draws with these
    palette:palette(),                      // the pen palette (colours, tools, icons, sizes) the verse-ink pen sheet reuses (R3)
    mount:(host,opts)=>Note(host, opts||{}),
    TIP_OPEN_MODE,                          // TODO(R4 seam): first-use tip text, pinned by test/tips.test.mjs
    prefs:()=>Object.assign({},PREFS),
    search:searchNotes, SEARCH_TXT,
    // ── The ONE default note title (R3) ── An unnamed note names itself by its CREATION TIME,
    // so a page of pure handwriting is still tellable apart in the drawer (six notes all reading
    // "New Note" is what made a user believe handwriting had been lost). Every note-hosting app
    // shares this: apps are sandboxed and cannot import a module, but PANote IS inlined into all
    // of them, so this is the copy they reach. The server derives the same string for its own
    // listings (web.mjs NEW_NOTE_LABEL + freeStamp); test/note-default-title.test.mjs pins the
    // two byte-identical, and pins that no app re-implements the format.
    NEW_NOTE_LABEL:'New Note 新笔记',
    // '' for an unusable timestamp — never a bogus date. Same day -> ' · HH:MM', else ' · M/D HH:MM'.
    stamp:(ts,now)=>{ const ms=Number(ts);
      // <=0 catches the falsy cases Number() turns into the 1970 epoch (null, '', false) — an entry
      // with no creation time must yield NO stamp, not a note dated 1/1 1970.
      if(!Number.isFinite(ms)||ms<=0) return ''; const d=new Date(ms); if(!Number.isFinite(d.getTime())) return '';
      const n=now||new Date();
      const hhmm=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
      return d.toDateString()===n.toDateString() ? ' · '+hhmm : ' · '+(d.getMonth()+1)+'/'+d.getDate()+' '+hhmm; },
    // Label + stamp. An unusable timestamp degrades to the bare label, never to "Untitled".
    defaultTitle:(ts,now)=>window.PANote.NEW_NOTE_LABEL+window.PANote.stamp(ts,now),
    // ── Shared save vocabulary (R3) ── Every app's broker helper maps its reply through
    // saveOutcome and honours SAVE_TIMEOUT_MS, so "did the write land?" is answered by ONE rule
    // in ONE file instead of being re-guessed per app (it was previously never asked at all).
    saveOutcome:outcomeOf,
    SAVE_TIMEOUT_MS,
    SAVE_TXT, NOT_SAVED, notSavedText,
    // ── The LOAD contract (R3) ── An app's load() must resolve LOAD.loaded / LOAD.absent /
    // LOAD.failed; LOAD.fromBroker(reply) maps a broker answer, treating ONLY an explicit
    // not-found code as an absence. Anything ambiguous is a failure, and a failure LOCKS the pad
    // rather than opening a blank note over a note that was never read (V1).
    LOAD, LOAD_TXT,
    // "Which copy holds more?" — exported so an app that merges two sources (e.g. a re-read that
    // races an edit) reaches the same verdict as the engine instead of re-deriving it (R3).
    pickRicher,
    contentSize:census,
    // The photo pre-flight, exported so an app can state the SAME cap in its own surface (R3) —
    // UPLOAD_MAX_BYTES is the file size the store's body cap actually admits, and PHOTO_TXT.big
    // is the one bilingual sentence that names it.
    UPLOAD_MAX_BYTES, PHOTO_TXT,
    // The markdown→allow-listed-HTML converter behind PANote's paste (V3), exported so any other
    // surface that accepts a pasted AI answer (e.g. the Bible note pane) formats it the SAME way
    // instead of growing a second dialect. mdToHtml's output is a fixpoint of sanitizeHtml.
    mdToHtml, looksLikeMarkdown, plainToHtml, sanitizeHtml,
    // ── ONE paste owner (V6) ── The engine owns every paste into a PANote text region. An app
    // that has its own renderer passes it as `pasteConverter: async(plainText)=>htmlString` in
    // mount()/fullscreen() options (its output is re-sanitized here, so it can only emit what the
    // note keeps) — it must NOT add its own paste listener, which is the round-2 regression that
    // made one paste land twice. An app listener that cannot be removed calls pasteTargetsPad(e)
    // and returns when it is true.
    pasteTargetsPad:(e)=>{ const t=e&&e.target;
      return !!(t&&t.closest&&t.closest('.pan-textlayer.pan-txted')); },
    // One call gives any app a full-screen PANote overlay whose top bar carries History + ✕,
    // mirroring PAChat.fullscreen(). The app calls .open() to show + reload for the current
    // scope, .hide() to step away, .setTitle() to relabel.
    fullscreen:(opts)=>{
      const o=opts||{};
      const ov=document.createElement('div'); ov.className='pan-fs';
      const host=document.createElement('div'); host.style.cssText='position:absolute;inset:0'; ov.appendChild(host);
      document.body.appendChild(ov);
      // The overlay hides at once (responsiveness) but the flush promise is RETURNED, so an app
      // that needs durability before its next step can await hide(). The old version discarded it
      // while the Bible app's onClose comment claimed "hide() already flushed the save".
      const hide=()=>{ ov.classList.remove('on'); return api.flush(); };
      // Re-measure on show: setupCanvases skips a hidden pad, so any size change that
      // happened while it was closed (drawer docked/undocked, rotation) is applied here.
      const show=()=>{ ov.classList.add('on'); try{ api.resize(); }catch(_){ /* pre-mount */ } };
      const api=Note(host, Object.assign({}, o, { onClose:async()=>{ await hide(); o.onClose&&o.onClose(); } }));
      return Object.assign({}, api, {
        el:ov, show, hide, isOpen:()=>ov.classList.contains('on'),
        // Show first (so the canvas has a size), then reload. `applyScope` is handed straight to
        // reload(), so the outgoing scope is flushed BEFORE the app repoints its closures.
        open:async(applyScope)=>{ show(); return api.reload(applyScope); },
      });
    },
    /* ── panel(): the same pad, hosted in a PASplit slot ────────────────────────────────────────
       An app must create EITHER this or fullscreen(), never both. Two pads on one page share the
       app's single scope variable and each save writes the WHOLE chapter, so their independent
       debounces would lose each other's handwriting — the 2026-09-02 / 2026-09-04 lost-update
       class. Nothing here can enforce that; the app's own wiring must, and its test must pin it.

       resize() is exported unchanged and the HOST must call it on every expand: the stage
       ResizeObserver below returns early on a zero reading BEFORE updating lastW/lastH, so a
       collapse and an expand back to the same width re-measures nothing and the canvas keeps a
       stale backing store (ink then lands right of the nib). */
    panel:(opts)=>{
      const o=opts||{};
      if(!o.host) throw new Error('PANote.panel: no host — a pad with nowhere to mount would render nothing and report success');
      const host=document.createElement('div');
      host.className='pan-panel';
      host.style.cssText='position:absolute;inset:0;background:var(--card,#fff)';
      o.host.appendChild(host);
      const api=Note(host, Object.assign({}, o, { onClose:async()=>{ await api.flush(); o.onClose&&o.onClose(); } }));
      return Object.assign({}, api, {
        el:host, hosted:'panel',
        // Always on screen while its slot is expanded: there is no overlay to show or hide, but
        // hide() still FLUSHES, because callers use it as "I am stepping away, make it durable".
        show:()=>{ try{ api.resize(); }catch(_){ } },
        hide:()=>api.flush(),
        isOpen:()=>true,
        open:async(applyScope)=>{ const r=await api.reload(applyScope); try{ api.resize(); }catch(_){ } return r; },
      });
    }
  };
})();
</script>
