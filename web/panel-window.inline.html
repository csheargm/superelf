<!-- PAWin — side panels as real windows（面板窗口）: dock, float, resize, minimise, maximise. ADR docs/adr/0043-panel-windows.md.
     Inlined by web.mjs at the PA_PANEL_WINDOW_UI marker, which split-ui carries after its script, so every page
     with PASplit has it. ONE generic component for every app's Ask AI / Note panels (owner 2026-11-25).
       PAWin.create({key, title, dock?, size?, closeSel?, onResize?, onVisible?}) → a window handle:
         open() close() minimize() maximize() restore() dock(where) float(rect?) setTitle(t) isVisible() state() destroy()
       where: right | left | top | bottom (push the page aside) | tr | br (corners, over the page). float: over the page.
       Each window is independent: opening one never shows another.
     DRAG the title bar (6px threshold) to tear a docked window off; drop on a target (edges 32px, corners 48px) to
     dock — the targets and a preview show while dragging; Esc cancels. Mouse, finger and Pencil alike: the bar and
     handles are touch-action:none and stop their events, so a drag never page-flips or inks.
     LAYOUT is kept per DEVICE CLASS (phone | tablet | desktop) as ratios of the viewport, in appPrefs.paneLayout2
     through PAAppPrefs (localStorage throws at the app frame's opaque origin). Phones never get here: PASplit's gate
     keeps them on the full-screen sheet. The pure geometry (PAWin.geo) is driven by test/panel-window.test.mjs. -->
<style id="paw-style">
/* TODO(R4): over 300 lines — split the CSS into its own inlined file (seam: this <style> vs the PAWin script). */
/* z-index LITERAL (test/app-load.test.mjs ladder): windows 46/47 above the page, snap 48, maximised 48, pills 49 (no window — docked or maximised — ever covers a pill), all below .pac-fs/.pan-fs (50). */
.paw-win{position:fixed;z-index:46;display:none;flex-direction:column;box-sizing:border-box;background:var(--card,#fff);
  border:1px solid var(--line,#e2e2de);box-shadow:0 4px 18px rgba(0,0,0,.12)}
.paw-win.on{display:flex}
.paw-win.paw-float{border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.22)}
.paw-win.paw-front{z-index:47}
.paw-win.paw-max{z-index:48}
.paw-bar{display:flex;align-items:center;gap:2px;height:40px;padding:0 4px 0 12px;flex-shrink:0;cursor:grab;touch-action:none;
  border-bottom:1px solid var(--line,#e2e2de);font:600 13px/1 -apple-system,system-ui,"PingFang SC",sans-serif;color:var(--muted,#6b7370);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.paw-bar:focus-visible{outline:2px solid var(--accent,#0f6355);outline-offset:-2px}
.paw-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.paw-err{font-size:11px;font-weight:400;color:#b3261e;flex-shrink:0}
.paw-btn{flex:none;width:36px;height:36px;border:0;border-radius:6px;background:none;color:inherit;font-family:inherit;font-size:18px;line-height:1;cursor:pointer;padding:0}
.paw-btn:hover{background:var(--line,#e2e2de)}
.paw-btn:focus-visible{outline:2px solid var(--accent,#0f6355)}
.paw-body{flex:1 1 auto;min-height:0;position:relative;overflow:hidden}
/* The window owns ✕ now: the mounted chat's / pad's own ✕ is hidden, and the window ✕ runs it (closeSel). */
.paw-win .pac-top .pac-close,.paw-win .pan-hx{display:none!important}
.paw-h{position:absolute;z-index:2;touch-action:none;display:none}
.paw-h[data-d=n],.paw-h[data-d=s]{left:10px;right:10px;height:10px;cursor:ns-resize}
.paw-h[data-d=e],.paw-h[data-d=w]{top:10px;bottom:10px;width:10px;cursor:ew-resize}
.paw-h[data-d=n]{top:-5px}.paw-h[data-d=s]{bottom:-5px}.paw-h[data-d=e]{right:-5px}.paw-h[data-d=w]{left:-5px}
.paw-h[data-d=ne],.paw-h[data-d=nw],.paw-h[data-d=sw]{width:18px;height:18px}
.paw-h[data-d=ne]{top:-6px;right:-6px;cursor:nesw-resize}.paw-h[data-d=sw]{bottom:-6px;left:-6px;cursor:nesw-resize}
.paw-h[data-d=nw]{top:-6px;left:-6px;cursor:nwse-resize}
/* The resize grip（缩放角, owner 2026-11-25）: a visible // glyph in a bottom gutter the body never covers (so it never sits on
   the composer's send button); the grab area is 24px (mouse) / 44px (touch), half outside the window. */
.paw-float{--paw-g:14px;padding-bottom:var(--paw-g)}
.paw-h[data-d=se]{--paw-gs:24px;--paw-go:10px;width:var(--paw-gs);height:var(--paw-gs);right:calc(-1*var(--paw-go));bottom:calc(-1*var(--paw-go));cursor:nwse-resize}
.paw-float>.paw-h[data-d=se]::after{content:'';position:absolute;right:calc(var(--paw-go) + 3px);bottom:calc(var(--paw-go) + 3px);width:11px;height:11px;opacity:.75;
  background:linear-gradient(135deg,transparent 40%,var(--muted,#6b7370) 40% 52%,transparent 52% 66%,var(--muted,#6b7370) 66% 78%,transparent 78%)}
@media (pointer:coarse){.paw-float{--paw-g:22px}.paw-h[data-d=se]{--paw-gs:44px;--paw-go:20px}.paw-float>.paw-h[data-d=se]::after{width:15px;height:15px}}
/* Docked: the inner edge is the resize handle（停靠边缘, owner 2026-11-25）: a visible bar, a 12px (mouse) / 44px (touch)
   strip along the edge, full length, col/row-resize. Only --paw-in of it lies inside the window (the title bar and the
   content stay grabbable); the rest is over the page's edge. */
.paw-win:not(.paw-float)>.paw-h{--paw-e:12px;--paw-in:6px}
.paw-win:not(.paw-float)>.paw-h:is([data-d=e],[data-d=w]){top:0;bottom:0;width:var(--paw-e);cursor:col-resize}
.paw-win:not(.paw-float)>.paw-h:is([data-d=n],[data-d=s]){left:0;right:0;height:var(--paw-e);cursor:row-resize}
.paw-win:not(.paw-float)>.paw-h[data-d=w]{left:calc(var(--paw-in) - var(--paw-e))}.paw-win:not(.paw-float)>.paw-h[data-d=e]{right:calc(var(--paw-in) - var(--paw-e))}
.paw-win:not(.paw-float)>.paw-h[data-d=n]{top:calc(var(--paw-in) - var(--paw-e))}.paw-win:not(.paw-float)>.paw-h[data-d=s]{bottom:calc(var(--paw-in) - var(--paw-e))}
@media (pointer:coarse){.paw-win:not(.paw-float)>.paw-h{--paw-e:44px;--paw-in:10px}}
.paw-win:not(.paw-float)>.paw-h::after{content:'';position:absolute;top:50%;left:calc(100% - var(--paw-in));width:4px;height:40px;margin:-20px 0 0 -2px;border-radius:2px;background:var(--muted,#6b7370);opacity:.55}
.paw-win:not(.paw-float)>.paw-h[data-d=e]::after{left:var(--paw-in)}
.paw-win:not(.paw-float)>.paw-h:is([data-d=n],[data-d=s])::after{left:50%;top:calc(100% - var(--paw-in));width:40px;height:4px;margin:-2px 0 0 -20px}
.paw-win:not(.paw-float)>.paw-h[data-d=s]::after{top:var(--paw-in)}
.paw-win:not(.paw-float)>.paw-h:hover::after,html.paw-moving .paw-win:not(.paw-float)>.paw-h::after{opacity:1;background:var(--accent,#0f6355)}
.paw-float>.paw-h,.paw-d-right>.paw-h[data-d=w],.paw-d-tr>.paw-h[data-d=w],.paw-d-br>.paw-h[data-d=w],
.paw-d-left>.paw-h[data-d=e],.paw-d-top>.paw-h[data-d=s],.paw-d-bottom>.paw-h[data-d=n]{display:block}
.paw-max>.paw-h{display:none!important}
.paw-snap{position:fixed;z-index:48;display:none;box-sizing:border-box;border:2px solid var(--accent,#0f6355);border-radius:8px;
  background:color-mix(in srgb,var(--accent,#0f6355) 14%,transparent);pointer-events:none}
.paw-tgt{position:fixed;z-index:48;display:none;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;pointer-events:none;
  background:var(--card,#fff);border:2px solid var(--accent,#0f6355);opacity:.7;box-sizing:border-box}
.paw-tgt.hit{opacity:1;background:var(--accent,#0f6355)}
html.paw-moving .paw-snap.on,html.paw-moving .paw-tgt{display:block}
html.paw-moving{-webkit-user-select:none;user-select:none}
html.paw-moving .paw-body{pointer-events:none}
.paw-pills{position:fixed;right:12px;bottom:12px;z-index:49;display:flex;gap:6px}
.paw-pill{border:1px solid var(--line,#e2e2de);border-radius:18px;background:var(--card,#fff);color:var(--text,#1d2321);
  font:13px/1 -apple-system,system-ui,sans-serif;padding:0 14px;min-height:36px;box-shadow:0 2px 10px rgba(0,0,0,.15);cursor:pointer}
/* THE PUSH. Sideways: margin on every body child (a flow column and a fixed surface both narrow — PASplit's
   proven rule). Up/down: body padding narrows the flow column; the shared full-screen surfaces take margin. */
html.paw-pr>body>*:not(.paw-x):not(.pac-drawerhost):not(.pac-lb){margin-right:var(--paw-r)}
html.paw-pl>body>*:not(.paw-x):not(.pac-drawerhost):not(.pac-lb){margin-left:var(--paw-l)}
html.paw-pt>body{padding-top:var(--paw-t);box-sizing:border-box}
html.paw-pb>body{padding-bottom:var(--paw-b);box-sizing:border-box}
html.paw-pt>body>:is(.pan-fs,.pac-fs){margin-top:var(--paw-t)}
html.paw-pb>body>:is(.pan-fs,.pac-fs){margin-bottom:var(--paw-b)}
</style>
<script id="paw-script">
(function(){
  if(window.PAWin) return;
  const KEY='paneLayout2', OLD='paneLayout';
  const DRAG_PX=6, EDGE=32, CORNER=48, MIN_W=280, MIN_H=200, DEF_W=420, DEF_H=480, STEP=16;
  const SIDE=[0.24,0.60], TB=[0.25,0.75], DEF_SIZE={right:0.34,left:0.34,top:0.5,bottom:0.5};
  const WHERE=['right','left','top','bottom','tr','br'];
  const L={min:'最小化 · Minimize',max:'最大化 · Maximize',restore:'还原 · Restore',close:'关闭 · Close',
    show:'恢复 · Restore ',save:'布局未保存 · Layout not saved',read:'布局未读取 · Layout not loaded',
    tip:'拖动标题栏可移动或停靠 · Drag the title bar to move or dock',grip:'拖动调整大小 · Drag to resize',edge:'拖动边缘调整大小 · Drag the edge to resize'};

  // ── pure geometry (PAWin.geo; unit-tested) ──
  const num=(v,d)=>{ v=Number(v); return isFinite(v)?v:d; };
  function clampSize(where,r){ const b=(where==='top'||where==='bottom')?TB:SIDE; return Math.min(b[1],Math.max(b[0],num(r,DEF_SIZE[where]||DEF_SIZE.right))); }
  function clampRect(r,vw,vh){
    const w=Math.min(Math.max(num(r&&r.w,DEF_W),Math.min(MIN_W,vw)),vw), h=Math.min(Math.max(num(r&&r.h,DEF_H),Math.min(MIN_H,vh)),vh);
    const x=Math.min(Math.max(num(r&&r.x,vw-w-24),0),vw-w), y=Math.min(Math.max(num(r&&r.y,56),0),vh-h);
    return {x:Math.round(x),y:Math.round(y),w:Math.round(w),h:Math.round(h)};
  }
  function snapAt(x,y,vw,vh){
    if(x>=vw-CORNER&&y<=CORNER) return 'tr';
    if(x>=vw-CORNER&&y>=vh-CORNER) return 'br';
    if(x>=vw-EDGE) return 'right'; if(x<=EDGE) return 'left';
    if(y<=EDGE) return 'top'; if(y>=vh-EDGE) return 'bottom';
    return null;
  }
  // Every visible window's pixel box, and how far the page is pushed from each edge. Sides take the full
  // height; top/bottom span between them. Windows docked on one edge share it. Corners and floats push nothing.
  function layout(list,vw,vh){
    const vis=list.filter(s=>s.open&&!s.min), rects={}, push={right:0,left:0,top:0,bottom:0};
    const on=w=>vis.filter(s=>!s.max&&s.mode==='dock'&&s.where===w);
    ['right','left'].forEach(side=>{ const g=on(side); if(!g.length) return;
      const px=Math.round(Math.max(...g.map(s=>clampSize(side,s.size[side])))*vw); push[side]=px;
      g.forEach((s,i)=>{ const h=vh/g.length; rects[s.key]={x:side==='right'?vw-px:0,y:Math.round(i*h),w:px,h:Math.round(h)}; }); });
    // Left + right together never take more than SIDE[1] of the width: the page keeps a reading column.
    const both=push.left+push.right, cap=Math.round(SIDE[1]*vw);
    if(push.left&&push.right&&both>cap){ const k=cap/both, l=Math.round(push.left*k), r=cap-l;
      Object.keys(rects).forEach(key=>{ const q=rects[key]; if(q.x===0){ q.w=l; } else { q.x=vw-r; q.w=r; } }); push.left=l; push.right=r; }
    const x0=push.left, span=vw-push.left-push.right;
    ['top','bottom'].forEach(tb=>{ const g=on(tb); if(!g.length) return;
      const px=Math.round(Math.max(...g.map(s=>clampSize(tb,s.size[tb])))*vh); push[tb]=px;
      g.forEach((s,i)=>{ const w=span/g.length; rects[s.key]={x:Math.round(x0+i*w),y:tb==='top'?0:vh-px,w:Math.round(w),h:px}; }); });
    // Top + bottom together never take more than TB[1] of the height, like left + right: never overlapping (nightly review 2026-11-26).
    const tbSum=push.top+push.bottom, tbCap=Math.round(TB[1]*vh);
    if(push.top&&push.bottom&&tbSum>tbCap){ const t=Math.round(push.top*tbCap/tbSum), b=tbCap-t;
      on('top').forEach(s=>{ rects[s.key].h=t; }); on('bottom').forEach(s=>{ rects[s.key].y=vh-b; rects[s.key].h=b; }); push.top=t; push.bottom=b; }
    vis.forEach(s=>{
      if(s.max) rects[s.key]={x:0,y:0,w:vw,h:vh};
      else if(s.mode==='dock'&&(s.where==='tr'||s.where==='br')){ const w=Math.round(clampSize('right',s.size.right)*vw), h=Math.round(vh/2);
        rects[s.key]={x:vw-w,y:s.where==='tr'?0:vh-h,w,h}; }
      else if(s.mode==='float') rects[s.key]=clampRect(s.rect?{x:s.rect.x*vw,y:s.rect.y*vh,w:s.rect.w*vw,h:s.rect.h*vh}:null,vw,vh);
    });
    return {rects,push};
  }
  const deviceClass=(vw,vh,coarse)=>Math.min(vw,vh)<600?'phone':(coarse?'tablet':'desktop');
  // The old account-wide paneLayout ({key:{mode:'docked'|'floating'|'max', rect px}}) → this device class, once.
  function migrate(old,cls,vw,vh){
    const out={}; if(!old||typeof old!=='object') return out;
    Object.keys(old).forEach(k=>{ const o=old[k]||{}, e={mode:o.mode==='floating'?'float':'dock'};
      if(o.mode==='max') e.max=true;
      if(o.rect&&typeof o.rect==='object'){ const r=clampRect(o.rect,vw,vh); e.rect={x:r.x/vw,y:r.y/vh,w:r.w/vw,h:r.h/vh}; }
      out[k]=e; });
    return {[cls]:out};
  }

  // ── the window manager ──
  const root=document.documentElement, wins=[];
  const vp=()=>({w:window.innerWidth,h:window.innerHeight});
  const cls=()=>{ let c=false; try{ c=window.matchMedia('(any-pointer:coarse)').matches; }catch(_){ /* no matchMedia: a desktop */ } return deviceClass(vp().w,vp().h,c); };
  let stored=null, saveT=0, pills=null, snapEl=null, tgts=null;
  function mk(tag,c,parent){ const e=document.createElement(tag); e.className=c; if(parent) parent.appendChild(e); return e; }
  function btn(c,text,label,fn){ const b=mk('button','paw-btn '+c,null); b.type='button'; b.textContent=text; b.title=label; b.setAttribute('aria-label',label);
    b.onclick=e=>{ e.stopPropagation(); fn(); }; return b; }
  function chrome(){
    if(pills) return; pills=mk('div','paw-pills paw-x',document.body); snapEl=mk('div','paw-snap paw-x',document.body);
    tgts=WHERE.map(where=>{ const t=mk('div','paw-tgt paw-x',document.body); t.dataset.w=where; return t; });
  }
  function placeTargets(hit){ const v=vp(), at={right:[v.w-24,v.h/2],left:[24,v.h/2],top:[v.w/2,24],bottom:[v.w/2,v.h-24],tr:[v.w-30,30],br:[v.w-30,v.h-30]};
    tgts.forEach(t=>{ const p=at[t.dataset.w]; t.style.left=p[0]+'px'; t.style.top=p[1]+'px'; t.classList.toggle('hit',t.dataset.w===hit); }); }
  function render(){
    const v=vp(), {rects,push}=layout(wins.map(w=>w.s),v.w,v.h);
    ['right','left','top','bottom'].forEach(e=>{ const c='paw-p'+e[0]; root.classList.toggle(c,push[e]>0);
      if(push[e]) root.style.setProperty('--paw-'+e[0],push[e]+'px'); else root.style.removeProperty('--paw-'+e[0]); });
    wins.forEach(w=>{ const r=rects[w.s.key], el=w.el; el.classList.toggle('on',!!r);
      el.className=el.className.replace(/\bpaw-d-\w+/g,'').trim(); el.classList.toggle('paw-float',w.s.mode==='float'&&!w.s.max);
      el.classList.toggle('paw-max',!!w.s.max); if(w.s.mode==='dock'&&!w.s.max) el.classList.add('paw-d-'+w.s.where);
      w.maxB.textContent=w.s.max?'❐':'□'; w.maxB.title=w.s.max?L.restore:L.max; w.maxB.setAttribute('aria-label',w.maxB.title);
      if(!r) return; const k=r.w+'x'+r.h; w.cur=r; Object.assign(el.style,{left:r.x+'px',top:r.y+'px',width:r.w+'px',height:r.h+'px'});
      if(k!==w.lastSize){ w.lastSize=k; if(w.o.onResize) w.o.onResize(); } });
    if(pills){ pills.textContent=''; wins.filter(w=>w.s.open&&w.s.min).forEach(w=>{ const p=mk('button','paw-pill',pills); p.type='button';
      p.textContent='▴ '+w.title(); p.title=L.show+w.title(); p.setAttribute('aria-label',p.title); p.onclick=()=>w.api.restore(); }); }
  }
  function showErr(text){ wins.forEach(w=>{ w.err.textContent=text||''; }); }
  function entry(s){ const e={mode:s.mode,where:s.where,size:Object.assign({},s.size)}; if(s.rect) e.rect=Object.assign({},s.rect); if(s.max) e.max=true; return e; }
  // The session's own copy, updated at once: a window rebuilt after a gate crossing (rotation) re-applies
  // THIS layout, not the page-load one, and a window destroyed inside the save debounce is still written.
  // The class is taken when the change is made, so a save still pending after a rotation lands in the class it came from.
  const dirty=new Set();
  function remember(){ if(active) return; const c=cls(); stored=Object.assign({},stored); stored[c]=Object.assign({},stored[c]);
    wins.forEach(w=>{ stored[c][w.s.key]=entry(w.s); }); dirty.add(c); }
  function save(){
    remember(); clearTimeout(saveT); saveT=setTimeout(()=>{ const P=window.PAAppPrefs;
      if(!P) return;   // no prefs on this page: the layout is simply not kept
      if(active){ save(); return; }   // mid-gesture: a transient (maybe cancelled) size is never written
      const cs=[...dirty]; dirty.clear();
      // Re-read first: another device may have saved ITS class since this page loaded; only this class is replaced.
      P.read().then(rd=>{ if(!(rd&&rd.ok)){ cs.forEach(c=>dirty.add(c)); showErr(L.save+' — '+((rd&&rd.error)||'?')); return; }
        const all=Object.assign({},rd.prefs[KEY]); cs.forEach(c=>{ all[c]=Object.assign({},all[c],stored[c]); });
        return P.patch({[KEY]:all}).then(r=>showErr(r&&r.ok?'':L.save+((r&&r.error)?' — '+r.error:''))); }); },300);
  }
  function apply(w){ const e=stored&&stored[cls()]&&stored[cls()][w.s.key]; if(!e||w.touched) return;
    if(e.mode==='float'||e.mode==='dock') w.s.mode=e.mode; if(WHERE.includes(e.where)) w.s.where=e.where;
    if(e.size&&typeof e.size==='object') Object.keys(DEF_SIZE).forEach(k=>{ if(e.size[k]!=null) w.s.size[k]=clampSize(k,e.size[k]); });
    if(e.rect&&typeof e.rect==='object') w.s.rect=e.rect; w.s.max=!!e.max; }
  function load(){
    if(load.p) return load.p; const P=window.PAAppPrefs; if(!P){ load.p=Promise.resolve(); return load.p; }
    load.p=P.read().then(r=>{ if(!(r&&r.ok)){ showErr(L.read+' — '+((r&&r.error)||'?')); return; }
      const mine=stored; stored=r.prefs[KEY]||null;
      if(mine){ stored=Object.assign({},stored); Object.keys(mine).forEach(c=>{ stored[c]=Object.assign({},stored[c],mine[c]); }); }   // a change made before the read answered wins
      if(!stored&&r.prefs[OLD]){ const v=vp(); stored=migrate(r.prefs[OLD],cls(),v.w,v.h); P.patch({[KEY]:stored,[OLD]:null}).then(w=>{ if(!(w&&w.ok)) showErr(L.save+' — '+((w&&w.error)||'?')); }); }
      wins.forEach(apply); render(); });
    return load.p;
  }
  function raise(w){ wins.forEach(x=>x.el.classList.toggle('paw-front',x===w)); }
  function setRect(w,px){ const v=vp(), r=clampRect(px,v.w,v.h); w.s.rect={x:r.x/v.w,y:r.y/v.h,w:r.w/v.w,h:r.h/v.h}; }
  // Off the dock (or out of max) under the pointer: the float keeps its last size; the grab point stays at the same fraction of the bar.
  function tearOff(w,sx,sy){
    const c=w.cur||{x:0,y:0,w:DEF_W,h:DEF_H};
    if(w.s.mode==='float'&&!w.s.max) return {x:sx-c.x,y:sy-c.y,w:c.w,h:c.h};
    const v=vp(), f=w.s.rect?{w:w.s.rect.w*v.w,h:w.s.rect.h*v.h}:{w:DEF_W,h:DEF_H}, r=clampRect(f,v.w,v.h);

  function onBarDown(w,e){

        if(d.includes('w')){ r.w=Math.max(MIN_W,Math.min(r0.w-dx,r0.x+r0.w)); r.x=r0.x+r0.w-r.w; }
        if(d.includes('n')){ r.h=Math.max(MIN_H,Math.min(r0.h-dy,r0.y+r0.h)); r.y=r0.y+r0.h-r.h; }

  function build(w){
    const el=w.el=mk('div','paw-win paw-x',document.body); el.setAttribute('role','dialog'); el.setAttribute('aria-label',w.o.title||w.s.key);
    const bar=w.bar=mk('div','paw-bar',el); bar.tabIndex=0; bar.title=L.tip;
    w.titleEl=mk('span','paw-t',bar); w.titleEl.textContent=w.o.title||w.s.key; w.err=mk('span','paw-err',bar);
    bar.appendChild(btn('paw-min','—',L.min,()=>w.api.minimize()));
    bar.appendChild(w.maxB=btn('paw-maxb','□',L.max,()=>{ if(w.s.max) w.api.restore(); else w.api.maximize(); }));
    bar.appendChild(btn('paw-close','✕',L.close,()=>w.api.userClose()));
    w.body=mk('div','paw-body',el);
    ['n','s','e','w','ne','nw','se','sw'].forEach(d=>{ const h=mk('div','paw-h',el); h.dataset.d=d;

  function create(o){

})();
