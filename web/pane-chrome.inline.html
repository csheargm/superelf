<!-- PAPaneChrome — the pane header controls Float / Close for every PASplit slot（面板标题栏：浮动 / 关闭）.
     Inlined by web.mjs at the PA_PANE_CHROME_UI marker, which split-ui carries after its own script,
     so every page with PASplit has it. ADR docs/adr/0031-pane-chrome.md.

     WHY A SEPARATE FILE. split-ui is over the R4 budget; the chrome is a new responsibility, so it
     lives here and PASplit calls it through a small hook (attach / onToggle / onMax / restore /
     destroy). Maximise / Restore stays PASplit's own ⤢ (toggleMax): ONE maximise, not two (R3).

       PAPaneChrome.attach(ctx) → a handle; ctx = {key, slot, head, title(), home(), isOpen(),
                                  close(), max(), isMaxed(), relayout()} (closures over the rail)
       handle.float(rect?) / handle.redock() / handle.isFloating() / handle.rect()
       handle.onToggle(open)   → PASplit tells it a slot opened or closed (a remembered mode re-applies)
       handle.onMax(on)        → PASplit tells it the slot was maximised or restored
       PAPaneChrome.restore(handles) → reads the account layout once (PAAppPrefs) and applies it
       PAPaneChrome.clamp(rect, vw, vh) → the rect kept inside the viewport (pure; tested)

     LAYOUT IS AN ACCOUNT APP PREF: appPrefs.paneLayout = {<key>: {mode:'docked'|'floating'|'max',
     rect:{x,y,w,h}}}, written ONLY through PAAppPrefs (the page's one prefs writer). A mode is applied
     when its pane OPENS, so a pane that boots collapsed comes back the way it was left.
     NARROW SCREENS: PASplit's gate (PASplit.onGate, never a second media query, R3) sets
     html.pch-narrow, which hides Float and ⤢; a narrow screen has no rail anyway. -->
<style id="pch-style">
.pch-btn{background:none;border:0;font:inherit;font-size:13px;line-height:1;cursor:pointer;
  color:var(--muted,#6b7370);padding:3px 6px;border-radius:6px;flex-shrink:0}
.pch-btn:hover{background:var(--line,#e2e2de)}
.pch-btn:focus-visible{outline:2px solid var(--accent,#0f6355);outline-offset:1px}
html.pch-narrow .pch-float-btn,html.pch-narrow .pas-zoom{display:none}
/* Browser test 2026-11-13: split-ui hides the header of a lone right-zone pane (.pas-single), and that
   header is where Float / ⤢ / ✕ live, so the common one-pane case had no controls at all. With the
   chrome loaded every pane keeps its header. Finger-sized targets: the controls are used on iPad. */
html .pas-rail.pas-single .pas-head{display:flex}
.pch-btn,.pas-rail .pas-zoom,.pas-rail .pas-dock{font-size:16px;min-width:32px;min-height:32px;display:inline-flex;align-items:center;justify-content:center}
/* z-index LITERAL (see split-ui): above the rail (45), below .pac-fs/.pan-fs (50). */
.pch-win{position:fixed;z-index:46;display:flex;flex-direction:column;background:var(--card,#fff);
  border:1px solid var(--line,#e2e2de);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.18);overflow:hidden}
/* The window pressed last sits one step up (47, still below the 50 full-screen views): with two
   floating panes, the one you touch comes to the front. */
.pch-win.pch-front{z-index:47}
.pch-win>.pas-slot{flex:1 1 auto;min-height:0}
.pch-win .pas-head{cursor:move;touch-action:none}
.pch-win .pas-dock{display:none}
.pch-grip{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;touch-action:none;
  background:linear-gradient(135deg,transparent 55%,var(--line,#e2e2de) 55%)}
.pch-err{font-size:11px;font-weight:400;color:#b3261e;flex-shrink:0}
html.pch-moving{-webkit-user-select:none;user-select:none}
html.pch-moving .pas-body{pointer-events:none}
</style>
<script id="pch-script">
(function(){
  if(window.PAPaneChrome) return;
  const PREF='paneLayout';
  const MODES={docked:1,floating:1,max:1};
  // Float window limits, px. The first float takes DEF_W x DEF_H at the right of the viewport.
  const MIN_W=240, MIN_H=160, DEF_W=420, DEF_H=480, DEF_GAP=24, DEF_TOP=56;   // DEF_TOP: below an app's top bar (browser test: the first float covered the Note / Ask AI buttons)
  const L_FLOAT='Float · 浮动', L_DOCK='Dock · 停靠', L_CLOSE='Close · 关闭';
  const L_SAVE_ERR='Layout not saved · 布局未保存', L_READ_ERR='Layout not loaded · 布局未读取';
  const root=document.documentElement;
  let front=null;   // the floating window on top (class pch-front); one per page, shared by every pane
  function raise(w){ if(front===w) return; if(front) front.classList.remove('pch-front'); w.classList.add('pch-front'); front=w; }

  function clamp(r,vw,vh){
    const n=(v,d)=>{ if(v==null) return d; v=Number(v); return isFinite(v)?v:d; };   // null is 'unset', not 0 (browser test: first float opened 240x160 at 0,0)
    const w=Math.min(Math.max(n(r&&r.w,DEF_W),MIN_W),vw), h=Math.min(Math.max(n(r&&r.h,DEF_H),MIN_H),vh);
    const x=Math.min(Math.max(n(r&&r.x,vw-w-DEF_GAP),0),vw-w), y=Math.min(Math.max(n(r&&r.y,DEF_TOP),0),vh-h);
    return {x:Math.round(x),y:Math.round(y),w:Math.round(w),h:Math.round(h)};
  }
  const vp=()=>({w:window.innerWidth,h:window.innerHeight});
  const prefs=()=>window.PAAppPrefs||null;

  // Narrow screens hide Float and ⤢. PASplit's gate is the only answer (R3); before PASplit
  // exists there is nothing to hide.
  function watchNarrow(){
    if(watchNarrow.on||!window.PASplit) return; watchNarrow.on=true;
    const set=on=>root.classList.toggle('pch-narrow',!on);
    set(window.PASplit.gateOpen()); window.PASplit.onGate(set);
  }

  function mkBtn(cls,text,label,fn){
    const b=document.createElement('button'); b.type='button'; b.className='pch-btn '+cls;
    b.textContent=text; b.setAttribute('aria-label',label); b.title=label;
    // stopPropagation: the slot header itself toggles collapse.
    b.onclick=e=>{ e.stopPropagation(); fn(); }; return b;
  }

  // One pointer drag, used for both the move (by the header) and the corner resize.
  function drag(e,onMove,onEnd){
    const t=e.currentTarget, sx=e.clientX, sy=e.clientY;
    try{ t.setPointerCapture(e.pointerId); }catch(_){ /* no capture (test DOM, a released pointer):
                                                          the move handlers below still run */ }
    root.classList.add('pch-moving');
    const move=ev=>onMove(ev.clientX-sx,ev.clientY-sy);
    const off=()=>{ root.classList.remove('pch-moving'); t.removeEventListener('pointermove',move);
      t.removeEventListener('pointerup',up); t.removeEventListener('pointercancel',up); };
    const up=()=>{ off(); onEnd(); };
    t.addEventListener('pointermove',move); t.addEventListener('pointerup',up); t.addEventListener('pointercancel',up);
    if(e.preventDefault) e.preventDefault();
    return off;   // a cancel (no save, no relayout): destroy() mid-gesture must not leave html.pch-moving (it blocks selection)
  }

  function attach(ctx){
    let mode='docked', rect=null, win=null, err=null, moved=false, quiet=false, endDrag=null;
    // 'floating' counts only while the window is up; a closed pane keeps mode as its remembered layout.
    const up=()=>mode==='floating'&&!!(win&&win.parentNode);
    const fl=mkBtn('pch-float-btn','⧉',L_FLOAT,()=>{ if(mode==='floating') redock(); else float(); });
    const cl=mkBtn('pch-close-btn','✕',L_CLOSE,close);
    ctx.head.appendChild(fl); ctx.head.appendChild(cl);

    function showErr(text){
      if(!err){ err=document.createElement('span'); err.className='pch-err'; ctx.head.insertBefore(err,fl); }
      err.textContent=text||'';
    }
    function save(){
      const P=prefs(); if(!P) return;   // no PAAppPrefs on this page: the layout is simply not kept
      const all=Object.assign({},P.get()[PREF]);
      all[ctx.key]=rect?{mode,rect}:{mode};
      P.patch({[PREF]:all}).then(r=>showErr(r&&r.ok?'':L_SAVE_ERR+((r&&r.error)?' — '+r.error:'')));
    }
    function place(){ if(!win) return; rect=clamp(rect,vp().w,vp().h);
      win.style.left=rect.x+'px'; win.style.top=rect.y+'px'; win.style.width=rect.w+'px'; win.style.height=rect.h+'px'; }
    const onResize=()=>place();
    function build(){
      win=document.createElement('div'); win.className='pch-win';
      win.setAttribute('role','dialog'); win.setAttribute('aria-label',ctx.title());
      const grip=document.createElement('div'); grip.className='pch-grip'; win.appendChild(grip);
      grip.addEventListener('pointerdown',e=>{ const r0=Object.assign({},rect);
        endDrag=drag(e,(dx,dy)=>{ const v=vp();   // cap the size at the far edges: a resize never moves the window
          rect={x:r0.x,y:r0.y,w:Math.max(MIN_W,Math.min(r0.w+dx,v.w-r0.x)),h:Math.max(MIN_H,Math.min(r0.h+dy,v.h-r0.y))}; place(); },()=>{ ctx.relayout(); save(); }); });
      ctx.head.addEventListener('pointerdown',onHeadDown);
      // Capture: a press anywhere in the window (note, chat, header) raises it, even where an inner
      // handler stops the event.
      win.addEventListener('pointerdown',()=>raise(win),true);
      window.addEventListener('resize',onResize);
    }
    // Drag by the header while floating; a real move swallows the click that follows it, so a drag
    // never also collapses the pane.
    function onHeadDown(e){
      if(!up()||(e.target&&e.target.closest&&e.target.closest('.pch-btn,.pas-zoom'))) return;
      const r0=Object.assign({},rect); moved=false;
      endDrag=drag(e,(dx,dy)=>{ if(dx||dy) moved=true; rect={x:r0.x+dx,y:r0.y+dy,w:r0.w,h:r0.h}; place(); },()=>{ if(moved) save(); });
    }
    // A floating pane's title bar never collapses it (that would drop it back into the rail with
    // no layout): swallow every header click while floating, except clicks on the header buttons.
    ctx.head.addEventListener('click',e=>{
      const onBtn=e.target&&e.target.closest&&e.target.closest('.pch-btn,.pas-zoom');
      if(moved||(up()&&!onBtn)){ moved=false; if(e.stopImmediatePropagation) e.stopImmediatePropagation(); }
    },true);

    function float(r){
      if(ctx.isMaxed()) unmaxQuiet();                // restore first: one slot cannot be both
      mode='floating'; if(r) rect=r;
      if(!win) build();
      win.insertBefore(ctx.slot,win.firstChild); win.style.display='';
      if(!win.parentNode) document.body.appendChild(win);
      raise(win);   // a pane just floated is the one in use
      place(); fl.textContent='⇲'; fl.setAttribute('aria-label',L_DOCK); fl.title=L_DOCK;
      ctx.relayout(); save();
    }
    function unfloat(){
      if(win&&win.parentNode) win.parentNode.removeChild(win);
      ctx.home().appendChild(ctx.slot);
      fl.textContent='⧉'; fl.setAttribute('aria-label',L_FLOAT); fl.title=L_FLOAT;
    }
    function redock(){ mode='docked'; unfloat(); ctx.relayout(); save(); }
    // Close keeps the remembered mode: the pane reopens floating, or maximised, the way it was left.
    function close(){
      const keep=mode;
      if(ctx.isMaxed()) unmaxQuiet();
      if(mode==='floating') unfloat();
      mode=keep; ctx.close(); ctx.relayout(); save();
    }
    function onToggle(open){
      if(!open){ if(win&&win.parentNode){ unfloat(); ctx.relayout(); } return; }   // mode kept for the next open
      if(!MODES[mode]) return;
      if(mode==='floating'&&!(win&&win.parentNode)) float();
      else if(mode==='max'&&!ctx.isMaxed()) ctx.max();
    }
    // Restore from max inside float()/close(): those save once themselves, so onMax stays quiet.
    function unmaxQuiet(){ quiet=true; try{ ctx.max(); } finally{ quiet=false; } }
    function onMax(on){ if(on&&mode==='floating') unfloat(); if(on) mode='max'; else if(mode==='max') mode='docked'; if(!quiet) save(); }
    function setRemembered(L,err2){
      if(err2) showErr(L_READ_ERR+' — '+err2);
      if(!L||!MODES[L.mode]) return;
      mode=L.mode; rect=L.rect&&typeof L.rect==='object'?clamp(L.rect,vp().w,vp().h):null;
      if(ctx.isOpen()) onToggle(true);
    }
    function destroy(){
      if(endDrag) endDrag();   // a gesture still in progress ends here; off() is idempotent
      endDrag=null;
      window.removeEventListener('resize',onResize);
      if(win&&win.parentNode) win.parentNode.removeChild(win);
    }
    watchNarrow();
    return { key:ctx.key, float, redock, close, onToggle, onMax, setRemembered, destroy,
      isFloating:up, mode:()=>mode, rect:()=>rect&&Object.assign({},rect), win:()=>win };
  }

  // Read the account layout once per rail and hand each pane its own entry. A refused read is
  // shown on the pane header (R5); the panes still work, docked.
  function restore(handles){
    const P=prefs(); if(!P) return Promise.resolve({ok:false,error:'no prefs'});
    return P.read().then(r=>{
      const all=(r&&r.ok&&r.prefs&&r.prefs[PREF])||{};
      handles.forEach(h=>h&&h.setRemembered(all[h.key],r&&r.ok?'':((r&&r.error)||'?')));
      return r;
    });
  }

  window.PAPaneChrome={attach,restore,clamp,PREF,MIN_W,MIN_H};
})();
</script>
