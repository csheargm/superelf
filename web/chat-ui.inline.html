    setPill();
    /* ══ PA_PILL_RESERVE_END ══ */
    // A taller composer (pills, chips, a 3-line draft) must not cover the last answer: a log that was
    // at the bottom stays at the bottom (owner 2026-11-13). Registered after setPill's observer, so the
    // reservation is already updated when this runs.
    if(window.ResizeObserver) new ResizeObserver(()=>{ if(nearBottom()) pin(); }).observe(el.row);
    // Model chooser: reflect the shell's model list; a pick applies to this chat's next sends.
    const renderModelBtn=()=>{ if(!PAC_MODELS.length){ el.model.style.display='none'; return; }
      el.model.style.display=''; const cur=PAC_MODELS.find(x=>x.id===PAC_CURMODEL)||PAC_MODELS[0]; el.model.textContent=cur.label+' ▾'; };
    PAC_MODEL_CBS.add(renderModelBtn); renderModelBtn();
    if(PAC_MODELS.some(x=>x.id==='research')) window.PANewDot.mark(el.model,'research-lane');   // dot the chooser when the new Research lane exists
    PAC_MODEL_CBS.add(()=>{ if(PAC_MODELS.some(x=>x.id==='research')) window.PANewDot.mark(el.model,'research-lane'); });   // models arrive via prefs after mount
    el.model.onclick=()=>{ let menu=host.querySelector('.pac-mmenu'); if(menu){ menu.remove(); return; }
      menu=document.createElement('div'); menu.className='pac-mmenu';
      const groups={}; PAC_MODELS.forEach(x=>{ (groups[x.group||'']=groups[x.group||'']||[]).push(x); });
      let html=''; for(const g of Object.keys(groups)){ if(g) html+='<div class="pac-mg">'+g+'</div>';
        for(const x of groups[g]) html+='<button class="pac-mi'+(x.id===(PAC_CURMODEL||(PAC_MODELS[0]&&PAC_MODELS[0].id))?' on':'')+'" data-m="'+x.id+'">'+x.label+'</button>'; }
      menu.innerHTML=html;
      menu.onclick=(ev)=>{ const b=ev.target.closest('[data-m]'); if(!b) return; PAC_CURMODEL=b.dataset.m; PAC_PICKED=true; renderModelBtn(); menu.remove();
        // Ask the shell to remember it for THIS app. The app cannot store it itself — sandboxed,
        // opaque origin, every storage API throws. Fire-and-forget on purpose: the choice is
        // already applied in this session, so a failed write costs the memory, not the turn.
        try{ parent.postMessage({pa:'req',id:'sm'+Date.now(),kind:'set-model',model:PAC_CURMODEL},'*'); }catch(e){}
      };
      el.row.appendChild(menu);
      setTimeout(()=>{ const off=(ev)=>{ if(!menu.contains(ev.target)&&ev.target!==el.model){ menu.remove(); document.removeEventListener('click',off); } }; document.addEventListener('click',off); },0);
    };
    el.vfy.onclick=()=>{ verifyOn=!verifyOn; renderVerify(); saveVerify(); };   // per-app: applies to every thread in this app until toggled again
    el.toList.onclick=showList;
    el.newC.onclick=newChat;   // top-bar ＋ = new chat; the drawer's own ＋new is wired inside buildDrawer
    if(opts.onClose) el.closes.forEach(b=>{ b.style.display=''; b.onclick=()=>{ drawer.close(); _closeN++;   // an open still loading resolves false: the user dismissed it
      // Closing the chat surface ends the chat's claim to "where the user is" — otherwise a
      // peeked-at chat stays highlighted in the drawer while the user is back in a note. The
      // host's onClose may re-assert the real context (e.g. setActiveNote of a visible note).
      if(_sel===curConvo){ _sel=null; drawer.setActive(null); }
      opts.onClose(); }; });
    // (search / tabs / row-tap / ⋯ menu are all owned by the shared buildDrawer instance now.)

    // Host tells PAChat which note is the current one so the ☰ drawer highlights exactly that
    // ONE row (a note overrides the open chat). Cleared back to the open chat by openConvo/newChat.
    function setActiveNote(id){ _sel=id||null; drawer.setActive(_sel); }
    return { open, send, openConvo, newChat, showList, closeList:()=>drawer.close(),   // closeList: hosts close the ☰ drawer when THEIR surface closes (e.g. the draw pad's ✕), matching the chat ✕
      // Re-read the ☰ list, but ONLY while it is on screen. A host calls this when it writes
      // something the list should show (a note that just became real), and a pad autosaves on a
      // debounce — refreshing a closed drawer would be an /api/notes round trip per keystroke
      // burst, for a list nobody is looking at. It re-reads on open anyway.
      refreshList:()=>{ if(drawer.isOpen&&drawer.isOpen()) return drawer.refresh(); },
      setActiveNote, getConvo:()=>curConvo,   // getConvo: host can restore this exact thread (e.g. back-to-chat after a verse jump)
      // Attach a file the app has ALREADY uploaded, by path. The ＋ button's flow uploads first
      // and then pushes the same shape; a note's photo is already on the server, so re-uploading
      // it to ask a question about it would cost a second copy of the bytes for nothing.
      attach:(a)=>{ if(!a||!a.path) return false;
        atts.push({name:a.name||'photo.jpg',path:a.path,thumb:a.thumb||null,label:a.label||''}); renderChips(); return true; },
      // The chips as they stand (copies), and removing one by its path: a host that replaces its own attachment.
      attachments:()=>atts.map((a)=>({...a})),
      detach:(p)=>{ const n=atts.length; atts=atts.filter((a)=>a.path!==p); if(atts.length!==n) renderChips(); return atts.length!==n; },
      // A host's status line (Done, Undone, a note): added like every message, so it is pinned above the
      // floating composer row and never left under its chips (owner report 2026-11-24).
      note:(t,id)=>{ const d=addMsg('status',String(t||'')); if(id) d.id=id; return d; },
      remeasure:setPill,   // a host that reveals this surface must say so — a hidden composer measures 0 (see PA_PILL_RESERVE)
             prefill:(t)=>{ el.inp.value=t; autosize(); el.inp.focus(); } };   // quick-prompt: fill, let user edit/send
  }

  window.PAChat={
    mount:(host,opts)=>Chat(host, opts||{}),
    // Deleting a conversation is a CHAT operation, and the ☰ list has always done it through
    // this same broker kind. Exposed so a host unbinding a note's chat does not hand-roll a
    // second postMessage that could drift from it (R3). The caller still has to release its own
    // pointer afterwards — the server owns the thread, the host owns the reference to it.
    deleteConvo:(convoId)=>req({kind:'convo-delete',convoId}),
    // The lane the NEXT turn will use, for a component that must say so before sending (the summary sheet's confirm line).
    // TODO(R4 seam): the broker client (reqChat, complete, this) becomes its own inlined part, see complete below.
    lane:()=>{ const cur=PAC_MODELS.find(x=>x.id===PAC_CURMODEL)||PAC_MODELS[0]; return cur?{id:cur.id,label:cur.label}:null; },
    lanes:()=>PAC_MODELS.map(x=>({id:x.id,label:x.label,group:x.group||'',provider:x.provider||'',vision:x.vision===true})),   // every served lane, with /api/models' vision flag: the summary sheet picks its lane from it (web/summary-images.inline.html)
    lightbox,   // the chat's own lightbox above, not a copy (R3): the 信纸 studio enlarges its too-small draft preview in it
    // One answer over the SAME 'chat' kind and broker as the composer (R3), for a component that
    // needs an ANSWER rather than a chat surface (PAStationeryStudio's AI design). Resolves
    // {ok, text, error, convoId}: the server's FINAL text when it sends one (an agent's deltas can
    // hold its working-out), else what streamed. A relay or lane failure is ok:false carrying the
    // shell's sentence — never text, so a warning can never be mistaken for an answer.
    // Always oneShot. o.signal (an AbortSignal) cancels: aborted BEFORE the call, nothing is posted
    // (posting only to cancel would still start a job); aborted DURING it, one chat-cancel names
    // this request — the shell closes its fetch, the server kills the job — and the caller is
    // answered at once, not when the relay winds down. That cancel's reply is not awaited: the
    // caller is answered either way, and a shell that cannot cancel leaves the job to finish, as
    // every job did before chat-cancel existed. Never rejects; always exactly these four fields.
    // TODO(R4): chat-ui is over budget. Split seam: the broker client (the waiter map, req, reqChat
    // and this complete) becomes its own inlined part, the way PA_PHOTO_UI is.
    complete:(message,o)=>{ const c=o||{}, sig=c.signal||null; let acc='', fin='', failure='', convoId=null, chatId=null, onAbort=null;
      const cancelled=()=>({ok:false,text:'',error:PAC_CANCELLED,convoId});
      if(sig&&sig.aborted) return Promise.resolve(cancelled());
      const answer=reqChat(String(message||''),c.convoId||null,(ev)=>{
        if(ev.type==='convo'&&ev.id) convoId=ev.id;
        if(ev.type==='delta') acc+=ev.text||'';
        if(ev.type==='done'){ if(ev.ok===false) failure=ev.text||ev.error||'失败 · failed'; else fin=ev.text||''; }
        if(ev.type==='error'||(ev.ok===false&&ev.type!=='done')) failure=ev.text||ev.error||'失败 · failed'; },
        c.attachments,c.label,c.system,undefined,true,(id)=>{ chatId=id; }).then(r=>{
        const f=failure||(r&&r.ok===false?(r.text||r.error||'失败 · failed'):''), text=f?'':(fin||acc);
        return {ok:!f&&!!text.trim(),text,error:f||(text.trim()?'':'无回答 · No response'),convoId}; });
      if(!sig) return answer;
      const stopped=new Promise(res=>{ onAbort=()=>{ req({kind:'chat-cancel',chatId}); res(cancelled()); }; sig.addEventListener('abort',onAbort,{once:true}); });
      return Promise.race([answer,stopped]).then(r=>{ sig.removeEventListener('abort',onAbort); return r; }); },
    /* ── The shared failure surface, for every OTHER component on this page ───────────────
       PANote and an app's own code are inlined into the SAME sandboxed page as this
       component, so exposing the mapping here is how they reach it without importing
       (opaque origin, no <script src>, no ES modules).
       `limits` is the AUTHORITATIVE cap the server actually enforces — a component that
       hardcodes its own number refuses photos the server would have accepted, which is a
       size message that is simply false. Kept in sync with the shell by
       {pa:'prefs',uploadMaxBytes} below, and with lib/webutil.mjs by
       test/fail-legibility.test.mjs.
       `failText(reply,{what,bytes})` is the ONE sentence for a failed broker call: the
       shell already rendered it into reply.text (relayFail in web/index.html), so this
       prefers that and only falls back to the local renderer for a bare 413 code. Passing
       a reply straight through here is what keeps a 401, a dropped socket and an oversized
       photo from all reading "Upload failed" (leftover (e) of the 2026-09-02 data loss). */
    limits:Object.freeze({...PAC_LIMITS}),   // a copy: an app must not be able to raise the cap it is checked against
    whatForFile:pacWhatForFile,
    failText:(reply,o)=>{ const c=o||{}, what=c.what||'File', lim=pacTooLargeLimit(reply);
      if(reply&&typeof reply.text==='string'&&reply.text) return reply.text;
      if(lim) return pacTooLargeText(what,c.bytes||0,lim);
      return (reply&&reply.error)||'请求失败 · Request failed — 未给出原因 · no reason given'; },
    // One call gives any app the SAME full-screen "Ask AI": a fixed, full-height
    // overlay whose composer owns the bottom safe-area, with ✕ to close. The app
    // just calls .open(key) when its Ask-AI entry point is invoked; .hide()/.show()
    // let it step away to a passage and back. Keeps full-screen behavior consistent
    // across every app instead of each one re-implementing (and re-breaking) it.
    fullscreen:(opts)=>{
      const o=opts||{};
      const ov=document.createElement('div'); ov.className='pac-fs';
      const host=document.createElement('div'); ov.appendChild(host);
      document.body.appendChild(ov);
      // This overlay starts display:none, so its composer measures 0 — and WebKit does not
      // reliably deliver a ResizeObserver callback when an ANCESTOR flips display:none→block.
      // Re-measure right after the overlay becomes visible (offsetHeight forces the layout that
      // makes the reading real), or the log keeps the un-measured fallback for the session.
      let chatApi=null;
      // THE KEYBOARD (phone audit): iOS keeps the layout viewport when the keyboard opens, so this inset:0
      // overlay's composer would sit under it. While shown, the overlay follows visualViewport's visible box.
      // Known limit: an emulator has no keyboard, so this is not proven on a real iPhone.
      // TODO(R4 seam): fullscreen()'s overlay host (this, show/hide) → its own part when this file is split.
      const vv=(typeof window!=='undefined'&&window.visualViewport)||null;
      const fitKb=()=>{ if(!vv) return; const kb=ov.classList.contains('on')&&innerHeight-vv.height-vv.offsetTop>1;
        ov.style.top=kb?vv.offsetTop+'px':''; ov.style.height=kb?vv.height+'px':''; ov.style.bottom=kb?'auto':''; };
      if(vv){ vv.addEventListener('resize',fitKb); vv.addEventListener('scroll',fitKb); }
      // FOCUS (GPT review): the page under the overlay is made inert while it is up, so Tab cannot reach the
      // hidden note; closing hands focus back to whatever opened it.
      let back=null, inerted=[];
      // The shell's overlaying bar would cover this chat's own top row (owner report 2026-11-25): it is told, and leaves.
      const tellShellOpen=()=>{ try{ if(window.parent!==window) window.parent.postMessage({pa:'shell',type:'chat-open'},'*'); }catch(e){ /* no shell (a page opened on its own): nothing sits over this chat */ } };
      const show=()=>{ if(!ov.classList.contains('on')){ back=document.activeElement;
          inerted=[...document.body.children].filter(n=>n!==ov&&!n.inert&&!/^(SCRIPT|STYLE)$/.test(n.tagName)&&!n.matches('.pac-drawerhost,.pac-lb,.pac-fs,#pa-notice')); inerted.forEach(n=>{ n.inert=true; }); }
        tellShellOpen(); ov.classList.add('on'); fitKb(); if(chatApi) chatApi.remeasure(); },
        hide=()=>{ const was=ov.classList.contains('on'); ov.classList.remove('on'); fitKb();
          if(was){ inerted.forEach(n=>{ n.inert=false; }); inerted=[]; if(back&&back.isConnected&&typeof back.focus==='function') back.focus(); back=null; } };
      // onShow: reveal this overlay + let the app dismiss any covering surface (e.g. a draw pad)
      const api=Chat(host, Object.assign({}, o, { onShow:()=>{ show(); o.onShow&&o.onShow(); },
        onClose:()=>{ hide(); o.onClose&&o.onClose(); } }));
      chatApi=api;
      return Object.assign({}, api, {
        el:ov, show, hide, isOpen:()=>ov.classList.contains('on'),
        open:(k)=>{ show(); return api.open(k); },   // resolves false when superseded or closed with ✕ while loading (in Chat core)
        openConvo:(id,meta)=>{ show(); api.openConvo(id,meta); },
        newChat:()=>{ show(); api.newChat(); },
        showList:()=>{ show(); api.showList(); },
        showListOnly:()=>api.showList(),   // open the drawer without revealing the chat overlay (e.g. draw pad is already visible)
      });
    },
    // A STANDALONE slide-in list drawer — a THIN wrapper over the shared buildDrawer (R3), so
    // the SAME renderer/⋯ menu/single-active/stay-open behavior serves both the chat ☰ list and
    // this. The opts contract is UNCHANGED, so the Journal notes app needs ZERO edits.
    // opts: { title, items():Promise<[{id,icon,title,preview,chip,updated}]>,
    //         onOpen(id), onRename(id,title), onDelete(id), onDeleteAi?(id), onPin?(id,flag), onNew?(), activeId?():id }
    // Returns { open, close, refresh, setActive, isOpen, el, confirm, prompt }.
    listDrawer:(opts)=>{
      const o=opts||{};
      return buildDrawer({
        title:o.title, newLabel:'＋', onNew:o.onNew, activeId:o.activeId, onRefresh:o.onRefresh, summary:o.summary,
        // Map this drawer's flat rows to buildDrawer items, binding each id's handlers. The
        // per-id onRename receives the new title; onDelete takes none (buildDrawer confirms first).
        items:async()=>{
          const raw=(o.items?await o.items():[])||[];
          return raw.map(it=>({ id:it.id, icon:it.icon, title:it.title, preview:it.preview, chip:it.chip, updated:it.updated, created:it.created, ai:it.ai, doc:it.doc, pin:!!it.pin, summary:it.summary===true,   // summary: the host's own flag for the Summaries group (plan H)
            onOpen:(_id,at)=>{ if(o.onOpen) o.onOpen(it.id,at); },   // `at`: a search hit's {page,boxes,terms}, forwarded (phase 3)
            onRename:o.onRename?(t)=>o.onRename(it.id,t):undefined,
            onPin:o.onPin?(f)=>o.onPin(it.id,f):undefined,          // the bookmark flag, per id like onRename (plan D)
            onDelete:o.onDelete?()=>o.onDelete(it.id):undefined,
            // Only where the row HAS a chat: ai and onDeleteAi must agree, or the ⋯ offers to
            // delete a conversation the badge says does not exist.
            onDeleteAi:(o.onDeleteAi&&it.ai)?()=>o.onDeleteAi(it.id):undefined }));
        }
      });
    },
    /* ── panel(): the SAME chat, hosted in a PASplit slot instead of a full-screen overlay ──────
       Placed AFTER listDrawer deliberately: test/chat-pill-reserve.test.mjs slices the source
       from `fullscreen:(opts)=>{` to the listDrawer comment and evaluates that window with
       `new Function`, so anything inserted between them is executed by that test as if it were
       part of fullscreen.

       Three differences from fullscreen(), each of them load-bearing:
       1. The host gets `position:absolute;inset:0`. `.pac` is `height:100%` and it is `.pac-fs`
          (`position:fixed;inset:0`) that resolves that today; a bare flex child would leave the
          log with an unresolved height.
       2. open/openConvo/newChat RETURN their promise. fullscreen() drops it, which is survivable
          for a surface the user just tapped open, but the rail AUTO-SENDS after opening and must
          be able to await it.
       3. `remeasure` is re-exposed. A rail is resizable; a fixed overlay is not. This is the one
          thing a panel host must call that a full-screen host never needs. */
    panel:(opts)=>{
      const o=opts||{};
      if(!o.host) throw new Error('PAChat.panel: no host — a panel with nowhere to mount would render nothing and report success');
      const host=document.createElement('div');
      host.className='pac-panel';
      host.style.cssText='position:absolute;inset:0;background:var(--card,#fff)';
      o.host.appendChild(host);
      const api=Chat(host, Object.assign({}, o, {
        // A panel is always visible while the rail is open, so there is no overlay to reveal or
        // hide. onShow/onClose stay the HOST's business: the app passes its own, and crucially the
        // full-screen versions (which tear down the draw pad) must NOT be reused here — in a split
        // view the note pad is a sibling, not a thing to dismiss.
        onShow:o.onShow, onClose:o.onClose,
      }));
      return Object.assign({}, api, {
        el:host, hosted:'panel',
        show:()=>{}, hide:()=>{}, isOpen:()=>true,
        open:(k)=>api.open(k), openConvo:(id,meta)=>api.openConvo(id,meta), newChat:()=>api.newChat(),
        showListOnly:()=>api.showList(),
        // `remeasure` needs no line here: Object.assign spreads it through from the engine, which
        // is also how fullscreen() gets it. An explicit re-listing was dead code (R1). What must
        // stay true is the CONTRACT — a panel exposes a working remeasure, because a resizable
        // host has to re-measure and a fixed overlay never does; the test asserts that, not this.
      });
    }
  };

  // Apply global font scale pushed by the shell ({pa:'prefs', fontScale}).
  window.addEventListener('message',e=>{
    const m=e.data;
    if(m&&m.pa==='prefs'){
      // The font scale is applied by the snippet web.mjs injects into EVERY app page, so that
      // apps without PAChat get it too. Setting it here as well double-scaled any app that
      // also receives zoom (R3: one setter, one place).
      // The shell's remembered lane for this app, if any. Set BEFORE the fallback below so it
      // wins over "first in the list", and still subject to that line's membership check — an id
      // the server no longer offers falls back rather than sending a lane it cannot route.
      if(typeof m.wantModel==='string'&&m.wantModel) PAC_WANTMODEL=m.wantModel;
      if(Array.isArray(m.models)){ PAC_MODELS=m.models;
        if(!PAC_PICKED&&typeof m.wantModel==='string'&&m.wantModel) PAC_CURMODEL=null;   // a default yields to the remembered lane (PAC_PICKED)
        // Honour the host's preferred lane, but only if the server actually offers it —
        // an unknown id falls back to the first model rather than sending a lane the server
        // would not recognise (R14: a wrong default must not become a silent no-lane turn).
        if(!PAC_CURMODEL&&PAC_MODELS[0]) PAC_CURMODEL=(PAC_WANTMODEL&&PAC_MODELS.some(x=>x.id===PAC_WANTMODEL))?PAC_WANTMODEL:PAC_MODELS[0].id;
        PAC_MODEL_CBS.forEach(cb=>{ try{ cb(); }catch(err){} }); }
      if(m.newFeatureKeys && !window.PANewDot._loaded) window.PANewDot._init(m.newFeatureKeys);
    }
  });

  // ── PANewDot: generic new-feature blue-dot helper for sandboxed apps ──
  // Usage: PANewDot.mark(el, 'feature-key')  — add CSS + clear on first tap via broker.
  // The shell pushes unseen keys via {pa:'prefs', newFeatureKeys:[...]} on app load.
  ;(()=>{
    const style=document.createElement('style');
    style.textContent='.pa-new{position:relative}.pa-new::after{content:"";position:absolute;top:1px;right:1px;width:8px;height:8px;background:#007AFF;border-radius:50%;pointer-events:none;box-shadow:0 0 0 2px var(--card,#fff);z-index:5}';
    document.head.appendChild(style);
    let _unseen=new Set();
    const _pending=[];   // [el,key] marks made before the shell's prefs push — replayed by _init (either order works)
    window.PANewDot={
      _loaded:false,
      _init(keys){ _unseen=new Set(keys); window.PANewDot._loaded=true; _pending.splice(0).forEach(p=>window.PANewDot.mark(p[0],p[1])); },
      mark(el,key){
        if(!el) return;
        if(!window.PANewDot._loaded){ _pending.push([el,key]); return; }
        if(!_unseen.has(key)||el.classList.contains('pa-new')) return;   // second guard = idempotent re-mark (re-rendered sections)
        el.classList.add('pa-new');
        el.addEventListener('pointerdown',()=>{
          el.classList.remove('pa-new'); _unseen.delete(key);
          parent.postMessage({pa:'req',id:'nd'+(Date.now()),kind:'seen-feature',key},'*');
        },{once:true,capture:true});
      }
    };
  })();
})();
</script>
