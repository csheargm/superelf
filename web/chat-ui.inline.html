<!-- PAChat — the ONE canonical mini-app chat UI. Single source of truth.
     Inlined into any app HTML at serve time wherever the PA_CHAT_UI marker appears
     (web.mjs). The sandbox CSP is `script-src 'unsafe-inline'` with no 'self',
     so a shared chat UI CANNOT be a <script src>; serve-time inlining of this
     one file is the only way to single-source it (see docs/adr). It talks to the
     shell through the same broker every app uses (kind: chat/convo/render-md/upload),
     so the backend pipeline, streaming, history and upload are all reused, not copied.
     Usage in an app:
       <div id="mychat"></div>            (any container, gets height:100%)
       PA_CHAT_UI                         (the HTML-comment marker, once in <body>)
       <script> const c = PAChat.mount(document.getElementById('mychat'), {
                  placeholder, greeting, contextPrefix, getConvoId, setConvoId, onConvo });
                c.open('some-key');        // load/switch a conversation thread
       </script>
-->
<!-- PAPhoto comes WITH PAChat. The composer's ＋ is a photo path, and four surfaces used to
     carry four different versions of "pick, read, check the size, upload" — only one of which
     knew the real cap. web.mjs walks PA_COMPONENTS in order and re-tests the ALREADY INLINED
     html for each remaining marker, so registering PA_PHOTO_UI after chat-ui is what makes the
     line below resolve, and every app that mounts PAChat gets the shared path with no per-app
     edit. Double-inlining is a no-op (photo-ui.inline.html guards on window.PAPhoto). -->
<!--PA_PHOTO_UI-->
<style id="pac-style">
/* --pac-pill = the room the log keeps clear at its bottom for the floating composer. The
   measured value (setPill → an INLINE --pac-pill on this same element) wins; this rule is what
   holds until a real measurement lands, and a hidden surface measures 0 forever if nothing
   re-measures. So it is DERIVED from the composer's own box, not guessed:
     8 pad-top + 0 chips(empty) + 6 gap + 22.4 pills + 6 gap + 40 composer + 10 pad-bottom = 92.4
     + 12 breathing room (== PAC_PILL_GAP in the script below), rounded up            → 106
   plus the home-indicator inset, written with the SAME env() .pac-row's own bottom padding
   uses so the reservation and the thing reserved for can never disagree at any inset.
   SCAR (iPhone screenshot): this was a flat 84px that predated the pills row and ignored the
   inset — on a 390x844 iPhone (34px inset) it reserved 84 against a 126.4px composer, so the
   last message's ✎/⧉ action icons sat 42px underneath the model pill. Every rule below reads
   the variable with NO fallback of its own: one number, defined once, here.
   test/chat-pill-reserve.test.mjs recomputes all of this from these very declarations. */
/* --pac-fs: ONE definition of the chat's reading size (R3), so A-/A+ reaches the chat too.
   The shell broadcasts the user's scale as {pa:'prefs', fontScale}; web.mjs turns it into either
   `zoom` (apps sized in absolute px — everything scales for free) or `--fs` (apps that mount
   PANote, whose canvas coordinates come from a MEASURED width, so zoom would re-lay the page out
   instead of magnifying it). This component was written in absolute px and consumed NEITHER, so
   in a --fs app — the Bible — A-/A+ resized the scripture and left the chat beside it unchanged.
   Only READING text scales. Icons and round buttons keep their px so the composer row and the
   scroll pill do not deform at 1.5x; a bigger tap target is not what A+ is asking for. */
.pac{-webkit-text-size-adjust:100%;text-size-adjust:100%;position:relative;display:flex;flex-direction:column;height:100%;min-height:0;--pac-pill:calc(106px + env(safe-area-inset-bottom,0px));--pac-fs:calc(14px * var(--fs,1))}
/* Full-screen host for PAChat.fullscreen(): fixed, full-height, own bottom safe-area.
   Owning this here keeps every app's "Ask AI" identical. */
.pac-fs{position:fixed;inset:0;z-index:50;background:var(--card,#fff);display:none}
.pac-fs.on{display:block}
/* Host for PAChat.listDrawer()/the ☰ list: a transparent fixed layer the slide-in .pac-list +
   .pac-backdrop live in. pointer-events:none while closed so the app underneath stays usable.
   Below 640px .on makes it live (overlay+backdrop); at ≥640px it DOCKS and is re-neutralized to
   pointer-events:none (see #pac-dock-style / dockOn) so the pushed app on the right stays usable. */
.pac-drawerhost{position:fixed;inset:0;z-index:60;pointer-events:none}
.pac-drawerhost.on{pointer-events:auto}
.pac-log{flex:1;overflow-y:auto;padding:10px 12px var(--pac-pill);display:flex;flex-direction:column;gap:8px;scroll-padding-bottom:var(--pac-pill)}
.pac-m{max-width:82%;padding:8px 11px;border-radius:13px;font-size:var(--pac-fs,14px);line-height:1.5;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
.pac-m.me{align-self:flex-end;background:var(--accent,#0a7a5a);color:#fff;border-bottom-right-radius:4px}
/* A reply is a document, not a speech bubble: it takes the log's full width (owner, v5.27.1: an empty strip
   on the right of every answer). A typed message (.me) keeps the 82% bubble. */
.pac-m.ai{max-width:100%;align-self:flex-start;background:var(--card,#fff);border:1px solid var(--line,#e6e6e6);color:var(--text,#111);border-bottom-left-radius:4px}
.pac-m.status{align-self:flex-start;background:none;border:none;color:var(--muted,#888);font-size:calc(var(--pac-fs,14px) * .86);padding:2px 4px;max-width:100%}
.pac-m img{max-width:min(120px,50%);max-height:120px;border-radius:8px;border:1px solid var(--line,#e6e6e6);margin-top:5px;display:block;cursor:zoom-in}
.pac-lb{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:1000;padding:16px;cursor:zoom-out}
.pac-lb.on{display:flex}
.pac-lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
/* Rendered markdown opts OUT of the bubble's pre-wrap. .pac-m is white-space:pre-wrap so a typed
   message and a still-streaming raw chunk keep their line breaks — but rendered HTML carries
   newlines BETWEEN block tags, and pre-wrap paints every one of them as a blank line ON TOP of
   the block margins. Measured on a real reply: 351px of bubble for 143px of content — 59% of the
   height was source newlines. The shell's own chat already scopes pre-wrap to .me/.status/.stream
   for this reason; this brings PAChat in line. The class is set only where rendered HTML is
   actually installed, so the plain-text fallback keeps its line breaks. */
.pac-m.pac-md{white-space:normal}
.pac-m.ai p{margin:.35em 0}.pac-m.ai p:first-child{margin-top:0}.pac-m.ai p:last-child{margin-bottom:0}
/* A nested list was doubling the gap — the outer li already spaces it. */
.pac-m.ai li{margin:.1em 0}.pac-m.ai li>p{margin:0}.pac-m.ai blockquote{margin:.35em 0;padding-left:.8em;border-left:3px solid var(--line,#ddd);color:var(--muted,#666)}.pac-m.ai hr{border:none;border-top:1px solid var(--line,#e6e6e6);margin:.6em 0}.pac-m.ai li>ul,.pac-m.ai li>ol{margin:.15em 0}
.pac-m.ai pre{white-space:pre-wrap;background:rgba(127,127,127,.14);padding:6px 8px;border-radius:6px;overflow-x:auto;font-size:calc(var(--pac-fs,14px) * .93)}
.pac-m.ai code{background:rgba(127,127,127,.16);padding:1px 4px;border-radius:4px;font-size:calc(var(--pac-fs,14px) * .93)}
.pac-m.ai pre code{background:none;padding:0}
.pac-m.ai a{color:var(--accent,#0a7a5a)}
.pac-m.ai ul,.pac-m.ai ol{margin:.35em 0;padding-left:1.3em}
.pac-m.ai h1,.pac-m.ai h2,.pac-m.ai h3{margin:.4em 0;font-size:1.05em}
.pac-m.ai table{border-collapse:collapse;font-size:12.5px;margin:.5em 0;display:block;overflow-x:auto;max-width:100%}
.pac-m.ai th,.pac-m.ai td{border:1px solid var(--line,#e6e6e6);padding:4px 8px;text-align:left;vertical-align:top}
.pac-m.ai th{background:rgba(127,127,127,.1);font-weight:600;white-space:nowrap}
.pac-acts{display:flex;gap:1px;margin-top:-3px}
.pac-acts.me{align-self:flex-end}.pac-acts.ai{align-self:flex-start}
.pac-ab{background:none;border:none;color:var(--muted,#888);font-size:13px;cursor:pointer;padding:3px 6px;border-radius:6px;line-height:1;opacity:.7}
.pac-ab:active{background:color-mix(in srgb,var(--accent,#0a7a5a) 14%,transparent)}
.pac-ab.on{color:var(--accent,#0a7a5a);opacity:1}
.pac-ab svg{width:18px;height:18px;display:block}
.pac-scroll{position:absolute;bottom:var(--pac-pill);left:50%;transform:translateX(-50%);width:34px;height:34px;border-radius:50%;background:var(--card,#fff);border:1px solid var(--line,#e6e6e6);color:var(--text,#111);font-size:16px;cursor:pointer;display:none;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.18);z-index:6}
.pac-scroll.show{display:flex}
/* Phone (owner iPhone 2026-11-25): the log ENDS at the composer instead of flowing under it, so no line of a reply
   ever sits under or below the pill; the jump button moves to the right corner above the composer, off the text
   column. --pac-pill is the measured composer height (setPill below). */
@media (pointer:coarse) and (max-width:600px){
  .pac-log{margin-bottom:var(--pac-pill);padding-bottom:8px;scroll-padding-bottom:8px}
  .pac-scroll{left:auto;right:10px;transform:none;bottom:calc(var(--pac-pill) + 8px);width:44px;height:44px}
}
.pac-chips{display:flex;flex-wrap:wrap;gap:6px}.pac-chips:not(:empty){padding:0 2px 6px}
.pac-chip{position:relative;width:50px;height:50px;border-radius:8px;overflow:hidden;border:1px solid var(--line,#e6e6e6)}
.pac-chip img{width:100%;height:100%;object-fit:cover}
.pac-chip .pac-ctime{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;font-size:9px;line-height:12px;text-align:center;pointer-events:none}
.pac-chip button{position:absolute;top:0;right:0;background:rgba(0,0,0,.55);color:#fff;border:none;width:18px;height:18px;font-size:11px;cursor:pointer}
/* Floating composer: transparent container fixed at the bottom, the pill carries the
   surface, and the log flows underneath to the physical bottom — no dead white bar. */
.pac-row{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:6px;padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px));background:transparent;pointer-events:none;z-index:4}
.pac-row>*{pointer-events:auto}
.pac-frow{display:flex;align-items:flex-end;gap:4px;background:var(--bg,#f4f4f5);border:1px solid var(--line,#e6e6e6);border-radius:20px;padding:2px 4px;box-shadow:0 2px 12px rgba(0,0,0,.22)}
.pac-plus{background:none;border:none;color:var(--muted,#888);font-size:20px;width:30px;height:34px;cursor:pointer;flex-shrink:0}
.pac-tool{background:none;border:none;color:var(--muted,#888);font-size:20px;width:30px;height:34px;cursor:pointer;flex-shrink:0;padding:0}
.pac-tool svg{width:20px;height:20px;vertical-align:middle}
.pac-inp{flex:1;font:inherit;font-size:var(--pac-fs,14px);padding:7px 8px;border:none;background:transparent;color:var(--text,#111);outline:none;resize:none;max-height:120px;line-height:1.4;overflow-y:auto}
.pac-go{background:var(--accent,#0a7a5a);color:#fff;border:none;border-radius:50%;width:34px;height:34px;padding:0;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;flex-shrink:0}
.pac-go:disabled{opacity:.4;cursor:default}
.pac-top{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line,#e6e6e6);flex-shrink:0}
.pac-tbtn{display:flex;align-items:center;gap:4px;color:var(--accent,#0a7a5a);font-size:13px;font-weight:600;background:color-mix(in srgb,var(--accent,#0a7a5a) 12%,transparent);border:none;border-radius:8px;padding:6px 10px;cursor:pointer}
.pac-title{flex:1;font-size:var(--pac-fs,14px);font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text,#111)}
.pac-new{background:none;border:none;color:var(--accent,#0a7a5a);font-size:20px;cursor:pointer;width:30px;flex-shrink:0}
/* Sort, Select and Refresh live in the header's ONE ⋯ sheet (owner, 2026-11-11): the header shows
   ＋, Summarize · 总结 (PADrawerSummary mounts it in .pac-dhead) and ⋯. The sheet names the order in
   WORDS — a tooltip needs a hover and an iPad has none, and every arrow glyph that means "sort" to
   one person reads as undo or refresh to another. */
/* Marks a row whose note already carries a conversation, so "has it been asked about?" is
   answerable from the list instead of by opening every note in turn. */
.pac-lai{font-size:11px;line-height:1;opacity:.85}
.pac-dhead{display:flex;align-items:center;flex-shrink:0}
/* The closed list sits just off screen. Two things leaked out of it onto every PAChat page (owner
   2026-11-24, a pale rounded square over an app's first input / the panel greeting, plus a thin edge):
   width:100% + padding on a content-box input made the search box ~46px wider than the list, so its
   right end stuck in; and the 18px shadow reached past the 2% gap. Every box in the drawer is
   border-box, and the closed list is hidden (after the slide-out) so nothing of it can show. */
.pac-drawerhost *,.pac-drawerhost *::before,.pac-drawerhost *::after{box-sizing:border-box}
.pac-list{position:absolute;top:0;left:0;bottom:0;width:86%;max-width:330px;background:var(--card,#fff);display:flex;flex-direction:column;z-index:8;transform:translateX(-102%);visibility:hidden;transition:transform .22s ease,visibility 0s linear .22s;box-shadow:2px 0 18px rgba(0,0,0,.22)}
.pac-list.on{transform:none;visibility:visible;transition:transform .22s ease}
/* Multi-select · 多选. Deliberately a MODE, not an always-on checkbox column: the drawer's
   everyday job is opening ONE thing, and a permanent column of boxes beside every row makes the
   common action look like the rare one. */
.pac-lbox{width:20px;height:20px;border:1.5px solid var(--line,#e6e6e6);border-radius:5px;
  flex-shrink:0;align-self:center;margin-right:4px;position:relative}
.pac-list.pac-multi .pac-lrow .pac-lbox{display:block}
.pac-list.pac-multi .pac-lrow .pac-lic{display:none}
.pac-lrow.picked .pac-lbox{background:var(--accent,#0a7a5a);border-color:var(--accent,#0a7a5a)}
.pac-lrow.picked .pac-lbox::after{content:"✓";position:absolute;inset:0;color:#fff;font-size:13px;line-height:20px;text-align:center}
.pac-list.pac-multi .pac-lmenu{display:none}
/* Shift-clicking a list selects text in every browser, which puts a blue smear over the rows
   being ticked. Only while the mode is on. */
.pac-list.pac-multi .pac-lrows{-webkit-user-select:none;user-select:none}
.pac-lbulk{display:none;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid var(--line,#e6e6e6);
  background:var(--card,#fff);flex-shrink:0}
.pac-list.pac-multi .pac-lbulk{display:flex}
.pac-lbulkn{flex:1;font-size:13px;color:var(--muted,#888)}
.pac-lbulkdel{background:var(--danger,#983d24);color:#fff;border:none;border-radius:8px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.pac-lbulkdel:disabled{opacity:.45;cursor:default}
.pac-lbulkx{background:none;border:none;color:var(--muted,#888);font:inherit;font-size:13px;cursor:pointer;padding:6px 8px}

.pac-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .22s;z-index:7}
.pac-backdrop.on{opacity:1;pointer-events:auto}

.pac-qwrap{position:relative}
.pac-qx{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:26px;height:26px;border:0;border-radius:13px;background:var(--line,#d9d9dc);color:var(--text,#111);font-size:18px;line-height:26px;padding:0;cursor:pointer}
.pac-qx[hidden]{display:none}
.pac-lrows{flex:1;overflow-y:auto}
.pac-lday{padding:11px 14px 4px;font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--muted,#888)}

.pac-m .pa-took{display:block;margin-top:6px;font-size:11.5px;color:var(--muted,#888);font-variant-numeric:tabular-nums}
</style>
<script id="pac-script">
(function(){
  if(window.PAChat) return;               // idempotent: safe if the marker appears twice

  // Isolated broker. String-prefixed ids ('pac1'…) so replies never collide with an
  // app's own numeric-id broker listening on the same window.
  let _cid=0; const _wait={};
  window.addEventListener('message',e=>{ const m=e.data;
    if(m&&m.pa==='res'&&_wait[m.id]){ const keep=(m.ev&&!m.done); _wait[m.id](m); if(!keep) delete _wait[m.id]; } });
  const req=(o)=> new Promise(res=>{ const id='pac'+(++_cid); _wait[id]=res; parent.postMessage(Object.assign({pa:'req',id},o),'*'); });
  // Composer model chooser — options pushed by the shell via {pa:'prefs', models}.
  let PAC_MODELS=[]; let PAC_CURMODEL=null; const PAC_MODEL_CBS=new Set();
  // A host may declare which lane it wants selected on load (PAChat opts.defaultModel).
  // Models arrive asynchronously from the shell (pa:'prefs'), so the wish is recorded here
  // and resolved against the real list below — an app must not guess at ids the server owns.
  let PAC_WANTMODEL=null;
  // PAC_PICKED: the person chose in this chooser. Until then the lane is only a default, and a
  // remembered lane that arrives in a LATER push replaces it (below) — a frame that first got the
  // list with no remembered lane used to keep PAC_MODELS[0], the fast DeepSeek lane, for good.
  let PAC_PICKED=false;
  // A turn sent BEFORE the list arrives carried no model, so the server's default answered while
  // the chip, once painted, named another lane (2026-11-12: Bible Ask AI fires Explain as the rail
  // opens). Every turn now waits for the list, bounded: past the shell's own 3 s models wait.
  // TODO(R4 seam): this file is over budget; the model chooser state (PAC_MODELS…, pacModelsReady, the prefs handler) is its own inlined part.
  const PAC_MODELS_WAIT_MS=5000;
  const pacModelsReady=()=>PAC_MODELS.length?Promise.resolve():new Promise(res=>{ let t=null;
    const done=()=>{ PAC_MODEL_CBS.delete(done); clearTimeout(t); res(); };
    t=setTimeout(done,PAC_MODELS_WAIT_MS); PAC_MODEL_CBS.add(done); });
  // `system` is passed IN (resolved at the call site inside Chat, where opts lives). reqChat is
  // module-scope and must not reference Chat's `opts` — doing so threw ReferenceError and broke send.
  // `oneShot` is PAChat.complete's and NEVER the composer's: one answer for a component, not a
  // conversation turn (the server answers it without extended thinking and kills the job when the
  // request is cancelled). `onId` hands the caller this request's broker id — the only handle a
  // later chat-cancel can name, since the waiter is keyed by it.
  const PAC_CANCELLED='已取消 · Cancelled';   // == RELAY_CANCELLED in web/index.html (test/chat-cancel.test.mjs)
  const reqChat=(message,convoId,onEvent,attachments,label,system,assess,oneShot,onId,model)=> new Promise(res=>{ const id='pac'+(++_cid);   // model: ONE turn's lane (a summary's preferred agent lane, web/summary-images.inline.html), else the chooser's
    _wait[id]=(m)=>{ if(m.ev) onEvent(m.ev); if(m.done) res(m); }; if(onId) onId(id);
    // A turn that names its lane, or a oneShot (its lane is the server's one_shot_model), needs no list;
    // with the list in hand the post stays synchronous, as before.
    const go=()=>parent.postMessage({pa:'req',id,kind:'chat',message,convoId,attachments:attachments||undefined,label:label||undefined,model:model||PAC_CURMODEL||undefined,system:system||undefined,assess:assess||undefined,oneShot:oneShot===true||undefined},'*');
    if(model||oneShot===true||PAC_MODELS.length) go(); else pacModelsReady().then(go); });

  /* ── Size limits（大小上限）— DEFECT V4, 2026-09-02 round 2 ────────────────────────────
     An oversize /api/chat body was a STRUCTURALLY INVISIBLE failure on the most-used route:
     the server answered 413 JSON, no chat reader parsed it, nothing threw, and the composer —
     already cleared — sat on "…" forever with the user's message gone. Two halves fix it:
       1. PRE-FLIGHT (here). We know the payload before we send it, so an oversize message is
          refused BEFORE the composer is cleared: the text and the attachment chips stay
          exactly where the user left them, and the reason is named with the limit.
       2. POST-FACTO (paint below). Any {ok:false,code:'too-large'} that does come back is
          rendered as the same sentence instead of "No response — try rephrasing."
     THE NUMBERS ARE A COPY. A sandboxed component cannot import lib/webutil.mjs, so
     test/chat-oversize.test.mjs pins PAC_LIMITS and PAC_TOO_LARGE against BODY_LIMITS /
     CODE_TOO_LARGE and fails the suite the moment they drift (R3 by test).            */
  const PAC_LIMITS={chat:1024*1024, upload:20*1024*1024};   // == lib/webutil.mjs BODY_LIMITS.chat / .upload
  const PAC_TOO_LARGE='too-large';                          // == lib/webutil.mjs CODE_TOO_LARGE
  // The shell wraps our fields in its own envelope (app slug, model id, assess flag, JSON key
  // names). We cannot see it, so we reserve for it and refuse slightly EARLY — erring toward a
  // refusal we can explain, never toward one only the server can see.
  const PAC_ENVELOPE_BYTES=512;
  // Composer reservation (see .pac's --pac-pill in #pac-style, which is derived from this GAP).
  const WAKE_MIN_MS=3000;   // focus + visibilitychange both fire on one tab switch
  const PAC_PILL_GAP=12;      // breathing room between the last message's action icons and the composer
  const PAC_PILL_TRIES=90;    // ~1.5s of frames for a slow first layout; show() re-measures explicitly, so this never has to cover a long-hidden surface
  const pacBytes=s=>{ const t=String(s==null?'':s); return new TextEncoder().encode(t).length; };   // UTF-8 bytes: 中文 is 3 bytes per character, .length would under-count by 3×
  const pacHuman=n=>{ const b=Number(n); if(!isFinite(b)||b<=0) return '0 B';
    if(b>=1048576){ const m=b/1048576; return (m>=10?Math.round(m):Math.round(m*10)/10)+' MB'; }
    return b>=1024 ? Math.round(b/1024)+' KB' : b+' B'; };
  // Bytes the /api/chat body will really weigh. JSON.stringify of exactly the fields reqChat
  // sends, plus the shell envelope — measured, never guessed from character counts. (oneShot is
  // not among them: only PAChat.complete sends it, and complete is not measured here.)
  const pacChatBytes=(message,convoId,attachments,label,system)=>PAC_ENVELOPE_BYTES+pacBytes(JSON.stringify({message,convoId:convoId||null,attachments:attachments||undefined,label:label||undefined,system:system||undefined}));
  /* ── The noun table（名词表）— a COPY of the shell's RELAY_NOUNS, byte-for-byte ─────────
     PRE-FLIGHT ONLY. Every failure that comes BACK from the shell already carries the
     sentence the shell's ONE mapper rendered (relayFail in web/index.html), and this
     component prints that verbatim. What no reply can cover is a refusal made HERE, before
     anything is sent — there is no reply to render, so the sentence must exist locally too.
     The sandbox has an opaque origin and cannot import, so test/fail-legibility.test.mjs
     runs BOTH renderers over the same matrix and fails the moment one character drifts.
     LEFTOVER (e): 'Photo' is a noun of its own — an oversized camera-roll insert must not
     read as the generic "File", and must never read like a 401. */
  const PAC_NOUNS={
    Message:{head:'消息过长 · Message too large',act:'请缩短内容或删除附件后重发 · Shorten it or remove an attachment, then send again'},
    File:   {head:'文件过大 · File too large',   act:'请选择更小的文件 · Pick a smaller file'},
    Photo:  {head:'照片过大 · Photo too large',  act:'请选择更小的照片或裁剪后重试 · Pick a smaller photo, or crop it'},
  };
  // The composer's ＋ delegates to PAPhoto; if the page never received that component there is
  // nothing to delegate to, and the user is told WHICH piece is missing rather than tapping a
  // button that does nothing. Reachable only on a page serving PAChat without PA_PHOTO_UI.
  const PAC_NO_PHOTO='无法上传照片 · Photo upload unavailable — 本页未加载共享照片组件 · the shared photo component did not load on this page';
  const PAC_IMAGE_RE=/\.(jpe?g|png|heic|heif|gif|webp|bmp|tiff?|avif)$/i;   // == the shell's RELAY_IMAGE_RE
  const pacWhatForFile=name=>PAC_IMAGE_RE.test(String(name||''))?'Photo':'File';
  const pacTooLargeText=(what,bytes,limit)=>{ const n=PAC_NOUNS[what]||PAC_NOUNS.Message;
    return n.head+(limit?' (max '+pacHuman(limit)+')':'')+(bytes?' — 已发送 '+pacHuman(bytes)+' · '+pacHuman(bytes)+' sent':'')+'. '+n.act+'。'; };
  // Did this reply mean "too large"? Reads the machine-readable code first and falls back to
  // the 413 status, so it holds whichever of those the relay happens to forward (R14: no
  // pattern-matching on prose — a translated or reworded message must not turn into a silent
  // success). Returns the limit (a number) or null.
  const pacTooLargeLimit=m=>{ if(!m||m.ok===true) return null;
    if(m.code===PAC_TOO_LARGE||m.status===413) return Number(m.limit)||null;
    return null; };

  const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  // Strip our own first-message scaffolding when replaying a saved user turn.
  /* PA_REPLY_CLEAN_JS */
  // TODO(R4): this file is far over budget; the render helpers split out with the message-render seam.
  // A reply as shown (bubble, Copy, Read aloud): web/reply-clean.js, the same file the server stores through.
  const shownAi=t=>{ const c=cleanReply(t); return c.emptied?REPLY_EMPTY_TEXT:c.text; };
  const cleanMe=t=>shownUserText(String(t||'').replace(/^Context:[\s\S]*?Question:\s*/,'').replace(/\n*\[Attached file:[^\]]*\]/g,'')).trim();

  // Tap-to-zoom lightbox (mirrors the main chat's full-screen image view): ONE element for every mount and PAChat.lightbox; tap or Esc closes.
  let _lb=null;
  function lightbox(src){
    if(!_lb){ _lb=document.createElement('div'); _lb.className='pac-lb';
      const im=document.createElement('img'); im.alt=''; _lb.appendChild(im);
      _lb.addEventListener('click',()=>_lb.classList.remove('on'));
      document.addEventListener('keydown',ev=>{ if(ev.key==='Escape'&&_lb) _lb.classList.remove('on'); });
      document.body.appendChild(_lb);
    }
    _lb.firstChild.src=src; _lb.classList.add('on');
  }

  // ── per-message actions (copy / read-aloud / retry / edit) — the standard chatbox toolkit ──
  const stripMd=t=>String(t||'').replace(/```[\s\S]*?```/g,' ').replace(/\[([^\]]*)\]\([^)]*\)/g,'$1').replace(/[#*`_>~]/g,'').replace(/\n{2,}/g,'. ').trim();
  // Message action icons as SVG line icons, never text glyphs: iOS has no font with ⎘/✎, so they fell back to a
  // tiny faint symbol (owner iPhone 2026-11-25). Mirror of PAIcons copy/speaker/refresh/pen in web/icons.js (this
  // page cannot load it); test/chat-action-icons.test.mjs pins them equal (R3). TODO(R4 seam): reply-row helpers → own part.
  const PAC_ICON={copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a1 1 0 0 1 1-1h10"/>',
    speaker:'<path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>',
    refresh:'<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>',
    pen:'<path d="M15 4l5 5L9 20H4v-5z"/><path d="M13 6l5 5"/>',
    check:'<path d="M5 12l5 5 9-10"/>'};
  const pacSvg=(k)=>'<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+PAC_ICON[k]+'</svg>';
  function mkab(icon,title){ const b=document.createElement('button'); b.className='pac-ab'; b.type='button'; b.title=title; b.setAttribute('aria-label',title); b.innerHTML=pacSvg(icon); return b; }
  function flash(b,icon){ const old=b.innerHTML; b.innerHTML=pacSvg(icon); setTimeout(()=>{ if(b.isConnected) b.innerHTML=old; },1200); }
  function fallbackCopy(t){ try{ const ta=document.createElement('textarea'); ta.value=t; ta.style.cssText='position:fixed;opacity:0'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); return true; }catch{ return false; } }
  function copyText(t,btn){ // clipboard API where allowed, execCommand fallback for the sandbox
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(()=>flash(btn,'check')).catch(()=>{ if(fallbackCopy(t)) flash(btn,'check'); });
    else if(fallbackCopy(t)) flash(btn,'check'); }
  // Mixed EN/中文 read-aloud: ONE utterance per script run, each with its own lang/voice —
  // a single-language utterance silently skips (or mangles) the other script on iOS/macOS.
  // Neutral chars (digits, punctuation, spaces) attach to the current run to avoid choppy
  // voice-switching. (Duplicated in web/index.html for the shell chat — separate documents.)
  const SPEAK_CJK=/[\u3000-\u303f\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff\uff00-\uffef]/;
  const SPEAK_SCRIPTED=/[A-Za-z\u3000-\u303f\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff\uff00-\uffef]/;
  function speechSegments(text){
    const out=[]; let cur='', curZh=null;
    for(const ch of String(text||'')){
      const zh=SPEAK_CJK.test(ch), neutral=!SPEAK_SCRIPTED.test(ch);
      if(curZh===null){ cur+=ch; if(!neutral) curZh=zh; continue; }
      if(neutral||zh===curZh){ cur+=ch; continue; }
      out.push({text:cur,zh:curZh}); cur=ch; curZh=zh;
    }
    if(cur.trim()) out.push({text:cur,zh:curZh===null?false:curZh});
    return out.filter(s=>s.text.trim());
  }
  function speak(text,onEnd){ const ss=window.speechSynthesis; if(!ss){ onEnd&&onEnd(); return; }
    ss.cancel();
    const segs=speechSegments(text);
    if(!segs.length){ onEnd&&onEnd(); return; }
    const voices=(ss.getVoices&&ss.getVoices())||[];
    const pick=zh=>voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith(zh?'zh':'en'))||null;
    let done=0; const finish=()=>{ if(++done===segs.length) onEnd&&onEnd(); };
    for(const s of segs){ const u=new SpeechSynthesisUtterance(s.text);
      u.lang=s.zh?'zh-CN':((navigator.language&&!/^zh/i.test(navigator.language))?navigator.language:'en-US');
      const v=pick(s.zh); if(v) u.voice=v;
      u.onend=finish; u.onerror=finish; ss.speak(u); }
  }

  // ── Verify · 校验: deep-view markdown built from a turn's persisted assessment ──
  // The participation line is computed from the persisted per-model status so absent and
  // skipped models are ALWAYS named (R14) — independent of the summarizer's own wording.
  function assessLine(a){ const ms=a.models||[]; const oks=ms.filter(x=>x.ok);
    const bits=ms.map(x=>(x.ok?'✓ ':'✗ ')+(x.label||x.id)+(x.ok||!x.error?'':' ('+x.error+')'));
    let s='**Participation 参与:** '+oks.length+'/'+ms.length+' responded 已响应';
    if(bits.length) s+=' — '+bits.join(' · ');
    if(a.skipped&&a.skipped.length) s+=' · skipped 跳过: '+a.skipped.map(x=>x.label||x.id).join(', ')+' (current model 当前模型)';
    return s; }
  function assessDeepMd(a){
    if(a.state==='error') return '⚠ **校验失败 · Verify failed** — '+(a.error||'未知错误 · unknown error')+'\n\n'+assessLine(a);   // explicit error, never a blank deep view (R5/R14)
    return assessLine(a)+'\n\n---\n\n'+(a.summary||''); }

  // ── shared list helpers (day grouping + relative time) ──
  // Module scope so BOTH the in-chat ☰ list (Chat) and the standalone PAChat.listDrawer
  // render identical day headers / timestamps from a single definition (R3).
  // A timestamp is usable only if it is a real, positive instant. Number('') / Number(null) are 0,
  // which as a date is 1970 — a row must say it has no time rather than claim it was written then.
  function usableTs(ts){ const ms=Number(ts);
    if(!Number.isFinite(ms)||ms<=0) return 0; const d=new Date(ms); return Number.isFinite(d.getTime())?ms:0; }
  function listDay(ts){ const ms=usableTs(ts); if(!ms) return '无日期 · No date';
    const d=new Date(ms), now=new Date();
    const s=x=>new Date(x.getFullYear(),x.getMonth(),x.getDate()).getTime();
    const diff=Math.round((s(now)-s(d))/86400000);
    if(diff<=0) return 'Today 今天'; if(diff===1) return 'Yesterday 昨天';
    const wd=['Sun 周日','Mon 周一','Tue 周二','Wed 周三','Thu 周四','Fri 周五','Sat 周六'][d.getDay()];
    return wd+' · '+(d.getMonth()+1)+'月'+d.getDate()+'日'; }
  // The row's own last-modified TIME, because the DAY is already the header above it.
  //
  // This replaced a relative label ("now"/"12m"/"4h"/"9/8"), which contradicted that header every
  // night: that label's "under 24 hours" window spans calendar days and listDay's does not, so
  // for the whole stretch between midnight and 24h after an edit a row read as e.g. "4h" — plainly
  // today — while sitting correctly under "Yesterday 昨天". (SCAR 2026-09-12: a note last written
  // at 20:27 the previous evening was read at 00:20 and reported as a stale-timestamp bug; the
  // data was right and the label was unreadable.) An absolute time cannot disagree with the day
  // above it, and it also survives a
  // docked drawer left open across midnight, which a relative label silently does not — nothing
  // redraws the list on a timer.
  //
  // Deliberately NOT PANote.stamp(): that formats a note's TITLE, it is absent from apps that mount
  // PAChat without PANote (rows would silently lose their times), and coupling the two would mean a
  // change to note titles silently restyling this list.
  function listTime(ts){ const ms=usableTs(ts); if(!ms) return '';
    const d=new Date(ms);
    return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }

  // ── in-panel modals ──
  // Native prompt()/confirm() are blocked in sandbox=allow-scripts; use these instead.
  // `host` is the element the .pac-modal overlay is appended to (a Chat host, or a
  // listDrawer host) — module scope so Chat and listDrawer share one implementation (R3).
  // Escape answers a modal or sheet the way its backdrop tap does (F3-07); the listener leaves with the overlay.
  // TODO(R4 seam): the in-panel modals (pacPrompt/pacConfirm/pacSheet/escCloses) → their own part.
  function escCloses(ov,close){ if(typeof document.addEventListener!=='function'||typeof MutationObserver!=='function') return;   // a DOM-free test host has neither
    const k=e=>{ if(e.key!=='Escape'||!ov.isConnected) return; e.preventDefault(); e.stopPropagation(); close(); };
    document.addEventListener('keydown',k,true); new MutationObserver((_,mo)=>{ if(!ov.isConnected){ document.removeEventListener('keydown',k,true); mo.disconnect(); } }).observe(ov.parentNode||document.body,{childList:true}); }
  function pacPrompt(host,title,initial){ return new Promise(res=>{
    const ov=document.createElement('div'); ov.className='pac-modal';
    ov.innerHTML='<div class="pac-mbox"><div class="pac-mttl"></div><input class="pac-minp"><div class="pac-mbtns"><button class="pac-mcancel">Cancel</button><button class="pac-mok">Save</button></div></div>';
    ov.querySelector('.pac-mttl').textContent=title; host.appendChild(ov);
    const inp=ov.querySelector('.pac-minp'); inp.value=initial||''; setTimeout(()=>{inp.focus();inp.select();},30);
    const done=v=>{ ov.remove(); res(v); };
    ov.querySelector('.pac-mcancel').onclick=()=>done(null);
    ov.querySelector('.pac-mok').onclick=()=>done(inp.value);
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){e.preventDefault();done(inp.value);} if(e.key==='Escape')done(null); });
    ov.addEventListener('click',e=>{ if(e.target===ov)done(null); }); }); }
  function pacConfirm(host,msg){ return new Promise(res=>{
    const ov=document.createElement('div'); ov.className='pac-modal';
    ov.innerHTML='<div class="pac-mbox"><div class="pac-mttl"></div><div class="pac-mbtns"><button class="pac-mcancel">Cancel</button><button class="pac-mok pac-del">Delete</button></div></div>';
    ov.querySelector('.pac-mttl').textContent=msg; host.appendChild(ov);
    const done=v=>{ ov.remove(); res(v); };
    ov.querySelector('.pac-mcancel').onclick=()=>done(false);
    ov.querySelector('.pac-mok').onclick=()=>done(true);
    ov.addEventListener('click',e=>{ if(e.target===ov)done(false); }); escCloses(ov,()=>done(false)); }); }
  // With an anchor element, the menu opens as a POPOVER next to it (clamped to the viewport,
  // outside-tap closes — no Cancel row needed); without one it stays the classic bottom sheet.
  // Open ⋯ sheets, so a chat taking the screen can close them (audit #7: the list's ⋯ floated over Ask AI).
  // TODO(R4 seam): pacSheet + closeSheets → web/drawer-ui.inline.html with buildDrawer (this file is over budget).
  const _sheets=new Set();
  function closeSheets(){ for(const f of [..._sheets]) f(); }
  function pacSheet(host,optsArr,anchor){ return new Promise(resolve=>{
    // A phone gets the ONE bottom sheet (web/phone-ui.inline.html), never a popover pinned to a 44px ⋯.
    const phone=!!(window.PAPhoneUI&&window.PAPhoneUI.isPhone()); if(phone) anchor=null;
    let shut=null; const res=v=>{ _sheets.delete(shut); resolve(v); };
    const ov=document.createElement('div'); ov.className='pac-modal'+(anchor?'':' pac-msheet');
    shut=()=>{ ov.remove(); res(-1); }; _sheets.add(shut);
    if(anchor) ov.style.background='transparent';
    const box=document.createElement('div'); box.className='pac-mbox'+(phone?' pa-sheet':'');
    optsArr.forEach((o,i)=>{ const b=document.createElement('button'); b.className='pac-mopt'+(o.del?' del':''); b.textContent=o.label; b.onclick=()=>{ov.remove();res(i);}; box.appendChild(b); });
    if(!anchor){ const c=document.createElement('button'); c.className='pac-mopt'; c.textContent='Cancel'; c.onclick=()=>{ov.remove();res(-1);}; box.appendChild(c); }
    ov.appendChild(box); ov.addEventListener('click',e=>{ if(e.target===ov){ov.remove();res(-1);} }); host.appendChild(ov); escCloses(ov,()=>{ov.remove();res(-1);});
    if(anchor){ const r=anchor.getBoundingClientRect(), bw=box.offsetWidth||190, bh=box.offsetHeight||100;
      box.style.position='absolute'; box.style.width='auto'; box.style.minWidth='170px'; box.style.padding='6px';
      box.style.left=Math.max(8, Math.min(r.left, innerWidth-bw-8))+'px';
      const below=r.bottom+6; box.style.top=(below+bh>innerHeight-8 ? Math.max(8, r.top-bh-6) : below)+'px';
      ov.style.alignItems='flex-start'; ov.style.justifyContent='flex-start'; } }); }

  // ── docked-drawer offset (module scope, shared by EVERY buildDrawer instance, R3) ──
  // On a WIDE viewport (≥640px) the drawer DOCKS at the left and the app's OWN full-screen
  // root(s) are PUSHED beside it — both stay visible AND interactive, no dimming. Mechanism is
  // fully app-agnostic: a class on <html> + one idempotent <style> that adds a left MARGIN to
  // every direct <body> child EXCEPT the component's own overlays, so BOTH a
  // `position:fixed;inset:0` root (the journal's #app, the Bible's .pac-fs) AND a normal-flow flex
  // column (the Bible's reading view) narrow to start at the panel's right edge. It used to
  // override `left`, which positioned children obey and flow children ignore — so the drawer
  // covered the Bible's text instead of making room for it.
  // Below 640px the offset is media-gated OFF and the drawer keeps the overlay+backdrop.
  //   Excluded (never pushed): .pac-drawerhost (holds the panel), .pac-lb (full-screen zoom),
  //   .paw-x (PAWin's panel windows, snap preview and pills — they place themselves, so pushing their
  //   margin would drag them off their own edge).
  //   CORRECTION: an earlier version of this comment also listed `.pan-fs` as "never pushed".
  //   It never was — the constant below does not exclude it, and in the unified Journal .pan-fs

    const searchNote=r=>r.truncated?whereLabel('more'):r.pending>0?ocrLine(r):'';

    // PA_DRAWER_TAGS_UI marker at the end of this file); null on a page without it. Its chip-tap

    // TODO(R4 seam): grows this over-budget file by four lines; the seam is buildDrawer → web/drawer-ui.inline.html.
    // `prefs` is this app's server-side prefs (the sort order's store, below): the components keep their

    // TODO(R4 seam): grows this over-budget file by four lines; the seam is buildDrawer → web/drawer-ui.inline.html.
    // ONE chain per PAGE (web/app-prefs.inline.html, carried by the PA_APP_PREFS_UI marker at the end of this file):

    const prefs={ get:()=>window.PAAppPrefs.get(), set:(patch)=>window.PAAppPrefs.patch(patch) };
    const tags=window.PADrawerTags?window.PADrawerTags.attach({host,rows,box:qi,items:()=>_items,sameDoc,search:()=>onSearchInput(),redraw:()=>draw(),prefs}):null;

    function draw(){
      const f=(qi.value||'').toLowerCase().trim();

        if(f&&!((it.title||'')+' '+(it.preview||'')).toLowerCase().includes(f)&&!hitFor(it,f)) return false;

    // Built from what the row can actually DO, rather than two fixed labels dispatched by their

        // SHIFT extends from the last plain tap to this row, inclusive, in the order the rows are
        // SHOWN (after search, tab and sort) — a range the user cannot see is not the range they
        // meant. It only ever ADDS: turning a mis-aimed shift into a silent deselection of work
        // already ticked is the expensive mistake here, and the list is a delete queue.
        // Ctrl/Cmd is accepted as the explicit form of the plain tap, so the habit works.
        if(e.shiftKey && _anchor && _anchor!==id) pickRange(_anchor,id);
        else {
          // Toggle the ROW, not the list. draw() rebuilds every row's innerHTML, which on a long
          // list costs a full re-render per tick AND detaches the element under the user's
          // finger — losing scroll position, and dropping ticks that land during the rebuild.
          if(_picked.has(id)){ _picked.delete(id); row.classList.remove('picked'); }
          else { _picked.add(id); row.classList.add('picked'); }
          _anchor=id;                             // only a PLAIN tap moves the anchor
        }
        syncBulk(); return;
      }
      // Stay open on select: highlight the tapped row and run its open handler, but do NOT
      // close — only a backdrop/outside tap closes the drawer.
      sel=row.dataset.id; draw();
      // A search hit opens WHERE it matched: the hit's page, the boxes of the matched OCR lines and
      // the query terms travel as onOpen's second argument (undefined for a plain row), which the
      // hosts hand to PANote.reveal after their reload (phase 3). Read at CLICK time from the
      // current query, never stored on the row.
      const it=itemOf(sel), hit=hitFor(it,(qi.value||'').toLowerCase().trim());
      if(it.onOpen) it.onOpen(sel, hit?{page:hit.page,boxes:hit.boxes||[],terms:_hitTerms}:undefined);
      // …except on a phone, where the list covers the note it just opened (audit #6): there it closes.
      if(window.PAPhoneUI&&window.PAPhoneUI.isPhone()) close();
    });
    // The typed query also goes to the node's index when PANote.search exists (feature-detected: a
    // page without PANote keeps the local filter alone). Debounced; a reply for an older query is
    // dropped; a failure is said ONCE under the box — the shell's reason when it carried one, else
    // the bilingual fallback — and the local filter keeps working (R5). A cleared box supersedes
    // the pending query exactly like a new one (seq bump) and takes the failure line with it.
    const SEARCH_DEBOUNCE_MS=250;
    // When the reply says pages are still being transcribed, the SAME query is asked ONCE more after
    // this long (the text unchanged), so a hit transcribed meanwhile appears without a keystroke
    // (R13 round 1 #7). Read at use time: a test shortens it through window.PA_SEARCH_REFRESH_MS.
    const searchRefreshMs=()=>(Number(window.PA_SEARCH_REFRESH_MS)>0?Number(window.PA_SEARCH_REFRESH_MS):4000);
    const smsg=q('.pac-lsmsg');
    async function askNode(f,my,again){
      let r; try{ r=await window.PANote.search(f); }catch(e){ r={ok:false,error:String((e&&e.message)||e)}; }
      if(my!==_hitSeq||!r||r.stale) return;                   // a newer query is in flight
      _pending=false;                                          // the verdict arrived, good or bad
      if(!r.ok){ if(smsg) smsg.textContent=r.error||whereLabel('failed'); _hits=null; _hitQ=''; draw(); return; }
      if(smsg) smsg.textContent=searchNote(r);                        // truncation, else OCR state, else nothing (R5)
      _hits=r.hits||[]; _hitQ=f; _hitTerms=Array.isArray(r.terms)?r.terms:[]; draw();
      if(r.pending>0&&!again) setTimeout(()=>{ if(my===_hitSeq) askNode(f,my,true); },searchRefreshMs());
    }
    function onSearchInput(){
      const f=(qi.value||'').toLowerCase().trim();
      if(_hitTimer){ clearTimeout(_hitTimer); _hitTimer=null; }
      // ANY change of text supersedes the query in flight (seq bump) and takes a failure line with it —
      // not only a cleared box (R13 round 2 #4).
      ++_hitSeq; if(smsg) smsg.textContent='';
      if(tags) tags.sync();                                    // the strip shows only under an empty box
      if(qx) qx.hidden=!f;                                     // the × clears a tag or query in one tap (owner, 2026-11-10)
      if(!f||!(window.PANote&&typeof window.PANote.search==='function')){ _pending=false; _hits=null; _hitQ=''; draw(); return; }
      _pending=true; draw();                                   // local matches at once; hits join when they arrive
      const my=_hitSeq;
      _hitTimer=setTimeout(()=>askNode(f,my,false),SEARCH_DEBOUNCE_MS);
    }
    qi.addEventListener('input',onSearchInput);
    if(qx) qx.addEventListener('click',()=>{ qi.value=''; onSearchInput(); });   // TODO(R4 seam): the search block → its own inline file
    if(tabs) list.querySelectorAll('.pac-ltab').forEach(b=>b.addEventListener('click',()=>{
      _tab=b.dataset.t; list.querySelectorAll('.pac-ltab').forEach(x=>x.classList.toggle('on',x===b)); draw(); }));
    const dnew=q('.pac-dnew'); if(dnew) dnew.onclick=()=>{ if(c.onNew) c.onNew(); close(); };
    const dnew2=q('.pac-dnew2'); if(dnew2) dnew2.onclick=()=>{ if(c.onNew2) c.onNew2(); close(); };
    backdrop.onclick=close;                  // narrow (overlay) fallback: tap the dim backdrop to close
    // Title = collapse: clicking the drawer's own title text COLLAPSES it (the menu icon in the
    // app re-expands via open()). This is the close affordance when docked (there is no backdrop).
    dtitle.onclick=close;
    dtitle.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); close(); } });   // role=button a11y
    // confirm/prompt expose the sandbox-safe in-panel modals so host apps reuse them (e.g. a
    // header 🗑 that deletes the open entry) instead of the blocked native confirm()/prompt().
    /* ── Re-read the list when you come back to it ───────────────────────────────────────
       Reported: a laptop left open all night still listed yesterday's conversations as the
       newest, while the same account on a phone showed them correctly. The list was fetched
       once, at load, and nothing ever asked again — there is no polling and no push, so
       returning to the tab is the only moment we know for certain the user is looking.

       NOT polling. Nothing happens while the tab is hidden or the lid is shut, which matters on
       a household of phones: a timer would cost every device something, forever, to fix a
       problem that only exists at the instant someone looks. Browsers also throttle background
       timers, so a poll would be least reliable exactly when it would have to be right.

       focus and visibilitychange BOTH fire on one tab switch, hence the throttle. */
    let _woke=0;
    const onWake=()=>{
      if(!host.isConnected){                      // drawer torn down: unhook rather than fetch
        document.removeEventListener('visibilitychange',onWake); window.removeEventListener('focus',onWake); return; }
      if(document.visibilityState==='hidden') return;
      const now=Date.now(); if(now-_woke<WAKE_MIN_MS) return;
      _woke=now; refresh(true);
    };
    document.addEventListener('visibilitychange',onWake);
    window.addEventListener('focus',onWake);

    return { open, close, refresh, setActive, isOpen:()=>list.classList.contains('on'), el:host,
      // Removable, because a listener on `document` outlives the element that owns it. An
      // anonymous one here would strand a closure over a dead drawer on every mount/destroy.
      destroy:()=>{ document.removeEventListener('visibilitychange',onWake); window.removeEventListener('focus',onWake); },
      confirm:(msg)=>pacConfirm(host,msg), prompt:(title,init)=>pacPrompt(host,title,init) };
  }

  function render(host){
    host.classList.add('pac');
    host.innerHTML=
      '<div class="pac-top"><button class="pac-tbtn pac-toList" title="笔记与对话 · Notes & Chats" aria-label="笔记与对话 · Notes & Chats">☰</button><div class="pac-title"></div><button class="pac-new pac-newC" title="New chat">＋</button><button class="pac-new pac-close" title="Close" style="display:none">✕</button></div>'+
      '<div class="pac-log"></div>'+
      '<button class="pac-scroll" title="Scroll to bottom">↓</button>'+
      '<div class="pac-row"><div class="pac-chips"></div><div class="pac-pills"><button class="pac-model" style="display:none"></button><button class="pac-vfy" title="多模型校验 · Verify with multiple models">校验 · ☐ Verify</button></div><div class="pac-frow">'+
        '<button class="pac-plus" title="Attach a photo">＋</button><span class="pac-tools"></span>'+
        '<textarea class="pac-inp" rows="1" autocomplete="off"></textarea>'+
        '<button class="pac-go" title="Send">↑</button>'+
      '</div><input type="file" class="pac-file" accept="image/*" style="display:none"></div>';
    // NOTE: the ☰ list/drawer is no longer in this template — Chat now uses a shared
    // buildDrawer() instance (body-appended), so there is ONE drawer renderer (R3).
    const q=s=>host.querySelector(s);
    return { log:q('.pac-log'),scroll:q('.pac-scroll'),chips:q('.pac-chips'),row:q('.pac-row'),model:q('.pac-model'),vfy:q('.pac-vfy'),
             plus:q('.pac-plus'),tools:q('.pac-tools'),inp:q('.pac-inp'),go:q('.pac-go'),file:q('.pac-file'),
             title:q('.pac-top .pac-title'),toList:q('.pac-toList'),newC:q('.pac-newC'),closes:[...host.querySelectorAll('.pac-close')] };
  }

  function Chat(host, opts){
    // opts.defaultModel: which lane this app prefers on load (e.g. 'claude'). Recorded
    // before the list arrives; resolved in the pa:'prefs' handler above. A user's own pick
    // in the chooser always wins afterwards — this only chooses the STARTING lane.
    if(opts&&opts.defaultModel&&!PAC_CURMODEL) PAC_WANTMODEL=String(opts.defaultModel);
    const el=render(host);
    let key=null, atts=[]/*[{name,path,thumb}]*/, sending=false, loadedKey=null, lastUser=null, curConvo=null, _sel=null, _loadSeq=0;   // _sel = the ONE active id (a convo or a note) the ☰ drawer highlights; _loadSeq = monotonic convo-load token (mirrors send()'s _rseq) so a slow load can't overwrite a newer selection
    if(typeof PABusy!=='undefined') PABusy.watch(()=>sending||!!el.inp.value.trim()||atts.length>0);   // a streaming turn or a draft (text or attachments): the shell must not reload itself under it (web/busy.inline.html)
    function setTitle(t){ el.title.textContent=t||'Chat'; }
    // opts.showMe: the host's view of its own user turns (Bible shows an explain turn's header + verse, not its instructions).
    const shownMe=t=>(typeof opts.showMe==='function'?opts.showMe(t):t);

    const nearBottom=()=> el.log.scrollHeight-el.log.scrollTop-el.log.clientHeight<=120;
    const pin=()=>{ el.log.scrollTop=el.log.scrollHeight; };
    const updateScroll=()=> el.scroll.classList.toggle('show', !nearBottom());

    // How long the answer took. Same format the shell uses, in this document's own copy — apps are
    // sandboxed and cannot share a script file, so the two are held identical by a test instead.
    const _took=(ms)=>ms<60000?(ms/1000).toFixed(1)+'s':Math.floor(ms/60000)+'m '+String(Math.round(ms%60000/1000)).padStart(2,'0')+'s';
    // `ms` may be absent (stored before this shipped, or a lane that never reported it): add
    // nothing rather than 'took NaNs'.
    // by: the model that actually answered (server 'done'.by / stored mm.by), so a rerouted pick is visible.
    function _addTook(el,ms,by){ if(!(Number.isFinite(ms)&&ms>=0)) return null;
      const t=document.createElement('small'); t.className='pa-took'; t.textContent=(by?by+' · ':'')+'took '+_took(ms); el.appendChild(t); return t; }
    function addMsg(role,text,imgs){
      const d=document.createElement('div'); d.className='pac-m '+role;
      if(text) d.textContent=text;
      if(imgs) for(const a of imgs) if(a.thumb){ const im=document.createElement('img'); im.src=a.thumb; d.appendChild(im); }
      el.log.appendChild(d); pin(); updateScroll(); return d;
    }
    async function addAI(md){ const d=addMsg('ai','…'); await paint(d,md); return d; }
    // Loading placeholder shown immediately when a conversation's content is being fetched over the
    // broker (network). The ☰ drawer now STAYS OPEN on select, so a slow/empty fetch would otherwise
    // just show a blank log. Reuses the existing .pac-m.status style (R3); it is removed when the
    // messages arrive, or repurposed into an error line on failure (R5, never a silent blank).
    function showLoading(){ return addMsg('status','Loading… 加载中'); }
    // Re-fetch attachment images on reload — the in-memory thumbnail isn't persisted, but the
    // uploaded file is; ask the shell for it as a data URL (mirrors the main chat's renderAtts).
    async function attImgs(atts){
      if(!Array.isArray(atts)||!atts.length) return null;
      const out=[];
      for(const a of atts){ if(!a||!a.path) continue;
        if(!/\.(png|jpe?g|gif|webp)$/i.test(a.name||a.path||'')) continue;   // images only
        try{ const r=await req({kind:'attach-url',path:a.path}); if(r&&r.ok&&r.dataUrl) out.push({thumb:r.dataUrl}); }catch{}
      }
      return out.length?out:null;
    }
    // 改这个应用 · Change this app under a reply: the shell opens its panel prefilled (web/app-edit.js fromApp).
    // TODO(R4 seam): with the reply-row helpers when this file is split.
    function addChangeApp(bubble,ev){ const b=document.createElement('button'); b.type='button'; b.className='pac-change-app';
      b.textContent=String(ev.label||'改这个应用 · Change this app'); b.style.cssText='display:block;align-self:flex-start;max-width:82%;margin:6px 0 2px;padding:6px 12px;border-radius:16px;border:1px solid currentColor;background:transparent;color:inherit;font:inherit;cursor:pointer';
      // 改 · Apply (ADR 0042): the server minted the message; the tap sends it as the next turn, once.
      if(ev.type==='app-change-confirm') b.classList.add('pac-confirm');
      b.onclick=ev.type==='app-change-confirm'?()=>{ send(String(ev.message)).then((ok)=>{ if(!ok) b.disabled=false; }); }:()=>parent.postMessage({pa:'shell',type:'change-app',request:String(ev.request||'').slice(0,2000)},'*'); bubble.after(b); }
    // Once any later turn is sent — the chip's own tap or a typed "yes" — an 改 · Apply chip is spent: really
    // disabled (a second tap would re-send the confirm) and visibly so (.pac-confirm:disabled in #pac-style).
    function retireConfirms(){ el.log.querySelectorAll('.pac-confirm').forEach((c)=>{ c.disabled=true; }); }
    function addActions(bubble,kind,rawText,prompt,scopeKey){   // scopeKey: the thread this bubble was rendered in (send() passes its snapshot); default = the thread shown now
      if(kind==='ai') rawText=shownAi(rawText);
      const bar=document.createElement('div'); bar.className='pac-acts '+kind;
      const copyBtn=mkab('copy','Copy'); copyBtn.onclick=()=>copyText(rawText,copyBtn); bar.appendChild(copyBtn);
      if(kind==='ai'){
        const speakBtn=mkab('speaker','Read aloud');
        speakBtn.onclick=()=>{ const ss=window.speechSynthesis;
          if(ss&&ss.speaking){ ss.cancel(); speakBtn.classList.remove('on'); return; }
          speakBtn.classList.add('on'); speak(stripMd(rawText),()=>speakBtn.classList.remove('on')); };
        const retryBtn=mkab('refresh','Ask again'); retryBtn.onclick=()=>{ const p=(prompt!=null?prompt:lastUser); if(p!=null) send(p); };  // re-ask THIS reply's question
        bar.append(speakBtn,retryBtn);
        // Save as note · 存为笔记 under a summary answer (plan E, web/drawer-summary.inline.html). TODO(R4 seam): the actions bar → its own inlined part.
        if(window.PADrawerSummary) window.PADrawerSummary.decorate(bar,rawText,{el:bubble,key:scopeKey===undefined?key:scopeKey,convo:(c=>()=>c)(curConvo),hooks:opts.summary||null,fresh:scopeKey!==undefined,prompt});   // both snapshots + the bubble + the prompt: it binds the thread, the refs it was rendered with and the turn; fresh = send()'s own answer (openConvo replays pass no scopeKey), which a summary saves as a note at once
      } else {
        const editBtn=mkab('pen','Edit'); editBtn.onclick=()=>{ el.inp.value=rawText; autosize(); el.inp.focus(); };
        bar.appendChild(editBtn);
      }
      el.log.appendChild(bar); pin(); updateScroll();
    }
    // ── Verify · 校验 chip row under an AI bubble. state 'pending' → a plain
    //    "校验中 · Verifying" chip + a background poll of the convo (10s→30s backoff, deadline
    //    from the server-declared timeout — passing it SURFACES the missing result, R14);
    //    terminal → [Fast · 快速][Deep ×N · 多模型] switch swapping the bubble content. ──
    function addAssessRow(bubble, fastMd, a0, convoId){
      const bar=document.createElement('div'); bar.className='pac-acts ai pac-vrow'; el.log.appendChild(bar);
      let cur=a0, view='fast';
      const chip=(label,tag)=>{ const b=document.createElement(tag||'button'); b.className='pac-vchip'; b.textContent=label; bar.appendChild(b); return b; };
      const show=(v)=>{ if(view===v) return; view=v; draw(); if(bubble.isConnected) paint(bubble, v==='deep'?assessDeepMd(cur):fastMd); };
      function draw(){ bar.innerHTML='';
        if(cur.state==='pending'){ chip('校验中 · ⏳ Verifying','span').classList.add('pend'); return; }
        if(cur.state==='timeout'){ chip('⚠ 校验超时 · Verify timed out','span').classList.add('pend'); return; }
        const n=(cur.models||[]).filter(x=>x.ok).length;
        const bf=chip('快速 · Fast'), bd=chip(cur.state==='error'?'⚠ 校验失败 · Verify failed':'Deep ×'+n+' · 多模型');
        bf.classList.toggle('on',view==='fast'); bd.classList.toggle('on',view==='deep');
        bf.onclick=()=>show('fast'); bd.onclick=()=>show('deep'); }
      async function poll(){ let wait=10000;
        const deadline=(cur.started||Date.now())+((cur.timeoutMinutes||30)*60000)+60000;
        while(bar.isConnected&&cur.state==='pending'){
          await new Promise(r=>setTimeout(r,wait)); wait=Math.min(Math.round(wait*1.5),30000);
          if(!bar.isConnected) return;   // thread switched / log cleared — a later replay re-attaches and resumes from the persisted state
          if(Date.now()>deadline){ cur=Object.assign({},cur,{state:'timeout'}); draw(); return; }   // absence of a result is itself surfaced (R14)
          try{ const r=await req({kind:'convo',convoId});
            const mm=((r&&r.ok&&r.data&&r.data.messages)||[]).find(x=>x.aid===cur.aid);
            if(mm&&mm.assess&&mm.assess.state!=='pending'){ cur=Object.assign({aid:cur.aid},mm.assess); draw(); if(view==='deep'&&bubble.isConnected) paint(bubble,assessDeepMd(cur)); }
          }catch(e){} } }   // transient broker/network error: keep polling — the deadline above guarantees a visible terminal state (R5)
      draw(); if(a0.state==='pending'&&convoId) poll();
    }

    // App-agnostic post-render hook: after any AI bubble's HTML is set, let the host
    // enhance it (e.g. the Bible app linkifies verse references). Errors never break render.
    const enh=el=>{ try{ if(window.PASummaryRefs) window.PASummaryRefs.enhance(el,key);   // a summary answer's [n] → note links (web/summary-refs.inline.html). TODO(R4 seam): the render hooks → the actions-bar part
        if(opts.enhance) opts.enhance(el); }catch(e){ console.warn('[PAChat] enhance hook failed',e); } };
    // ONE place installs a message body, so "rendered markdown or plain text?" is decided AND
    // recorded in a single spot. The class it sets is what turns off pre-wrap; a bubble that fell
    // back to escaped text keeps pre-wrap, and therefore keeps its line breaks.
    // ONE place installs a message body, so "rendered markdown or plain text?" is decided AND
    // recorded in a single spot. The class it sets is what turns off pre-wrap; a bubble that fell
    // back to escaped text keeps pre-wrap, and therefore keeps its line breaks.
    function setBody(d,md,html){
      const ok=typeof html==='string'&&html!=='';
      d.innerHTML=ok?html:esc(md);
      d.classList.toggle('pac-md',ok);
    }
    async function paint(d,md){
      md=shownAi(md);
      try{ const r=await req({kind:'render-md',text:md}); setBody(d,md,(r&&r.ok)?r.html:null); }
      catch{ d.textContent=md; d.classList.remove('pac-md'); }   // plain text: pre-wrap must stay on
      enh(d); pin(); updateScroll();
    }

    function renderChips(){ el.chips.innerHTML='';
      atts.forEach((a,i)=>{ const c=document.createElement('div'); c.className='pac-chip';
        const im=document.createElement('img'); im.src=a.thumb; im.alt=''; c.appendChild(im);       // .src, not innerHTML
        if(a.label){ const t=document.createElement('span'); t.className='pac-ctime'; t.textContent=a.label; c.appendChild(t); }   // e.g. a screenshot's time: a stale picture is never unmarked
        const b=document.createElement('button'); b.dataset.i=i; b.textContent='✕'; c.appendChild(b);
        el.chips.appendChild(c); }); }

    // ── convo-id persistence ──
    // Priority: app-supplied getConvoId/setConvoId (e.g. bible stores it in its
    // annotation file). Else, if opts.persist is set, PAChat keeps a {key:convoId}
    // map in <persist>.json via the broker — so any app gets remembered history for
    // free. Else session-only (in-memory).
    let convoMap=null, mapPromise=null;
    function loadMap(){ if(mapPromise) return mapPromise;   // cache the in-flight promise, not a half-built object
      mapPromise=(async()=>{ let mp={};
        if(opts.persist){ try{ const r=await req({kind:'data',path:opts.persist+'.json'}); if(r&&r.ok&&r.text) mp=JSON.parse(r.text)||{}; }
          // Degrade to an empty map on a missing/corrupt/failed read. Safe by design: this value is
          // only a {scope:convoId} POINTER — the real conversations live in the shell's store and stay
          // in ☰ history; the worst case is starting a fresh thread, never losing an existing one. (R5)
          catch{} }
        convoMap=mp; return mp; })();
      return mapPromise; }
    async function getCid(k){ if(opts.getConvoId) return opts.getConvoId(k); const mp=await loadMap(); return mp[k]; }
    // Release every scope bound to a conversation that no longer exists. The host owns its own
    // map (the Bible keeps verse→thread in the chapter file), so it is asked to forget; the
    // built-in convoMap is cleaned directly. Silent no-op for a host that offers neither.
    function unbindConvo(id){
      if(!id) return;
      if(opts.unbindConvo){ try{ opts.unbindConvo(id); }catch(e){ console.warn('[PAChat] unbindConvo hook failed',e); } return; }
      if(!convoMap) return;
      let changed=false;
      for(const kk of Object.keys(convoMap)) if(convoMap[kk]===id){ delete convoMap[kk]; changed=true; }
      if(changed&&opts.persist) req({kind:'save-data',path:opts.persist+'.json',data:JSON.stringify(convoMap)});
    }

    function setCid(k,id){
      // An unkeyed chat binds to nothing. Without this, `k` of null was written as the STRING
      // "null" — a real entry named "null" exists in live Bible data — and every later unkeyed
      // chat overwrote it, so they all collapsed onto one bogus scope.
      if(k===null||k===undefined||k==='') return;
      if(opts.setConvoId){ opts.setConvoId(k,id); return; }
      convoMap=convoMap||{}; convoMap[k]=id;
      if(opts.persist) req({kind:'save-data',path:opts.persist+'.json',data:JSON.stringify(convoMap)}); }

    // ── Verify · 校验 toggle — remembered PER APP ──
    // Stored under the RESERVED '_verify' key in the same per-app {scope:convoId} map
    // (opts.persist JSON, broker-namespaced to data/<slug>/), so each app keeps its own
    // setting, one app's toggle never leaks into another, and a fresh app starts OFF.
    // ('_verify' is reserved: apps must not use it as a thread scope key.) Apps without
    // opts.persist degrade to session-only — the toggle resets when the app reloads.
    let verifyOn=false;
    const renderVerify=()=>{ el.vfy.textContent=(verifyOn?'☑':'☐')+' 校验 · Verify'; el.vfy.classList.toggle('on',verifyOn); };
    window.PANewDot.mark(el.vfy,'verify-toggle');   // buffered if the shell's prefs push hasn't arrived yet
    loadMap().then(mp=>{ if(mp&&mp._verify===true){ verifyOn=true; renderVerify(); } });
    async function saveVerify(){ if(!opts.persist) return; await loadMap();   // never write before the read finished (a racing save would drop the stored map)
      convoMap=convoMap||{}; if(verifyOn) convoMap._verify=true; else delete convoMap._verify;
      req({kind:'save-data',path:opts.persist+'.json',data:JSON.stringify(convoMap)}); }

    // ── history: clear + replay a thread, or greet ──
    // open() resolves false when a newer open/openConvo/newChat superseded it, so a caller that acts on the
    // opened thread (e.g. a picture ask) can stop instead of writing into whatever thread is shown now.
    let _openP, _closeN=0;   // _closeN: ✕ taps (full-screen and rail alike)
    function open(k){
      el.inp.focus(); drawer.close(); closeSheets();
