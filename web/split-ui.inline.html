<!-- ─────────────────────────────────────────────────────────────────────────────────────────
     PASplit — the GATE for side panels, and the rail API apps already call, backed by PAWin windows.
     Inlined at serve time by web.mjs into any app page carrying the marker

       PA_SPLIT_UI                          (the HTML-comment marker, once in <body>)

     written here WITHOUT the comment delimiters on purpose: the literal form would be replaced by
     this file's own content at serve time (web.mjs replaces every occurrence).

     WHAT IT IS NOW (2026-11-25, ADR docs/adr/0043-panel-windows.md). The old right-hand rail —
     collapse headers, ⤓/⤒, ⤢, a bottom zone, stacked-slot dividers — is deleted (R1). Every slot
     is its OWN window (web/panel-window.inline.html, PAWin): opening Ask AI shows only Ask AI.
     PASplit keeps two jobs:
       1. the gate: ONE matchMedia(GATE) for the page (gateOpen / onGate), so phones never get a
          window and an app learns when a rotation crosses it;
       2. PASplit.open({slots}) → the same rail handle apps call (open / expand / collapse /
          isCollapsed / setTitle / destroy …), each slot mapped onto a PAWin window.

     NO CLIENT-SIDE STORAGE: localStorage & co. throw at an opaque origin (verified 2026-09-02).
     Window layout is kept by PAWin through PAAppPrefs.
────────────────────────────────────────────────────────────────────────────────────────── -->
<script>
(function(){
  if(window.PASplit) return;                       // idempotent: safe if the marker appears twice

  // The gate is its OWN, deliberately not the dock's `(min-width:640px)`: 640 admits iPhone
  // landscape (852x393), where a side window must never appear. 820x600 admits desktop and iPad
  // (landscape, and 820 portrait) and keeps phones on the full-screen sheet.
  var GATE='(min-width:820px) and (min-height:600px)';
  function gateOpen(){ try{ return window.matchMedia(GATE).matches; }catch(e){ return false; } }

  /* ══ THE GATE, WATCHED ONCE ═══════════════════════════════════════════════════════════════
     ONE matchMedia for the whole component, with subscribers (R3). Two parties need the same
     answer and must never be able to disagree about it:
       - a live rail, which must CLOSE the moment the screen stops being wide enough;
       - the APP, which decided at boot whether to build a rail at all and otherwise never
         learns that an iPad was rotated into landscape — the rail it refused at boot stays
         refused until a reload.
     An app cannot answer the second one with a matchMedia of its own without restating GATE,
     which is exactly the duplicated-critical-string shape R3 exists to stop.
     Returns an unsubscribe: a rail that is torn down must stop being told about rotations, or
     it keeps toggling pas-open on the root and fights the surface that replaced it. */
  var gateSubs=[], gateMQ=null;
  function watchGate(fn){
    gateSubs.push(fn);
    if(!gateMQ){
      try{ gateMQ=window.matchMedia(GATE); }catch(e){ gateMQ=null; }
      if(gateMQ){
        var fire=function(){
          var on=!!gateMQ.matches, bad=null;
          // Every subscriber runs even when one throws — a stale rail that never hears "closed"
          // keeps pushing the app aside, which is a worse failure than the one that caused it.
          // NOT swallowed: the first error is re-thrown once the fan-out is complete, so it still
          // reaches the page's error handler with its stack (R5). This is also what a browser does
          // for several listeners on one MediaQueryList.
          gateSubs.slice().forEach(function(f){ try{ f(on); }catch(e){ if(!bad) bad=e; } });
          if(bad) throw bad;
        };
        if(gateMQ.addEventListener) gateMQ.addEventListener('change',fire);
        else if(gateMQ.addListener) gateMQ.addListener(fire);
      }
    }
    return function(){ var i=gateSubs.indexOf(fn); if(i>=0) gateSubs.splice(i,1); };
  }

  window.PASplit={
    GATE:GATE, available:true,
    gateOpen:gateOpen,
    // Subscribe to gate crossings WITHOUT owning a rail. fn(open) runs on every crossing; the
    // return value unsubscribes. This is how an app rebuilds the surface it chose at boot.
    onGate:watchGate,
    open:function(opts){ return Rail(opts||{}); }
  };

  // The rail handle, over one PAWin window per slot. slot = {key, title, zone:'right'|'bottom', mount(host, rail)}.
  // A slot's window starts closed; expand() opens it (restoring it if minimised), collapse() closes it.
  function Rail(o){
    var slots=(o.slots||[]).filter(Boolean);
    if(!slots.length) throw new Error('PASplit.open: no slots — an empty rail would push the app aside for nothing');
    if(!window.PAWin) throw new Error('PASplit.open: PAWin is missing — the page lacks the panel-window component');
    var wins={}, api={}, shown=false, offGate=null;
    function remeasure(key){
      (key?[key]:Object.keys(api)).forEach(function(k){
        var a=api[k]; if(!a||!wins[k].isVisible()) return;
        try{ if(a.resize) a.resize(); if(a.remeasure) a.remeasure(); }
        catch(e){ /* a surface that cannot re-measure must not take the others down; its own
                     surface reports its failure (R5 — the documented-silence case). */ }
      });
    }
    function toggle(key,want){
      var w=wins[key]; if(!w) return;
      var next=want===undefined?!w.isVisible():!!want;
      if(next){ shown=true; w.open(); remeasure(key); } else w.close();
    }
    function open(){ if(!gateOpen()) return false; shown=true; return true; }
    function close(){ if(!shown) return; Object.keys(wins).forEach(function(k){ wins[k].close(); }); shown=false; if(o.onClose) o.onClose(); }
    function destroy(){
      close();
      if(offGate){ offGate(); offGate=null; }
      Object.keys(wins).forEach(function(k){ wins[k].destroy(); });
    }
    var railApi={
      hostFor:function(k){ return wins[k]&&wins[k].body; },
      register:function(k,a){ api[k]=a; },
      open:open, close:close, isOpen:function(){ return shown; }, destroy:destroy,
      expand:function(k){ toggle(k,true); }, collapse:function(k){ toggle(k,false); }, toggle:toggle,
      isCollapsed:function(k){ return !(wins[k]&&wins[k].isVisible()); },
      toggleMax:function(k){ var w=wins[k]; if(!w) return; if(w.state().max) w.restore(); else w.maximize(); },
      isMaxed:function(k){ return Object.keys(wins).some(function(x){ return (!k||x===k)&&wins[x].state().max; }); },
      dock:function(k,z){ if(wins[k]) wins[k].dock(z); },
      zoneOf:function(k){ return wins[k]&&wins[k].state().where; },
      setTitle:function(k,t){ if(wins[k]) wins[k].setTitle(t); },
      win:function(k){ return wins[k]; },
      remeasure:remeasure,
    };
    slots.forEach(function(sl){
      wins[sl.key]=window.PAWin.create({ key:sl.key, title:sl.title||sl.key, dock:sl.zone==='bottom'?'bottom':'right', size:o.ratio,
        // The window ✕ runs the surface's own close (PAChat's ✕, PANote's ✕ — which flushes first), so
        // closing from the window and from the surface are ONE path (R3).
        closeSel:'.pac-top .pac-close,.pan-hx',
        onResize:function(){ remeasure(sl.key); },
        onVisible:function(v){ if(o.onToggle) o.onToggle(sl.key,v); } });
    });
    slots.forEach(function(sl){ if(sl.mount) api[sl.key]=sl.mount(wins[sl.key].body,railApi)||null; });
    offGate=watchGate(function(on){ if(!on){ close(); if(o.onGateClose) o.onGateClose(); } else remeasure(); });
    return railApi;
  }
})();
</script>
<!--PA_PANEL_WINDOW_UI-->
