<!-- PANotePhone — phone mode for PANote（手机模式）: finger ink, two-finger pan, pinch zoom.
     Inlined by web.mjs into any page carrying the PA_NOTE_PHONE_UI marker (note-ui carries it, so the
     Journal and the Bible get it with no app code). Plan: journal-iphone step 1 (rules 2-zoom and 3).
     PHONE MODE = a viewport narrower than 768px AND a coarse pointer, read at use time (no switch). On a
     wider screen or a fine pointer nothing here acts: iPad and desktop behaviour is unchanged.
     API:
       PANotePhone.isPhone()            → bool, now
       PANotePhone.watch(host, cb, listen) → toggles host.pan-phone with phone mode (the ONE source the CSS
                                          below reads); cb(on) on each change; listen = the host's registrar.
       PANotePhone.clampZoom(z)         → z inside [ZOOM_MIN, ZOOM_MAX] (1 = fit, 3 = 3x)
       PANotePhone.gesture(c)           → {down(e), move(e), up(e), active()} — the two-finger tracker.
         c.allowed()   → may a two-finger gesture start now (phone, drawing tool, no pen down)
         c.begin()     → the host drops what the first finger started (a stroke, a scroll); false refuses
         c.zoomNow()   → the zoom at the start;  c.pan(dx,dy) / c.zoom(z,cx,cy) / c.end() while it runs
       Each handler returns true when it CONSUMED the event (the host's own routing must then skip it).
     Driven by test/note-phone.test.mjs (the tracker) and test/note-phone-e2e.test.mjs (WebKit iPhone). -->
<style id="pnp-style">
/* The phone's pen toggle: hidden everywhere but phone mode, where it replaces the 16px checkbox. */
.pan-fingerbtn{display:none}
.pan-phone .pan-fingerbtn{display:flex;min-width:44px;min-height:44px}
.pan-phone .pan-fingerrow{display:none}
.pan-fingerbtn .pan-foff,.pan-fingerbtn.on .pan-fon{display:block}
.pan-fingerbtn .pan-fon,.pan-fingerbtn.on .pan-foff{display:none}
</style>
<script id="pnp-script">
(function(){
  if(window.PANotePhone) return;
  const PHONE_MQ='(max-width: 767.98px) and (pointer: coarse)';
  const ZOOM_MIN=1, ZOOM_MAX=3;
  const PHONE_CLS='pan-phone';
  // Fingers never move in step: a pan changes their spread a little. Zoom starts only once the spread
  // has changed by this fraction, and counts from there, so a two-finger scroll never zooms.
  const PINCH_SLOP=0.12;
  function isPhone(){
    try{ return !!(window.matchMedia&&window.matchMedia(PHONE_MQ).matches); }
    catch(_){ return false; /* no matchMedia: never phone mode, so the iPad/desktop path is the default */ }
  }
  const clampZoom=z=>(Number.isFinite(z)&&z>0)?Math.min(ZOOM_MAX,Math.max(ZOOM_MIN,z)):ZOOM_MIN;
  // listen(target,type,fn): the host's own registrar (PANote's listenG), so a destroyed pad drops these too.
  function watch(host,cb,listen){
    let on=null;
    const sync=()=>{ const now=isPhone(); if(now===on) return; on=now; host.classList.toggle(PHONE_CLS,now); if(cb) cb(now); };
    sync();
    const add=listen||((t,ty,f)=>t.addEventListener(ty,f));
    let mq=null;
    try{ mq=window.matchMedia?window.matchMedia(PHONE_MQ):null; }catch(_){ mq=null; /* sync() already settled on "not a phone" */ }
    if(mq&&mq.addEventListener) add(mq,'change',sync);
    add(window,'resize',sync);
  }
  // The two-finger tracker. Every touch pointer the host routes here is remembered until it lifts;
  // a SECOND one while allowed() starts a gesture, and from then on every touch is the gesture's
  // until the last finger lifts (a finger left down never starts a stroke). isPrimary marks the
  // first finger of a NEW touch sequence, so an up the page never saw cannot leave a ghost finger
  // that would turn the next one-finger stroke into a pinch.
  function gesture(c){
    const pts=new Map(); let g=null;
    const pair=()=>{ const a=pts.get(g.a), b=pts.get(g.b); return {cx:(a.x+b.x)/2, cy:(a.y+b.y)/2, d:Math.hypot(a.x-b.x,a.y-b.y)}; };
    function finish(){ if(!g) return; g=null; c.end(); }
    function down(e){
      if(e.pointerType!=='touch') return false;
      if(e.isPrimary){ pts.clear(); finish(); }
      pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
      if(g) return true;                                       // a third finger: part of the gesture, ignored
      if(pts.size<2||!c.allowed()||!c.begin()) return false;
      const ids=[...pts.keys()];
      g={a:ids[ids.length-2], b:e.pointerId};
      const p=pair(); g.d0=Math.max(1,p.d); g.z0=c.zoomNow(); g.cx=p.cx; g.cy=p.cy; g.z=g.z0;
      return true;
    }
    function move(e){
      if(e.pointerType!=='touch') return false;
      const pt=pts.get(e.pointerId); if(!pt) return false;
      pt.x=e.clientX; pt.y=e.clientY;
      if(!g) return false;
      if(e.cancelable) e.preventDefault();
      if(!pts.has(g.a)||!pts.has(g.b)) return true;           // one of the pair lifted: the rest only wait to lift
      if(e.pointerId!==g.a&&e.pointerId!==g.b) return true;
      const p=pair();
      c.pan(g.cx-p.cx, g.cy-p.cy); g.cx=p.cx; g.cy=p.cy;
      if(!g.pinch){ if(Math.abs(p.d/g.d0-1)<PINCH_SLOP) return true; g.pinch=true; g.d0=Math.max(1,p.d); }
      const z=clampZoom(g.z0*p.d/g.d0);
      if(Math.abs(z-g.z)>1e-3){ g.z=z; c.zoom(z,p.cx,p.cy); }
      return true;
    }
    function up(e){
      if(e.pointerType!=='touch') return false;
      pts.delete(e.pointerId);
      if(!g) return false;
      if(!pts.size) finish();
      return true;
    }
    return {down,move,up,active:()=>!!g};
  }
  window.PANotePhone={PHONE_MQ,ZOOM_MIN,ZOOM_MAX,PINCH_SLOP,isPhone,watch,clampZoom,gesture};
})();
</script>
