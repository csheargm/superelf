<!-- PANotePhone — phone mode for PANote（手机模式）: finger ink, two-finger pan, pinch zoom.
     Inlined by web.mjs into any page carrying the PA_NOTE_PHONE_UI marker (note-ui carries it, so the
     Journal and the Bible get it with no app code). Plan: journal-iphone step 1 (rules 2-zoom and 3).
     PHONE MODE = a viewport narrower than 768px AND a coarse pointer, read at use time (no switch). On a
     wider screen or a fine pointer nothing here acts: iPad and desktop behaviour is unchanged.
     API:
       PANotePhone.isPhone()            → bool, now
       PANotePhone.watch(host, cb, listen) → toggles host.pan-phone with phone mode (the ONE source the CSS
                                          below reads); cb(on) on each change; listen = the host's registrar.
       PANotePhone.clampZoom(z)         → z inside [ZOOM_MIN, ZOOM_MAX] (1 = fit, 3 = 3x)
       PANotePhone.gesture(c)           → {down(e), move(e), up(e), active()} — the two-finger tracker.
         c.allowed()   → may a two-finger gesture start now (phone, drawing tool, no pen down)
         c.begin()     → the host drops what the first finger started (a stroke, a scroll); false refuses
         c.zoomNow()   → the zoom at the start;  c.pan(dx,dy) / c.zoom(z,cx,cy) / c.end() while it runs
       Each handler returns true when it CONSUMED the event (the host's own routing must then skip it).
       PANotePhone.fitK(rw,pageW,minW,wide) → the page scale: on a phone a WIDE page (ink or photos) fits the
                                          screen width with no floor (适配宽度); otherwise max(minW,rw)/pageW
                                          exactly as before. Stored ink stays in pageW units either way.
       PANotePhone.toolSheet(c)         → the phone tool strip's ⋯ sheet（工具面板, step 3 rule 5）: on a phone the strip keeps
         pen · eraser · undo · redo (and the pen toggle); every other drawing control is a row here that presses
         the control it stands for. c = {doc, rows:[{key, btn, icon}], onPick(btn)}. → {el, sync()}; labels: SHEET_TXT.
       PANotePhone.readView(c)          → Read view（阅读视图）: the page's typed text reflowed at this device's
         text size, ink hidden. c = {host, textLayer, btn, txt, hasInk(), listen, onSize(px), openLink(href)}. → {open(), close(), isOpen()}
         c.onSize(px) reports an A−/A+ change; the host stores it on THIS device (the shell's pa_notereadsize,
         a sandboxed app has no storage of its own) and hands it back with view.setSize(px). Never in the note.
     Driven by test/note-phone.test.mjs (the tracker) and test/note-phone-e2e.test.mjs (WebKit iPhone). -->
<style id="pnp-style">
/* The phone's pen toggle: hidden everywhere but phone mode, where it replaces the 16px checkbox. */
.pan-fingerbtn{display:none}
.pan-phone .pan-fingerbtn{display:flex;min-width:44px;min-height:44px}
.pan-phone .pan-fingerrow{display:none}
.pan-fingerbtn .pan-foff,.pan-fingerbtn.on .pan-fon{display:block}
.pan-fingerbtn .pan-fon,.pan-fingerbtn.on .pan-foff{display:none}
.pan-readbtn{display:none}
.pan-phone .pan-readbtn{display:flex;min-width:44px;min-height:44px}
/* Where the header's ⋯ is a menu (note-ui OVF_MQ, 600px) Read view is its first row and the header button hides. */
.pan-ovf .pan-ovfread{display:none}
@media (max-width:600px){ .pan-phone .pan-top .pan-readbtn{display:none} .pan-phone .pan-ovf .pan-ovfread{display:flex} }
/* The phone tool strip (step 3): pen, eraser, undo, redo and ⋯ (plus the pen toggle), every tap 44px; the rest
   moves into the ⋯ sheet. Off a phone the ⋯ is hidden and the strip is exactly what it was. */
.pan-toolmore{display:none}
.pan-phone .pan-tools .pan-toolmore{display:flex}
.pan-phone .pan-tools>.pan-tbtn,.pan-phone .pan-tools>.pan-grip{min-width:44px;min-height:44px}
.pan-phone .pan-tools>.pan-tool:not([data-tool=pen]):not([data-tool=erase]),.pan-phone .pan-tools>.pan-inkbtn,.pan-phone .pan-tools>.pan-paperbtn,
.pan-phone .pan-tools>.pan-photo,.pan-phone .pan-tools>.pan-readbtn,.pan-phone .pan-tools>.pan-sep{display:none}
.pan-toolsheet{gap:2px;padding:6px}
.pan-toolsheet button{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border:none;background:none;border-radius:9px;
  font:inherit;font-size:15px;color:var(--text,#111);text-align:left;cursor:pointer;white-space:nowrap}
.pan-toolsheet button[aria-pressed=true]{background:color-mix(in srgb,var(--accent,#0f6355) 14%,transparent);color:var(--accent,#0f6355)}
.pnp-read{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;background:var(--pan-paper,#fffdf8);color:#1c1e1d}
.pnp-read[hidden]{display:none}
.pnp-rhead{display:flex;align-items:center;gap:6px;padding:6px 8px;padding-top:max(6px,env(safe-area-inset-top));border-bottom:1px solid rgba(0,0,0,.12);background:inherit}
.pnp-rtitle{flex:1;min-width:0;font:600 15px/1.25 system-ui,-apple-system,sans-serif}
.pnp-rnote{display:block;font-weight:400;font-size:13px;color:#5b5f5d}
.pnp-rhead button{min-width:44px;min-height:44px;border:0;border-radius:10px;background:rgba(0,0,0,.06);color:inherit;font:600 16px system-ui,-apple-system,sans-serif}
.pnp-rbody{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:16px 16px calc(24px + env(safe-area-inset-bottom));overflow-wrap:anywhere;line-height:1.55}
.pnp-rbody *{position:static!important;font-size:inherit!important;max-width:100%!important;width:auto!important;height:auto!important;margin-left:0!important;transform:none!important;line-height:inherit!important}
.pnp-rbody h1{font-size:1.5em!important}.pnp-rbody h2{font-size:1.3em!important}.pnp-rbody h3{font-size:1.15em!important}
.pnp-rbody img{height:auto!important}
.pnp-rempty{color:#5b5f5d;font-style:italic}
</style>
<script id="pnp-script">
(function(){
  if(window.PANotePhone) return;
  const PHONE_MQ='(max-width: 767.98px) and (pointer: coarse)';
  const ZOOM_MIN=1, ZOOM_MAX=3;
  const PHONE_CLS='pan-phone';
  // Fingers never move in step: a pan changes their spread a little. Zoom starts only once the spread
  // has changed by this fraction, and counts from there, so a two-finger scroll never zooms.
  const PINCH_SLOP=0.12;
  function isPhone(){
    try{ return !!(window.matchMedia&&window.matchMedia(PHONE_MQ).matches); }
    catch(_){ return false; /* no matchMedia: never phone mode, so the iPad/desktop path is the default */ }
  }
  const clampZoom=z=>(Number.isFinite(z)&&z>0)?Math.min(ZOOM_MAX,Math.max(ZOOM_MIN,z)):ZOOM_MIN;
  // listen(target,type,fn): the host's own registrar (PANote's listenG), so a destroyed pad drops these too.
  function watch(host,cb,listen){
    let on=null;
    const sync=()=>{ const now=isPhone(); if(now===on) return; on=now; host.classList.toggle(PHONE_CLS,now); if(cb) cb(now); };
    sync();
    const add=listen||((t,ty,f)=>t.addEventListener(ty,f));
    let mq=null;
    try{ mq=window.matchMedia?window.matchMedia(PHONE_MQ):null; }catch(_){ mq=null; /* sync() already settled on "not a phone" */ }
    if(mq&&mq.addEventListener) add(mq,'change',sync);
    add(window,'resize',sync);
  }
  // The two-finger tracker. Every touch pointer the host routes here is remembered until it lifts;
  // a SECOND one while allowed() starts a gesture, and from then on every touch is the gesture's
  // until the last finger lifts (a finger left down never starts a stroke). isPrimary marks the
  // first finger of a NEW touch sequence, so an up the page never saw cannot leave a ghost finger
  // that would turn the next one-finger stroke into a pinch.
  function gesture(c){
    const pts=new Map(); let g=null;
    const pair=()=>{ const a=pts.get(g.a), b=pts.get(g.b); return {cx:(a.x+b.x)/2, cy:(a.y+b.y)/2, d:Math.hypot(a.x-b.x,a.y-b.y)}; };
    function finish(){ if(!g) return; g=null; c.end(); }
    function down(e){
      if(e.pointerType!=='touch') return false;
      if(e.isPrimary){ pts.clear(); finish(); }
      pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
      if(g) return true;                                       // a third finger: part of the gesture, ignored
      if(pts.size<2||!c.allowed()||!c.begin()) return false;
      const ids=[...pts.keys()];
      g={a:ids[ids.length-2], b:e.pointerId, moved:new Set()};
      const p=pair(); g.d0=Math.max(1,p.d); g.z0=c.zoomNow(); g.cx=p.cx; g.cy=p.cy; g.z=g.z0;
      return true;
    }
    function move(e){
      if(e.pointerType!=='touch') return false;
      const pt=pts.get(e.pointerId); if(!pt) return false;
      pt.x=e.clientX; pt.y=e.clientY;
      if(!g) return false;
      if(e.cancelable) e.preventDefault();
      if(!pts.has(g.a)||!pts.has(g.b)) return true;           // one of the pair lifted: the rest only wait to lift
      if(e.pointerId!==g.a&&e.pointerId!==g.b) return true;
      // Measure only once BOTH fingers have reported since the last measure (or one moved twice: the
      // other is resting), so the order the two moves arrive in never reads as a change of spread.
      if(!g.moved.has(e.pointerId)){ g.moved.add(e.pointerId); if(g.moved.size<2) return true; }
      g.moved.clear(); g.moved.add(e.pointerId);
      const p=pair();
      c.pan(g.cx-p.cx, g.cy-p.cy); g.cx=p.cx; g.cy=p.cy;
      if(!g.pinch){ if(Math.abs(p.d/g.d0-1)<PINCH_SLOP) return true; g.pinch=true; g.d0=Math.max(1,p.d); }
      const z=clampZoom(g.z0*p.d/g.d0);
      if(Math.abs(z-g.z)>1e-3){ g.z=z; c.zoom(z,p.cx,p.cy); }
      return true;
    }
    function up(e){
      if(e.pointerType!=='touch') return false;
      pts.delete(e.pointerId);
      if(!g) return false;
      if(!pts.size) finish();
      return true;
    }
    return {down,move,up,active:()=>!!g};
  }
  function fitK(rw,pageW,minW,wide){
    if(!(rw>0)||!(pageW>0)) return 1;
    return (wide&&isPhone()) ? rw/pageW : Math.max(minW/pageW, rw/pageW);
  }
  // ── Read view（阅读视图）── text size per device: READ_SIZES px, never below 18 (plan rule 4).
  const READ_SIZES=[18,20,22,24,28,32], READ_DEF=18;
  const readSize=v=>{ v=Number(v); return READ_SIZES.includes(v)?v:READ_DEF; };
  function stepSize(cur,dir){ const i=READ_SIZES.indexOf(cur), j=Math.min(READ_SIZES.length-1,Math.max(0,(i<0?0:i)+dir)); return READ_SIZES[j]; }
  function readView(c){
    const doc=c.host.ownerDocument, T=c.txt, add=c.listen||((t,ty,f,o)=>t.addEventListener(ty,f,o));
    const el=doc.createElement('div'); el.className='pnp-read'; el.hidden=true;
    el.setAttribute('role','dialog'); el.setAttribute('aria-label',T.title);
    const head=doc.createElement('div'); head.className='pnp-rhead';
    const title=doc.createElement('div'); title.className='pnp-rtitle'; title.textContent=T.title;
    const note=doc.createElement('span'); note.className='pnp-rnote'; note.textContent=T.inkHidden; title.appendChild(note);
    const mk=(txt,label,cls)=>{ const b=doc.createElement('button'); b.type='button'; b.className=cls; b.textContent=txt; b.title=label; b.setAttribute('aria-label',label); return b; };
    const less=mk('A−',T.smaller,'pnp-rless'), more=mk('A+',T.bigger,'pnp-rmore'), shut=mk('✕',T.close,'pnp-rclose');
    head.append(title,less,more,shut);
    const body=doc.createElement('div'); body.className='pnp-rbody';
    el.append(head,body); c.host.appendChild(el);
    let size=READ_DEF, obs=null;
    const applySize=()=>{ body.style.fontSize=size+'px'; less.disabled=size<=READ_SIZES[0]; more.disabled=size>=READ_SIZES[READ_SIZES.length-1]; };
    // A COPY of the rendered text layer, so nothing typed here can reach the note (it is read only).
    function fill(){
      body.textContent='';
      for(const n of c.textLayer.childNodes) body.appendChild(n.cloneNode(true));
      body.querySelectorAll('[contenteditable],[id]').forEach(n=>{ n.removeAttribute('contenteditable'); n.removeAttribute('id'); });
      if(!body.textContent.trim()&&!body.querySelector('img')){ const p=doc.createElement('p'); p.className='pnp-rempty'; p.textContent=T.empty; body.appendChild(p); }
      note.hidden=!c.hasInk();
    }
    function sync(on){ if(c.btn){ c.btn.classList.toggle('on',on); c.btn.setAttribute('aria-pressed',String(on)); } }
    // While it is open the pad under it is INERT (no focus, no taps) and the keys that edit it are
    // held at the window, ahead of the pad's own document handlers, so nothing changes the note unseen.
    const setInert=on=>{ for(const n of c.host.children) if(n!==el) n.inert=on; };
    // Tab / Enter / Space on the view's OWN controls pass, so A−, A+, ✕ and links work from a keyboard.
    const OWN_KEYS={Tab:1,Enter:1,' ':1};
    const hold=e=>{ if(el.hidden) return;
      if(e.type==='keydown'&&e.key==='Escape'){ close(); e.preventDefault(); e.stopImmediatePropagation(); return; }
      if(e.type==='keydown'&&OWN_KEYS[e.key]&&(e.key==='Tab'||el.contains(e.target))) return;
      e.stopImmediatePropagation(); e.preventDefault(); };
    for(const ty of ['keydown','paste','cut']) add(window,ty,hold,true);
    // A link in the copy goes through the pad's own opener (c.openLink: a note reference, or the shell's
    // checked URL opener), never the browser's default, which the sandbox blocks.
    body.addEventListener('click',e=>{ const a=e.target&&e.target.closest&&e.target.closest('a'); if(!a) return;
      e.preventDefault(); const href=a.getAttribute('href'); if(href&&c.openLink){ close(); c.openLink(href); } });
    function open(){ applySize(); fill(); el.hidden=false; setInert(true); sync(true);
      if(!obs&&window.MutationObserver){ obs=new MutationObserver(fill); obs.observe(c.textLayer,{childList:true,subtree:true,characterData:true}); } }
    function close(){ el.hidden=true; setInert(false); sync(false); if(obs){ obs.disconnect(); obs=null; } }
    const step=dir=>{ size=stepSize(size,dir); applySize(); if(c.onSize) c.onSize(size); };
    less.addEventListener('click',()=>step(-1)); more.addEventListener('click',()=>step(1));
    shut.addEventListener('click',close);
    if(c.btn) c.btn.addEventListener('click',()=>{ if(el.hidden) open(); else close(); });
    // Leaving phone mode (rotation, Split View widening) leaves the view too: its button is gone.
    let mq=null; try{ mq=window.matchMedia?window.matchMedia(PHONE_MQ):null; }catch(_){ mq=null; /* never phone mode: nothing opens */ }
    if(mq&&mq.addEventListener) add(mq,'change',()=>{ if(!isPhone()) close(); });
    return {open,close,isOpen:()=>!el.hidden,size:()=>size,setSize:px=>{ size=readSize(px); applySize(); }};
  }
  // ── The tool strip's ⋯ sheet（工具面板）── labels 中文 first; `more` is the ⋯ itself, `tip` its first-use tip.
  const SHEET_TXT={more:'更多工具 · More tools',marker:'马克笔 · Marker',highlighter:'荧光笔 · Highlighter',select:'选择 · Select',
    text:'文字 · Text',ink:'颜色与粗细 · Colour & size',paper:'纸张与背景 · Paper & background',photo:'插入图片 · Insert photo',read:'阅读视图 · Read view',
    tip:'更多工具：马克笔、荧光笔、选择、颜色与粗细 · More tools: marker, highlighter, select, colour & size'};
  function toolSheet(c){
    const doc=c.doc||document, el=doc.createElement('div');
    el.className='pan-pop pan-toolsheet pa-sheet'; el.setAttribute('role','menu'); el.setAttribute('aria-label',SHEET_TXT.more);
    const rows=c.rows.filter(r=>r.btn&&SHEET_TXT[r.key]);
    for(const r of rows){ const b=doc.createElement('button'); b.type='button'; b.dataset.k=r.key; b.setAttribute('role','menuitem');
      b.innerHTML=r.icon||''; b.appendChild(doc.createTextNode(SHEET_TXT[r.key])); r.row=b;
      b.addEventListener('click',()=>c.onPick(r.btn)); el.appendChild(b); }
    // The row of the tool in use reads as pressed, so a tool picked here is still visible as the one on.
    const sync=()=>{ for(const r of rows) r.row.setAttribute('aria-pressed',String(r.btn.classList.contains('on'))); };
    return {el,sync};
  }
  window.PANotePhone={PHONE_MQ,ZOOM_MIN,ZOOM_MAX,PINCH_SLOP,READ_SIZES,SHEET_TXT,isPhone,watch,clampZoom,gesture,fitK,readSize,stepSize,readView,toolSheet};
})();
</script>
