<script>
// ── PAPrint · 打印 ─────────────────────────────────────────────────────────────────────────
// Printing a handwritten note, from inside a sandboxed app that is not allowed to print.
//
// THE CONSTRAINT. App pages run in sandbox="allow-scripts" with no allow-modals, so
// window.print() is a SILENT no-op: it returns undefined, throws nothing, and fires neither
// beforeprint nor afterprint. typeof window.print === 'function' in every configuration, so
// feature detection cannot tell permitted from blocked. Nothing here may call it, and nothing
// here may wrap it in a try/catch and report success (R5 — the blocked call reports nothing).
// Adding allow-modals WOULD work and is the wrong trade: it ungates alert/confirm/prompt and
// beforeunload for every mini-app, which is exactly what pacPrompt/pacConfirm exist to avoid.
//
// THE ROUTE. The shell (web/index.html) is an ordinary document and can print. It already owns
// Web APIs the sandbox denies an app — speech-start/speech-stop exists because iOS blocks
// webkitSpeechRecognition in iframes — so print is the same shape, brokered as kind:'print'.
//
// THE FORMAT. Raster PNG, not SVG or PDF, and that is not a shortcut. drawStroke varies stroke
// width PER SEGMENT from pen pressure; neither SVG nor PDF can vary stroke-width along one path,
// so a faithful vector render needs one path element per segment. At the density real pages here
// reach (measured: up to 226 strokes on one page, tens of thousands of points) that is hundreds of
// thousands of elements, and the vector file ends up LARGER than the raster while still flattening
// the pressure away. A 300dpi PNG of a sparse page is ~85KB and is exact. "Save as PDF" in the
// print dialog then gives a PDF for free, at the same resolution.
window.PAPrint = (function(){
  'use strict';
  // Letter width (8.5in) less the 6mm inner margin each side ≈ 8.03in; ×300dpi ≈ 2400px. 2244 is kept (≈280dpi): plenty for ink.
  const TARGET_W=2244;
  // Canvas area guard. iOS caps a canvas far below desktop, and the failure is not an exception —
  // the canvas silently comes back BLANK, which would print empty sheets and look like a data
  // loss. Staying well under the cap and reporting the reduced resolution is the honest trade.
  const MAX_PX=20e6;
  // EVERY printed page is the pad's own sheet: 816 x 1056 CSS px, a Letter page, the same sheet
  // the screen draws its fold on. One page = one sheet, rendered whole (paper, rules, stationery,
  // text, ink) under ONE transform, so the writing never drifts off its lines.
  //
  // SCAR 2026-11-25 (owner): print was off-centre, off the lines and full of gaps, and a page
  // written on a 12.9in iPad printed at a different size from the same page on an 11in one.
  // Causes: the image was a 1.20 box (a white band on every sheet, more on A4); only the content
  // shrank while the rules stayed full size; and the shrink was chosen PER PAGE from how far down
  // that screen let the user write. Now the scale is one number for the whole note, decided by the
  // content alone (stored in page-width units, so the device never enters), and the shell centres
  // each sheet on the paper (web/index.html, #printRoot).
  const PAD_RATIO=0.04;
  const LETTER_ASPECT=1056/816;
  // A4 is relatively taller than Letter. Its sheet is the box the shell leaves inside A4 (6mm each
  // side, web/index.html .pr-sheet): (297-12)/(210-12). Rendering the page at that shape means the
  // same handwriting fills an A4 sheet instead of floating in a 20mm band top and bottom; the
  // ruling simply continues further down, like a real A4 pad. Letter keeps the pad's own sheet.
  const A4_ASPECT=(297-12)/(210-12);
  // Paper the shell lays the sheets onto. Default by locale: Letter in the US/Canada/Mexico/
  // Philippines/Chile/Colombia, A4 elsewhere. Only a hint for the CSS page box — the print dialog's
  // own paper choice still wins, and the sheet is centred inside whatever it picks.
  const LETTER_REGIONS=/-(US|CA|MX|PH|CL|CO|VE|GT|CR|PA|DO|PR)$/i;
  function defaultPaper(lang){ return LETTER_REGIONS.test(String(lang||'')) ? 'letter' : 'a4'; }
  const TXT={
    nothing:'没有可打印的内容 · Nothing to print',
    blocked:'无法打开打印窗口 · The print window could not open',
    noPhoto:'部分图片未能加载 · Some photos could not be loaded and printed as empty boxes',
    lowRes:'页面过长，已降低分辨率 · Printed at reduced resolution (page too tall)',
    lightInk:'浅色墨迹在白纸上看不见 · Very light ink will not show on white paper',
  };
  // Ink-only printing puts the note on WHITE instead of its own paper tint: on screen the tint
  // separates the page from the app, on paper it is a full-bleed colour wash over every sheet.
  const PAPER_WHITE='#ffffff';
  // Page numbers are drawn INTO the image, not added to the sheet as HTML. Each sheet is now
  // exactly page-shaped, so any extra element inside it would push the sheet past one printed page
  // and emit a blank sheet after every note page. Sizes are fractions of the page WIDTH so the
  // stamp is the same physical size whatever resolution the page was rendered at.
  const NUM_INK='#9aa0a6', NUM_SIZE=0.013, NUM_INSET=0.022;
  // How much to scale a page of this size. Pure, and exported, so the pixel-budget decision can
  // be tested without a canvas — the failure it guards against (a silently BLANK canvas on iOS)
  // is invisible in a source-only test.
  function fitScale(w,hCss){
    const s=TARGET_W/w, px=(w*s)*(hCss*s);
    return px>MAX_PX ? s*Math.sqrt(MAX_PX/px) : s;
  }

  // The printed sheet height in CSS px: the pad's sheet, or a Letter page when a host reports none.
  function pageHeight(info,paper){ const w=info.width||816;
    return paper==='a4' ? Math.round(w*A4_ASPECT) : Math.round(info.sheetH||w*LETTER_ASPECT); }
  // ONE scale for the whole note. A page whose content fits the sheet needs none; otherwise the
  // deepest page decides, and every page uses that same scale so the handwriting is one size from
  // the first sheet to the last. Extents are in page-width units, so this is device-independent:
  // the same strokes give the same k whichever iPad wrote them. Stored strokes are never rewritten.
  function noteFit(info,paper){
    const w=info.width||816, sheet=pageHeight(info,paper);
    let need=0; for(const pg of info.pages||[]) need=Math.max(need,(pg.extent||0)*w);
    need+=w*PAD_RATIO;                    // padding always counts: a thick stroke's edge sits below its centreline
    return { k: need<=sheet ? 1 : sheet/need };
  }
  // Render every page to a PNG data URL by asking the PAD to draw. PAPrint deliberately owns no
  // renderer of its own: a second one would drift from the on-screen note and the printout would
  // quietly stop matching it (R3).
  async function renderNote(note,inkOnly,sheetPaper){
    if(!note||typeof note.printPage!=='function') throw new Error('this note cannot be printed');
    if(typeof note.printPrime==='function') await note.printPrime();
    const info=note.printInfo();
    const w=info.width||816;
    // undefined leaves the note's own paper colour in place; white is the ink-only default.
    const paper=inkOnly===false?undefined:PAPER_WHITE;
    const out=[]; const warn={photo:false,lowRes:false,lightInk:false};
    // One note page is one sheet.
    const plan=info.pages.map((_,i)=>i);
    const fit=noteFit(info,sheetPaper), hCss=pageHeight(info,sheetPaper);
    for(const i of plan){
      const pg=info.pages[i];
      if(pg.unresolved) warn.photo=true;
      // Only a concern on white: against the note's own tint these strokes read fine, which is why
      // they were drawn. Dropping them onto white without a word would be ink silently lost.
      if(paper&&pg.lightInk) warn.lightInk=true;
      // Fit the sheet's pixel budget: shrink the scale rather than the page, so a very tall page
      // prints smaller instead of coming back blank.
      const scale=fitScale(w,hCss);
      if(scale<TARGET_W/w) warn.lowRes=true;
      const c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(w*scale)); c.height=Math.max(1,Math.round(hCss*scale));
      const ctx=c.getContext('2d');
      if(!ctx) throw new Error('no 2d context for the print page');
      if(!note.printPage(i,ctx,scale,hCss,paper,fit)) continue;
      stampPageNumber(ctx,c,out.length+1,plan.length);   // numbered by SHEET: what the reader is holding
      // PNG, not JPEG: ink on white is ~2x smaller as PNG and JPEG rings around every stroke.
      out.push({ png:c.toDataURL('image/png'), w:c.width, h:c.height });
      c.width=c.height=1;                                  // release the backing store before the next page
    }
    return { pages:out, warn };
  }

  // Bottom CENTRE, small and muted, on every sheet: a real journal page carries nothing else in
  // its footer. Numeric so it needs no translation. Sized from the image width so it is the same
  // physical size at any render resolution, and inset so it clears a printer's unprintable edge.
  function stampPageNumber(ctx,c,n,total){
    ctx.save();
    ctx.setTransform(1,0,0,1,0,0);            // printPage restores the transform; draw in device px
    const size=Math.max(8,Math.round(c.width*NUM_SIZE)), inset=Math.round(c.width*NUM_INSET);
    ctx.font='500 '+size+'px -apple-system,system-ui,sans-serif';
    ctx.fillStyle=NUM_INK; ctx.textAlign='center'; ctx.textBaseline='alphabetic';
    ctx.fillText(total>1 ? n+' / '+total : String(n), c.width/2, c.height-inset);
    ctx.restore();
  }

  // The shell answers kind:'print'. There is no timeout here on purpose: the reply lands only
  // after the user dismisses the print dialog, and dialogs stay open as long as a person needs.
  function ask(msg){
    return new Promise((res)=>{
      const id='pr'+Date.now()+Math.random().toString(36).slice(2,7);
      const onMsg=(e)=>{ const d=e&&e.data;
        if(!d||d.pa!=='res'||d.id!==id) return;
        window.removeEventListener('message',onMsg); res(d); };
      window.addEventListener('message',onMsg);
      try{ parent.postMessage(Object.assign({pa:'req',id},msg),'*'); }
      catch(err){ window.removeEventListener('message',onMsg); res({ok:false,error:String((err&&err.message)||err)}); }
    });
  }

  return {
    TARGET_W, MAX_PX, TXT,
    pageHeight, fitScale, noteFit, defaultPaper,
    // Print an open PANote. Returns {ok, error, notes:[...]} — it renders NOTHING itself and
    // shows no UI, so the caller decides how to surface the outcome (PANote uses its own flash).
    note:async(api,opts)=>{
      opts=opts||{};
      let r;
      const paper=opts.paper==='letter'||opts.paper==='a4' ? opts.paper : defaultPaper(navigator.language);
      try{ r=await renderNote(api,opts.inkOnly,paper); }
      catch(err){ return {ok:false,error:String((err&&err.message)||err)}; }
      if(!r.pages.length) return {ok:false,error:TXT.nothing};
      const notes=[];
      if(r.warn.photo) notes.push(TXT.noPhoto);
      if(r.warn.lowRes) notes.push(TXT.lowRes);
      if(r.warn.lightInk) notes.push(TXT.lightInk);
      const res=await ask({ kind:'print', title:opts.title||'', paper, pages:r.pages });
      // A shell that cannot print says so. Never report success because the call returned.
      if(!res||!res.ok) return {ok:false,error:(res&&res.error)||TXT.blocked,notes};
      return {ok:true,notes,pages:r.pages.length};
    },
  };
})();
</script>
