<!-- PATips — first-use tips（首次使用提示）: ONE small bilingual callout beside a new control, the first time
     that control is on screen for this account (docs/adr/0030-first-use-tips.md). Carried by chat-ui (its
     PA_TIPS_UI marker, after PA_APP_PREFS_UI), so every PAChat page has it; registered in web.mjs PA_COMPONENTS.
     WHY. Owner 2026-11-12: "otherwise I really don't know about these new capabilities". Design rule: every
     new user-facing feature registers a tip in its OWN code, next to the control it explains.
     RULES (owner: minimalist UI — no tours, no modal walls):
       - at most ONE tip on screen, and on an app page at most one per page open: the rest wait for the next open.
         The shell lives for hours, so its store sets oneAtATimeOnly: after a dismissal the next may show (still one);
       - EVERY tip can be closed (owner 2026-11-24: tips stayed stuck): its ✕ (44px, 关闭提示 · Dismiss tip),
         a tap on it, Escape, or the first press anywhere outside it; the tip is removed FIRST, then stored;
       - 'seen' is stored on the account: a host store (window.PATipsStore — the shell's profile.tipsSeen,
         web/tips-store.js) or PAAppPrefs (appPrefs[slug].tipsSeen; a sandboxed app's opaque-origin storage
         never persists, so its prefs go through the shell). Also kept in localStorage and sessionStorage when
         they work: a refused account write still keeps the tip closed for this session (memory at least);
       - never over its control's bar, nor over another control (measured: below, above, then the least-covering
         spot); an anchor inside an [inert] or [hidden] layer is not on screen;
       - placed below the anchor, else above it, clamped inside the viewport; never on top of a small anchor;
       - a short fade only, none under prefers-reduced-motion; colours from the page's tokens (dark mode).
       PATips.register({id, anchor, text, when?, priority?}) anchor = element | selector | () => element; when() → bool
         priority:true  goes ahead of every non-priority tip (owner 2026-11-13: "Home moved" must not wait
                        behind older unseen tips), and replaces one already on screen, unseen, so it shows THIS
                        open. Default false: registration order, as before.
           pen:true       a Pencil tip: waits until this page has seen a pen pointer (pointerType 'pen'), so a phone or
                        a mouse never shows it (phone audit #3).
       dismissOnUse:true  the first press or key anywhere on the page also dismisses it for good (F2-07:
                        the app-bar tip explains a bar that then moves; it must not outstay the first tap).
       PATips.check()   re-look now (a feature that just opened a sheet or dialog calls it)
       PATips.reset()   forget tipsSeen on the account (Settings: Show tips again · 重新显示提示)
       PATips.seen() / PATips.current() / PATips.whenIdle() — for tests and hosts.
     Driven by test/tips.test.mjs over the real component and PAAppPrefs. -->
<style id="pat-style">
.pat-tip{position:fixed;z-index:2147483000;display:flex;gap:8px;align-items:flex-start;box-sizing:border-box;
  max-width:min(320px,calc(100vw - 16px));padding:8px 10px;border-radius:10px;font:13px/1.35 -apple-system,system-ui,"PingFang SC","Noto Sans SC",sans-serif;
  background:var(--card,#fff);color:var(--ink,#1d2321);border:1px solid var(--accent,#0f6355);
  box-shadow:0 4px 14px rgba(0,0,0,.18);opacity:0;transition:opacity .15s ease;cursor:pointer}
.pat-tip.on{opacity:1}
.pat-tip>span{align-self:center;flex:1 1 auto;min-width:0;white-space:normal;overflow-wrap:anywhere;text-overflow:clip}
.pat-x{flex:none;box-sizing:border-box;width:44px;height:44px;margin:-8px -10px -8px 0;border:none;background:none;color:var(--muted,#6b7370);font-size:16px;padding:0;cursor:pointer;font-family:inherit}
@media(prefers-color-scheme:dark){.pat-tip{background:var(--card,#1c2321);color:var(--ink,#e8ecea);box-shadow:0 4px 14px rgba(0,0,0,.5)}}
@media(prefers-reduced-motion:reduce){.pat-tip{transition:none}}
</style>
<script id="pat-script">
(function(){
  if(window.PATips) return;
  const PREF='tipsSeen';
  const EDGE_PX=8, GAP_PX=6, SCAN_PX=8;                  // viewport margin; space between anchor and tip
  const CLOSE='关闭提示 · Dismiss tip';
  const LOCAL_KEY='pa_tips_seen';             // localStorage + sessionStorage fallback (per device / per tab)
  const CTRL_SEL='button,a[href],input,select,textarea,summary,[role=button]';
  // Also kept clear: a page's title and header bar (phone audit #2: the tip sat on every app's title and on the
  // app-chat panel's ☰ row). Not controls, so a tip may still cover them when nothing else is free.
  // [data-tip-clear]: any other block a page wants left readable (the home greeting).
  const HEAD_SEL='h1,header,[role=banner],nav,[data-tip-clear]';
  const regs=[];                              // [{id, anchor, text, when}] in registration order
  const MAX_W_PX=320;                         // tip width cap, also bounded by the viewport
  // The control's whole BAR: a tip clears it, so it never covers the bar's other controls or a wrapped second row (F3-06).
  const BAR_MAX_FRAC=1/3;   // a "bar" taller than this share of the viewport is a sheet: its controls are anchors on their own
  const BAR_SEL='.pan-top,.pac-dhead,.pac-lsearch,.paab-bar,.cmenu-pop,[data-tip-bar]';   // .cmenu-pop: a shell pop-up menu, so a tip never covers its other items
  const muted=new Set();
  let penSeen=false;
  let seen=null, failed=false, loading=null, cur=null, shown=false, waiting=false, chain=Promise.resolve();
  const prefs=()=>window.PAAppPrefs;
  // The account store: the host's (the shell) or PAAppPrefs (an app page). {read()→{ok,list}, write(list)→{ok}}.
  function acct(){
    if(window.PATipsStore) return window.PATipsStore;
    const p=prefs(); if(!p) return null;
    return {read:()=>p.read().then(r=>r&&r.ok?{ok:true,list:listOf(r.prefs[PREF])}:{ok:false}),
      write:list=>p.patch({[PREF]:[...new Set([...listOf((p.get()||{})[PREF]),...list])]}), reset:()=>p.patch({[PREF]:[]})};
  }
  // Device and tab copies. Blocked storage (private mode, an opaque-origin frame) throws: that copy is skipped,
  // the account copy and this page's memory still hold the dismissal (R5 case c: a hint, not data).
  // Keyed by account where the host knows it (the shell: two people on one browser never share dismissals).
  const devKey=()=>{ try{ const w=window.PATipsStore&&window.PATipsStore.who&&window.PATipsStore.who(); return w?LOCAL_KEY+':'+w:LOCAL_KEY; }catch(_){ return LOCAL_KEY; } };
  function devList(st){ try{ return listOf(JSON.parse(window[st].getItem(devKey())||'[]')); }catch(_){ return null; } }
  function devPut(st,list){ try{ window[st].setItem(devKey(),JSON.stringify(list)); return true; }catch(_){ return false; } }
  const later=f=>(typeof window.requestAnimationFrame==='function'?window.requestAnimationFrame(f):queueMicrotask(f));
  const listOf=v=>Array.isArray(v)?v.filter(x=>typeof x==='string'):[];

  function load(){
    if(loading) return loading;
    const a=acct(); let dev=null, tab=null, devOk=false;
    // Device copies are read AFTER the account answered: the shell's key carries the signed-in account (who()).
    const devRead=()=>{ dev=devList('localStorage'); tab=devList('sessionStorage'); devOk=!!(dev||tab); };   // either copy can remember a dismissal
    const merge=(list)=>{ seen=new Set([...(seen||[]),...list,...(dev||[]),...(tab||[])]); };
    // No account store AND no device storage, or a refused read with none: tips do NOT show (R5 case c): a
    // hint with no way to remember its dismissal would nag on every open. Device storage alone is enough.
    if(!a){ devRead(); if(devOk){ merge([]); failed=false; } else failed=true; loading=Promise.resolve(); return loading; }
    loading=Promise.resolve().then(()=>a.read()).then(r=>{ devRead(); if(r&&r.ok){ merge(r.list||[]); failed=false; } else if(devOk){ merge([]); failed=false; } else failed=true; },
      ()=>{ devRead(); if(devOk){ merge([]); failed=false; } else failed=true; });   // a thrown read = refused (same rule)
    chain=loading; return loading;
  }
  function resolve(a){
    try{ const el=typeof a==='function'?a():typeof a==='string'?document.querySelector(a):a; return el&&el.getBoundingClientRect?el:null; }
    catch(_){ return null; }   // an anchor callback that throws means "not on screen"; the tip waits (R5 case c)
  }
  function visible(el){
    const r=el.getBoundingClientRect(), H=window.innerHeight||0, W=window.innerWidth||0;
    return r.width>0&&r.height>0&&r.bottom>0&&r.right>0&&r.top<H&&r.left<W;
  }
  // In the document, (partly) inside the viewport, and not in an inert or hidden layer (the shell header behind
  // an open app is inert: a tip there painted over the app's own controls and could not be tapped away).
  const layerOff=el=>{ try{ return typeof el.closest==='function'&&!!el.closest('[inert],[hidden]'); }catch(_){ return false; } };
  // An open MODAL dialog makes everything outside it inert without an [inert] attribute (GPT r2).
  const underModal=el=>{ try{ if(typeof el.closest==='function'&&el.closest('dialog[open]:modal')) return false; return !!document.querySelector('dialog[open]:modal'); }catch(_){ return false; } };   // inside one (stacked modals: Settings → Activity log) is fine   // no :modal (old engine): not detected
  const onScreen=el=>!!el.isConnected&&visible(el)&&!layerOff(el)&&!underModal(el);
  function next(){
    if(!seen) return null;   // a re-read in flight (a prefs push): nothing decided yet
    // muted: hidden by a signal this page cannot trust (hide()); not stored, back on a later open.
    for(const t of regs){
      if(seen.has(t.id)||muted.has(t.id)) continue;
      if(t.when&&!t.when()) continue;
      if(t.pen&&!penSeen) continue;
      const el=resolve(t.anchor); if(el&&onScreen(el)) return {t,el};
    }
    return null;
  }
  // The FIRST show waits two frames: a drawer sliding open or a toolbar settling moves the anchor right after
  // register/check, and measuring then drew the tip off screen (browser bug 2026-11-12). Re-check after.
  function check(){
    if(failed||!seen||cur||shown){ unwatch(); return; }
    if(waiting) return;
    if(!next()){ watch(); return; }
    waiting=true;
    later(()=>later(()=>{ waiting=false; if(cur||shown) return; const hit=next(); if(hit) show(hit.t,hit.el); else watch(); }));
  }
  // A tip registered BEFORE its anchor renders (the docked note list draws after register) had no re-check
  // until an unrelated click (browser bug 2026-11-12). While a tip is pending and none is shown, a body
  // MutationObserver and one IntersectionObserver per resolved anchor re-check, throttled to one frame;
  // selectors are re-resolved on every check. Both disconnect once a tip shows or nothing is pending.
  // No observers (old WebKit) or a refused observe: click, scroll, resize and transitionend still re-check,
  // so the tip is only late, never lost (R5 case c).
  let mo=null, moPending=false; const ios=new Map();
  const onSeen=()=>{ if(moPending) return; moPending=true; later(()=>{ moPending=false; check(); }); };
  function watch(){
    const pend=regs.filter(t=>!seen.has(t.id)); if(!pend.length){ unwatch(); return; }
    const MO=window.MutationObserver, IO=window.IntersectionObserver;
    if(!mo&&typeof MO==='function'&&document.body){
      try{ mo=new MO(onSeen); mo.observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['class','style','hidden']}); }
      catch(_){ mo=null; }   // fallback triggers above (R5 c)
    }
    if(typeof IO==='function') for(const t of pend){
      const el=resolve(t.anchor); if(!el||ios.has(el)) continue;
      try{ const io=new IO(onSeen); io.observe(el); ios.set(el,io); }
      catch(_){ /* fallback triggers above (R5 c) */ }
    }
  }
  function unwatch(){ if(mo){ mo.disconnect(); mo=null; } ios.forEach(io=>io.disconnect()); ios.clear(); }
  // Below the anchor if it fits, else above, else the side with more room clamped inside the viewport
  // (only an anchor taller than the screen, like the Bible's verse list, can then be overlapped).
  // Placement is MEASURED, not assumed: with the note list docked open, chat-ui pushes every body child with
  // `html.pac-docked>body>* {margin-left:320px}`, and a transformed ancestor would offset a fixed box the same
  // way (browser bug 2026-11-12: the tip sat a drawer-width too far right, squeezed to a sliver). So the tip
  // lives on <html> (outside that selector), has an explicit width, and any remaining offset of its containing
  // block is read back from a probe position and subtracted.
  function place(tip,el){
    // W: the layout viewport WITHOUT a desktop scrollbar (innerWidth counts it: a right-edge tip ran under it).
    const W=(document.documentElement&&document.documentElement.clientWidth)||window.innerWidth||0, H=window.innerHeight||0, w=Math.max(0,Math.min(MAX_W_PX,W-2*EDGE_PX));
    tip.style.width=w+'px'; tip.style.maxWidth=w+'px'; tip.style.left=EDGE_PX+'px'; tip.style.top=EDGE_PX+'px';
    const a=el.getBoundingClientRect(), b=tip.getBoundingClientRect(), h=b.height||0;
    // A tall .cmenu-pop is a SHEET (Publish), not a bar: past BAR_MAX_FRAC of the screen the tip goes beside the control,
    // or it was pushed above the whole sheet, onto the chat text (R13 review 2026-11-27, Try it).
    const bar=typeof el.closest==='function'?el.closest(BAR_SEL):null, br=bar&&bar.getBoundingClientRect(), v=br&&br.height<=H*BAR_MAX_FRAC?br:a;   // vertical: the bar's edges; horizontal: the control's
    const dx=(b.left||0)-EDGE_PX, dy=(b.top||0)-EDGE_PX;          // containing-block offset (0 when none)
    const clampT=t=>Math.max(EDGE_PX,Math.min(t,H-EDGE_PX-h)), clampL=l=>Math.max(EDGE_PX,Math.min(l,W-EDGE_PX-w));
    const fits=t=>t>=EDGE_PX&&t+h<=H-EDGE_PX;
    // Candidates in order of preference; the first one that covers no control wins, else the one covering fewest.
    const tops=[v.bottom+GAP_PX,v.top-GAP_PX-h,a.bottom+GAP_PX,a.top-GAP_PX-h].filter(fits);
    if(!tops.length) tops.push(H-v.bottom>v.top?H-EDGE_PX-h:EDGE_PX);
    // An anchor in the right third (the home ⋯) aligns the tip's RIGHT edge with it, so the box grows inward, not off the page.
    const RIGHT_THIRD=2/3, lefts=(a.left+a.right)/2>W*RIGHT_THIRD?[clampL(a.right-w),clampL(a.left)]:[clampL(a.left),clampL(a.right-w)];
    const ctrls=controls(tip,el);
    let best=null;
    // Then, if every spot beside the bar covers something, the nearest free band in the viewport (SCAN_PX steps).
    const band=[]; for(let y=EDGE_PX;y+h<=H-EDGE_PX;y+=SCAN_PX) band.push(y);
    band.sort((p,q)=>Math.abs(p-v.bottom)-Math.abs(q-v.bottom));
    // Its own (small) anchor outweighs any other control: a crowded phone home put the tip on the pill (CI 2026-11-27).
    const own=a.height<H?CTRL_MAX+1:0;
    outer: for(const t of [...tops,...band]) for(const l of lefts){ const T=clampT(t), box={left:l,top:T,right:l+w,bottom:T+h}, n=covers(ctrls,box)+(hit(a,box)?own:0);
      if(!best||n<best.n) best={t:T,l,n}; if(n===0) break outer; }
    tip.style.top=Math.round(best.t-dy)+'px'; tip.style.left=Math.round(best.l-dx)+'px';
  }
  // The visible controls a tip must not cover (its own anchor included). Bounded: the scan stops at CTRL_MAX.
  const CTRL_MAX=400;
  function controls(tip,el){
    const out=[];
    const q=sel=>{ try{ return document.querySelectorAll?[...document.querySelectorAll(sel)]:[]; }catch(_){ return []; } };   // a stub document: nothing to avoid
    const H=window.innerHeight||0, heads=q(HEAD_SEL);   // headers first, so the CTRL_MAX budget never drops them
    for(const c of [...heads,...q(CTRL_SEL)]){ if(out.length>=CTRL_MAX) break; if(tip.contains&&tip.contains(c)) continue;
      const r=c.getBoundingClientRect&&c.getBoundingClientRect(); if(!(r&&r.width>0&&r.height>0&&r.bottom>0&&r.right>0&&r.top<H&&r.left<(window.innerWidth||0)&&!layerOff(c))) continue;   // on screen only: off-screen rows must not use up the budget
      if(r.height>H/2&&heads.includes(c)) continue;   // a <header> wrapping the whole page is not a bar
      out.push(r); }
    if(el&&!out.length) out.push(el.getBoundingClientRect());
    return out;
  }
  const hit=(a,b)=>a.left<b.right&&b.left<a.right&&a.top<b.bottom&&b.top<a.bottom;
  const covers=(ctrls,box)=>ctrls.reduce((n,r)=>n+(hit(r,box)?1:0),0);
  // An anchor inside an open modal <dialog> (the top layer): the tip goes INTO that dialog, or it would sit under
  // it, unseen and unclosable. Else <html>, outside the docked-drawer body margin (see place()).
  function hostOf(el){ let d=null; try{ d=typeof el.closest==='function'?el.closest('dialog[open]'):null; }catch(_){ d=null; } return d||document.documentElement||document.body; }
  function show(t,el){
    const tip=document.createElement('div'); tip.className='pat-tip'; tip.setAttribute('role','status'); tip.setAttribute('data-tip',t.id);
    const txt=document.createElement('span'); txt.textContent=t.text;
    const x=document.createElement('button'); x.className='pat-x'; x.type='button'; x.textContent='✕'; x.setAttribute('aria-label',CLOSE);
    tip.appendChild(txt); tip.appendChild(x); hostOf(el).appendChild(tip);
    place(tip,el); cur={t,el,tip,ro:observe(el)}; cur.mo=layerWatch(); shown=true; unwatch();
    tip.addEventListener('click',e=>{ if(e&&e.stopPropagation) e.stopPropagation(); dismiss(); });
    x.addEventListener('pointerdown',()=>dismiss());   // a host's capture click handler (a pop-up menu's outside-close) may swallow the click
    later(()=>tip.classList.add('on'));
  }
  function dismiss(){
    if(!cur) return chain;
    const {t,tip}=cur; drop(); if(tip.parentNode) tip.parentNode.removeChild(tip);   // gone FIRST, whatever the stores do
    if(!seen) seen=new Set(); seen.add(t.id); const all=[...seen];
    if(window.PATipsStore&&window.PATipsStore.oneAtATimeOnly){ shown=false; later(check); }   // the shell: the next tip may follow, one at a time
    devPut('sessionStorage',all); devPut('localStorage',all);
    // A refused account write: the tab and device copies (or this page's memory) keep it closed; it may show
    // again on another device, which is honest (it was not remembered there) — R5 case c.
    const a=acct();
    chain=chain.then(()=>a?a.write(all):{ok:true}).catch(e=>({ok:false,error:String(e&&e.message||e)})); return chain;
  }
  function register(o){
    if(!o||typeof o.id!=='string'||!o.id||typeof o.text!=='string'||!o.text||!o.anchor) throw new Error('PATips.register: id, text and anchor required');
    if(!regs.some(r=>r.id===o.id)){
      const t={id:o.id,anchor:o.anchor,text:o.text,when:typeof o.when==='function'?o.when:null,priority:o.priority===true,pen:o.pen===true,dismissOnUse:o.dismissOnUse===true};
      const at=t.priority?regs.findIndex(r=>!r.priority):-1;   // after earlier priority tips, before the rest
      if(at<0) regs.push(t); else regs.splice(at,0,t);
    }
    load().then(()=>{ if(o.priority===true&&seen&&!seen.has(o.id)) yieldTo(); later(check); });
  }
  // A priority tip arrived while an ordinary one is on screen: that one leaves UNSEEN (it shows on a later
  // open) and the one-per-open slot is freed for the priority tip. A tip already shown and dismissed this
  // open keeps the slot: the priority tip waits for the next open (one tip per open).
  function yieldTo(){
    if(cur&&!cur.t.priority){ const {tip}=cur; drop(); if(tip.parentNode) tip.parentNode.removeChild(tip); shown=false; }
  }
  function reset(){
    const a=acct(); if(!a) return Promise.resolve({ok:false,error:'no PAAppPrefs'});
    seen=new Set(); failed=false; shown=false; devPut('sessionStorage',[]); devPut('localStorage',[]);
    chain=chain.then(()=>a.reset()); return chain;   // after any dismissal write in flight, never before it
  }
  // An app frame tells the shell about Escape and presses here, so a SHELL tip closes too.
  function up(){ try{ if(typeof parent!=='undefined'&&parent&&parent!==window&&parent.postMessage) parent.postMessage({pa:'tips-dismiss-up'},'*'); }catch(_){ /* no parent: nothing to tell (R5 c) */ } }
  // In an app frame, Escape or a press in the SHELL (focus is often there) never reaches this page: the shell
  // forwards them as {pa:'tips-dismiss'} (web/tips-store.js). Only from the parent window.
  window.addEventListener('message',e=>{ const m=e&&e.data; if(m&&m.pa==='tips-dismiss'&&cur&&(!e.source||e.source===parent)) dismiss(); });
  // The shell re-pushes prefs after the Settings dialog saves: a cleared list there shows tips again.
  window.addEventListener('message',e=>{ const m=e&&e.data; if(!(m&&m.pa==='prefs')||!seen||parent===window||e.source!==parent) return;   // only the shell, to its app frame: never another frame (the Try it preview)
    loading=null; const before=seen.size; seen=null;   // re-read whole: a list cleared there shows tips again
    load().then(()=>{ if(seen&&seen.size<before) shown=false; later(check); }); });
  // A shown tip is position:fixed, so it follows its anchor by hand: on scroll (capture: any scroller), resize
  // and click. An anchor detached, hidden (its panel closed) or scrolled off screen drops the tip UNSEEN — the
  // user never saw it by its control — so it shows again on a later check; else the tip is re-placed.
  function follow(){
    if(!cur) return;
    if(!onScreen(cur.el)){ const {tip}=cur; drop(); shown=false; if(tip.parentNode) tip.parentNode.removeChild(tip); return; }
    place(cur.tip,cur.el);
  }
  let pending=false;
  const onScroll=()=>{ if(pending) return; pending=true; later(()=>{ pending=false; follow(); }); };
  // A CSS layout change (drawer slide, toolbar settling) fires no window resize: observe the anchor AND the
  // root, re-placing through the same one-pending-frame guard. No ResizeObserver (old WebKit): skip it quietly
  // — scroll, click, resize and transitionend still re-place, so the tip is only late, never lost (R5 case c).
  function observe(el){
    const RO=window.ResizeObserver; if(typeof RO!=='function') return null;
    try{ const ro=new RO(onScroll); ro.observe(el); if(document.documentElement) ro.observe(document.documentElement); return ro; }
    catch(_){ return null; }   // same fallback as above: a refused observe leaves the other re-place paths (R5 c)
  }
  // A layer turning [inert]/[hidden] fires no scroll, click or resize: the shell opening an app over the home made the
  // header inert and the home ⋯ tip stayed on top of every app's title bar (phone audit #2). Watch exactly those two.
  function layerWatch(){
    const MO=window.MutationObserver; if(typeof MO!=='function'||!document.documentElement) return null;
    try{ const mo=new MO(onScroll); mo.observe(document.documentElement,{subtree:true,attributes:true,attributeFilter:['inert','hidden']}); return mo; }
    catch(_){ return null; }   // old engine: the click/scroll/resize re-checks remain (R5 c)
  }
  function drop(){ if(cur&&cur.ro) cur.ro.disconnect(); if(cur&&cur.mo) cur.mo.disconnect(); cur=null; }
  if(typeof document.addEventListener==='function'){
    document.addEventListener('transitionend',onScroll,true);   // an ancestor's slide finished: re-place
    document.addEventListener('click',()=>{ follow(); later(check); },true);
    // The first press anywhere else is the user getting on with the page: the tip is dismissed (seen), so one
    // that sits over a note's first lines or a group header never stands in the way twice (F3-06). Not swallowed.
    document.addEventListener('pointerdown',e=>{ if(cur&&shown&&!(cur.tip.contains&&cur.tip.contains(e.target))) dismiss(); },true);
    document.addEventListener('scroll',onScroll,true);
    // dismissOnUse: a key press also dismisses it (a press already dismisses every tip, above).
    const used=e=>{ if(cur&&e&&e.key==='Escape'){ dismiss(); return; }   // Escape closes any tip
      if(cur&&cur.t.dismissOnUse&&!(e&&e.target&&cur.tip.contains&&cur.tip.contains(e.target))) dismiss(); };
    document.addEventListener('keydown',used,true);
    // First in line: a page that stops Escape below the window still closes the tip.
    window.addEventListener('keydown',e=>{ if(cur&&e&&e.key==='Escape') dismiss(); if(e&&e.key==='Escape') up(); },true);
    document.addEventListener('pointerdown',e=>{ up(); if(e&&e.pointerType==='pen'&&!penSeen){ penSeen=true; later(check); } },true);   // in an app frame: the shell's tip closes too (web/tips-store.js)
  }
  window.addEventListener('resize',()=>{ if(cur) follow(); else later(check); });
  // hide(): off screen, NOT stored (shows on a later open) — for a signal that may not be the user's own act.
  // That tip is muted for this page, so it does not pop straight back; the slot frees for the next one.
  function hide(){ if(!cur) return; const {t,tip}=cur; muted.add(t.id); drop(); shown=false; if(tip.parentNode) tip.parentNode.removeChild(tip); later(check); }
  window.PATips={register,check,reset,dismiss,hide,PREF,CLOSE,
    seen:()=>seen?[...seen]:null, current:()=>cur?cur.t.id:null, registered:()=>regs.map(r=>({id:r.id,text:r.text})), whenIdle:()=>chain};
})();
</script>
