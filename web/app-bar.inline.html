<!-- PAAppBar — the app's own bar（应用自带栏）: ← Home and A-/A+ inside the app's top bar, which slides
     away for full-screen reading and writing (docs/adr/0032-app-own-bar.md). Registered in web.mjs
     PA_COMPONENTS; an app carries the PA_APP_BAR_UI marker on its own page (Bible, Journal) —
     NOT note-ui, so the Bible's Note pane (also PANote) never gets a second Home.
     OFF BY DEFAULT: nothing is drawn until the shell's {pa:'prefs'} says ownBar:true (meta.json
     "ownBar": true). Then the app answers {pa:'shell',type:'ready'} and the shell hides its own bar.
       PAAppBar.attach({bar, homeSlot?, sizeBefore?, narrowSizeSlot?, scroller?, keepOpen?})
         bar        the app's top row (element or () => element)
         homeSlot   where ← Home goes first (default: bar); sizeBefore: A-/A+ go before it (default: end)
         narrowSizeSlot  on a phone (<=600px) A-/A+ move to the top of this existing menu instead
         scroller   scrolling it UP shows the bar (Bible's #verses); scrolling forward hides it
         keepOpen   () => true while a menu/sheet/pane from the bar is open: never hide then
     GESTURES (owner 2026-11-13, ADR 0035 + 0036): a finger swipe up / forward scroll hides at once; a finger pull down (also an overscroll
     pull at the top) or the top handle shows it; shown, it hides itself after IDLE_MS with no action.
     TOUCH ONLY (owner 2026-11-23, F2-06): it hides by itself (idle, forward scroll) only while the reader is
     on touch; after a mouse / trackpad input (or on a hover device that has not been touched) it stays.
     All listeners passive, no preventDefault; a Pencil (pointerType 'pen' / touchType 'stylus') never pulls.
     Driven by test/app-bar.test.mjs (no browser) and test/app-own-bar-e2e.test.mjs (Playwright). -->
<style id="paab-style">
/* PA_BAR_HANDLE_CSS */
.paab-on{transition:transform .18s ease,margin-top .18s ease}
.paab-btn{font:inherit;font-weight:700;background:none;border:none;color:var(--accent,#0f6355);cursor:pointer;
  padding:4px 8px;min-height:36px;flex-shrink:0;white-space:nowrap}
.paab-home{font-size:13px}.paab-dn{font-size:12px}.paab-up{font-size:15px}
@media(max-width:600px){.paab-home .paab-lbl{display:none}.paab-btn{padding:4px 5px}}
.paab-narrow{display:flex;justify-content:center;gap:12px}
.paab-handle{display:none;position:fixed;top:0;left:50%;transform:translateX(-50%);z-index:2147482000;width:var(--pa-handle-w);height:var(--pa-handle-h);
  align-items:center;justify-content:center;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.paab-handle::before{content:'';width:var(--pa-grab-w);height:var(--pa-grab-h);border-radius:3px;background:var(--line,#ccc)}
.paab-handle.on{display:flex}
@media(prefers-reduced-motion:reduce){.paab-on{transition:none}}
</style>
<script id="paab-script">
(function(){
  if(window.PAAppBar) return;
  // The same press length as the shell's own A-/A+ long-press reset (web/index.html fsBind).
  const RESET_PRESS_MS=550;
  // Shown, the bar leaves on its own after IDLE_MS with no action (owner 2026-11-13, ADR 0035); a tap on
  // it restarts the clock, and keepOpen holds it. A finger pull of PULL_PX down, or a scroll up past it, shows it.
  const IDLE_MS=4000, PULL_PX=24, USER_SCROLL_MS=1000;
  const NARROW_MQ='(max-width:600px)';   // the phone breakpoint every app page here uses
  const TOUCH_MQ='(hover:none)';          // a phone / iPad with no mouse: touch until a mouse is used
  const touchFirst=()=>{ try{ return matchMedia(TOUCH_MQ).matches; }catch(_){ return false; /* no matchMedia: assume a mouse, the bar stays */ } };
  const TIP='主页和字号在这里；几秒后自动隐藏，下拉或点顶部把手返回 · Home and text size live here now — the bar hides after a few seconds; pull down or tap the top handle to bring it back';
  const S={cfg:null,on:false,touch:false,bar:null,hidden:false,handle:null,idle:0,lastY:0,mark:0,t0:null,pen:false,ptrs:new Set(),touches:0,held:false,inputAt:0};
  const el=(v)=>typeof v==='function'?v():v;
  const post=(type,d)=>{ try{ parent.postMessage({pa:'shell',type,d:d||0},'*'); }
    catch(_){ /* no parent (page opened on its own): nothing to tell, and nothing was drawn */ } };
  // A field being used (book <select>, search box) or keyboard focus — not a button merely left focused by a click.
  const FOCUS_HOLDS='select,input,textarea,[contenteditable="true"],:focus-visible';
  function keepOpen(){
    const b=S.bar; if(!b) return true;
    const f=document.activeElement;
    try{ if(f&&b.contains(f)&&f.matches(FOCUS_HOLDS)) return true; }
    catch(_){ /* an engine without :focus-visible: fall back to the field check alone */ if(f&&b.contains(f)&&f.matches('select,input,textarea')) return true; }
    if(b.querySelector('[aria-expanded="true"]')) return true;
    if(S.held) return true;
    try{ return !!(S.cfg.keepOpen&&S.cfg.keepOpen()); }
    catch(_){ return true; /* a broken check must never strand the user without the bar: keep it */ }
  }
  function arm(){ clearTimeout(S.idle); S.idle=S.hidden?0:setTimeout(onIdle,IDLE_MS); }
  // Never mid-stroke, mid-tap or mid-scroll: hiding moves the page up by the bar's height (it gives the space back).
  // A pointer that is still down is never expired by time; only a real end signal clears it (pointerup,
  // lostpointercapture, blur, visibilitychange). A finger counts until touchend/touchcancel — iOS fires
  // pointercancel the moment native scrolling takes the touch while the finger is still on the glass.
  const isDown=()=>S.ptrs.size>0||S.touches>0;
  function onIdle(){
    S.idle=0; if(S.hidden||!S.touch) return;   // a mouse reader keeps the bar (F2-06): no clock to re-arm
    if(isDown()||keepOpen()) return arm();
    setHidden(true);
  }
  function setHidden(h){
    const b=S.bar; if(!b) return;
    if(h===S.hidden){ if(!h) arm(); return; }
    if(h&&keepOpen()) return arm();
    S.hidden=h;
    const flow=!/^(absolute|fixed)$/.test(getComputedStyle(b).position);
    // In-flow (Bible #nav) the row gives its height back to the text; absolute (Journal .pan-top) slides,
    // and its host reads data-paab-hidden to give the page the bar's height back (note-ui barClearance).
    if(flow) b.style.marginTop=h?(-b.offsetHeight-1)+'px':'';
    else b.style.transform=h?'translateY(-101%)':'';
    b.inert=h;   // off-screen controls leave the tab order and VoiceOver / switch control (a11y)
    b.setAttribute('data-paab-hidden',h?'1':'0');
    S.handle.classList.toggle('on',h);
    arm();
  }
  function sizeBtn(d){
    const b=document.createElement('button'); b.type='button';
    b.className='paab-btn '+(d<0?'paab-dn':'paab-up'); b.textContent=d<0?'A-':'A+';
    const t=(S.titles&&S.titles[d<0?0:1])||''; if(t){ b.title=t; b.setAttribute('aria-label',t); }
    let held=0, tm=0;
    b.addEventListener('pointerdown',()=>{ held=0; clearTimeout(tm); tm=setTimeout(()=>{ held=1; post('font',0); },RESET_PRESS_MS); });
    for(const ev of ['pointerup','pointercancel','pointerleave']) b.addEventListener(ev,()=>clearTimeout(tm));
    b.addEventListener('click',()=>{ if(held){ held=0; return; } post('font',d); });   // the press that reset must not also step
    return b;
  }
  function mount(){
    const c=S.cfg, bar=el(c.bar); if(!bar||S.bar) return;
    S.bar=bar; bar.classList.add('paab-on');
    const home=document.createElement('button'); home.type='button'; home.className='paab-btn paab-home';
    home.title='主页 · Home'; home.setAttribute('aria-label','主页 · Home');
    home.innerHTML='← <span class="paab-lbl">Home</span>';
    home.addEventListener('click',()=>post('home'));
    const hs=el(c.homeSlot)||bar; hs.insertBefore(home,hs.firstChild);
    const dn=sizeBtn(-1), up=sizeBtn(1), row=document.createElement('div'); row.className='paab-narrow';
    // A phone row with no room left (Journal at 375px) takes A-/A+ into an existing menu: no new button.
    const narrow=matchMedia(NARROW_MQ), place=()=>{
      const slot=narrow.matches&&el(c.narrowSizeSlot), before=el(c.sizeBefore);
      if(slot){ row.append(dn,up); slot.insertBefore(row,slot.firstChild); return; }
      row.remove();
      if(before&&before.parentNode){ before.parentNode.insertBefore(dn,before); before.parentNode.insertBefore(up,before); }
      else bar.append(dn,up);
    };
    place(); narrow.addEventListener('change',place);
    // Any use of the bar restarts the idle clock.
    for(const ev of ['pointerdown','click','keydown','focusin','change']) bar.addEventListener(ev,arm,{passive:true,capture:true});
    const h=S.handle=document.createElement('button'); h.type='button'; h.className='paab-handle';
    h.title='显示栏 · Show the bar'; h.setAttribute('aria-label','Show the bar');
    // A Pencil resting near the top must not pull the bar over the page: finger / mouse only.
    let pen=false; h.addEventListener('pointerdown',(e)=>{ pen=e.pointerType==='pen'; });
    h.addEventListener('click',()=>{ if(pen){ pen=false; return; } setHidden(false); });
    document.body.appendChild(h);
    const sc=el(c.scroller);
    if(sc){ S.lastY=sc.scrollTop; sc.addEventListener('scroll',()=>onScroll(sc),{passive:true}); }
    bindPull();
    if(window.PATips) window.PATips.register({id:'app-own-bar',anchor:()=>home,text:TIP,priority:true});   // first-use tip (ADR 0030); first: Home moved
    setHidden(false);   // shown on open, on the idle clock
    post('ready');
  }
  // Scrolling UP shows; scrolling forward (down) PULL_PX hides at once (owner 2026-11-13 final, ADR 0036).
  // Only a scroll the user drove (touch / wheel / key within USER_SCROLL_MS) hides: a programmatic jump
  // to a verse on open must not take the bar away before it was seen.
  function onScroll(sc){
    const y=sc.scrollTop, d=y-S.lastY; S.lastY=y;
    S.mark=(d<0)===(S.mark<0)?S.mark+d:d;
    if(S.mark<-PULL_PX){ S.mark=0; setHidden(false); }
    else if(S.mark>PULL_PX){ S.mark=0; if(S.touch&&(S.touches>0||Date.now()-S.inputAt<USER_SCROLL_MS)) setHidden(true); }
  }
  // A finger pulled down PULL_PX (more down than across) shows the bar — also at the very top, where
  // nothing scrolls. Passive capture listeners: a stroke or a scroll is never taken, only watched.
  function bindPull(){
    const o={passive:true,capture:true};
    // Touch pointers are counted by the touch events below, not here (pointercancel ≠ finger lifted).
    addEventListener('pointerdown',(e)=>{ S.pen=e.pointerType==='pen'; S.touch=e.pointerType!=='mouse'; if(e.pointerType!=='touch') S.ptrs.add(e.pointerId); },o);
    for(const ev of ['pointerup','lostpointercapture']) addEventListener(ev,(e)=>{ S.ptrs.delete(e.pointerId); },o);
    addEventListener('pointercancel',(e)=>{ if(e.pointerType!=='touch') S.ptrs.delete(e.pointerId); },o);
    // A mouse released outside the frame sends no pointerup here: a move with no button down ends it.
    addEventListener('pointermove',(e)=>{ if(e.buttons===0&&e.pointerType!=='touch') S.ptrs.delete(e.pointerId); },o);
    const clearDown=()=>{ S.ptrs.clear(); S.touches=0; };   // the page lost the input: nothing is down any more
    addEventListener('blur',clearDown);
    document.addEventListener('visibilitychange',()=>{ if(document.hidden) clearDown(); });
    addEventListener('touchstart',(e)=>{
      S.touches=e.touches?e.touches.length:S.touches+1; S.touch=true;
      const t=e.touches&&e.touches[0];
      S.t0=(e.touches.length===1&&t&&t.touchType!=='stylus'&&!S.pen)?{x:t.clientX,y:t.clientY}:null; },o);
    addEventListener('touchmove',(e)=>{
      const t=e.touches&&e.touches[0]; if(!S.t0||!t) return;
      const dy=t.clientY-S.t0.y, dx=Math.abs(t.clientX-S.t0.x);
      if(dy>PULL_PX&&dy>dx){ S.t0=null; setHidden(false); }
      else if(-dy>PULL_PX&&-dy>dx){ S.t0=null; setHidden(true); }   // a finger swipe up hides at once (keepOpen still wins)
      else if(dx>PULL_PX) S.t0=null;   // a swipe across: neither, stop watching
    },o);
    for(const ev of ['touchend','touchcancel']) addEventListener(ev,(e)=>{ S.t0=null; S.touches=e.touches?e.touches.length:0; },o);
    // Desktop: a wheel / trackpad scroll up is the same "pull down" (also over a page that cannot scroll).
    // A wheel is a mouse / trackpad: the reader is not on touch now, so it only ever shows (F2-06).
    addEventListener('wheel',(e)=>{ S.inputAt=Date.now(); S.touch=false; if(e.deltaY<-PULL_PX/2) setHidden(false); },o);
    addEventListener('keydown',()=>{ S.inputAt=Date.now(); },o);
  }
  addEventListener('message',(e)=>{
    const m=e.data; if(!m||m.pa!=='prefs'||e.source!==parent) return;
    if(Array.isArray(m.fsTitles)) S.titles=m.fsTitles;
    if(m.ownBar!==true||S.on) return;
    S.on=true; S.touch=touchFirst(); if(S.cfg) mount();
  });
  function attach(cfg){ if(!cfg||!cfg.bar) throw new Error('PAAppBar.attach: bar required'); S.cfg=cfg; if(S.on) mount(); }
  // hold(true): keep the bar shown until hold(false) — for a host flow that must not have the page move.
  window.PAAppBar={attach,hide:()=>setHidden(true),show:()=>setHidden(false),hold:(on)=>{ S.held=!!on; if(S.held) setHidden(false); else arm(); },
    state:()=>({on:S.on,mounted:!!S.bar,hidden:S.hidden,idle:!!S.idle}),TIP,IDLE_MS,PULL_PX,RESET_PRESS_MS};
})();
</script>
